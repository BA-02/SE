<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // بيانات مشروع Supabase
  const SUPABASE_URL = "https://beezqxxltabbmfqdyxne.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cCO8hXnwLocQfw5SGTjDtw_3ZQAZDvO";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const TABLE = "warehouse_state";

  window.storage = {
    async get(key) {
      const { data, error } = await supabase
        .from(TABLE)
        .select("key,value")
        .eq("key", key)
        .maybeSingle();
      if (error) throw error;
      if (!data) return null;
      return { key: data.key, value: data.value };
    },
    async set(key, value) {
      const { error } = await supabase
        .from(TABLE)
        .upsert({ key, value: String(value), updated_at: new Date().toISOString() }, { onConflict: "key" });
      if (error) throw error;
      return { key, value };
    },
    async delete(key) {
      const { data, error } = await supabase
        .from(TABLE)
        .delete()
        .eq("key", key)
        .select("key")
        .maybeSingle();
      if (error) throw error;
      return { key, deleted: !!data };
    },
    async list(prefix) {
      let q = supabase.from(TABLE).select("key");
      if (prefix) q = q.like("key", `${prefix}%`);
      const { data, error } = await q;
      if (error) throw error;
      return { keys: (data || []).map(r => r.key), prefix };
    }
  };

  // مزامنة فورية بين جميع الأجهزة عبر Supabase Realtime
  window.subscribeStorage = function (key, callback) {
    const channel = supabase
      .channel(`warehouse-state-${key}`)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: TABLE, filter: `key=eq.${key}` },
        (payload) => {
          if (payload.eventType === "DELETE") return;
          const row = payload.new;
          if (row && row.key === key) callback(row.value, false);
        }
      )
      .subscribe();

    return () => { supabase.removeChannel(channel); };
  };

  window.supabase = supabase;
</script>

/* True, scannable barcode (Code128) rendered as SVG — falls back to a
   placeholder if the number isn't a valid barcode value. */
function RealBarcode({ value, height = 34 }) {
  const svgRef = React.useRef(null);
  const [ok, setOk] = useState(true);
  useEffect(() => {
    if (!svgRef.current) return;
    try {
      JsBarcode(svgRef.current, String(value || ""), {
        format: "CODE128", displayValue: false, margin: 0, height, width: 1.6,
        background: "transparent", lineColor: "#23303A",
      });
      setOk(true);
    } catch { setOk(false); }
  }, [value, height]);
  if (!value) return null;
  return ok ? <svg ref={svgRef} className="real-barcode" /> : (
    <div className="barcode-stripes" aria-hidden="true">
      {Array.from({ length: 28 }).map((_, i) => <span key={i} style={{ width: (i % 5 === 0 ? 3 : 1) + "px" }} />)}

let __audioCtx = null;
function playBeep(kind = "success") {
  try {
    __audioCtx = __audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __audioCtx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.value = kind === "error" ? 220 : 880;
    g.gain.value = 0.001;
    const t0 = ctx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (kind === "error" ? 0.28 : 0.14));
    o.start(t0);
    o.stop(t0 + (kind === "error" ? 0.3 : 0.16));
    if (kind === "error") {
      const o2 = ctx.createOscillator();
      o2.connect(g); o2.type = "sine"; o2.frequency.value = 160;
      o2.start(t0 + 0.15); o2.stop(t0 + 0.3);
    }
  } catch {}
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const clean = rows.filter((r) => r.some((c) => String(c).trim() !== ""));
  if (!clean.length) return [];
  const headers = clean[0].map((h) => h.trim().toLowerCase());
  return clean.slice(1).map((r) => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] ?? "").trim(); });
    return obj;
  });
}

/*  PERSISTENCE                                                       */

const STORE_KEY = "warehouse-data-v1";
// Data now lives in Supabase and syncs in real time across devices
// (laptop, phone, tablet) via window.subscribeStorage — see the Supabase layer above.

function useStore(onRemoteUpdate) {
  const [data, setData] = useState(null);
  const [saving, setSaving] = useState(false);
  const [online, setOnline] = useState(true);
  const [lastSynced, setLastSynced] = useState(null);
  const dataRef = React.useRef(null);
  // نتذكّر آخر نسخة كتبناها نحن بأنفسنا، حتى نتجاهل صداها القادم عبر
  // Realtime (لأن Supabase يرسل الحدث للجهاز المُرسِل نفسه أيضاً)
  const lastLocalWriteRef = React.useRef(null);

  useEffect(() => {
    let cancelled = false;
    let unsub = null;
    (async () => {
      try {
        const res = await window.storage?.get(STORE_KEY, false);
        if (!cancelled) {
          if (res?.value) {
            dataRef.current = withDefaults(JSON.parse(res.value));
            setData(dataRef.current);
          } else {
            const seed = withDefaults({ items: seedItems, incoming: seedIncoming, outgoing: seedOutgoing, barcodes: seedBarcodes });
            dataRef.current = seed;
            setData(seed);
            const serializedSeed = JSON.stringify(seed);
            lastLocalWriteRef.current = serializedSeed;
            await window.storage?.set(STORE_KEY, serializedSeed, false);
          }
          setOnline(true);
          setLastSynced(Date.now());
        }
      } catch {
        if (!cancelled) {
          const seed = withDefaults({ items: seedItems, incoming: seedIncoming, outgoing: seedOutgoing, barcodes: seedBarcodes });
          dataRef.current = seed;
          setData(seed);
          setOnline(false);
        }
      }
      // مزامنة فورية: أي تعديل يحصل من جهاز آخر يصل هنا تلقائياً بدون تحديث الصفحة
      if (!cancelled && window.subscribeStorage) {
        unsub = window.subscribeStorage(STORE_KEY, (rawValue, isLocalWrite) => {
          if (cancelled || isLocalWrite) return; // تجاهل صدى تعديلاتنا نحن
          // تجاهل الحدث إذا كانت القيمة القادمة هي نفسها آخر شيء كتبناه من هذا الجهاز
          // (Realtime يرسل الحدث لصاحب التعديل أيضاً، وهذا هو مصدر إشعار
          // "تم تحديث البيانات من جهاز آخر" الذي كان يظهر حتى لتعديلاتنا نحن)
          if (rawValue === lastLocalWriteRef.current) return;
          try {
            const next = withDefaults(JSON.parse(rawValue));
            dataRef.current = next;
            setData(next);
            setOnline(true);
            setLastSynced(Date.now());
            onRemoteUpdate?.();
          } catch {}
        });
      }
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, []);

  const OFFLINE_KEY = "warehouse-offline-pending-v1";

  const persist = useCallback(async (next) => {
    dataRef.current = next;
    setData(next);
    setSaving(true);
    const serialized = JSON.stringify(next);
    lastLocalWriteRef.current = serialized;
    try {
      await window.storage?.set(STORE_KEY, serialized, false);
      setOnline(true);
      setLastSynced(Date.now());
      try { localStorage.removeItem(OFFLINE_KEY); } catch {}
    } catch {
      // لا يوجد اتصال بالإنترنت: نحفظ التعديل محلياً وننتظر عودة الاتصال
      setOnline(false);
      try { localStorage.setItem(OFFLINE_KEY, JSON.stringify(next)); } catch {}
    } finally {
      setSaving(false);
    }
  }, []);

  // عند عودة الاتصال، حاول مزامنة أي تعديلات محفوظة محلياً أثناء الانقطاع
  useEffect(() => {
    const flush = async () => {
      let pending = null;
      try { pending = localStorage.getItem(OFFLINE_KEY); } catch {}
      if (!pending) return;
      try {
        lastLocalWriteRef.current = pending;
        await window.storage?.set(STORE_KEY, pending, false);
        try { localStorage.removeItem(OFFLINE_KEY); } catch {}
        setOnline(true);
        setLastSynced(Date.now());
      } catch {}
    };
    window.addEventListener("online", flush);
    flush();
    return () => window.removeEventListener("online", flush);
  }, []);

  return [data, persist, saving, { online, lastSynced }];
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(todayISO() + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

function expiryTier(daysLeft) {
  if (daysLeft === null) return null;
  if (daysLeft <= 0) return "expired";
  if (daysLeft <= 7) return "critical";
  if (daysLeft <= 15) return "warning";
  if (daysLeft <= 30) return "notice";
  return null;
}

const EXPIRY_TIER_META = {
  expired: { label: "منتهي الصلاحية", ink: "#B23A2E", bg: "#FAE6E2" },
  critical: { label: "ينتهي خلال 7 أيام", ink: "#B23A2E", bg: "#FAE6E2" },
  warning: { label: "ينتهي خلال 15 يوماً", ink: "#B3792C", bg: "#FBF0DD" },
  notice: { label: "ينتهي خلال 30 يوماً", ink: "#8A7A3E", bg: "#F5F0DD" },
};

function computeInventory(data) {
  const { items, incoming, outgoing } = data;
  return items.map((item) => {
    const inQty = incoming.filter((r) => r.code === item.code).reduce((s, r) => s + Number(r.qty || 0), 0);
    const outQty = outgoing.filter((r) => r.code === item.code).reduce((s, r) => s + Number(r.qty || 0), 0);
    const balance = Math.round((inQty - outQty) * 100) / 100;
    const threshold = Number(item.minQty) > 0 ? Number(item.minQty) : LOW_STOCK_THRESHOLD;
    let status = "available";
    if (balance <= 0) status = "empty";
    else if (balance <= threshold) status = "low";
    const daysLeft = daysUntil(item.expiryDate);
    const expiry = expiryTier(daysLeft);
    return { ...item, inQty, outQty, balance, status, threshold, daysLeft, expiry };
  });
}

function fmtDate(d) {
  if (!d) return "—";
  try {
    return new Intl.DateTimeFormat("ar-SA-u-nu-latn", { day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(d));
  } catch {
    return d;
  }
}

function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(esc).join(",")];
  rows.forEach((r) => lines.push(headers.map((h) => esc(r[h])).join(",")));
  return lines.join("\n");
}

function downloadCSV(filename, rows, headers) {
  const csv = "\uFEFF" + toCSV(rows, headers);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/* -------------------- CAMERA BARCODE SCANNER -------------------- */
/* Uses the phone/laptop camera with the browser's native BarcodeDetector
   API — no external library needed. Falls back to manual entry when the
   browser doesn't support live detection (e.g. Safari on iPhone today). */

function BarcodeCameraModal({ onDetect, onClose }) {
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const [status, setStatus] = useState("initializing"); // initializing | scanning | unsupported | denied | error
  const [manualCode, setManualCode] = useState("");

  useEffect(() => {
    let cancelled = false;

    function cleanup() {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      streamRef.current?.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }

    async function start() {
      if (typeof window === "undefined" || !("BarcodeDetector" in window)) {
        setStatus("unsupported");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        setStatus("scanning");

        let detector;
        try {
          detector = new window.BarcodeDetector({
            formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "codabar", "itf", "qr_code"],
          });
        } catch {
          detector = new window.BarcodeDetector();
        }

        const tick = async () => {
          if (cancelled || !videoRef.current) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes && codes.length > 0) {
              const value = (codes[0].rawValue || "").trim();
              if (value) {
                cancelled = true;
                cleanup();
                playBeep("success");
                hapticPulse("success");
                onDetect(value);
                return;
              }
            }
          } catch {
            /* ignore per-frame decode errors */
          }
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
      } catch (err) {
        setStatus(err && err.name === "NotAllowedError" ? "denied" : "error");
      }
    }

    start();
    return () => {
      cancelled = true;
      cleanup();
    };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const submitManual = () => {
    const v = manualCode.trim();
    if (v) onDetect(v);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet camera-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <span className="modal-title"><Camera size={16} style={{ verticalAlign: "-2px", marginLeft: 6 }} /> مسح بالكاميرا</span>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="modal-body camera-body">
          {status === "scanning" || status === "initializing" ? (
            <div className="camera-frame">
              <video ref={videoRef} className="camera-video" muted playsInline />
              <div className="camera-reticle">
                <span className="reticle-corner tl" /><span className="reticle-corner tr" />
                <span className="reticle-corner bl" /><span className="reticle-corner br" />
                <div className="reticle-line" />
              </div>
              <div className="camera-status">
                {status === "initializing" ? "جارٍ تشغيل الكاميرا…" : "وجّه الكاميرا نحو الباركود"}
              </div>
            </div>
          ) : (
            <div className="camera-fallback">
              <ShieldAlert size={26} strokeWidth={1.5} />
              {status === "unsupported" && (
                <p>
                  متصفحك الحالي لا يدعم القراءة المباشرة للباركود بالكاميرا (مدعوم حالياً في Chrome على أندرويد بشكل أساسي).
                  اكتب الكود يدوياً بالأسفل، أو استخدم قارئ الباركود اليدوي.
                </p>
              )}
              {status === "denied" && <p>تم رفض إذن الكاميرا. فعّل إذن الكاميرا لهذا الموقع من إعدادات المتصفح ثم أعد المحاولة، أو اكتب الكود يدوياً.</p>}
              {status === "error" && <p>تعذّر تشغيل الكاميرا. تأكد من عدم استخدامها في تطبيق آخر، أو اكتب الكود يدوياً.</p>}
              <div className="camera-manual">
                <input
                  className="input mono"
                  autoFocus
                  placeholder="اكتب الكود هنا"
                  value={manualCode}
                  onChange={(e) => setManualCode(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); submitManual(); } }}
                />
                <button className="btn-primary" onClick={submitManual}><Check size={15} /> استخدام هذا الكود</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Dashboard({ inventory, data, go, readOnly, onPrint }) {
  const total = inventory.length;
  const low = inventory.filter((i) => i.status === "low").length;
  const empty = inventory.filter((i) => i.status === "empty").length;
  const available = total - low - empty;
  const critical = useMemo(
    () => inventory.filter((i) => i.status !== "available").sort((a, b) => a.balance - b.balance).slice(0, 12),
    [inventory]
  );
  const expiring = useMemo(
    () => inventory.filter((i) => i.expiry).sort((a, b) => a.daysLeft - b.daysLeft).slice(0, 12),
    [inventory]
  );

  // إشعار نظام حقيقي (خارج المتصفح) عند وجود أصناف حرجة الصلاحية — يُطلب الإذن مرة واحدة فقط
  useEffect(() => {
    const urgentExpiring = inventory.filter((i) => i.expiry === "critical" || i.expiry === "expired");
    if (!urgentExpiring.length || typeof Notification === "undefined") return;
    const fire = () => {
      try {
        new Notification("سجلّ المستودع — تنبيه صلاحية", {
          body: `${urgentExpiring.length} صنفاً قريب من انتهاء الصلاحية أو منتهي بالفعل`,
          tag: "warehouse-expiry",
        });
      } catch {}
    };
    if (Notification.permission === "granted") fire();
    else if (Notification.permission !== "denied") {
      Notification.requestPermission().then((p) => { if (p === "granted") fire(); });
    }
  }, [inventory]);

  const recent = useMemo(() => {
    const emojiByCode = new Map(data.items.map((it) => [it.code, it.emoji]));
    const inRows = data.incoming.map((r) => ({ ...r, kind: "in", emoji: emojiByCode.get(r.code) }));
    const outRows = data.outgoing.map((r) => ({ ...r, kind: "out", emoji: emojiByCode.get(r.code) }));
    return [...inRows, ...outRows]
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id.localeCompare(a.id))
      .slice(0, 8);
  }, [data]);

  // توزيع الأصناف حسب المجموعة (نوع الصنف: بلاستيك، صحون...) — مع النسبة المئوية
  const byGroup = useMemo(() => {
    const nameOf = (id) => data.itemGroups.find((g) => g.id === id)?.name;
    const map = new Map();
    inventory.forEach((i) => {
      const g = nameOf(i.group) || "بدون مجموعة";
      map.set(g, (map.get(g) || 0) + 1);
    });
    const totalItems = inventory.length || 1;
    return [...map.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([name, count]) => ({ name, count, pct: Math.round((count / totalItems) * 100) }));
  }, [inventory, data.itemGroups]);

  const stats = [
    { label: "إجمالي الأصناف", value: total, icon: Boxes, tone: "navy", action: () => go(readOnly ? "inventory" : "items") },
    { label: "متوفرة", value: available, icon: Check, tone: "green", action: () => go("inventory") },
    { label: "مخزون منخفض", value: low, icon: TriangleAlert, tone: "amber", action: () => go("inventory") },
    { label: "نفدت كمياتها", value: empty, icon: AlertTriangle, tone: "red", action: () => go("inventory") },
  ];

  const maxGroup = Math.max(1, ...byGroup.map((g) => g.count));

  return (
    <div className="page">
      <PageHeader
        eyebrow="نظرة عامة" title="لوحة التحكم" subtitle="ملخص سريع لحالة المستودع اليوم"
        action={<button className="btn-ghost" onClick={() => (onPrint ? onPrint() : window.print())}><Download size={15} /> طباعة / PDF</button>}
      />

      {critical.length > 0 && (
        <div className="alert-banner">
          <TriangleAlert size={18} />
          <div className="alert-banner-text">
            <strong>{critical.length} صنفاً بحاجة لانتباه:</strong>{" "}
            {critical.map((i) => i.name).join("، ")}
          </div>
          <button className="btn-ghost alert-banner-btn" onClick={() => go("inventory")}>عرض المخزون</button>
        </div>
      )}

      {expiring.length > 0 && (
        <div className="alert-banner alert-banner-expiry">
          <Clock size={18} />
          <div className="alert-banner-text">
            <strong>{expiring.length} صنفاً قريب من انتهاء الصلاحية:</strong>{" "}
            {expiring.map((i) => `${i.name} (${i.daysLeft <= 0 ? "منتهي" : i.daysLeft + "ي"})`).join("، ")}
          </div>
        </div>
      )}

      <div className="stat-grid">
        {stats.map((s) => (
          <button key={s.label} className={`stat-card tone-${s.tone}`} onClick={s.action}>
            <s.icon size={20} strokeWidth={2} />
            <div className="stat-value">{s.value}</div>
            <div className="stat-label">{s.label}</div>
          </button>
        ))}
      </div>

      <div className="panel">
        <div className="panel-head">
          <span className="panel-title">توزيع الأصناف حسب المجموعة</span>
          <span className="panel-sub">نسبة كل مجموعة من إجمالي عدد الأصناف — بلاستيك، صحون، ورقيات…</span>
        </div>
        <div className="mini-chart">
          {byGroup.length === 0 ? (
            <EmptyState icon={Layers} title="لا توجد مجموعات مسجّلة" />
          ) : byGroup.map((g) => (
            <div className="mini-chart-row" key={g.name}>
              <span className="mini-chart-label">{suggestEmojiForGroup(g.name) ? `${suggestEmojiForGroup(g.name)} ` : ""}{g.name}</span>
              <div className="mini-chart-track">
                <div className="mini-chart-bar mini-chart-bar-amber" style={{ width: `${(g.count / maxGroup) * 100}%` }} />
              </div>
              <span className="mini-chart-val">{g.count} <span className="mini-chart-pct">({g.pct}%)</span></span>
            </div>
          ))}
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <span className="panel-title">آخر الحركات</span>
          <span className="panel-sub">أحدث 8 عمليات دخول وخروج</span>
        </div>
        {recent.length === 0 ? (
          <EmptyState icon={Clock} title="لا توجد حركات بعد" hint="سجّل أول عملية دخول أو خروج ليظهر السجل هنا" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>النوع</th>
                  <th>الصنف</th>
                  <th>الكود</th>
                  <th>الكمية</th>
                  <th>التاريخ</th>
                </tr>
              </thead>
              <tbody>
                {recent.map((r) => (
                  <tr key={r.kind + r.id}>
                    <td>
                      <span className={`move-pill move-${r.kind}`}>
                        {r.kind === "in" ? <ArrowDownToLine size={13} /> : <ArrowUpFromLine size={13} />}
                        {r.kind === "in" ? "داخل" : "خارج"}
                      </span>
                    </td>
                    <td className="cell-strong">{r.emoji ? `${r.emoji} ` : ""}{r.name}</td>
                    <td><CodeTag code={r.code} /></td>
                    <td className="cell-mono">{r.qty}</td>
                    <td className="cell-mono">{fmtDate(r.date)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

  return (

      <div>
        {eyebrow && <div className="page-eyebrow">{eyebrow}</div>}
        <h1 className="page-title">{title}</h1>
        {subtitle && <p className="page-subtitle">{subtitle}</p>}

function ItemsPage({ data, setData, notify, readOnly, onPrint }) {
  const [query, setQuery] = useState("");
  const [modal, setModal] = useState(null); // { mode: 'add'|'edit', item }
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);

  const filtered = data.items.filter((it) =>
    (it.name + it.code + it.category).toLowerCase().includes(query.toLowerCase())
  );

  const openAdd = () => setModal({ mode: "add", item: { code: "", name: "", category: "", notes: "", minQty: "", expiryDate: "", emoji: "", group: "" } });
  const openEdit = (item) => setModal({ mode: "edit", item: { ...item } });

  const save = (item) => {
    if (!item.code.trim() || !item.name.trim()) {
      notify("الكود واسم المنتج مطلوبان", "error");
      return;
    }
    const exists = data.items.some((i) => i.code === item.code && i.code !== modal.item.__originalCode);
    if (modal.mode === "add" && data.items.some((i) => i.code === item.code)) {
      notify("هذا الكود مسجّل مسبقاً لصنف آخر", "error");
      return;
    }
    let items;
    if (modal.mode === "add") {
      items = [...data.items, item];
    } else {
      items = data.items.map((i) => (i.code === modal.item.code ? item : i));
    }
    setData({ ...data, items });
    setModal(null);
    notify(modal.mode === "add" ? "تمت إضافة الصنف" : "تم حفظ التعديلات");
  };

  const remove = (code) => {
    setData({
      ...data,
      items: data.items.filter((i) => i.code !== code),
    });
    setConfirmDelete(null);
    notify("تم حذف الصنف");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="الجرد"
        title="قائمة الأغراض"
        subtitle={`${data.items.length} صنفاً مسجلاً في المستودع`}
        action={
          !readOnly && (
            <button className="btn-primary" onClick={openAdd}>
              <Plus size={16} /> إضافة غرض
            </button>
          )
        }
      />

      <div className="toolbar">
        <div className="search-box">
          <Search size={16} />
          <input placeholder="ابحث بالاسم أو الكود أو الموقع…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
            <Camera size={15} />
          </button>
        </div>
        <button className="btn-ghost" onClick={() => downloadCSV("قائمة_الاغراض.csv", data.items, ["code", "name", "category", "notes", "minQty"])}>
          <Download size={15} /> تصدير CSV
        </button>
        <button className="btn-ghost" onClick={() => (onPrint ? onPrint() : window.print())}>
          <Download size={15} /> طباعة / PDF
        </button>
        {!readOnly && (
          <label className="btn-ghost" style={{ cursor: "pointer" }}>
            <Download size={15} style={{ transform: "rotate(180deg)" }} /> استيراد CSV
            <input
              type="file" accept=".csv,text/csv" style={{ display: "none" }}
              onChange={(e) => {
                const file = e.target.files?.[0];
                e.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  const rows = parseCSV(String(reader.result || ""));
                  const byCode = new Map(data.items.map((it) => [it.code, it]));
                  let added = 0, updated = 0;
                  rows.forEach((r) => {
                    const code = (r.code || r["الكود"] || "").trim();
                    if (!code) return;
                    const item = {
                      code,
                      name: r.name || r["اسم المنتج"] || r["الاسم"] || "",
                      category: r.category || r["الموقع"] || r["الفئة"] || "",
                      notes: r.notes || r["ملاحظات"] || "",
                      minqty: undefined,
                    };
                    item.minQty = r.minqty || r["minQty"] || r["حد التنبيه"] || "";
                    if (byCode.has(code)) updated++; else added++;
                    byCode.set(code, item);
                  });
                  setData({ ...data, items: Array.from(byCode.values()) });
                  notify(`تم الاستيراد: ${added} صنفاً جديداً، ${updated} محدَّثاً`);
                };
                reader.readAsText(file, "UTF-8");
              }}
            />
          </label>
        )}
      </div>

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon={Package} title="لا توجد أصناف مطابقة" hint="جرّب كلمة بحث مختلفة أو أضف صنفاً جديداً" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>م</th>
                  <th>الكود</th>
                  <th>اسم المنتج</th>
                  <th>الموقع / الفئة</th>
                  <th>ملاحظات</th>
                  {!readOnly && <th></th>}
                </tr>
              </thead>
              <tbody>
                {filtered.map((it, idx) => (
                  <tr key={it.code}>
                    <td className="cell-mono">{idx + 1}</td>
                    <td><CodeTag code={it.code} /></td>
                    <td className="cell-strong">{it.emoji ? `${it.emoji} ` : ""}{it.name}</td>
                    <td className="cell-muted"><MapPin size={12} style={{ opacity: 0.5, marginLeft: 4 }} />{it.category || "—"}</td>
                    <td className="cell-muted">{it.notes || "—"}</td>
                    {!readOnly && (
                      <td>
                        <div className="row-actions">
                          <button className="icon-btn" onClick={() => openEdit(it)}><Pencil size={15} /></button>
                          <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(it)}><Trash2 size={15} /></button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal wide title={modal.mode === "add" ? "إضافة غرض جديد" : "تعديل بيانات الصنف"} onClose={() => setModal(null)}>
          <ItemForm item={modal.item} itemGroups={data.itemGroups} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">
            هل أنت متأكد من حذف «{confirmDelete.name}»؟ لن يؤثر هذا على السجلات السابقة في الداخل والخارج.
          </p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete.code)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/*  MOVEMENT FORM (shared shape for incoming / outgoing)               */
/* ------------------------------------------------------------------ */

function MovementPage({ kind, data, setData, notify, readOnly }) {
  const isOut = kind === "out";
  const rows = isOut ? data.outgoing : data.incoming;
  const [form, setForm] = useState({ code: "", name: "", date: todayISO(), qty: "", notes: "" });
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [scanFlash, setScanFlash] = useState(false);
  const [cameraOpen, setCameraOpen] = useState(false);

  const codeInputRef = React.useRef(null);
  const qtyInputRef = React.useRef(null);

  const inventory = useMemo(() => computeInventory(data), [data]);

  // Keep the scanner "aimed" at the code field — a handheld reader types into
  // whatever input currently has focus, so refocus it after every reset.
  useEffect(() => {
    codeInputRef.current?.focus();
  }, []);

  const suggestions = form.code
    ? data.items.filter((i) => i.code.includes(form.code) || i.name.includes(form.code)).slice(0, 6)
    : [];

  const pick = (item, focusQty = true) => {
    setForm((f) => ({ ...f, code: item.code, name: item.name }));
    setSuggestOpen(false);
    if (focusQty) setTimeout(() => qtyInputRef.current?.focus(), 0);
  };

  const balanceFor = (code) => inventory.find((i) => i.code === code)?.balance ?? null;

  // Shared resolution logic used by both the handheld-scanner (keyboard Enter)
  // path and the phone-camera live detection path.
  const resolveScannedCode = (raw) => {
    const clean = String(raw).trim();
    if (!clean) return;
    const exact = data.items.find((i) => i.code === clean);
    if (exact) {
      setScanFlash(true);
      setTimeout(() => setScanFlash(false), 350);
      pick(exact);
      return;
    }
    const partial = data.items.filter((i) => i.code.includes(clean) || i.name.includes(clean));
    if (partial.length === 1) {
      pick(partial[0]);
      return;
    }
    setForm((f) => ({ ...f, code: clean, name: "" }));
    notify("لم يتم التعرف على هذا الكود — تأكد من تسجيله في قائمة الأغراض", "error");
    setTimeout(() => codeInputRef.current?.select(), 0);
  };

  // Handheld barcode readers act like a keyboard: they "type" every digit of
  // the code within milliseconds, then send an Enter keystroke. We resolve
  // the item as soon as Enter arrives, so scanning needs zero clicks.
  const handleCodeKeyDown = (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    resolveScannedCode(form.code);
  };

  const handleCameraDetect = (value) => {
    setCameraOpen(false);
    resolveScannedCode(value);
  };

  const handleQtyKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submit();
    }
  };

  const submit = () => {
    const item = data.items.find((i) => i.code === form.code);
    if (!item) {
      notify("هذا الكود غير موجود في قائمة الأغراض", "error");
      return;
    }
    const qty = Number(form.qty);
    if (!qty || qty <= 0) {
      notify("أدخل كمية صحيحة أكبر من صفر", "error");
      return;
    }
    if (isOut) {
      const bal = balanceFor(form.code) ?? 0;
      if (qty > bal) {
        notify(`الكمية غير كافية — المتوفر حالياً ${bal} فقط`, "error");
        return;
      }
    }
    const entry = { id: kind + "-" + Date.now(), code: form.code, name: item.name, date: form.date || todayISO(), qty, notes: form.notes };
    const key = isOut ? "outgoing" : "incoming";
    setData({ ...data, [key]: [entry, ...rows] });
    setForm({ code: "", name: "", date: todayISO(), qty: "", notes: "" });
    notify(isOut ? "تم تسجيل خروج البضاعة" : "تم تسجيل دخول البضاعة");
    setTimeout(() => codeInputRef.current?.focus(), 0);
  };

  const sorted = [...rows].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const currentBalance = form.code ? balanceFor(form.code) : null;
  const insufficient = isOut && form.code && Number(form.qty) > (currentBalance ?? 0);
  const notFound = form.code && !data.items.some((i) => i.code === form.code);

  return (
    <div className="page">
      <PageHeader
        eyebrow={isOut ? "الحركة" : "الحركة"}
        title={isOut ? "تسجيل الخارج" : "تسجيل الداخل"}
        subtitle={isOut ? "إخراج بضاعة من المستودع" : "استلام بضاعة جديدة إلى المستودع"}
      />

      {readOnly ? (
        <div className="alert alert-info" style={{ margin: "0 0 16px" }}>
          <ShieldAlert size={15} /> وضع الزائر: يمكنك تصفّح السجل السابق فقط، ولا يمكنك تسجيل حركات جديدة.
        </div>
      ) : (
      <div className="panel form-panel">
        <div className="form-grid form-grid-move">
          <Field label={<span className="scan-label"><ScanLine size={13} /> كود المنتج <span className="scan-hint">جاهز للمسح</span></span>}>
            <div className="autocomplete">
              <div className="scan-input-row">
                <input
                  ref={codeInputRef}
                  className={`input mono scan-input ${scanFlash ? "scan-flash" : ""}`}
                  value={form.code}
                  onChange={(e) => { setForm({ ...form, code: e.target.value, name: "" }); setSuggestOpen(true); }}
                  onFocus={() => setSuggestOpen(true)}
                  onKeyDown={handleCodeKeyDown}
                  placeholder="وجّه قارئ الباركود إلى هنا وامسح…"
                  autoComplete="off"
                />
                <ScanCameraButton onClick={() => setCameraOpen(true)} />
              </div>
              {suggestOpen && suggestions.length > 0 && (
                <div className="suggest-list">
                  {suggestions.map((s) => (
                    <button key={s.code} className="suggest-item" onClick={() => pick(s)}>
                      <CodeTag code={s.code} />
                      <span>{s.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </Field>
          <Field label="اسم المنتج">
            <input className="input" value={form.name} disabled placeholder="يُعبأ تلقائياً بعد المسح" />
          </Field>
          <Field label="التاريخ">
            <input className="input mono" type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          </Field>
          <Field label="الكمية">
            <input
              ref={qtyInputRef}
              className="input mono"
              type="number"
              step="0.5"
              min="0"
              value={form.qty}
              onChange={(e) => setForm({ ...form, qty: e.target.value })}
              onKeyDown={handleQtyKeyDown}
              placeholder="0 — ثم Enter للتسجيل"
            />
          </Field>
          <Field label="ملاحظات">
            <input className="input" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="اختياري" />
          </Field>
        </div>

        {notFound && (
          <div className="alert alert-error"><AlertTriangle size={15} /> هذا الكود غير مسجّل في قائمة الأغراض — أضِفه أولاً من صفحة «قائمة الأغراض».</div>
        )}
        {!notFound && isOut && form.code && (
          <div className={`alert ${insufficient ? "alert-error" : "alert-info"}`}>
            {insufficient ? <AlertTriangle size={15} /> : <Boxes size={15} />}
            الكمية المتوفرة حالياً من «{form.name || form.code}»: <b className="mono">{currentBalance}</b>
            {insufficient && " — الكمية المطلوبة أكبر من المتوفر"}
          </div>
        )}

        <div className="form-actions">
          <button className={isOut ? "btn-danger" : "btn-primary"} onClick={submit}>
            {isOut ? <ArrowUpFromLine size={16} /> : <ArrowDownToLine size={16} />}
            {isOut ? "تسجيل الخروج" : "تسجيل الدخول"}
          </button>
        </div>
      </div>
      )}

      <div className="panel">
        <div className="panel-head">
          <span className="panel-title">السجل السابق</span>
          <span className="panel-sub">{rows.length} حركة مسجّلة</span>
        </div>
        {sorted.length === 0 ? (
          <EmptyState icon={isOut ? ArrowUpFromLine : ArrowDownToLine} title="لا توجد حركات مسجّلة بعد" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>الكود</th>
                  <th>اسم المنتج</th>
                  <th>التاريخ</th>
                  <th>الكمية</th>
                  <th>ملاحظات</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((r) => (
                  <tr key={r.id}>
                    <td><CodeTag code={r.code} /></td>
                    <td className="cell-strong">{r.name}</td>
                    <td className="cell-mono">{fmtDate(r.date)}</td>
                    <td className="cell-mono">{r.qty}</td>
                    <td className="cell-muted">{r.notes || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {cameraOpen && (
        <BarcodeCameraModal onDetect={handleCameraDetect} onClose={() => setCameraOpen(false)} />
      )}
    </div>
  );
}

function InventoryPage({ inventory, itemGroups, onPrint }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [locationFilter, setLocationFilter] = useState("all");
  const [groupFilter, setGroupFilter] = useState("all");
  const [view, setView] = useState("grid"); // grid | list — البطاقات هي الوضع الافتراضي
  const [sortKey, setSortKey] = useState("name");
  const [sortDir, setSortDir] = useState(1);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);

  const groupName = (id) => itemGroups.find((g) => g.id === id)?.name || "";

  const locations = useMemo(
    () => [...new Set(inventory.map((i) => i.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ar")),
    [inventory]
  );

  const filtered = inventory
    .filter((i) => (i.name + i.code + i.category).toLowerCase().includes(query.toLowerCase()))
    .filter((i) => statusFilter === "all" || i.status === statusFilter)
    .filter((i) => locationFilter === "all" || i.category === locationFilter)
    .filter((i) => groupFilter === "all" || i.group === groupFilter)
    .sort((a, b) => {
      if (sortKey === "daysLeft") {
        const va = a.daysLeft === null || a.daysLeft === undefined ? Infinity : a.daysLeft;
        const vb = b.daysLeft === null || b.daysLeft === undefined ? Infinity : b.daysLeft;
        return (va - vb) * sortDir;
      }
      const va = a[sortKey], vb = b[sortKey];
      if (typeof va === "number") return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb), "ar") * sortDir;
    });

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => -d);
    else { setSortKey(key); setSortDir(1); }
  };

  const SortHeader = ({ label, k }) => (
    <th onClick={() => toggleSort(k)} className="sortable">
      {label} {sortKey === k && <ChevronDown size={12} style={{ transform: sortDir === -1 ? "rotate(180deg)" : "none", display: "inline" }} />}
    </th>
  );

  return (
    <div className="page">
      <PageHeader eyebrow="الجرد" title="المخزون" subtitle="الأرصدة الحالية محسوبة تلقائياً من حركات الدخول والخروج" />

      <div className="toolbar">
        <div className="search-box">
          <Search size={16} />
          <input placeholder="ابحث بالاسم أو الكود…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
            <Camera size={15} />
          </button>
        </div>
        <div className="filter-chips">
          {[
            { k: "all", label: "الكل" },
            { k: "available", label: "متوفر" },
            { k: "low", label: "منخفض" },
            { k: "empty", label: "نفد" },
          ].map((f) => (
            <button key={f.k} className={`chip ${statusFilter === f.k ? "chip-active" : ""}`} onClick={() => setStatusFilter(f.k)}>
              {f.label}
            </button>
          ))}
        </div>
        {itemGroups.length > 0 && (
          <select className="input location-select" value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)}>
            <option value="all">كل المجموعات</option>
            {itemGroups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
        )}
        {locations.length > 0 && (
          <select className="input location-select" value={locationFilter} onChange={(e) => setLocationFilter(e.target.value)}>
            <option value="all">كل المواقع</option>
            {locations.map((loc) => <option key={loc} value={loc}>{loc}</option>)}
          </select>
        )}
        <div className="view-toggle">
          <button className={`chip ${view === "grid" ? "chip-active" : ""}`} onClick={() => setView("grid")}>بطاقات</button>
          <button className={`chip ${view === "list" ? "chip-active" : ""}`} onClick={() => setView("list")}>جدول</button>
        </div>
        <button
          className="btn-ghost"
          onClick={() => downloadCSV("المخزون.csv", filtered, ["code", "name", "category", "inQty", "outQty", "balance", "status"])}
        >
          <Download size={15} /> تصدير CSV
        </button>
        <button className="btn-ghost" onClick={() => (onPrint ? onPrint() : window.print())}>
          <Download size={15} /> طباعة / PDF
        </button>
      </div>

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon={Boxes} title="لا توجد نتائج" hint="جرّب تغيير الفلتر أو كلمة البحث" />
        ) : view === "grid" ? (
          <div className="inv-card-grid">
            {filtered.map((i) => (
              <div className="inv-card" key={i.code}>
                <div className="inv-card-head">
                  <span className="cell-strong">{i.emoji ? `${i.emoji} ` : ""}{i.name}</span>
                  <StampBadge status={i.status} />
                </div>
                <CodeTag code={i.code} />
                <div className="inv-card-loc"><MapPin size={12} style={{ opacity: 0.55 }} /> {i.category || "—"}{groupName(i.group) ? ` · ${groupName(i.group)}` : ""}</div>
                {i.expiry && <ExpiryBadge expiry={i.expiry} daysLeft={i.daysLeft} />}
                <div className="inv-card-balance">{i.balance} <span className="inv-card-balance-unit">الكمية</span></div>
              </div>
            ))}
          </div>
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <SortHeader label="الكود" k="code" />
                  <SortHeader label="اسم المنتج" k="name" />
                  <SortHeader label="الفئة / الموقع" k="category" />
                  <SortHeader label="الداخل" k="inQty" />
                  <SortHeader label="الخارج" k="outQty" />
                  <SortHeader label="الكمية" k="balance" />
                  <th>الحالة</th>
                  <SortHeader label="الصلاحية" k="daysLeft" />
                </tr>
              </thead>
              <tbody>
                {filtered.map((i) => (
                  <tr key={i.code}>
                    <td><CodeTag code={i.code} /></td>
                    <td className="cell-strong">{i.emoji ? `${i.emoji} ` : ""}{i.name}</td>
                    <td className="cell-muted">{i.category || "—"}</td>
                    <td className="cell-mono">{i.inQty}</td>
                    <td className="cell-mono">{i.outQty}</td>
                    <td className="cell-mono cell-balance">{i.balance}</td>
                    <td><StampBadge status={i.status} /></td>
                    <td>{i.expiry ? <ExpiryBadge expiry={i.expiry} daysLeft={i.daysLeft} /> : "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function BarcodesPage({ data, setData, notify, readOnly }) {
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const openAdd = () => setModal({ mode: "add", row: { name: "", number: "" } });
  const openEdit = (row, idx) => setModal({ mode: "edit", row: { ...row }, idx });

  const save = (row) => {
    if (!row.name.trim() || !row.number.trim()) {
      notify("الاسم والرقم مطلوبان", "error");
      return;
    }
    let barcodes;
    if (modal.mode === "add") barcodes = [...data.barcodes, row];
    else barcodes = data.barcodes.map((b, i) => (i === modal.idx ? row : b));
    setData({ ...data, barcodes });
    setModal(null);
    notify(modal.mode === "add" ? "تمت إضافة الباركود" : "تم حفظ التعديلات");
  };

  const remove = (idx) => {
    setData({ ...data, barcodes: data.barcodes.filter((_, i) => i !== idx) });

function GlobalSearch({ data, inventory, go }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);
  const results = q.length > 1
    ? inventory.filter((i) => (i.name + i.code).toLowerCase().includes(q.toLowerCase())).slice(0, 6)
    : [];

  return (
    <div className="global-search">
      <Search size={15} />
      <input
        placeholder="بحث عام بالكود أو الاسم…"
        value={q}
        onChange={(e) => { setQ(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      <button
        type="button"
        className="search-cam-btn"
        title="بحث بالكاميرا"
        onMouseDown={(e) => e.preventDefault()}

      >
        <Camera size={15} />
      </button>
      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQ(code); setOpen(true); setSearchCameraOpen(false); }}

      )}
      {open && results.length > 0 && (
        <div className="global-results">
          {results.map((r) => (
            <button key={r.code} className="global-result-item" onMouseDown={() => { go("inventory"); setQ(""); setOpen(false); }}>
              <div>
                <div className="cell-strong">{r.emoji ? `${r.emoji} ` : ""}{r.name}</div>
                <CodeTag code={r.code} />

const TEMP_DURATIONS = [
  { key: "1d", label: "يوم واحد", ms: 24 * 3600 * 1000 },
  { key: "3d", label: "3 أيام", ms: 3 * 24 * 3600 * 1000 },
  { key: "7d", label: "7 أيام", ms: 7 * 24 * 3600 * 1000 },
  { key: "30d", label: "30 يوماً", ms: 30 * 24 * 3600 * 1000 },
];

function randomPassword() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  return Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join("");
}

function UsersPage({ data, setData, notify }) {
  const [modal, setModal] = useState(null); // { mode, user }
  const [confirmDelete, setConfirmDelete] = useState(null);

  const openAdd = () => setModal({ mode: "add", user: { username: "", password: randomPassword(), canEdit: true, temp: false, durationKey: "1d" } });
  const openEdit = (u) => setModal({ mode: "edit", user: { ...u, temp: !!u.tempUntil, durationKey: "1d" } });

  const save = (form) => {
    const username = form.username.trim();
    if (!username || !form.password.trim()) {
      notify("اسم المستخدم وكلمة المرور مطلوبان", "error");
      return;
    }
    const dup = data.users.some((u) => u.username === username && u.id !== form.id);
    if (dup) { notify("اسم المستخدم مستخدم بالفعل", "error"); return; }

    const tempUntil = form.temp
      ? new Date(Date.now() + (TEMP_DURATIONS.find((d) => d.key === form.durationKey)?.ms || 0)).toISOString()
      : null;

    const record = {
      id: form.id || genId("user"),
      username,
      password: form.password.trim(),
      canEdit: !!form.canEdit,
      tempUntil,
      createdAt: form.createdAt || Date.now(),
    };

    const exists = data.users.some((u) => u.id === record.id);
    const users = exists ? data.users.map((u) => (u.id === record.id ? record : u)) : [...data.users, record];
    setData({ ...data, users });
    setModal(null);
    notify(exists ? "تم تحديث بيانات المستخدم" : "تمت إضافة المستخدم");
  };

  const remove = (id) => {
    setData({ ...data, users: data.users.filter((u) => u.id !== id) });
    setConfirmDelete(null);
    notify("تم حذف المستخدم");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="إدارة الوصول" title="المستخدمون" subtitle="حسابات دخول بكلمة مرور دائمة أو مؤقتة، مع تحديد هل يقدر يعدّل أو للقراءة فقط"
        action={<button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة مستخدم</button>}
      />
      <div className="panel">
        {data.users.length === 0 ? (
          <EmptyState icon={Users} title="لا يوجد مستخدمون بعد" hint="أضف مستخدماً بكلمة مرور دائمة أو مؤقتة" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr><th>اسم المستخدم</th><th>الصلاحية</th><th>كلمة المرور</th><th>المدة</th><th></th></tr>
              </thead>
              <tbody>
                {data.users.map((u) => {
                  const expired = isTempExpired(u);
                  return (
                    <tr key={u.id}>
                      <td className="cell-strong">{u.username}</td>
                      <td>
                        <span className="stamp-badge" style={u.canEdit
                          ? { color: "#3F6D4E", borderColor: "#3F6D4E", background: "#E9F1E9" }
                          : { color: "#5B6570", borderColor: "#5B6570", background: "#EEE9DA" }}>
                          {u.canEdit ? "يقدر يعدّل" : "قراءة فقط"}
                        </span>
                      </td>
                      <td className="cell-mono">{u.password}</td>
                      <td>
                        {u.tempUntil ? (
                          <span className="stamp-badge" style={{
                            color: expired ? "#B23A2E" : "#B3792C",
                            borderColor: expired ? "#B23A2E" : "#B3792C",
                            background: expired ? "#FAE6E2" : "#FBF0DD",
                          }}>
                            <KeyRound size={11} style={{ marginLeft: 3, verticalAlign: "-1px" }} />
                            {expired ? "منتهية" : `مؤقتة حتى ${new Date(u.tempUntil).toLocaleString("ar-SA")}`}
                          </span>
                        ) : (
                          <span className="stamp-badge" style={{ color: "#3F6D4E", borderColor: "#3F6D4E", background: "#E9F1E9" }}>دائمة</span>
                        )}
                      </td>
                      <td>
                        <div className="row-actions">
                          <button className="icon-btn" onClick={() => openEdit(u)}><Pencil size={15} /></button>
                          <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(u)}><Trash2 size={15} /></button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal wide title={modal.mode === "add" ? "إضافة مستخدم" : "تعديل المستخدم"} onClose={() => setModal(null)}>
          <UserForm user={modal.user} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">هل تريد حذف المستخدم «{confirmDelete.username}»؟ لن يتمكن من الدخول بعدها.</p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete.id)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

          </label>
        </div>
      </Field>
      {form.temp && (
        <Field label="مدة الصلاحية">
          <select className="input" value={form.durationKey} onChange={(e) => setForm({ ...form, durationKey: e.target.value })}>
            {TEMP_DURATIONS.map((d) => <option key={d.key} value={d.key}>{d.label}</option>)}
          </select>
        </Field>
      )}
      <div className="modal-actions">
        <button className="btn-ghost" onClick={onCancel}>إلغاء</button>
        <button className="btn-primary" onClick={() => onSave(form)}><Check size={15} /> حفظ</button>
      </div>
    </div>
  );

}

function GroupsPage({ data, setData, notify }) {
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const countFor = (id) => data.items.filter((i) => i.group === id).length;

  const openAdd = () => setModal({ mode: "add", group: { name: "" } });
  const openEdit = (g) => setModal({ mode: "edit", group: { ...g } });

  const save = (form) => {
    if (!form.name.trim()) { notify("اسم المجموعة مطلوب", "error"); return; }
    const record = { id: form.id || genId("grp"), name: form.name.trim() };
    const exists = data.itemGroups.some((g) => g.id === record.id);
    const itemGroups = exists ? data.itemGroups.map((g) => (g.id === record.id ? record : g)) : [...data.itemGroups, record];
    setData({ ...data, itemGroups });
    setModal(null);
    notify(exists ? "تم تحديث المجموعة" : "تمت إضافة المجموعة");
  };

  const remove = (id) => {
    // الأصناف المرتبطة بهذه المجموعة تبقى بدون مجموعة بدل ما تُحذف
    const items = data.items.map((i) => (i.group === id ? { ...i, group: "" } : i));
    setData({ ...data, itemGroups: data.itemGroups.filter((g) => g.id !== id), items });
    setConfirmDelete(null);
    notify("تم حذف المجموعة");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="تصنيف الأصناف" title="المجموعات" subtitle="نوع الصنف — مثل بلاستيك، صحون، ورقيات — يسهّل التصفية والتنظيم"
        action={<button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة مجموعة</button>}
      />
      <div className="panel">
        {data.itemGroups.length === 0 ? (
          <EmptyState icon={Layers} title="لا توجد مجموعات بعد" hint="أضف مجموعة مثل «بلاستيك» أو «صحون» لتصنيف الأصناف عليها" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead><tr><th>اسم المجموعة</th><th>عدد الأصناف</th><th></th></tr></thead>
              <tbody>
                {data.itemGroups.map((g) => (
                  <tr key={g.id}>
                    <td className="cell-strong">{suggestEmojiForGroup(g.name) ? `${suggestEmojiForGroup(g.name)} ` : ""}{g.name}</td>
                    <td className="cell-mono">{countFor(g.id)}</td>
                    <td>
                      <div className="row-actions">
                        <button className="icon-btn" onClick={() => openEdit(g)}><Pencil size={15} /></button>
                        <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(g)}><Trash2 size={15} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal title={modal.mode === "add" ? "إضافة مجموعة" : "تعديل المجموعة"} onClose={() => setModal(null)}>
          <GroupForm group={modal.group} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">هل تريد حذف مجموعة «{confirmDelete.name}»؟ الأصناف المرتبطة بها تبقى موجودة بدون مجموعة.</p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete.id)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function ChangeOwnerPasswordModal({ currentPassword, currentRecoveryQuestion, currentRecoveryAnswer, onSave, onClose, notify }) {
  const [oldPass, setOldPass] = useState("");
  const [newPass, setNewPass] = useState("");
  const [newPass2, setNewPass2] = useState("");
  const [recoveryQuestion, setRecoveryQuestion] = useState(currentRecoveryQuestion || "");
  const [recoveryAnswer, setRecoveryAnswer] = useState(currentRecoveryAnswer || "");

  const submit = () => {
    if (oldPass !== currentPassword) { notify("كلمة المرور الحالية غير صحيحة", "error"); return; }
    if (!newPass.trim() || newPass.length < 4) { notify("كلمة المرور الجديدة قصيرة جداً", "error"); return; }
    if (newPass !== newPass2) { notify("كلمتا المرور الجديدتان غير متطابقتين", "error"); return; }
    if ((recoveryQuestion.trim() && !recoveryAnswer.trim()) || (!recoveryQuestion.trim() && recoveryAnswer.trim())) {
      notify("لاستخدام استرداد كلمة المرور، أدخل السؤال والإجابة معاً", "error");
      return;
    }
    onSave({ password: newPass, recoveryQuestion: recoveryQuestion.trim(), recoveryAnswer: recoveryAnswer.trim() });
    onClose();
  };

  return (
    <Modal title="تغيير كلمة مرور رئيس الموقع" onClose={onClose}>
      <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
        <Field label="كلمة المرور الحالية">
          <input type="password" className="input" value={oldPass} onChange={(e) => setOldPass(e.target.value)} />
        </Field>
        <Field label="كلمة المرور الجديدة">
          <input type="password" className="input" value={newPass} onChange={(e) => setNewPass(e.target.value)} />
        </Field>
        <Field label="تأكيد كلمة المرور الجديدة">
          <input type="password" className="input" value={newPass2} onChange={(e) => setNewPass2(e.target.value)} />
        </Field>
        <div className="modal-section-divider">استرداد كلمة المرور (اختياري)</div>
        <Field label="سؤال استرداد — يُستخدم لو نسيت كلمة المرور لاحقاً">
          <input className="input" value={recoveryQuestion} onChange={(e) => setRecoveryQuestion(e.target.value)} placeholder="مثال: ما اسم أول موقع عملت فيه؟" />
        </Field>
        <Field label="الإجابة">
          <input className="input" value={recoveryAnswer} onChange={(e) => setRecoveryAnswer(e.target.value)} placeholder="إجابتك" />
        </Field>
        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>إلغاء</button>
          <button className="btn-primary" onClick={submit}><Check size={15} /> حفظ</button>
        </div>
      </div>
    </Modal>
  );
}

      <div className="panel">
        {log.length === 0 ? (
          <EmptyState icon={Clock} title="لا يوجد نشاط مسجّل بعد" hint="سيظهر هنا كل إضافة أو تعديل أو حذف تقوم به" />
        ) : (
          <div className="table-wrap">
