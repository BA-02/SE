<!-- طبقة تخزين سحابية: Supabase (PostgreSQL + Realtime) -->
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // بيانات مشروع Supabase
  const SUPABASE_URL = "https://beezqxxltabbmfqdyxne.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cCO8hXnwLocQfw5SGTjDtw_3ZQAZDvO";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const TABLE = "warehouse_state";

  window.storage = {
    async get(key) {
      const { data, error } = await supabase
        .from(TABLE)
        .select("key,value")
        .eq("key", key)
        .maybeSingle();
      if (error) throw error;
      if (!data) return null;
      return { key: data.key, value: data.value };
    },
    async set(key, value) {
      const { error } = await supabase
        .from(TABLE)
        .upsert({ key, value: String(value), updated_at: new Date().toISOString() }, { onConflict: "key" });
      if (error) throw error;
      return { key, value };
    },
    async delete(key) {
      const { data, error } = await supabase
        .from(TABLE)
        .delete()
        .eq("key", key)
        .select("key")
        .maybeSingle();
      if (error) throw error;
      return { key, deleted: !!data };
    },
    async list(prefix) {
      let q = supabase.from(TABLE).select("key");
      if (prefix) q = q.like("key", `${prefix}%`);
      const { data, error } = await q;
      if (error) throw error;
      return { keys: (data || []).map(r => r.key), prefix };
    }
  };

  // مزامنة فورية بين جميع الأجهزة عبر Supabase Realtime
  window.subscribeStorage = function (key, callback) {
    const channel = supabase
      .channel(`warehouse-state-${key}`)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: TABLE, filter: `key=eq.${key}` },
        (payload) => {
          if (payload.eventType === "DELETE") return;
          const row = payload.new;
          if (row && row.key === key) callback(row.value, false);
        }
      )
      .subscribe();

    return () => { supabase.removeChannel(channel); };
  };

  window.supabase = supabase;
</script>

/* True, scannable barcode (Code128) rendered as SVG — falls back to a
   placeholder if the number isn't a valid barcode value. */
function RealBarcode({ value, height = 34 }) {
  const svgRef = React.useRef(null);
  const [ok, setOk] = useState(true);
  useEffect(() => {
    if (!svgRef.current) return;
    try {
      JsBarcode(svgRef.current, String(value || ""), {
        format: "CODE128", displayValue: false, margin: 0, height, width: 1.6,
        background: "transparent", lineColor: "#23303A",
      });
      setOk(true);
    } catch { setOk(false); }
  }, [value, height]);
  if (!value) return null;
  return ok ? <svg ref={svgRef} className="real-barcode" /> : (
    <div className="barcode-stripes" aria-hidden="true">
      {Array.from({ length: 28 }).map((_, i) => <span key={i} style={{ width: (i % 5 === 0 ? 3 : 1) + "px" }} />)}

  );
}

let __audioCtx = null;
function playBeep(kind = "success") {
  try {
    __audioCtx = __audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __audioCtx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.value = kind === "error" ? 220 : 880;
    g.gain.value = 0.001;
    const t0 = ctx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (kind === "error" ? 0.28 : 0.14));
    o.start(t0);
    o.stop(t0 + (kind === "error" ? 0.3 : 0.16));
    if (kind === "error") {
      const o2 = ctx.createOscillator();
      o2.connect(g); o2.type = "sine"; o2.frequency.value = 160;
      o2.start(t0 + 0.15); o2.stop(t0 + 0.3);
    }
  } catch {}
}
function hapticPulse(kind = "success") {
  try { navigator.vibrate?.(kind === "error" ? [40, 40, 40] : 30); } catch {}
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const clean = rows.filter((r) => r.some((c) => String(c).trim() !== ""));
  if (!clean.length) return [];
  const headers = clean[0].map((h) => h.trim().toLowerCase());
  return clean.slice(1).map((r) => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] ?? "").trim(); });
    return obj;
  });
}

/*  PERSISTENCE                                                       */

const STORE_KEY = "warehouse-data-v1";
// Data now lives in Supabase and syncs in real time across devices
// (laptop, phone, tablet) via window.subscribeStorage — see the Supabase layer above.

function useStore(onRemoteUpdate) {
  const [data, setData] = useState(null);
  const [saving, setSaving] = useState(false);
  const [online, setOnline] = useState(true);
  const [lastSynced, setLastSynced] = useState(null);
  const dataRef = React.useRef(null);

  useEffect(() => {
    let cancelled = false;
    let unsub = null;
    (async () => {
      try {
        const res = await window.storage?.get(STORE_KEY, false);
        if (!cancelled) {
          if (res?.value) {
            dataRef.current = JSON.parse(res.value);
            setData(dataRef.current);
          } else {
            const seed = { items: seedItems, incoming: seedIncoming, outgoing: seedOutgoing, barcodes: seedBarcodes };
            dataRef.current = seed;
            setData(seed);
            await window.storage?.set(STORE_KEY, JSON.stringify(seed), false);
          }
          setOnline(true);
          setLastSynced(Date.now());
        }
      } catch {
        if (!cancelled) {
          const seed = { items: seedItems, incoming: seedIncoming, outgoing: seedOutgoing, barcodes: seedBarcodes };
          dataRef.current = seed;
          setData(seed);
          setOnline(false);
        }
      }
      // مزامنة فورية: أي تعديل يحصل من جهاز آخر يصل هنا تلقائياً بدون تحديث الصفحة
      if (!cancelled && window.subscribeStorage) {
        unsub = window.subscribeStorage(STORE_KEY, (rawValue, isLocalWrite) => {
          if (cancelled || isLocalWrite) return; // تجاهل صدى تعديلاتنا نحن
          try {
            const next = JSON.parse(rawValue);
            dataRef.current = next;
            setData(next);
            setOnline(true);
            setLastSynced(Date.now());
            onRemoteUpdate?.();
          } catch {}
        });
      }
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, []);

  const OFFLINE_KEY = "warehouse-offline-pending-v1";

  const persist = useCallback(async (next) => {
    dataRef.current = next;
    setData(next);
    setSaving(true);
    try {
      await window.storage?.set(STORE_KEY, JSON.stringify(next), false);
      setOnline(true);
      setLastSynced(Date.now());
      try { localStorage.removeItem(OFFLINE_KEY); } catch {}
    } catch {
      // لا يوجد اتصال بالإنترنت: نحفظ التعديل محلياً وننتظر عودة الاتصال
      setOnline(false);
      try { localStorage.setItem(OFFLINE_KEY, JSON.stringify(next)); } catch {}
    } finally {
      setSaving(false);
    }
  }, []);

  // عند عودة الاتصال، حاول مزامنة أي تعديلات محفوظة محلياً أثناء الانقطاع
  useEffect(() => {
    const flush = async () => {
      let pending = null;
      try { pending = localStorage.getItem(OFFLINE_KEY); } catch {}
      if (!pending) return;
      try {
        await window.storage?.set(STORE_KEY, pending, false);
        try { localStorage.removeItem(OFFLINE_KEY); } catch {}
        setOnline(true);
        setLastSynced(Date.now());
      } catch {}
    };
    window.addEventListener("online", flush);
    flush();
    return () => window.removeEventListener("online", flush);
  }, []);

  return [data, persist, saving, { online, lastSynced }];
}

function computeInventory(data) {
  const { items, incoming, outgoing } = data;
  return items.map((item) => {
    const inQty = incoming.filter((r) => r.code === item.code).reduce((s, r) => s + Number(r.qty || 0), 0);
    const outQty = outgoing.filter((r) => r.code === item.code).reduce((s, r) => s + Number(r.qty || 0), 0);
    const balance = Math.round((inQty - outQty) * 100) / 100;
    const threshold = Number(item.minQty) > 0 ? Number(item.minQty) : LOW_STOCK_THRESHOLD;
    let status = "available";
    if (balance <= 0) status = "empty";
    else if (balance <= threshold) status = "low";
    return { ...item, inQty, outQty, balance, status, threshold };
  });
}

function fmtDate(d) {
  if (!d) return "—";
  try {
    return new Intl.DateTimeFormat("ar-SA-u-nu-latn", { day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(d));
  } catch {
    return d;
  }
}

function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(esc).join(",")];
  rows.forEach((r) => lines.push(headers.map((h) => esc(r[h])).join(",")));
  return lines.join("\n");
}

function downloadCSV(filename, rows, headers) {
  const csv = "\uFEFF" + toCSV(rows, headers);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

/* -------------------- CAMERA BARCODE SCANNER -------------------- */
/* Uses the phone/laptop camera with the browser's native BarcodeDetector
   API — no external library needed. Falls back to manual entry when the
   browser doesn't support live detection (e.g. Safari on iPhone today). */

function BarcodeCameraModal({ onDetect, onClose }) {
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const [status, setStatus] = useState("initializing"); // initializing | scanning | unsupported | denied | error
  const [manualCode, setManualCode] = useState("");

  useEffect(() => {
    let cancelled = false;

    function cleanup() {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      streamRef.current?.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }

    async function start() {
      if (typeof window === "undefined" || !("BarcodeDetector" in window)) {
        setStatus("unsupported");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        setStatus("scanning");

        let detector;
        try {
          detector = new window.BarcodeDetector({
            formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "codabar", "itf", "qr_code"],
          });
        } catch {
          detector = new window.BarcodeDetector();
        }

        const tick = async () => {
          if (cancelled || !videoRef.current) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes && codes.length > 0) {
              const value = (codes[0].rawValue || "").trim();
              if (value) {
                cancelled = true;
                cleanup();
                playBeep("success");
                hapticPulse("success");
                onDetect(value);
                return;
              }
            }
          } catch {
            /* ignore per-frame decode errors */
          }
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
      } catch (err) {
        setStatus(err && err.name === "NotAllowedError" ? "denied" : "error");
      }
    }

    start();
    return () => {
      cancelled = true;
      cleanup();
    };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const submitManual = () => {
    const v = manualCode.trim();
    if (v) onDetect(v);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet camera-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <span className="modal-title"><Camera size={16} style={{ verticalAlign: "-2px", marginLeft: 6 }} /> مسح بالكاميرا</span>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="modal-body camera-body">
          {status === "scanning" || status === "initializing" ? (
            <div className="camera-frame">
              <video ref={videoRef} className="camera-video" muted playsInline />
              <div className="camera-reticle">
                <span className="reticle-corner tl" /><span className="reticle-corner tr" />
                <span className="reticle-corner bl" /><span className="reticle-corner br" />
                <div className="reticle-line" />
              </div>
              <div className="camera-status">
                {status === "initializing" ? "جارٍ تشغيل الكاميرا…" : "وجّه الكاميرا نحو الباركود"}
              </div>
            </div>
          ) : (
            <div className="camera-fallback">
              <ShieldAlert size={26} strokeWidth={1.5} />
              {status === "unsupported" && (
                <p>
                  متصفحك الحالي لا يدعم القراءة المباشرة للباركود بالكاميرا (مدعوم حالياً في Chrome على أندرويد بشكل أساسي).
                  اكتب الكود يدوياً بالأسفل، أو استخدم قارئ الباركود اليدوي.
                </p>
              )}
              {status === "denied" && <p>تم رفض إذن الكاميرا. فعّل إذن الكاميرا لهذا الموقع من إعدادات المتصفح ثم أعد المحاولة، أو اكتب الكود يدوياً.</p>}
              {status === "error" && <p>تعذّر تشغيل الكاميرا. تأكد من عدم استخدامها في تطبيق آخر، أو اكتب الكود يدوياً.</p>}
              <div className="camera-manual">
                <input
                  className="input mono"
                  autoFocus
                  placeholder="اكتب الكود هنا"
                  value={manualCode}
                  onChange={(e) => setManualCode(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); submitManual(); } }}
                />
                <button className="btn-primary" onClick={submitManual}><Check size={15} /> استخدام هذا الكود</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Dashboard({ inventory, data, go, readOnly }) {
  const total = inventory.length;
  const low = inventory.filter((i) => i.status === "low").length;
  const empty = inventory.filter((i) => i.status === "empty").length;
  const available = total - low - empty;
  const critical = useMemo(
    () => inventory.filter((i) => i.status !== "available").sort((a, b) => a.balance - b.balance).slice(0, 12),
    [inventory]
  );

  const recent = useMemo(() => {
    const inRows = data.incoming.map((r) => ({ ...r, kind: "in" }));
    const outRows = data.outgoing.map((r) => ({ ...r, kind: "out" }));
    return [...inRows, ...outRows]
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id.localeCompare(a.id))
      .slice(0, 8);
  }, [data]);

  // أكثر الأصناف حركة (دخول + خروج)
  const topMovers = useMemo(() => {
    const map = new Map();
    [...data.incoming, ...data.outgoing].forEach((r) => {
      map.set(r.code, (map.get(r.code) || 0) + Number(r.qty || 0));
    });
    return [...map.entries()]
      .map(([code, qty]) => ({ code, qty, name: data.items.find((i) => i.code === code)?.name || code }))
      .sort((a, b) => b.qty - a.qty)
      .slice(0, 6);
  }, [data]);

  // توزيع الأصناف حسب الموقع/الفئة
  const byLocation = useMemo(() => {
    const map = new Map();
    inventory.forEach((i) => {
      const loc = i.category || "بدون موقع";
      map.set(loc, (map.get(loc) || 0) + 1);
    });
    return [...map.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
  }, [inventory]);

  const stats = [
    { label: "إجمالي الأصناف", value: total, icon: Boxes, tone: "navy", action: () => go(readOnly ? "inventory" : "items") },
    { label: "متوفرة", value: available, icon: Check, tone: "green", action: () => go("inventory") },
    { label: "مخزون منخفض", value: low, icon: TriangleAlert, tone: "amber", action: () => go("inventory") },
    { label: "نفدت كمياتها", value: empty, icon: AlertTriangle, tone: "red", action: () => go("inventory") },
  ];

  const maxMover = Math.max(1, ...topMovers.map((m) => m.qty));
  const maxLoc = Math.max(1, ...byLocation.map((l) => l[1]));

  return (
    <div className="page">
      <PageHeader
        eyebrow="نظرة عامة" title="لوحة التحكم" subtitle="ملخص سريع لحالة المستودع اليوم"
        action={<button className="btn-ghost" onClick={() => window.print()}><Download size={15} /> طباعة / PDF</button>}
      />

      {critical.length > 0 && (
        <div className="alert-banner">
          <TriangleAlert size={18} />
          <div className="alert-banner-text">
            <strong>{critical.length} صنفاً بحاجة لانتباه:</strong>{" "}
            {critical.map((i) => i.name).join("، ")}
          </div>
          <button className="btn-ghost alert-banner-btn" onClick={() => go("inventory")}>عرض المخزون</button>
        </div>
      )}

      <div className="stat-grid">
        {stats.map((s) => (
          <button key={s.label} className={`stat-card tone-${s.tone}`} onClick={s.action}>
            <s.icon size={20} strokeWidth={2} />
            <div className="stat-value">{s.value}</div>
            <div className="stat-label">{s.label}</div>
          </button>
        ))}
      </div>

      <div className="chart-grid">
        <div className="panel">
          <div className="panel-head">
            <span className="panel-title">أكثر الأصناف حركة</span>
            <span className="panel-sub">إجمالي الدخول + الخروج لكل صنف</span>
          </div>
          <div className="mini-chart">
            {topMovers.length === 0 ? (
              <EmptyState icon={Boxes} title="لا توجد بيانات حركة بعد" />
            ) : topMovers.map((m) => (
              <div className="mini-chart-row" key={m.code}>
                <span className="mini-chart-label">{m.name}</span>
                <div className="mini-chart-track">
                  <div className="mini-chart-bar" style={{ width: `${(m.qty / maxMover) * 100}%` }} />
                </div>
                <span className="mini-chart-val">{m.qty}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="panel">
          <div className="panel-head">
            <span className="panel-title">توزيع الأصناف حسب الموقع</span>
            <span className="panel-sub">عدد الأصناف في كل رف / دولاب</span>
          </div>
          <div className="mini-chart">
            {byLocation.length === 0 ? (
              <EmptyState icon={MapPin} title="لا توجد مواقع مسجّلة" />
            ) : byLocation.map(([loc, count]) => (
              <div className="mini-chart-row" key={loc}>
                <span className="mini-chart-label">{loc}</span>
                <div className="mini-chart-track">
                  <div className="mini-chart-bar mini-chart-bar-amber" style={{ width: `${(count / maxLoc) * 100}%` }} />
                </div>
                <span className="mini-chart-val">{count}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <span className="panel-title">آخر الحركات</span>
          <span className="panel-sub">أحدث 8 عمليات دخول وخروج</span>
        </div>
        {recent.length === 0 ? (
          <EmptyState icon={Clock} title="لا توجد حركات بعد" hint="سجّل أول عملية دخول أو خروج ليظهر السجل هنا" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>النوع</th>
                  <th>الصنف</th>
                  <th>الكود</th>
                  <th>الكمية</th>
                  <th>التاريخ</th>
                </tr>
              </thead>
              <tbody>
                {recent.map((r) => (
                  <tr key={r.kind + r.id}>
                    <td>
                      <span className={`move-pill move-${r.kind}`}>
                        {r.kind === "in" ? <ArrowDownToLine size={13} /> : <ArrowUpFromLine size={13} />}
                        {r.kind === "in" ? "داخل" : "خارج"}
                      </span>
                    </td>
                    <td className="cell-strong">{r.name}</td>
                    <td><CodeTag code={r.code} /></td>
                    <td className="cell-mono">{r.qty}</td>
                    <td className="cell-mono">{fmtDate(r.date)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function ItemsPage({ data, setData, notify, readOnly }) {
  const [query, setQuery] = useState("");
  const [modal, setModal] = useState(null); // { mode: 'add'|'edit', item }
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);

  const filtered = data.items.filter((it) =>
    (it.name + it.code + it.category).toLowerCase().includes(query.toLowerCase())
  );

  const openAdd = () => setModal({ mode: "add", item: { code: "", name: "", category: "", notes: "", minQty: "" } });
  const openEdit = (item) => setModal({ mode: "edit", item: { ...item } });

  const save = (item) => {
    if (!item.code.trim() || !item.name.trim()) {
      notify("الكود واسم المنتج مطلوبان", "error");
      return;
    }
    const exists = data.items.some((i) => i.code === item.code && i.code !== modal.item.__originalCode);
    if (modal.mode === "add" && data.items.some((i) => i.code === item.code)) {
      notify("هذا الكود مسجّل مسبقاً لصنف آخر", "error");
      return;
    }
    let items;
    if (modal.mode === "add") {
      items = [...data.items, item];
    } else {
      items = data.items.map((i) => (i.code === modal.item.code ? item : i));
    }
    setData({ ...data, items });
    setModal(null);
    notify(modal.mode === "add" ? "تمت إضافة الصنف" : "تم حفظ التعديلات");
  };

  const remove = (code) => {
    setData({
      ...data,
      items: data.items.filter((i) => i.code !== code),
    });
    setConfirmDelete(null);
    notify("تم حذف الصنف");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="الجرد"
        title="قائمة الأغراض"
        subtitle={`${data.items.length} صنفاً مسجلاً في المستودع`}
        action={
          !readOnly && (
            <button className="btn-primary" onClick={openAdd}>
              <Plus size={16} /> إضافة غرض
            </button>
          )
        }
      />

      <div className="toolbar">
        <div className="search-box">
          <Search size={16} />
          <input placeholder="ابحث بالاسم أو الكود أو الموقع…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
            <Camera size={15} />
          </button>
        </div>
        <button className="btn-ghost" onClick={() => downloadCSV("قائمة_الاغراض.csv", data.items, ["code", "name", "category", "notes", "minQty"])}>
          <Download size={15} /> تصدير CSV
        </button>
        <button className="btn-ghost" onClick={() => window.print()}>
          <Download size={15} /> طباعة / PDF
        </button>
        {!readOnly && (
          <label className="btn-ghost" style={{ cursor: "pointer" }}>
            <Download size={15} style={{ transform: "rotate(180deg)" }} /> استيراد CSV
            <input
              type="file" accept=".csv,text/csv" style={{ display: "none" }}
              onChange={(e) => {
                const file = e.target.files?.[0];
                e.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  const rows = parseCSV(String(reader.result || ""));
                  const byCode = new Map(data.items.map((it) => [it.code, it]));
                  let added = 0, updated = 0;
                  rows.forEach((r) => {
                    const code = (r.code || r["الكود"] || "").trim();
                    if (!code) return;
                    const item = {
                      code,
                      name: r.name || r["اسم المنتج"] || r["الاسم"] || "",
                      category: r.category || r["الموقع"] || r["الفئة"] || "",
                      notes: r.notes || r["ملاحظات"] || "",
                      minqty: undefined,
                    };
                    item.minQty = r.minqty || r["minQty"] || r["حد التنبيه"] || "";
                    if (byCode.has(code)) updated++; else added++;
                    byCode.set(code, item);
                  });
                  setData({ ...data, items: Array.from(byCode.values()) });
                  notify(`تم الاستيراد: ${added} صنفاً جديداً، ${updated} محدَّثاً`);
                };
                reader.readAsText(file, "UTF-8");
              }}
            />
          </label>
        )}
      </div>

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon={Package} title="لا توجد أصناف مطابقة" hint="جرّب كلمة بحث مختلفة أو أضف صنفاً جديداً" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>م</th>
                  <th>الكود</th>
                  <th>اسم المنتج</th>
                  <th>الموقع / الفئة</th>
                  <th>ملاحظات</th>
                  {!readOnly && <th></th>}
                </tr>
              </thead>
              <tbody>
                {filtered.map((it, idx) => (
                  <tr key={it.code}>
                    <td className="cell-mono">{idx + 1}</td>
                    <td><CodeTag code={it.code} /></td>
                    <td className="cell-strong">{it.name}</td>
                    <td className="cell-muted"><MapPin size={12} style={{ opacity: 0.5, marginLeft: 4 }} />{it.category || "—"}</td>
                    <td className="cell-muted">{it.notes || "—"}</td>
                    {!readOnly && (
                      <td>
                        <div className="row-actions">
                          <button className="icon-btn" onClick={() => openEdit(it)}><Pencil size={15} /></button>
                          <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(it)}><Trash2 size={15} /></button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal wide title={modal.mode === "add" ? "إضافة غرض جديد" : "تعديل بيانات الصنف"} onClose={() => setModal(null)}>
          <ItemForm item={modal.item} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">
            هل أنت متأكد من حذف «{confirmDelete.name}»؟ لن يؤثر هذا على السجلات السابقة في الداخل والخارج.
          </p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete.code)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  MOVEMENT FORM (shared shape for incoming / outgoing)               */
/* ------------------------------------------------------------------ */

function MovementPage({ kind, data, setData, notify, readOnly }) {
  const isOut = kind === "out";
  const rows = isOut ? data.outgoing : data.incoming;
  const [form, setForm] = useState({ code: "", name: "", date: todayISO(), qty: "", notes: "" });
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [scanFlash, setScanFlash] = useState(false);
  const [cameraOpen, setCameraOpen] = useState(false);

  const codeInputRef = React.useRef(null);
  const qtyInputRef = React.useRef(null);

  const inventory = useMemo(() => computeInventory(data), [data]);

  // Keep the scanner "aimed" at the code field — a handheld reader types into
  // whatever input currently has focus, so refocus it after every reset.
  useEffect(() => {
    codeInputRef.current?.focus();
  }, []);

  const suggestions = form.code
    ? data.items.filter((i) => i.code.includes(form.code) || i.name.includes(form.code)).slice(0, 6)
    : [];

  const pick = (item, focusQty = true) => {
    setForm((f) => ({ ...f, code: item.code, name: item.name }));
    setSuggestOpen(false);
    if (focusQty) setTimeout(() => qtyInputRef.current?.focus(), 0);
  };

  const balanceFor = (code) => inventory.find((i) => i.code === code)?.balance ?? null;

  // Shared resolution logic used by both the handheld-scanner (keyboard Enter)
  // path and the phone-camera live detection path.
  const resolveScannedCode = (raw) => {
    const clean = String(raw).trim();
    if (!clean) return;
    const exact = data.items.find((i) => i.code === clean);
    if (exact) {
      setScanFlash(true);
      setTimeout(() => setScanFlash(false), 350);
      pick(exact);
      return;
    }
    const partial = data.items.filter((i) => i.code.includes(clean) || i.name.includes(clean));
    if (partial.length === 1) {
      pick(partial[0]);
      return;
    }
    setForm((f) => ({ ...f, code: clean, name: "" }));
    notify("لم يتم التعرف على هذا الكود — تأكد من تسجيله في قائمة الأغراض", "error");
    setTimeout(() => codeInputRef.current?.select(), 0);
  };

  // Handheld barcode readers act like a keyboard: they "type" every digit of
  // the code within milliseconds, then send an Enter keystroke. We resolve
  // the item as soon as Enter arrives, so scanning needs zero clicks.
  const handleCodeKeyDown = (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    resolveScannedCode(form.code);
  };

  const handleCameraDetect = (value) => {
    setCameraOpen(false);
    resolveScannedCode(value);
  };

  const handleQtyKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submit();
    }
  };

  const submit = () => {
    const item = data.items.find((i) => i.code === form.code);
    if (!item) {
      notify("هذا الكود غير موجود في قائمة الأغراض", "error");
      return;
    }
    const qty = Number(form.qty);
    if (!qty || qty <= 0) {
      notify("أدخل كمية صحيحة أكبر من صفر", "error");
      return;
    }
    if (isOut) {
      const bal = balanceFor(form.code) ?? 0;
      if (qty > bal) {
        notify(`الكمية غير كافية — المتوفر حالياً ${bal} فقط`, "error");
        return;
      }
    }
    const entry = { id: kind + "-" + Date.now(), code: form.code, name: item.name, date: form.date || todayISO(), qty, notes: form.notes };
    const key = isOut ? "outgoing" : "incoming";
    setData({ ...data, [key]: [entry, ...rows] });
    setForm({ code: "", name: "", date: todayISO(), qty: "", notes: "" });
    notify(isOut ? "تم تسجيل خروج البضاعة" : "تم تسجيل دخول البضاعة");
    setTimeout(() => codeInputRef.current?.focus(), 0);
  };

  const sorted = [...rows].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const currentBalance = form.code ? balanceFor(form.code) : null;
  const insufficient = isOut && form.code && Number(form.qty) > (currentBalance ?? 0);
  const notFound = form.code && !data.items.some((i) => i.code === form.code);

  return (
    <div className="page">
      <PageHeader
        eyebrow={isOut ? "الحركة" : "الحركة"}
        title={isOut ? "تسجيل الخارج" : "تسجيل الداخل"}
        subtitle={isOut ? "إخراج بضاعة من المستودع" : "استلام بضاعة جديدة إلى المستودع"}
      />

      {readOnly ? (
        <div className="alert alert-info" style={{ margin: "0 0 16px" }}>
          <ShieldAlert size={15} /> وضع الزائر: يمكنك تصفّح السجل السابق فقط، ولا يمكنك تسجيل حركات جديدة.
        </div>
      ) : (
      <div className="panel form-panel">
        <div className="form-grid form-grid-move">
          <Field label={<span className="scan-label"><ScanLine size={13} /> كود المنتج <span className="scan-hint">جاهز للمسح</span></span>}>
            <div className="autocomplete">
              <div className="scan-input-row">
                <input
                  ref={codeInputRef}
                  className={`input mono scan-input ${scanFlash ? "scan-flash" : ""}`}
                  value={form.code}
                  onChange={(e) => { setForm({ ...form, code: e.target.value, name: "" }); setSuggestOpen(true); }}
                  onFocus={() => setSuggestOpen(true)}
                  onKeyDown={handleCodeKeyDown}
                  placeholder="وجّه قارئ الباركود إلى هنا وامسح…"
                  autoComplete="off"
                />
                <ScanCameraButton onClick={() => setCameraOpen(true)} />
              </div>
              {suggestOpen && suggestions.length > 0 && (
                <div className="suggest-list">
                  {suggestions.map((s) => (
                    <button key={s.code} className="suggest-item" onClick={() => pick(s)}>
                      <CodeTag code={s.code} />
                      <span>{s.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </Field>
          <Field label="اسم المنتج">
            <input className="input" value={form.name} disabled placeholder="يُعبأ تلقائياً بعد المسح" />
          </Field>
          <Field label="التاريخ">
            <input className="input mono" type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          </Field>
          <Field label="الكمية">
            <input
              ref={qtyInputRef}
              className="input mono"
              type="number"
              step="0.5"
              min="0"
              value={form.qty}
              onChange={(e) => setForm({ ...form, qty: e.target.value })}
              onKeyDown={handleQtyKeyDown}
              placeholder="0 — ثم Enter للتسجيل"
            />
          </Field>
          <Field label="ملاحظات">
            <input className="input" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="اختياري" />
          </Field>
        </div>

        {notFound && (
          <div className="alert alert-error"><AlertTriangle size={15} /> هذا الكود غير مسجّل في قائمة الأغراض — أضِفه أولاً من صفحة «قائمة الأغراض».</div>
        )}
        {!notFound && isOut && form.code && (
          <div className={`alert ${insufficient ? "alert-error" : "alert-info"}`}>
            {insufficient ? <AlertTriangle size={15} /> : <Boxes size={15} />}
            الرصيد المتوفر حالياً من «{form.name || form.code}»: <b className="mono">{currentBalance}</b>
            {insufficient && " — الكمية المطلوبة أكبر من المتوفر"}
          </div>
        )}

        <div className="form-actions">
          <button className={isOut ? "btn-danger" : "btn-primary"} onClick={submit}>
            {isOut ? <ArrowUpFromLine size={16} /> : <ArrowDownToLine size={16} />}
            {isOut ? "تسجيل الخروج" : "تسجيل الدخول"}
          </button>
        </div>
      </div>
      )}

      <div className="panel">
        <div className="panel-head">
          <span className="panel-title">السجل السابق</span>
          <span className="panel-sub">{rows.length} حركة مسجّلة</span>
        </div>
        {sorted.length === 0 ? (
          <EmptyState icon={isOut ? ArrowUpFromLine : ArrowDownToLine} title="لا توجد حركات مسجّلة بعد" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>الكود</th>
                  <th>اسم المنتج</th>
                  <th>التاريخ</th>
                  <th>الكمية</th>
                  <th>ملاحظات</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((r) => (
                  <tr key={r.id}>
                    <td><CodeTag code={r.code} /></td>
                    <td className="cell-strong">{r.name}</td>
                    <td className="cell-mono">{fmtDate(r.date)}</td>
                    <td className="cell-mono">{r.qty}</td>
                    <td className="cell-muted">{r.notes || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {cameraOpen && (
        <BarcodeCameraModal onDetect={handleCameraDetect} onClose={() => setCameraOpen(false)} />
      )}
    </div>
  );
}

function InventoryPage({ inventory }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [locationFilter, setLocationFilter] = useState("all");
  const [view, setView] = useState("list"); // list | grid
  const [sortKey, setSortKey] = useState("name");
  const [sortDir, setSortDir] = useState(1);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);

  const locations = useMemo(
    () => [...new Set(inventory.map((i) => i.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ar")),
    [inventory]
  );

  const filtered = inventory
    .filter((i) => (i.name + i.code + i.category).toLowerCase().includes(query.toLowerCase()))
    .filter((i) => statusFilter === "all" || i.status === statusFilter)
    .filter((i) => locationFilter === "all" || i.category === locationFilter)
    .sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      if (typeof va === "number") return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb), "ar") * sortDir;
    });

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => -d);
    else { setSortKey(key); setSortDir(1); }
  };

  const SortHeader = ({ label, k }) => (
    <th onClick={() => toggleSort(k)} className="sortable">
      {label} {sortKey === k && <ChevronDown size={12} style={{ transform: sortDir === -1 ? "rotate(180deg)" : "none", display: "inline" }} />}
    </th>
  );

  return (
    <div className="page">
      <PageHeader eyebrow="الجرد" title="المخزون" subtitle="الأرصدة الحالية محسوبة تلقائياً من حركات الدخول والخروج" />

      <div className="toolbar">
        <div className="search-box">
          <Search size={16} />
          <input placeholder="ابحث بالاسم أو الكود…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
            <Camera size={15} />
          </button>
        </div>
        <div className="filter-chips">
          {[
            { k: "all", label: "الكل" },
            { k: "available", label: "متوفر" },
            { k: "low", label: "منخفض" },
            { k: "empty", label: "نفد" },
          ].map((f) => (
            <button key={f.k} className={`chip ${statusFilter === f.k ? "chip-active" : ""}`} onClick={() => setStatusFilter(f.k)}>
              {f.label}
            </button>
          ))}
        </div>
        {locations.length > 0 && (
          <select className="input location-select" value={locationFilter} onChange={(e) => setLocationFilter(e.target.value)}>
            <option value="all">كل المواقع</option>
            {locations.map((loc) => <option key={loc} value={loc}>{loc}</option>)}
          </select>
        )}
        <div className="view-toggle">
          <button className={`chip ${view === "list" ? "chip-active" : ""}`} onClick={() => setView("list")}>جدول</button>
          <button className={`chip ${view === "grid" ? "chip-active" : ""}`} onClick={() => setView("grid")}>بطاقات</button>
        </div>
        <button
          className="btn-ghost"
          onClick={() => downloadCSV("المخزون.csv", filtered, ["code", "name", "category", "inQty", "outQty", "balance", "status"])}
        >
          <Download size={15} /> تصدير CSV
        </button>
        <button className="btn-ghost" onClick={() => window.print()}>
          <Download size={15} /> طباعة / PDF
        </button>
      </div>

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon={Boxes} title="لا توجد نتائج" hint="جرّب تغيير الفلتر أو كلمة البحث" />
        ) : view === "grid" ? (
          <div className="inv-card-grid">
            {filtered.map((i) => (
              <div className="inv-card" key={i.code}>
                <div className="inv-card-head">
                  <span className="cell-strong">{i.name}</span>
                  <StampBadge status={i.status} />
                </div>
                <CodeTag code={i.code} />
                <div className="inv-card-loc"><MapPin size={12} style={{ opacity: 0.55 }} /> {i.category || "—"}</div>
                <div className="inv-card-balance">{i.balance} <span className="inv-card-balance-unit">الرصيد</span></div>
              </div>
            ))}
          </div>
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <SortHeader label="الكود" k="code" />
                  <SortHeader label="اسم المنتج" k="name" />
                  <SortHeader label="الفئة / الموقع" k="category" />
                  <SortHeader label="الداخل" k="inQty" />
                  <SortHeader label="الخارج" k="outQty" />
                  <SortHeader label="الرصيد" k="balance" />
                  <th>الحالة</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((i) => (
                  <tr key={i.code}>
                    <td><CodeTag code={i.code} /></td>
                    <td className="cell-strong">{i.name}</td>
                    <td className="cell-muted">{i.category || "—"}</td>
                    <td className="cell-mono">{i.inQty}</td>
                    <td className="cell-mono">{i.outQty}</td>
                    <td className="cell-mono cell-balance">{i.balance}</td>
                    <td><StampBadge status={i.status} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function BarcodesPage({ data, setData, notify, readOnly }) {
  const [modal, setModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const openAdd = () => setModal({ mode: "add", row: { name: "", number: "" } });
  const openEdit = (row, idx) => setModal({ mode: "edit", row: { ...row }, idx });

  const save = (row) => {
    if (!row.name.trim() || !row.number.trim()) {
      notify("الاسم والرقم مطلوبان", "error");
      return;
    }
    let barcodes;
    if (modal.mode === "add") barcodes = [...data.barcodes, row];
    else barcodes = data.barcodes.map((b, i) => (i === modal.idx ? row : b));
    setData({ ...data, barcodes });
    setModal(null);
    notify(modal.mode === "add" ? "تمت إضافة الباركود" : "تم حفظ التعديلات");
  };

  const remove = (idx) => {
    setData({ ...data, barcodes: data.barcodes.filter((_, i) => i !== idx) });
    setConfirmDelete(null);
    notify("تم الحذف");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="مرجع"
        title="باركودات الأشياء غير المعنونة"
        subtitle="أشياء بلا كود مسجّل في قائمة الأغراض، مع رقمها القابل للطباعة"
        action={
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn-ghost" onClick={() => window.print()}><Download size={15} /> طباعة الملصقات</button>
            {!readOnly && <button className="btn-primary" onClick={openAdd}><Plus size={16} /> إضافة باركود</button>}
          </div>
        }
      />

      <div className="panel">
        {data.barcodes.length === 0 ? (
          <EmptyState icon={Barcode} title="لا توجد باركودات مسجّلة" />
        ) : (
          <div className="barcode-grid">
            {data.barcodes.map((b, idx) => (
              <div className="barcode-card" key={idx}>
                <RealBarcode value={b.number} />
                <div className="barcode-number">{b.number}</div>
                <div className="barcode-name">{b.name}</div>
                {!readOnly && (
                  <div className="row-actions barcode-actions">
                    <button className="icon-btn" onClick={() => openEdit(b, idx)}><Pencil size={14} /></button>
                    <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(idx)}><Trash2 size={14} /></button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      {modal && (
        <Modal title={modal.mode === "add" ? "إضافة باركود" : "تعديل الباركود"} onClose={() => setModal(null)}>
          <BarcodeForm row={modal.row} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete !== null && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">هل تريد حذف هذا الباركود؟</p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function BarcodeForm({ row, onCancel, onSave }) {
  const [form, setForm] = useState(row);
  return (
    <div className="form-grid">
      <Field label="اسم الشيء">

        <button className="btn-ghost" onClick={onCancel}>إلغاء</button>
        <button className="btn-primary" onClick={() => onSave(form)}><Check size={15} /> حفظ</button>
      </div>

}

const ADMIN_PASSWORD = "admin";
const ROLE_KEY = "warehouse-role";

function LoginGate({ onEnter }) {
  const [mode, setMode] = useState(null); // null | 'admin'
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const submitAdmin = (e) => {
    e.preventDefault();
    if (password === ADMIN_PASSWORD) {
      setError("");
      onEnter("admin");
    } else {
      setError("كلمة المرور غير صحيحة");
    }
  };

  return (
    <div className="login-screen">
      <FontStyles />
      <div className="login-card">
        <div className="brand-mark login-mark">
          <Boxes size={24} strokeWidth={2.2} />
        </div>
        <div className="login-title">سجلّ المستودع</div>
        <div className="login-sub">اختر طريقة الدخول للمتابعة</div>

        {mode !== "admin" ? (
          <div className="login-choices">
            <button className="login-choice" onClick={() => onEnter("guest")}>
              <div className="login-choice-icon"><Search size={18} /></div>
              <div className="login-choice-text">
                <div className="login-choice-title">الدخول كزائر</div>
                <div className="login-choice-hint">تصفّح كل البيانات دون إمكانية التعديل</div>
              </div>
            </button>
            <button className="login-choice" onClick={() => { setMode("admin"); setError(""); setPassword(""); }}>
              <div className="login-choice-icon"><ShieldAlert size={18} /></div>
              <div className="login-choice-text">
                <div className="login-choice-title">الدخول كمسؤول</div>
                <div className="login-choice-hint">التحكم الكامل: إضافة وتعديل وحذف</div>
              </div>
            </button>
          </div>
        ) : (
          <form className="login-admin-form" onSubmit={submitAdmin}>
            <Field label="كلمة مرور المسؤول">
              <input
                autoFocus
                type="password"
                className="input"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="أدخل كلمة المرور"
              />
            </Field>
            {error && <div className="alert alert-error"><AlertTriangle size={15} /> {error}</div>}
            <div className="login-admin-actions">
              <button type="button" className="btn-ghost" onClick={() => { setMode(null); setError(""); }}>رجوع</button>
              <button type="submit" className="btn-primary"><Check size={15} /> دخول</button>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [navOpen, setNavOpen] = useState(false);
  const [role, setRole] = useState(() => {
    try { return sessionStorage.getItem(ROLE_KEY) || null; } catch (e) { return null; }
  });

  const [auditLog, setAuditLog] = useState([]);

  const notify = useCallback((msg, type = "success", opts = {}) => {
    setToast({ msg, type, id: Date.now() });
    if (!opts.silent) { playBeep(type === "error" ? "error" : "success"); hapticPulse(type === "error" ? "error" : "success"); }
    if (type !== "error" && !opts.silent) {
      setAuditLog((log) => [{ msg, time: Date.now() }, ...log].slice(0, 60));
    }
    setTimeout(() => setToast((t) => (t?.msg === msg ? null : t)), 2600);
  }, []);

  const onRemoteUpdate = useCallback(() => {
    notify("تم تحديث البيانات من جهاز آخر", "success", { silent: true });
  }, [notify]);

  const [data, setData, saving, sync] = useStore(onRemoteUpdate);

  const inventory = useMemo(() => (data ? computeInventory(data) : []), [data]);

  const enter = (r) => {
    setRole(r);
    try { sessionStorage.setItem(ROLE_KEY, r); } catch (e) {}
  };

  const logout = () => {
    setRole(null);
    setPage("dashboard");
    try { sessionStorage.removeItem(ROLE_KEY); } catch (e) {}
  };

  if (!role) {
    return <LoginGate onEnter={enter} />;
  }

  if (!data) {
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">📦</div>
        <div>جارٍ تحضير سجل المستودع…</div>
      </div>
    );
  }

  const readOnly = role === "guest";
  const GUEST_PAGES = ["dashboard", "inventory"];
  const visibleNav = readOnly ? NAV.filter((n) => GUEST_PAGES.includes(n.key)) : NAV;
  const safePage = readOnly && !GUEST_PAGES.includes(page) ? "dashboard" : page;
  const go = (p) => { setPage(readOnly && !GUEST_PAGES.includes(p) ? "dashboard" : p); setNavOpen(false); };

  return (
    <div className="app-shell">
      <FontStyles />
      <aside className={`sidebar ${navOpen ? "sidebar-open" : ""}`}>
        <div className="brand">
          <div className="brand-mark">
            <Boxes size={20} strokeWidth={2.2} />
          </div>
          <div>
            <div className="brand-title">سجلّ المستودع</div>
            <div className="brand-sub">Warehouse Manifest</div>

        </div>

        <nav className="nav-list">
          {visibleNav.map((n, i) => (
            <button key={n.key} className={`nav-item ${safePage === n.key ? "nav-item-active" : ""}`} onClick={() => go(n.key)}>
              <span className="nav-index">{String(i + 1).padStart(2, "0")}</span>
              <n.icon size={17} strokeWidth={2} />
              <span>{n.label}</span>
            </button>
          ))}
        </nav>

        <div className="sidebar-foot">
          <div className={`save-indicator ${saving ? "save-active" : ""}`}>
            <span className="save-dot" /> {saving ? "جارٍ الحفظ…" : "محفوظ تلقائياً"}
          </div>
          <div className={`sync-indicator ${sync.online ? "" : "sync-offline"}`}>
            <span className="save-dot" /> {sync.online ? "محفوظ على هذا الجهاز" : "غير متصل"}
          </div>
          <button className="logout-btn" onClick={logout}>
            <X size={14} /> تسجيل الخروج
          </button>
        </div>
      </aside>

      <div className="main-col">
        <header className="topbar">
          <button className="hamburger" onClick={() => setNavOpen((v) => !v)} aria-label="القائمة">
            <span /><span /><span />
          </button>
          <GlobalSearch data={data} inventory={inventory} go={go} />
        </header>

        <main className="main-area">
          {safePage === "dashboard" && <Dashboard inventory={inventory} data={data} go={go} readOnly={readOnly} />}
          {safePage === "items" && <ItemsPage data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "incoming" && <MovementPage kind="in" data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "outgoing" && <MovementPage kind="out" data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "inventory" && <InventoryPage inventory={inventory} />}
          {safePage === "barcodes" && <BarcodesPage data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "audit" && <AuditPage log={auditLog} />}
        </main>
      </div>

      <nav className="bottom-nav">
        {visibleNav.slice(0, 5).map((n) => (
          <button key={n.key} className={`bottom-nav-item ${safePage === n.key ? "bottom-nav-active" : ""}`} onClick={() => go(n.key)}>
            <n.icon size={19} strokeWidth={2} />
            <span>{n.label}</span>
          </button>
        ))}
      </nav>

      <Toast toast={toast} />
    </div>
  );
}

        background: var(--kraft); padding: 20px;
      }
      .login-card {
        background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
        padding: 34px 30px; width: 100%; max-width: 380px; text-align: center;
        box-shadow: 0 14px 40px rgba(35,48,58,0.12);
      }
      .login-mark {
        width: 52px; height: 52px; border-radius: 14px; background: var(--navy); color: #F3EEDD;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
      }
      .login-title { font-family: 'Almarai'; font-weight: 800; font-size: 19px; color: var(--ink); }
      .login-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; margin-bottom: 22px; }
      .login-choices { display: flex; flex-direction: column; gap: 10px; }
      .login-choice {
        display: flex; align-items: center; gap: 12px; text-align: right;
        background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
        cursor: pointer; font-family: 'Tajawal';
      }
      .login-choice:hover { background: #FAF6EA; border-color: var(--navy); }
      .login-choice-icon {
        width: 36px; height: 36px; border-radius: 10px; background: var(--kraft);
        display: flex; align-items: center; justify-content: center; color: var(--navy); flex-shrink: 0;
      }
      .login-choice-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
      .login-choice-hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
      .login-admin-form { display: flex; flex-direction: column; gap: 4px; text-align: right; }
      .login-admin-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }

      /* ---------- ROLE BADGE ---------- */
      .role-badge {
        display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
        padding: 7px 12px; border-radius: 20px; margin: 0 16px 10px;
      }
      .role-badge-guest { background: var(--amber-bg); color: var(--amber); }
      .role-badge-admin { background: var(--green-bg); color: var(--green); }

      .logout-btn {
        display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
        font-family: 'Tajawal'; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); padding: 6px 2px; margin-top: 6px;
      }
      .logout-btn:hover { color: var(--red); }

      /* ---------- ALERT BANNER ---------- */
      .alert-banner {
        display: flex; align-items: center; gap: 10px; background: var(--amber-bg); color: var(--amber);
        border: 1px solid var(--amber); border-radius: 10px; padding: 11px 14px; margin-bottom: 16px; font-size: 12.5px;
      }
      .alert-banner-text { flex: 1; line-height: 1.7; }
      .alert-banner-btn { flex-shrink: 0; }

      /* ---------- CHARTS ---------- */
      .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
      .mini-chart { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      .mini-chart-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; }
      .mini-chart-label { font-size: 11.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mini-chart-track { background: var(--kraft); border-radius: 6px; height: 10px; overflow: hidden; }
      .mini-chart-bar { background: var(--navy); height: 100%; border-radius: 6px; transition: width 0.3s ease; }
      .mini-chart-bar-amber { background: var(--amber); }
      .mini-chart-val { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: left; }

      /* ---------- INVENTORY GRID CARDS ---------- */
      .location-select { max-width: 180px; }
      .view-toggle { display: flex; gap: 4px; }
      .inv-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 14px; }
      .inv-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 13px; display: flex; flex-direction: column; gap: 6px; }
      .inv-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .inv-card-loc { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; }
      .inv-card-balance { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; margin-top: 4px; }
      .inv-card-balance-unit { font-family: 'Tajawal'; font-size: 11px; font-weight: 400; color: var(--ink-soft); }

      /* ---------- REAL BARCODE ---------- */
      .real-barcode { width: 100%; max-width: 170px; height: 34px; }

      /* ---------- BOTTOM NAV (mobile) ---------- */
      .bottom-nav { display: none; }

      /* ---------- PRINT / PDF EXPORT ---------- */
      @media print {
        .sidebar, .bottom-nav, .topbar, .toolbar, .toast, .row-actions, .barcode-actions,
        .stat-grid button, .modal-overlay, .alert-banner-btn, .btn-primary, .btn-ghost { display: none !important; }
        body, .app-shell { background: #fff !important; }
        .main-col { margin: 0 !important; }
        .panel, .ledger-table, .barcode-grid { box-shadow: none !important; border: 1px solid #999 !important; }
        .page { padding: 0 !important; }
      }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 860px) {
        .stat-grid { grid-template-columns: repeat(2, 1fr); }
        .chart-grid { grid-template-columns: 1fr; }
        .form-grid, .form-grid-move { grid-template-columns: 1fr 1fr; }
        .sidebar { position: fixed; top: 0; bottom: 0; right: 0; z-index: 50; transform: translateX(100%); transition: transform 0.2s ease; box-shadow: -8px 0 24px rgba(0,0,0,0.15); }
        .sidebar-open { transform: translateX(0); }
        .hamburger { display: flex; }
        .main-area { padding: 18px 16px 60px; }
      }
      @media (max-width: 520px) {
        .stat-grid { grid-template-columns: 1fr 1fr; }
        .form-grid, .form-grid-move { grid-template-columns: 1fr; }
        .page-title { font-size: 20px; }
        .bottom-nav {
          display: flex; position: fixed; bottom: 0; right: 0; left: 0; z-index: 60;
          background: var(--paper); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
          box-shadow: 0 -6px 18px rgba(35,48,58,0.12);
        }
        .bottom-nav-item {
          flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
          background: none; border: none; color: var(--ink-soft); font-family: 'Tajawal'; font-weight: 600; font-size: 10px; padding: 6px 2px;
        }
        .bottom-nav-item span { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bottom-nav-active { color: var(--navy); }
        .main-area { padding-bottom: 76px; }
      }
    `}</style>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
