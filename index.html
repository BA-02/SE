                    <td className="cell-mono">{new Date(e.time).toLocaleString("ar-SA")}</td>
                    <td className="cell-strong">{e.msg}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

const ROLE_KEY = "warehouse-role";

// نافذة استرداد كلمة المرور — تظهر داخل نافذة الدخول للتحكم
function ForgotPasswordPanel({ mode, data, onClose }) {
  const [answer, setAnswer] = useState("");
  const [revealed, setRevealed] = useState(false);
  const [err, setErr] = useState("");
  const hasQuestion = mode === "owner" && !!(data?.ownerRecoveryQuestion || "").trim();

  const checkAnswer = (e) => {
    e.preventDefault();
    const correct = (data?.ownerRecoveryAnswer || "").trim().toLowerCase();
    if (answer.trim().toLowerCase() === correct && correct !== "") {
      setRevealed(true);
      setErr("");
    } else {
      setErr("الإجابة غير صحيحة");
    }
  };

  return (
    <Modal title="نسيت كلمة المرور؟" onClose={onClose}>
      {mode === "user" ? (
        <p className="confirm-text">
          كلمات مرور المستخدمين يديرها رئيس الموقع من صفحة «المستخدمون» — تواصل معه لإعادة تعيين كلمة مرورك.
        </p>
      ) : !hasQuestion ? (
        <p className="confirm-text">
          لم يتم إعداد سؤال استرداد لكلمة مرور رئيس الموقع بعد. يمكنك إعداده لاحقاً من «تغيير كلمة المرور»
          بعد الدخول. كلمة المرور الافتراضية عند أول تشغيل للموقع هي <strong>admin</strong> إن لم تُغيَّر بعد.
        </p>
      ) : revealed ? (
        <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
          <p className="confirm-text">كلمة مرور رئيس الموقع الحالية هي:</p>
          <div className="recovered-pass">{data.ownerPassword}</div>
          <p className="confirm-text" style={{ fontSize: 12.5 }}>يُفضّل تغييرها فور الدخول من «تغيير كلمة المرور».</p>
        </div>
      ) : (
        <form className="form-grid" style={{ gridTemplateColumns: "1fr" }} onSubmit={checkAnswer}>
          <Field label={data.ownerRecoveryQuestion}>
            <input autoFocus className="input" value={answer} onChange={(e) => setAnswer(e.target.value)} placeholder="إجابتك" />
          </Field>
          {err && <div className="alert alert-error"><AlertTriangle size={15} /> {err}</div>}
          <div className="modal-actions">
            <button type="button" className="btn-ghost" onClick={onClose}>إلغاء</button>
            <button type="submit" className="btn-primary"><Check size={15} /> تحقّق</button>
          </div>
        </form>
      )}
    </Modal>
  );
}

// نافذة "الدخول للتحكم" — تظهر عند طلب المستخدم الانتقال من وضع العرض
// إلى وضع التحكم والتعديل (مستخدم أو رئيس الموقع)، محمية بكلمة مرور
function ControlLoginModal({ onEnter, onClose, data }) {
  const [mode, setMode] = useState(null); // null | 'owner' | 'user'
  const [password, setPassword] = useState("");
  const [username, setUsername] = useState("");
  const [error, setError] = useState("");
  const [showForgot, setShowForgot] = useState(false);

  const submitOwner = (e) => {
    e.preventDefault();
    if (!data) return;
    if (password === data.ownerPassword) {
      setError("");
      onEnter({ type: "owner" });
    } else {
      setError("كلمة المرور غير صحيحة");
    }
  };

  const submitUser = (e) => {
    e.preventDefault();
    if (!data) return;
    const u = data.users.find((x) => x.username === username.trim());
    if (!u || u.password !== password) {
      setError("اسم المستخدم أو كلمة المرور غير صحيحة");
      return;
    }
    if (isTempExpired(u)) {
      setError("انتهت صلاحية كلمة المرور المؤقتة — تواصل مع رئيس الموقع لتجديدها");
      return;
    }
    setError("");
    onEnter({ type: "user", userId: u.id });
  };

  return (
    <Modal title="الدخول لوضع التحكم" onClose={onClose}>
      {!data ? (
        <div className="login-sub">جارٍ التحضير…</div>
      ) : mode === null ? (
        <div className="login-choices">
          <button className="login-choice" onClick={() => { setMode("user"); setError(""); setUsername(""); setPassword(""); }}>
            <div className="login-choice-icon"><Users size={18} /></div>
            <div className="login-choice-text">
              <div className="login-choice-title">دخول مستخدم</div>
              <div className="login-choice-hint">حساب باسم مستخدم وكلمة مرور، بصلاحية محددة</div>
            </div>
          </button>
          <button className="login-choice" onClick={() => { setMode("owner"); setError(""); setPassword(""); }}>
            <div className="login-choice-icon"><ShieldAlert size={18} /></div>
            <div className="login-choice-text">
              <div className="login-choice-title">رئيس الموقع</div>
              <div className="login-choice-hint">تحكم كامل بالموقع + إدارة المستخدمين والمجموعات</div>
            </div>
          </button>
        </div>
      ) : mode === "owner" ? (
        <form className="login-admin-form" onSubmit={submitOwner}>
          <Field label="كلمة مرور رئيس الموقع">
            <input
              autoFocus type="password" className="input"
              value={password} onChange={(e) => setPassword(e.target.value)}
              placeholder="أدخل كلمة المرور"
            />
          </Field>
          {error && <div className="alert alert-error"><AlertTriangle size={15} /> {error}</div>}
          <button type="button" className="link-btn" onClick={() => setShowForgot(true)}>نسيت كلمة المرور؟</button>
          <div className="login-admin-actions">
            <button type="button" className="btn-ghost" onClick={() => { setMode(null); setError(""); }}>رجوع</button>
            <button type="submit" className="btn-primary"><Check size={15} /> دخول</button>
          </div>
        </form>
      ) : (
        <form className="login-admin-form" onSubmit={submitUser}>
          <Field label="اسم المستخدم">
            <input autoFocus className="input" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="اسم المستخدم" />
          </Field>
          <Field label="كلمة المرور">
            <input type="password" className="input" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="كلمة المرور" />
          </Field>
          {error && <div className="alert alert-error"><AlertTriangle size={15} /> {error}</div>}
          <button type="button" className="link-btn" onClick={() => setShowForgot(true)}>نسيت كلمة المرور؟</button>
          <div className="login-admin-actions">
            <button type="button" className="btn-ghost" onClick={() => { setMode(null); setError(""); }}>رجوع</button>
            <button type="submit" className="btn-primary"><Check size={15} /> دخول</button>
          </div>
        </form>
      )}
      {showForgot && <ForgotPasswordPanel mode={mode || "owner"} data={data} onClose={() => setShowForgot(false)} />}
    </Modal>
  );
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [navOpen, setNavOpen] = useState(false);
  const [showPwModal, setShowPwModal] = useState(false);
  const [showControlLogin, setShowControlLogin] = useState(false);
  const [printJob, setPrintJob] = useState(null); // { type: 'dashboard'|'inventory'|'items' } | null
  const [session, setSession] = useState(() => {
    try {
      const raw = sessionStorage.getItem(ROLE_KEY);
      return raw ? JSON.parse(raw) : { type: "guest" };
    } catch (e) { return { type: "guest" }; }
  });

  const [auditLog, setAuditLog] = useState([]);

  const notify = useCallback((msg, type = "success", opts = {}) => {
    setToast({ msg, type, id: Date.now() });
    if (!opts.silent) { playBeep(type === "error" ? "error" : "success"); hapticPulse(type === "error" ? "error" : "success"); }
    if (type !== "error" && !opts.silent) {
      setAuditLog((log) => [{ msg, time: Date.now() }, ...log].slice(0, 60));
    }
    setTimeout(() => setToast((t) => (t?.msg === msg ? null : t)), 2600);
  }, []);

  const onRemoteUpdate = useCallback(() => {
    notify("تم تحديث البيانات من جهاز آخر", "success", { silent: true });
  }, [notify]);

  const [data, setData, saving, sync] = useStore(onRemoteUpdate);

  const inventory = useMemo(() => (data ? computeInventory(data) : []), [data]);

  const enter = (s) => {
    setSession(s);
    try { sessionStorage.setItem(ROLE_KEY, JSON.stringify(s)); } catch (e) {}
  };

  // تسجيل الخروج من وضع التحكم يعيدك دائماً إلى وضع العرض الافتراضي، وليس لشاشة اختيار فارغة
  const logout = () => {
    setSession({ type: "guest" });
    setPage("dashboard");
    try { sessionStorage.removeItem(ROLE_KEY); } catch (e) {}
  };

  // تجهيز تقرير قابل للطباعة/PDF بتصميم مستند مرتّب، ثم فتح نافذة الطباعة
  const triggerPrint = (type) => setPrintJob({ type });
  useEffect(() => {
    if (!printJob) {
      document.body.classList.remove("printing-report");
      return;
    }
    document.body.classList.add("printing-report");
    const t = setTimeout(() => window.print(), 60);
    const after = () => setPrintJob(null);
    window.addEventListener("afterprint", after);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", after); };
  }, [printJob]);

  if (!data) {
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">📦</div>
        <div>جارٍ تحضير سجل المستودع…</div>
      </div>
    );
  }

  const isOwner = session.type === "owner";
  const isGuest = session.type !== "owner" && session.type !== "user";
  const currentUser = session.type === "user" ? data.users.find((u) => u.id === session.userId) : null;

  // مستخدم مؤقت انتهت صلاحيته أو حُذف حسابه — إخراج فوري
  if (session.type === "user" && (!currentUser || isTempExpired(currentUser))) {
    setTimeout(() => {
      logout();
      notify("انتهت صلاحية الدخول — تواصل مع رئيس الموقع", "error");
    }, 0);
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">⏳</div>
        <div>جارٍ تسجيل الخروج…</div>
      </div>
    );
  }

  /* ---------------- وضع العرض (الافتراضي التلقائي) ----------------
     واجهة مبسّطة جداً: المخزون فقط للقراءة، بدون لوحة تحكم ولا قوائم جانبية،
     مع زر واحد للانتقال لوضع التحكم والتعديل (محمي بكلمة مرور). */
  if (isGuest) {
    return (
      <div className="view-shell">
        <FontStyles />
        <header className="view-topbar">
          <div className="brand">
            <div className="brand-mark">
              <Boxes size={20} strokeWidth={2.2} />
            </div>
            <div>
              <div className="brand-title">سجلّ المستودع</div>
              <div className="brand-sub">لوحة العرض</div>
            </div>
          </div>
          <span
            className={`conn-dot ${sync.online ? "conn-dot-on" : "conn-dot-off"}`}
            title={sync.online ? "متصل — البيانات محدّثة" : "غير متصل — سيتم التحديث عند عودة الاتصال"}
          />
          <button className="btn-ghost view-control-btn" onClick={() => setShowControlLogin(true)}>
            <KeyRound size={14} /> <span>الدخول للتحكم</span>
          </button>
        </header>

        <main className="view-main">
          <InventoryPage inventory={inventory} itemGroups={data.itemGroups} onPrint={() => triggerPrint("inventory")} />
        </main>

        {showControlLogin && (
          <ControlLoginModal
            data={data}
            onClose={() => setShowControlLogin(false)}
            onEnter={(s) => { enter(s); setShowControlLogin(false); notify("تم الدخول بنجاح"); }}
          />
        )}

        <Toast toast={toast} />
        <PrintableReport job={printJob} data={data} inventory={inventory} />
      </div>
    );
  }

  // كل مستخدم مسجّل دخول (رئيس الموقع أو مستخدم) يشوف كل صفحات التشغيل؛
  // الفرق فقط: هل يقدر يعدّل (readOnly) وهل يشوف صفحتي المستخدمين/المجموعات (owner فقط)
  const readOnly = currentUser ? !currentUser.canEdit : false;
  const allowedKeys = NAV.filter((n) => !n.ownerOnly).map((n) => n.key);
  const visibleNav = NAV.filter((n) => (n.ownerOnly ? isOwner : allowedKeys.includes(n.key)));
  const safePage = allowedKeys.includes(page) || (n2ok(page)) ? page : (allowedKeys[0] || "dashboard");
  function n2ok(p) { return (p === "users" || p === "groups") && isOwner; }
  const go = (p) => {
    const ok = n2ok(p) || allowedKeys.includes(p);
    setPage(ok ? p : (allowedKeys[0] || "dashboard"));
    setNavOpen(false);
  };

  const roleLabel = isOwner ? "رئيس الموقع — تحكم كامل"
    : `${currentUser?.username}${readOnly ? " (قراءة فقط)" : " (يقدر يعدّل)"}`;

  return (
    <div className="app-shell">
      <FontStyles />
      <aside className={`sidebar ${navOpen ? "sidebar-open" : ""}`}>
        <div className="brand">
          <div className="brand-mark">
            <Boxes size={20} strokeWidth={2.2} />
          </div>
          <div>
            <div className="brand-title">سجلّ المستودع</div>
            <div className="brand-sub">Warehouse Manifest</div>
          </div>
        </div>

        <div className={`role-badge role-badge-admin`}>
          {isOwner ? <ShieldAlert size={13} /> : <Users size={13} />}
          {roleLabel}
        </div>

        <nav className="nav-list">
          {visibleNav.map((n, i) => (
            <button key={n.key} className={`nav-item ${safePage === n.key ? "nav-item-active" : ""}`} onClick={() => go(n.key)}>
              <span className="nav-index">{String(i + 1).padStart(2, "0")}</span>
              <n.icon size={17} strokeWidth={2} />
              <span>{n.label}</span>
            </button>
          ))}
        </nav>

        <div className="sidebar-foot">
          {isOwner && (
            <button className="logout-btn" onClick={() => setShowPwModal(true)}>
              <KeyRound size={14} /> تغيير كلمة المرور
            </button>
          )}
          <button className="logout-btn" onClick={logout}>
            <X size={14} /> تسجيل الخروج
          </button>
        </div>
      </aside>

      <div className="main-col">
        <header className="topbar">
          <button className="hamburger" onClick={() => setNavOpen((v) => !v)} aria-label="القائمة">
            <span /><span /><span />
          </button>
          <span
            className={`conn-dot ${sync.online ? "conn-dot-on" : "conn-dot-off"}`}
            title={sync.online ? (saving ? "جارٍ الحفظ…" : "متصل — يُحفظ تلقائياً") : "غير متصل — سيتم الحفظ عند عودة الاتصال"}
          />
          <GlobalSearch data={data} inventory={inventory} go={go} />
        </header>

        <main className="main-area">
          {safePage === "dashboard" && <Dashboard inventory={inventory} data={data} go={go} readOnly={readOnly} onPrint={() => triggerPrint("dashboard")} />}
          {safePage === "items" && <ItemsPage data={data} setData={setData} notify={notify} readOnly={readOnly} onPrint={() => triggerPrint("items")} />}
          {safePage === "incoming" && <MovementPage kind="in" data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "outgoing" && <MovementPage kind="out" data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "inventory" && <InventoryPage inventory={inventory} itemGroups={data.itemGroups} onPrint={() => triggerPrint("inventory")} />}
          {safePage === "barcodes" && <BarcodesPage data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "audit" && <AuditPage log={auditLog} />}
          {safePage === "users" && isOwner && <UsersPage data={data} setData={setData} notify={notify} />}
          {safePage === "groups" && isOwner && <GroupsPage data={data} setData={setData} notify={notify} />}
        </main>
      </div>

      <nav className="bottom-nav">
        {visibleNav.slice(0, 5).map((n) => (
          <button key={n.key} className={`bottom-nav-item ${safePage === n.key ? "bottom-nav-active" : ""}`} onClick={() => go(n.key)}>
            <n.icon size={19} strokeWidth={2} />
            <span>{n.label}</span>
          </button>
        ))}
      </nav>

      {showPwModal && (
        <ChangeOwnerPasswordModal
          currentPassword={data.ownerPassword}
          currentRecoveryQuestion={data.ownerRecoveryQuestion}
          currentRecoveryAnswer={data.ownerRecoveryAnswer}
          notify={notify}
          onClose={() => setShowPwModal(false)}
          onSave={({ password, recoveryQuestion, recoveryAnswer }) => {
            setData({ ...data, ownerPassword: password, ownerRecoveryQuestion: recoveryQuestion, ownerRecoveryAnswer: recoveryAnswer });
            notify("تم تغيير كلمة مرور رئيس الموقع");
          }}
        />
      )}

      <Toast toast={toast} />
      <PrintableReport job={printJob} data={data} inventory={inventory} />
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  PRINTABLE REPORT — تصميم مستند مرتّب للتصدير كـ PDF/طباعة           */
/*  (بديل عن طباعة الموقع كما هو، يظهر فقط أثناء الطباعة)              */
/* ------------------------------------------------------------------ */

function PrintableReport({ job, data, inventory }) {
  if (!job || !data) return null;
  const type = job.type;
  const now = new Date();
  let generatedAt;
  try {
    generatedAt = new Intl.DateTimeFormat("ar-SA-u-nu-latn", { dateStyle: "long", timeStyle: "short" }).format(now);
  } catch {
    generatedAt = now.toLocaleString();
  }

  const groupName = (id) => data.itemGroups.find((g) => g.id === id)?.name || "بدون مجموعة";

  const TITLES = {
    dashboard: "تقرير ملخص المستودع",
    inventory: "تقرير المخزون",
    items: "تقرير قائمة الأغراض",
  };

  const total = inventory.length;
  const available = inventory.filter((i) => i.status === "available").length;
  const low = inventory.filter((i) => i.status === "low").length;
  const empty = inventory.filter((i) => i.status === "empty").length;

  return (
    <div className="print-report">
      <div className="print-report-header">
        <div className="print-report-brand">
          <div className="print-report-brand-mark">📦</div>
          <div>
            <div className="print-report-brand-title">سجلّ المستودع</div>
            <div className="print-report-brand-sub">Warehouse Manifest</div>
          </div>
        </div>
        <div className="print-report-meta">
          <div className="print-report-doc-title">{TITLES[type] || "تقرير"}</div>
          <div>تاريخ الإصدار: {generatedAt}</div>
        </div>
      </div>

      {type === "dashboard" && (
        <>
          <div className="print-stat-row">
            <div className="print-stat"><span>{total}</span>إجمالي الأصناف</div>
            <div className="print-stat"><span>{available}</span>متوفرة</div>
            <div className="print-stat"><span>{low}</span>مخزون منخفض</div>
            <div className="print-stat"><span>{empty}</span>نفدت كمياتها</div>
          </div>
          <table className="print-table">
            <thead><tr><th>الكود</th><th>الصنف</th><th>المجموعة</th><th>الموقع</th><th>الكمية</th><th>الحالة</th></tr></thead>
            <tbody>
              {inventory.map((i) => (
                <tr key={i.code}>
                  <td>{i.code}</td>
                  <td>{i.name}</td>
                  <td>{groupName(i.group)}</td>
                  <td>{i.category || "—"}</td>
                  <td>{i.balance}</td>
                  <td>{STATUS_META[i.status]?.label}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </>
      )}

      {type === "inventory" && (
        <table className="print-table">
          <thead><tr><th>الكود</th><th>الصنف</th><th>المجموعة</th><th>الموقع</th><th>الداخل</th><th>الخارج</th><th>الكمية</th><th>الحالة</th></tr></thead>
          <tbody>
            {inventory.map((i) => (
              <tr key={i.code}>
                <td>{i.code}</td>
                <td>{i.name}</td>
                <td>{groupName(i.group)}</td>
                <td>{i.category || "—"}</td>
                <td>{i.inQty}</td>
                <td>{i.outQty}</td>
                <td>{i.balance}</td>
                <td>{STATUS_META[i.status]?.label}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {type === "items" && (
        <table className="print-table">
          <thead><tr><th>الكود</th><th>اسم الغرض</th><th>الفئة / الموقع</th><th>ملاحظات</th></tr></thead>
          <tbody>
            {data.items.map((it) => (
              <tr key={it.code}>
                <td>{it.code}</td>
                <td>{it.name}</td>
                <td>{it.category || "—"}</td>
                <td>{it.notes || "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <div className="print-report-footer">سجلّ المستودع — مستند تم إنشاؤه تلقائياً بتاريخ {generatedAt}</div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  STYLES                                                             */
/* ------------------------------------------------------------------ */

function FontStyles() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

      :root {
        --kraft: #ECE2CC;
        --kraft-deep: #E1D3B2;
        --paper: #F8F3E7;
        --ink: #23303A;
        --ink-soft: #5B6570;
        --line: #C9BA96;
        --navy: #2B3B47;
        --green: #3F6D4E;
        --green-bg: #E9F1E9;
        --amber: #B3792C;
        --amber-bg: #FBF0DD;
        --red: #B23A2E;
        --red-bg: #FAE6E2;
      }

      * { box-sizing: border-box; }

      .app-shell, .boot-screen {
        direction: rtl;
        font-family: 'Tajawal', sans-serif;
        color: var(--ink);
        background: var(--paper);
        background-image:
          linear-gradient(var(--paper), var(--paper)),
          repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(35,48,58,0.025) 28px);
      }

      .boot-screen {
        height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        font-size: 14px; color: var(--ink-soft);
      }
      .boot-mark { font-size: 34px; }

      .app-shell {
        display: flex;
        min-height: 100vh;
        width: 100%;
      }

      .mono, .cell-mono, .code-tag, input.mono { font-family: 'JetBrains Mono', monospace; }

      /* ---------- SIDEBAR ---------- */
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--kraft);
        border-left: 1px dashed var(--line);
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
        gap: 22px;
      }
      .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 8px; background: var(--navy); color: #F3EEDD;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      }
      .brand-title { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 15px; line-height: 1.3; }
      .brand-sub { font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.04em; font-family: 'JetBrains Mono', monospace; }

      .nav-list { display: flex; flex-direction: column; gap: 3px; }
      .nav-item {
        display: flex; align-items: center; gap: 10px;
        background: transparent; border: none; cursor: pointer;
        padding: 10px 10px; border-radius: 8px;
        font-family: 'Tajawal', sans-serif; font-size: 13.5px; font-weight: 500;
        color: var(--ink); text-align: right; transition: background 0.15s ease;
      }
      .nav-index {
        font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-soft);
        width: 16px;
      }
      .nav-item:hover { background: rgba(43,59,71,0.06); }
      .nav-item-active { background: var(--navy); color: #F3EEDD; }
      .nav-item-active .nav-index { color: rgba(243,238,221,0.55); }

      .sidebar-foot { margin-top: auto; padding: 0 4px; }
      .save-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
      .conn-dot { width: 9px; height: 9px; min-width: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); cursor: default; }
      .conn-dot-off { background: var(--red); box-shadow: 0 0 0 3px var(--red-bg, rgba(178,58,46,0.12)); animation: pulse 1.2s infinite ease-in-out; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

      /* ---------- MAIN ---------- */
      .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 24px; border-bottom: 1px dashed var(--line);
        position: sticky; top: 0; background: var(--paper); z-index: 5;
      }
      .hamburger { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 6px; }
      .hamburger span { width: 20px; height: 2px; background: var(--ink); border-radius: 2px; }

      .global-search { position: relative; flex: 1; max-width: 380px; display: flex; align-items: center; gap: 8px;
        background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--ink-soft);
      }
      .global-search input { border: none; outline: none; background: transparent; font-family: 'Tajawal'; font-size: 13px; color: var(--ink); flex: 1; }
      .global-results { position: absolute; top: 42px; right: 0; left: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(35,48,58,0.12); overflow: hidden; z-index: 20; }
      .global-result-item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: none; border: none; border-bottom: 1px solid #eee2c9; cursor: pointer; text-align: right; }
      .global-result-item:last-child { border-bottom: none; }
      .global-result-item:hover { background: #FAF6EA; }

      .main-area { padding: 24px 28px 60px; flex: 1; }

      .page { display: flex; flex-direction: column; gap: 18px; max-width: 1180px; }

      .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .page-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; margin-bottom: 4px; }
      .page-title { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 24px; margin: 0; color: var(--navy); }
      .page-subtitle { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }

      /* ---------- STAT CARDS ---------- */
      .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .stat-card {
        background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 8px; cursor: pointer;
        text-align: right; transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(35,48,58,0.08); }
      .stat-value { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 26px; }
      .stat-label { font-size: 12.5px; color: var(--ink-soft); }
      .tone-navy svg { color: var(--navy); } .tone-navy .stat-value { color: var(--navy); }
      .tone-green svg { color: var(--green); } .tone-green .stat-value { color: var(--green); }
      .tone-amber svg { color: var(--amber); } .tone-amber .stat-value { color: var(--amber); }
      .tone-red svg { color: var(--red); } .tone-red .stat-value { color: var(--red); }

      /* ---------- PANEL / TABLE ---------- */
      .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
      .panel-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 10px; }
      .panel-title { font-family: 'Almarai', sans-serif; font-weight: 700; font-size: 14.5px; }
      .panel-sub { font-size: 11.5px; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; }

      .table-wrap { overflow-x: auto; }
      .ledger-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .ledger-table th {
        text-align: right; font-family: 'Tajawal'; font-weight: 700; font-size: 11.5px; color: var(--ink-soft);
        padding: 8px 14px; border-top: 1px dashed var(--line); border-bottom: 1px solid var(--line); white-space: nowrap;
      }
      .ledger-table th.sortable { cursor: pointer; user-select: none; }
      .ledger-table td { padding: 11px 14px; border-bottom: 1px solid #F0E9D6; white-space: nowrap; }
      .ledger-table tr:last-child td { border-bottom: none; }
      .ledger-table tr:hover td { background: #FBF8F0; }
      .cell-strong { font-weight: 700; }
      .cell-muted { color: var(--ink-soft); font-size: 12.5px; }
      .cell-mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
      .cell-balance { font-weight: 700; }

      .code-tag { display: inline-flex; align-items: center; gap: 5px; background: #F3EEDD; border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; font-size: 11.5px; color: var(--ink); }

      .stamp-badge {
        display: inline-block; font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 11px;
        padding: 4px 10px; border: 1.5px solid; border-radius: 20px; letter-spacing: 0.01em;
      }

      .move-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 20px; }
      .move-in { background: var(--green-bg); color: var(--green); }
      .move-out { background: var(--red-bg); color: var(--red); }

      /* ---------- TOOLBAR ---------- */
      .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .search-box { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; flex: 1; min-width: 220px; color: var(--ink-soft); }
      .search-box input { border: none; outline: none; background: transparent; font-family: 'Tajawal'; font-size: 13px; flex: 1; color: var(--ink); }
      .search-cam-btn {
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        width: 28px; height: 28px; border-radius: 7px; border: none; cursor: pointer;
        background: var(--navy); color: #F3EEDD; margin-inline-start: 2px;
      }
      .search-cam-btn:hover { background: #1E2A33; }
      .filter-chips { display: flex; gap: 6px; }
      .chip { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 7px 14px; font-size: 12px; font-family: 'Tajawal'; font-weight: 500; cursor: pointer; color: var(--ink-soft); }
      .chip-active { background: var(--navy); border-color: var(--navy); color: #F3EEDD; }

      /* ---------- BUTTONS ---------- */
      .btn-primary, .btn-ghost, .btn-danger {
        display: inline-flex; align-items: center; gap: 7px; font-family: 'Tajawal'; font-weight: 700; font-size: 13px;
        border-radius: 9px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
      }
      .btn-primary { background: var(--navy); color: #F3EEDD; }
      .btn-primary:hover { background: #1E2A33; }
      .btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
      .btn-ghost:hover { background: #FAF6EA; }
      .btn-danger { background: var(--red); color: #fff; }
      .btn-danger:hover { background: #98301F; }

      .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 7px; color: var(--ink-soft); display: inline-flex; }
      .icon-btn:hover { background: #F0E9D6; color: var(--ink); }
      .icon-btn-danger:hover { background: var(--red-bg); color: var(--red); }
      .row-actions { display: flex; gap: 2px; }

      /* ---------- FORMS ---------- */
      .form-panel { padding: 18px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .form-grid-move { grid-template-columns: 1fr 1fr 1fr; }
      .field { display: flex; flex-direction: column; gap: 6px; position: relative; }
      .field-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
      .scan-label { display: inline-flex; align-items: center; gap: 5px; }
      .scan-hint {
        font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; color: var(--green);
        background: var(--green-bg); padding: 1.5px 7px; border-radius: 10px; letter-spacing: 0.02em;
        animation: scan-breathe 1.6s ease-in-out infinite;
      }
      @keyframes scan-breathe { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .scan-input { border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,109,78,0.08); }
      .scan-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,109,78,0.14); }
      .scan-flash { animation: scan-flash-anim 0.35s ease; }
      @keyframes scan-flash-anim {
        0% { background: var(--green-bg); border-color: var(--green); }
        100% { background: var(--paper); }
      }

      .scan-input-row { display: flex; gap: 6px; align-items: stretch; }
      .scan-input-row .scan-input { flex: 1; min-width: 0; }
      .scan-camera-btn {
        display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        background: var(--navy); color: #F3EEDD; border: none; border-radius: 8px; padding: 0 12px;
        font-family: 'Tajawal'; font-weight: 700; font-size: 12px; cursor: pointer;
      }
      .scan-camera-btn:hover { background: #1E2A33; }

      .camera-sheet { max-width: 460px; }
      .camera-body { padding: 0; }
      .camera-frame { position: relative; width: 100%; aspect-ratio: 4 / 5; background: #111; overflow: hidden; }
      .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .camera-reticle { position: absolute; inset: 14% 10%; pointer-events: none; }
      .reticle-corner { position: absolute; width: 26px; height: 26px; border: 3px solid #7FE0A0; }
      .reticle-corner.tl { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 6px 0 0 0; }
      .reticle-corner.tr { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 0 6px 0 0; }
      .reticle-corner.bl { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 0 6px; }
      .reticle-corner.br { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 6px 0; }
      .reticle-line { position: absolute; right: 0; left: 0; top: 50%; height: 2px; background: #7FE0A0; box-shadow: 0 0 8px #7FE0A0; animation: reticle-sweep 1.6s ease-in-out infinite; }
      @keyframes reticle-sweep { 0%,100% { top: 12%; } 50% { top: 88%; } }
      .camera-status {
        position: absolute; bottom: 12px; right: 50%; transform: translateX(50%);
        background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; font-family: 'Tajawal'; font-weight: 600;
        padding: 6px 14px; border-radius: 20px; white-space: nowrap;
      }
      .camera-fallback { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 26px 22px; color: var(--ink-soft); }
      .camera-fallback svg { color: var(--amber); }
      .camera-fallback p { font-size: 12.5px; line-height: 1.8; margin: 0; }
      .camera-manual { display: flex; gap: 8px; width: 100%; margin-top: 4px; }
      .camera-manual .input { flex: 1; }
      .input {
        border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-family: 'Tajawal'; font-size: 13.5px;
        background: var(--paper); color: var(--ink); outline: none;
      }
      .input:focus { border-color: var(--navy); background: #fff; }
      .input:disabled { color: var(--ink-soft); }
      .form-actions { display: flex; justify-content: flex-start; margin-top: 14px; }

      .autocomplete { position: relative; }
      .suggest-list { position: absolute; top: 42px; right: 0; left: 0; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 20px rgba(35,48,58,0.12); z-index: 15; max-height: 220px; overflow-y: auto; }
      .suggest-item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 11px; background: none; border: none; border-bottom: 1px solid #F0E9D6; cursor: pointer; text-align: right; font-size: 12.5px; }
      .suggest-item:last-child { border-bottom: none; }
      .suggest-item:hover { background: #FAF6EA; }

      .alert { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 10px 13px; border-radius: 8px; margin-top: 12px; }
      .alert-error { background: var(--red-bg); color: var(--red); }
      .alert-info { background: #EAF1F5; color: var(--navy); }

      /* ---------- MODAL ---------- */
      .modal-overlay { position: fixed; inset: 0; background: rgba(35,48,58,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
      .modal-sheet { background: var(--paper); border-radius: 14px; width: 100%; max-width: 420px; border: 1px solid var(--line); overflow: hidden; }
      .modal-sheet-wide { max-width: 640px; }
      .modal-sheet-wide .modal-body { padding: 24px 26px; }
      .modal-sheet-wide .form-grid { gap: 18px 22px; }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px dashed var(--line); }
      .modal-title { font-family: 'Almarai'; font-weight: 800; font-size: 14.5px; }
      .modal-body { padding: 18px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; grid-column: 1 / -1; }
      .modal-section-divider {
        grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
        border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 4px;
      }
      .confirm-text { font-size: 13px; color: var(--ink); line-height: 1.7; margin: 0; }

      /* ---------- EMPTY STATE ---------- */
      .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 46px 20px; color: var(--ink-soft); text-align: center; }
      .empty-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
      .empty-hint { font-size: 12px; }

      /* ---------- BARCODE CARDS ---------- */
      .barcode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 14px; }
      .barcode-card { position: relative; background: #fff; border: 1px dashed var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .barcode-stripes { display: flex; gap: 1.5px; height: 32px; align-items: stretch; }
      .barcode-stripes span { background: var(--ink); display: block; }
      .barcode-number { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.05em; margin-top: 4px; }
      .barcode-name { font-size: 12.5px; font-weight: 700; text-align: center; }
      .barcode-actions { position: absolute; top: 6px; left: 6px; }

      /* ---------- TOAST ---------- */
      .toast {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
        font-family: 'Tajawal'; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(35,48,58,0.2); z-index: 200;
        animation: toast-in 0.2s ease;
      }
      @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
      .toast-success { background: var(--navy); color: #F3EEDD; }
      .toast-error { background: var(--red); color: #fff; }

      /* ---------- LOGIN GATE ---------- */
      .login-screen {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--kraft); padding: 20px;
      }
      .login-card {
        background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
        padding: 34px 30px; width: 100%; max-width: 380px; text-align: center;
        box-shadow: 0 14px 40px rgba(35,48,58,0.12);
      }
      .login-mark {
        width: 52px; height: 52px; border-radius: 14px; background: var(--navy); color: #F3EEDD;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
      }
      .login-title { font-family: 'Almarai'; font-weight: 800; font-size: 19px; color: var(--ink); }
      .login-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; margin-bottom: 22px; }
      .login-choices { display: flex; flex-direction: column; gap: 10px; }
      .login-choice {
        display: flex; align-items: center; gap: 12px; text-align: right;
        background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
        cursor: pointer; font-family: 'Tajawal';
      }
      .login-choice:hover { background: #FAF6EA; border-color: var(--navy); }
      .login-choice-icon {
        width: 36px; height: 36px; border-radius: 10px; background: var(--kraft);
        display: flex; align-items: center; justify-content: center; color: var(--navy); flex-shrink: 0;
      }
      .login-choice-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
      .login-choice-hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
      .login-admin-form { display: flex; flex-direction: column; gap: 4px; text-align: right; }
      .login-admin-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
      .link-btn {
        background: none; border: none; padding: 0; margin-top: 8px; text-align: right;
        color: var(--navy); font-family: 'Tajawal'; font-size: 12px; font-weight: 700;
        text-decoration: underline; cursor: pointer; align-self: flex-start;
      }
      .recovered-pass {
        font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
        background: var(--kraft); border: 1px dashed var(--line); border-radius: 10px;
        padding: 10px; text-align: center; letter-spacing: 0.04em;
      }

      /* ---------- VIEW MODE (لوحة العرض) — واجهة مبسّطة للزوار ---------- */
      .view-shell { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
      .view-topbar {
        display: flex; align-items: center; gap: 12px; padding: 14px 20px;
        border-bottom: 1px dashed var(--line); background: var(--paper); position: sticky; top: 0; z-index: 5;
      }
      .view-topbar .brand { display: flex; align-items: center; gap: 10px; flex: 1; }
      .view-control-btn { white-space: nowrap; }
      .view-main { flex: 1; padding: 20px 24px 40px; }
      @media (max-width: 520px) {
        .view-topbar { padding: 12px 14px; }
        .view-main { padding: 16px 14px 60px; }
        .view-control-btn span { display: none; }
      }

      /* ---------- ROLE BADGE ---------- */
      .role-badge {
        display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
        padding: 7px 12px; border-radius: 20px; margin: 0 16px 10px;
      }
      .role-badge-guest { background: var(--amber-bg); color: var(--amber); }
      .role-badge-admin { background: var(--green-bg); color: var(--green); }

      .logout-btn {
        display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
        font-family: 'Tajawal'; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); padding: 6px 2px; margin-top: 6px;
      }
      .logout-btn:hover { color: var(--red); }

      /* ---------- ALERT BANNER ---------- */
      .alert-banner {
        display: flex; align-items: center; gap: 10px; background: var(--amber-bg); color: var(--amber);
        border: 1px solid var(--amber); border-radius: 10px; padding: 11px 14px; margin-bottom: 16px; font-size: 12.5px;
      }
      .alert-banner-text { flex: 1; line-height: 1.7; }
      .alert-banner-btn { flex-shrink: 0; }
      .alert-banner-expiry { background: var(--red-bg); color: var(--red); border-color: var(--red); }

      /* ---------- CHARTS ---------- */
      .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
      .mini-chart { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      .mini-chart-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; }
      .mini-chart-label { font-size: 11.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mini-chart-track { background: var(--kraft); border-radius: 6px; height: 10px; overflow: hidden; }
      .mini-chart-bar { background: var(--navy); height: 100%; border-radius: 6px; transition: width 0.3s ease; }
      .mini-chart-bar-amber { background: var(--amber); }
      .mini-chart-val { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: left; }
      .mini-chart-pct { color: var(--ink-soft); font-size: 10.5px; }

      /* ---------- INVENTORY GRID CARDS ---------- */
      .location-select { max-width: 180px; }
      .view-toggle { display: flex; gap: 4px; }
      .page-check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .page-check-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

      /* ---------- EMOJI PICKER ---------- */
      .emoji-picker-wrap { position: relative; }
      .emoji-trigger {
        display: flex; align-items: center; gap: 8px; width: 100%; background: #fff; border: 1px solid var(--line);
        border-radius: 8px; padding: 9px 12px; font-family: 'Tajawal'; font-size: 13px; color: var(--ink); cursor: pointer;
      }
      .emoji-trigger-glyph { font-size: 18px; }
      .emoji-popover {
        position: absolute; z-index: 40; top: calc(100% + 6px); right: 0; left: 0; background: #fff; border: 1px solid var(--line);
        border-radius: 10px; padding: 10px; box-shadow: 0 10px 28px rgba(35,48,58,0.18);
      }
      .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 8px; }
      .emoji-cell { font-size: 18px; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px; cursor: pointer; }
      .emoji-cell:hover { background: var(--kraft); }
      .emoji-cell-active { border-color: var(--navy); background: var(--kraft); }
      .emoji-custom-row { display: flex; gap: 6px; }
      .inv-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 14px; }
      .inv-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 13px; display: flex; flex-direction: column; gap: 6px; }
      .inv-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .inv-card-loc { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; }
      .inv-card-balance { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; margin-top: 4px; }
      .inv-card-balance-unit { font-family: 'Tajawal'; font-size: 11px; font-weight: 400; color: var(--ink-soft); }

      /* ---------- REAL BARCODE ---------- */
      .real-barcode { width: 100%; max-width: 170px; height: 34px; }

      /* ---------- BOTTOM NAV (mobile) ---------- */
      .bottom-nav { display: none; }

      /* ---------- PRINT / PDF EXPORT ---------- */
      @media print {
        .sidebar, .bottom-nav, .topbar, .toolbar, .toast, .row-actions, .barcode-actions,
        .stat-grid button, .modal-overlay, .alert-banner-btn, .btn-primary, .btn-ghost { display: none !important; }
        body, .app-shell { background: #fff !important; }
        .main-col { margin: 0 !important; }
        .panel, .ledger-table, .barcode-grid { box-shadow: none !important; border: 1px solid #999 !important; }
        .page { padding: 0 !important; }
      }

      /* ---------- تقرير الطباعة/PDF (تصميم مستند مستقل عن واجهة الموقع) ---------- */
      .print-report { display: none; }
      body.printing-report .app-shell,
      body.printing-report .view-shell,
      body.printing-report .toast { display: none !important; }
      @media print {
        body.printing-report .print-report {
          display: block !important; background: #fff; color: #23303A;
          font-family: 'Tajawal', sans-serif; padding: 10mm 6mm; direction: rtl;
        }
      }
      .print-report-header {
        display: flex; align-items: flex-start; justify-content: space-between;
        border-bottom: 2px solid #23303A; padding-bottom: 10px; margin-bottom: 16px;
      }
      .print-report-brand { display: flex; align-items: center; gap: 10px; }
      .print-report-brand-mark { font-size: 26px; }
      .print-report-brand-title { font-family: 'Almarai'; font-weight: 800; font-size: 16px; }
      .print-report-brand-sub { font-size: 10.5px; color: #5B6570; }
      .print-report-meta { text-align: left; font-size: 11px; color: #5B6570; }
      .print-report-doc-title { font-family: 'Almarai'; font-weight: 800; font-size: 14px; color: #23303A; margin-bottom: 3px; }
      .print-stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
      .print-stat {
        flex: 1; border: 1px solid #C9BA96; border-radius: 8px; padding: 10px;
        text-align: center; font-size: 11px; color: #5B6570;
      }
      .print-stat span { display: block; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #23303A; margin-bottom: 2px; }
      .print-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .print-table th, .print-table td { border: 1px solid #999; padding: 5px 7px; text-align: right; }
      .print-table th { background: #ECE2CC; font-weight: 700; }
      .print-table tr { break-inside: avoid; }
      .print-report-footer { margin-top: 18px; padding-top: 8px; border-top: 1px dashed #C9BA96; font-size: 10px; color: #5B6570; text-align: center; }
      @page { margin: 12mm; }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 860px) {
        .stat-grid { grid-template-columns: repeat(2, 1fr); }
        .chart-grid { grid-template-columns: 1fr; }
        .form-grid, .form-grid-move { grid-template-columns: 1fr 1fr; }
        .sidebar { position: fixed; top: 0; bottom: 0; right: 0; z-index: 50; transform: translateX(100%); transition: transform 0.2s ease; box-shadow: -8px 0 24px rgba(0,0,0,0.15); }
        .sidebar-open { transform: translateX(0); }
        .hamburger { display: flex; }
        .main-area { padding: 18px 16px 60px; }
      }
      @media (max-width: 520px) {
        .stat-grid { grid-template-columns: 1fr 1fr; }
        .form-grid, .form-grid-move { grid-template-columns: 1fr; }
        .page-title { font-size: 20px; }
        .bottom-nav {
          display: flex; position: fixed; bottom: 0; right: 0; left: 0; z-index: 60;
          background: var(--paper); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
          box-shadow: 0 -6px 18px rgba(35,48,58,0.12);
        }
        .bottom-nav-item {
          flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
          background: none; border: none; color: var(--ink-soft); font-family: 'Tajawal'; font-weight: 600; font-size: 10px; padding: 6px 2px;
        }
        .bottom-nav-item span { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bottom-nav-active { color: var(--navy); }
        .main-area { padding-bottom: 76px; }
      }
    `}</style>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
