<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // بيانات مشروع Supabase (استبدلها بمشروعك)
  const SUPABASE_URL = "https://mptanycarwowbtojeswf.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_WCOF4gaVOhXHTKSVUT6r4Q_UUoQLSIT";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const TABLE = "warehouse_state";

  window.storage = {
    async get(key) {
      const { data, error } = await supabase
        .from(TABLE).select("key, value").eq("key", key).maybeSingle();
      if (error) throw error;
      if (!data) return null;
      return { key: data.key, value: data.value };
    },
    async set(key, value) {
      const { error } = await supabase
        .from(TABLE)
        .upsert({ key, value: String(value), updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value };
    },
    async delete(key) {
      const { data: existing } = await supabase
        .from(TABLE).select("key").eq("key", key).maybeSingle();
      const existed = !!existing;
      if (existed) {
        const { error } = await supabase.from(TABLE).delete().eq("key", key);
        if (error) throw error;
      }
      return { key, deleted: existed };
    },
    async list(prefix) {
      let q = supabase.from(TABLE).select("key").order("key");
      if (prefix) q = q.gte("key", prefix).lt("key", prefix + "\uf8ff");
      const { data, error } = await q;
      if (error) throw error;
      return { keys: (data || []).map((d) => d.key), prefix };
    },
  };

  // مزامنة فورية بين جميع الأجهزة عبر Supabase Realtime
  window.subscribeStorage = function (key, callback) {
    const channel = supabase
      .channel(`storage-${key}`)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: TABLE, filter: `key=eq.${key}` },
        (payload) => {
          if (payload.eventType === "DELETE") return;
          callback(payload.new.value, false);
        }
      )
      .subscribe();
    return () => supabase.removeChannel(channel);
  };

  window.supabaseClient = supabase;
</script>

/* True, scannable barcode (Code128) rendered as SVG — falls back to a
   placeholder if the number isn't a valid barcode value. */
function RealBarcode({ value, height = 34 }) {
  const svgRef = React.useRef(null);
  const [ok, setOk] = useState(true);
  useEffect(() => {
    if (!svgRef.current) return;
    try {
      JsBarcode(svgRef.current, String(value || ""), {
        format: "CODE128", displayValue: false, margin: 0, height, width: 1.6,
        background: "transparent", lineColor: "#23303A",
      });
      setOk(true);
    } catch { setOk(false); }
  }, [value, height]);
  if (!value) return null;
  return ok ? <svg ref={svgRef} className="real-barcode" /> : (
    <div className="barcode-stripes" aria-hidden="true">
      {Array.from({ length: 28 }).map((_, i) => <span key={i} style={{ width: (i % 5 === 0 ? 3 : 1) + "px" }} />)}
    </div>
  );
}

const GROUP_EMOJI_HINTS = [

// الموحّد. نتحقق أولاً من اسم مجموعة الصنف، وإن ما توافق أو ما فيه مجموعة
// نتحقق من اسم/فئة الصنف نفسه — مجرد تمييز بصري، بدون أي تغيير بالبيانات
const CARD_THEME_HINTS = [
  { key: "book", match: /كتاب|كتب|مكتبة|رواية|مجلد|ديوان/ },
  { key: "dishes", match: /صحون|مائدة|أطباق/ },
  { key: "plastic", match: /بلاستيك/ },
  { key: "paper", match: /ورق/ },
  { key: "cleaning", match: /منظف|تنظيف/ },
  { key: "water", match: /ماء|مياه/ },
  { key: "cardboard", match: /كرتون/ },
  { key: "electrical", match: /كهرب/ },
  { key: "safety", match: /سلامة|إطفاء/ },
  { key: "tools", match: /أدوات|صيانة|عدة/ },
  { key: "stationery", match: /قرطاسية|مكتب/ },
];
function getCardTheme(item, itemGroups) {
  if (!item) return null;
  const group = (itemGroups || []).find((g) => g.id === item.group);
  const groupName = group?.name || "";
  for (const h of CARD_THEME_HINTS) {
    if (h.match.test(groupName)) return h.key;
  }
  const selfText = `${item.name || ""} ${item.category || ""}`;
  for (const h of CARD_THEME_HINTS) {
    if (h.match.test(selfText)) return h.key;
  }
  return null;
}
// إبقاء الاسم القديم متاحاً تحسباً لاستخدامه في مكان آخر
function isBookItem(item, itemGroups) {
  return getCardTheme(item, itemGroups) === "book";

function genId(prefix) {
  return prefix + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

// يولّد رقم باركود عشوائي مكوّن من 10 أرقام، ويتأكد أنه غير مكرر مع أي
// باركود موجود مسبقاً بالقائمة المُمرَّرة (existingBarcodes)
function generateBarcodeNumber(existingBarcodes) {
  const list = existingBarcodes || [];
  let code;
  do {
    code = String(Math.floor(1000000000 + Math.random() * 9000000000));
  } while (list.some((b) => b.number === code));
  return code;
}

// تطبيع نص عربي للبحث المرن: يوحّد الهمزات (أ إ آ ا)، الياء/الألف المقصورة
// (ي ى)، التاء المربوطة/الهاء (ة ه)، يشيل التشكيل والتطويل، ويطبّع الأرقام
// العربية للإنجليزية — حتى البحث يلقى النتيجة رغم فروقات الكتابة الشائعة.
function normalizeAr(str) {
  return String(str || "")
    .replace(/[\u064B-\u0652\u0670\u0640]/g, "") // تشكيل + تطويل
    .replace(/[إأآا]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
    .toLowerCase()
    .trim();
}
// يتحقق أن نص المصدر يحتوي على نص البحث بعد تطبيع الاثنين — يدعم كذلك
// البحث بعدة كلمات بأي ترتيب (مثال: "شاي كبير" يلقى "بسكوت شاي حجم كبير")
// طالما كل كلمة من كلمات البحث موجودة بمكان ما في النص، بدل اشتراط تطابق
// الجملة كاملة بنفس ترتيبها الحرفي
function fuzzyIncludes(source, query) {
  if (!query) return true;
  const src = normalizeAr(source);
  const tokens = normalizeAr(query).split(/\s+/).filter(Boolean);
  if (!tokens.length) return true;
  return tokens.every((t) => src.includes(t));
}

// يضمن وجود إعدادات الحساب/المستخدمين/المجموعات حتى لو كانت بيانات

let __audioCtx = null;
function playBeep(kind = "success") {
  try {
    __audioCtx = __audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __audioCtx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.value = kind === "error" ? 220 : 880;
    g.gain.value = 0.001;
    const t0 = ctx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (kind === "error" ? 0.28 : 0.14));
    o.start(t0);
    o.stop(t0 + (kind === "error" ? 0.3 : 0.16));
    if (kind === "error") {
      const o2 = ctx.createOscillator();
      o2.connect(g); o2.type = "sine"; o2.frequency.value = 160;
      o2.start(t0 + 0.15); o2.stop(t0 + 0.3);
    }
  } catch {}
}
function hapticPulse(kind = "success") {
  try { navigator.vibrate?.(kind === "error" ? [40, 40, 40] : 30); } catch {}
}

/* ------------------------------------------------------------------ */
/*  CSV IMPORT (bulk)                                                  */
/* ------------------------------------------------------------------ */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  const clean = rows.filter((r) => r.some((c) => String(c).trim() !== ""));
  if (!clean.length) return [];
  const headers = clean[0].map((h) => h.trim().toLowerCase());
  return clean.slice(1).map((r) => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] ?? "").trim(); });
    return obj;
  });
}

/* ------------------------------------------------------------------ */

const STORE_KEY = "warehouse-data-v1";
const AUDIT_KEY = "warehouse-audit-log-v1";
// Data now lives in Firebase (Firestore) and syncs in real time across devices
// (laptop, phone, tablet) via window.subscribeStorage — see the Firebase layer above.

/* ------------------------------------------------------------------ */
/*  DAMAJ DHAKI (SMART MERGE) — يمنع ضياع بيانات جهاز عند حفظ جهاز آخر
    بنفس اللحظة تقريباً. بدل ما نكتب فوق الوثيقة كاملة، نقارن "قبل" و
    "بعد" تعديل هذا الجهاز مع أحدث نسخة فعلية بالسيرفر، ونطبّق فرق
    هذا الجهاز فقط (إضافة/تعديل/حذف) فوق تلك النسخة، صنف بصنف، بدل
    استبدال القائمة بأكملها.                                          */
/* ------------------------------------------------------------------ */
const ARRAY_ID_KEYS = {
  items: "code",
  incoming: "id",
  outgoing: "id",
  barcodes: "number",
  activities: "id",
  users: "id",
  owners: "id",
  branches: "id",
  tasks: "id",
  itemGroups: "id",
  auditLog: "id",
};

function mergeArrayField(latestArr, beforeArr, afterArr, idKey) {
  if (!Array.isArray(latestArr) || !Array.isArray(beforeArr) || !Array.isArray(afterArr)) {
    return Array.isArray(afterArr) ? afterArr : [];
  }
  const beforeMap = new Map(beforeArr.map((x) => [x?.[idKey], x]));
  const afterMap = new Map(afterArr.map((x) => [x?.[idKey], x]));
  const latestMap = new Map(latestArr.map((x) => [x?.[idKey], x]));

  // ابدأ من النسخة الفعلية بالسيرفر — تحترم تعديلات باقي الأجهزة
  const resultMap = new Map(latestMap);

  // طبّق ما أضافه/عدّله هذا الجهاز محلياً فقط
  for (const [id, afterItem] of afterMap) {
    if (id === undefined) continue;
    const beforeItem = beforeMap.get(id);
    const changedLocally = !beforeItem || JSON.stringify(beforeItem) !== JSON.stringify(afterItem);
    if (changedLocally) resultMap.set(id, afterItem);
  }
  // طبّق ما حذفه هذا الجهاز محلياً فقط (كان موجوداً قبل التعديل ومفقود بعده)
  for (const [id] of beforeMap) {
    if (id !== undefined && !afterMap.has(id)) resultMap.delete(id);
  }

  // إعادة بناء الترتيب: أولاً بترتيب afterArr (يحافظ على ترتيب القوائم
  // اللي تُضاف بالمقدمة مثل سجلات الوارد/الصادر)، ثم أي عناصر متبقية من
  // latestArr (تعديلات أجهزة أخرى لم تظهر بترتيب afterArr)
  const seen = new Set();
  const ordered = [];
  for (const item of afterArr) {
    const id = item?.[idKey];
    if (id !== undefined && resultMap.has(id) && !seen.has(id)) {
      ordered.push(resultMap.get(id));
      seen.add(id);
    }
  }
  for (const item of latestArr) {
    const id = item?.[idKey];
    if (id !== undefined && resultMap.has(id) && !seen.has(id)) {
      ordered.push(resultMap.get(id));
      seen.add(id);
    }
  }
  for (const [id, item] of resultMap) {
    if (!seen.has(id)) { ordered.push(item); seen.add(id); }
  }
  return ordered;
}

function smartMergeData(latest, before, after) {
  const result = { ...latest };
  const beforeSafe = before || {};
  for (const key of Object.keys(after)) {
    const idKey = ARRAY_ID_KEYS[key];
    if (idKey && Array.isArray(after[key])) {
      result[key] = mergeArrayField(latest[key], beforeSafe[key], after[key], idKey);
    } else if (JSON.stringify(beforeSafe[key]) !== JSON.stringify(after[key])) {
      // حقل عادي (مو قائمة، أو قائمة بدون مفتاح هوية معروف) وتغيّر محلياً
      // بهذا التعديل تحديداً: خذ قيمتنا نحن (نادر الحدوث ومحصور بحقول
      // إعدادات عامة، ليس قوائم أصناف/سجلات).
      result[key] = after[key];
    }
    // إن لم يتغيّر هذا الحقل بتعديلنا المحلي، يبقى كما هو بالسيرفر (latest)
  }
  return result;
}

function useStore(onRemoteUpdate) {
  const [data, setData] = useState(null);
  const [saving, setSaving] = useState(false);
  const [online, setOnline] = useState(true);
  const [lastSynced, setLastSynced] = useState(null);
  const dataRef = React.useRef(null);
  // نتذكّر آخر نسخة كتبناها نحن بأنفسنا، حتى نتجاهل صداها القادم عبر
  // Realtime (لأن Supabase يرسل الحدث للجهاز المُرسِل نفسه أيضاً)
  const lastLocalWriteRef = React.useRef(null);
  // آخر نسخة "نعرف بالتأكيد" أنها موجودة فعلياً على الخادم — تُحدَّث عند كل
  // تحميل أو استلام تحديث لحظي من جهاز آخر أو حفظ ناجح من هذا الجهاز.
  // تُستخدم لاكتشاف ما إذا عدّل جهاز آخر البيانات دون أن نستلم إشعاره بعد
  // (تأخير بالشبكة مثلاً) قبل أن نكتب فوقها بتعديلنا نحن.
  const knownRemoteRef = React.useRef(null);
  // كاش محلي لآخر نسخة بيانات وصلت بنجاح من الخادم — يُستخدم فقط عند
  // انقطاع الاتصال لعرض آخر بيانات معروفة بدل الرجوع لبيانات افتراضية
  // فارغة (وهو خطأ كان موجوداً سابقاً: أي انقطاع بالفتح الأول كان يمسح
  // شكل البيانات ويستبدلها بعيّنة تجريبية).
  const READ_CACHE_KEY = "warehouse-read-cache-v1";

  // نتذكّر أننا حمّلنا بيانات حقيقية من الخادم بنجاح ولو مرة واحدة من قبل
  // (على أي جهاز فتح الموقع) — حتى لا نعيد "تبذير" بيانات تجريبية فوق
  // بيانات حقيقية موجودة فعلاً في حال رجع الخادم استجابة فارغة لأي سبب
  // عابر (رجوع الصف فارغاً مؤقتاً، مفتاح تغيّر بالخطأ، مشكلة صلاحيات...الخ).
  // هذا هو السبب الحقيقي الأكثر شيوعاً لمشكلة "اختفاء البيانات فجأة".
  const EVER_LOADED_KEY = "warehouse-ever-loaded-v1";

  useEffect(() => {
    let cancelled = false;
    let unsub = null;
    (async () => {
      try {
        const res = await window.storage?.get(STORE_KEY, false);
        if (!cancelled) {
          if (res?.value) {
            dataRef.current = withDefaults(JSON.parse(res.value));
            setData(dataRef.current);
            knownRemoteRef.current = res.value;
            try {
              localStorage.setItem(READ_CACHE_KEY, res.value);
              localStorage.setItem(EVER_LOADED_KEY, "1");
            } catch {}
          } else {
            // الخادم رجّع "لا يوجد صف بهذا المفتاح" — هذا طبيعي فقط أول مرة
            // يُفتح فيها الموقع على الإطلاق. لو سبق ونجحنا بتحميل بيانات
            // حقيقية من قبل (على هذا الجهاز)، فهذا يعني على الأغلب مشكلة
            // مؤقتة بالخادم/الصلاحيات وليس أن البيانات فُقدت فعلاً — لذلك
            // لا نكتب فوقها بيانات تجريبية، بل نستخدم آخر نسخة محفوظة محلياً
            // ونعرض الموقع كـ "غير متصل" حتى لا نمحو بيانات حقيقية بالخطأ.
            let everLoaded = false;
            try { everLoaded = localStorage.getItem(EVER_LOADED_KEY) === "1"; } catch {}
            let cached = null;
            try {
              const raw = localStorage.getItem(READ_CACHE_KEY);
              if (raw) cached = withDefaults(JSON.parse(raw));
            } catch {}
            if (cached) {
              // نستخدم آخر نسخة معروفة محلياً بدل بيانات تجريبية، ونعتبر
              // أنفسنا "غير متصلين" حتى تصلنا نسخة حقيقية من الخادم —
              // منعاً لعرض بيانات ناقصة على أنها مؤكدة.
              dataRef.current = cached;
              setData(cached);
              setOnline(false);
            } else {
              // لا يوجد أي وثيقة بالخادم بهذا المفتاح، ولا نسخة محفوظة
              // محلياً على هذا الجهاز. نعرض بيانات تجريبية للتصفح فقط —
              // ولا نكتبها تلقائياً فوق الخادم أبداً (حتى لو أول فتح على
              // الإطلاق)، لأن أي قراءة فارغة عابرة (خطأ شبكة، صلاحيات،
              // تأخير مؤقت) قد تُخلط مع "أول فتح فعلي" وتمحو بيانات حقيقية
              // موجودة أصلاً. أول عملية حفظ حقيقية (إضافة/تعديل من المستخدم)
              // هي وحدها من ستكتب بيانات فعلية للخادم، عبر persist().
              const seed = withDefaults({ items: seedItems, incoming: seedIncoming, outgoing: seedOutgoing, barcodes: seedBarcodes });
              dataRef.current = seed;
              setData(seed);
              setOnline(everLoaded ? true : false);
              if (everLoaded) setLastSynced(Date.now());
            }
          }
        }
      } catch {
        if (!cancelled) {
          // لا يوجد اتصال: جرّب آخر نسخة محفوظة محلياً قبل اللجوء لبيانات تجريبية
          let cached = null;
          try {
            const raw = localStorage.getItem(READ_CACHE_KEY);
            if (raw) cached = withDefaults(JSON.parse(raw));
          } catch {}
          const fallback = cached || withDefaults({ items: seedItems, incoming: seedIncoming, outgoing: seedOutgoing, barcodes: seedBarcodes });
          dataRef.current = fallback;
          setData(fallback);
          setOnline(false);
        }
      }
      // مزامنة فورية: أي تعديل يحصل من جهاز آخر يصل هنا تلقائياً بدون تحديث الصفحة
      if (!cancelled && window.subscribeStorage) {
        unsub = window.subscribeStorage(STORE_KEY, (rawValue, isLocalWrite) => {
          if (cancelled || isLocalWrite) return; // تجاهل صدى تعديلاتنا نحن
          // تجاهل الحدث إذا كانت القيمة القادمة هي نفسها آخر شيء كتبناه من هذا الجهاز
          // (Realtime يرسل الحدث لصاحب التعديل أيضاً، وهذا هو مصدر إشعار
          // "تم تحديث البيانات من جهاز آخر" الذي كان يظهر حتى لتعديلاتنا نحن)
          if (rawValue === lastLocalWriteRef.current) return;
          knownRemoteRef.current = rawValue;
          try {
            const next = withDefaults(JSON.parse(rawValue));
            dataRef.current = next;
            setData(next);
            setOnline(true);
            setLastSynced(Date.now());
            try { localStorage.setItem(READ_CACHE_KEY, rawValue); } catch {}
            onRemoteUpdate?.();
          } catch {}
        });
      }
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, []);

  const OFFLINE_KEY = "warehouse-offline-pending-v1";

  const OFFLINE_BEFORE_KEY = "warehouse-offline-pending-before-v1";

  // دمج ذكي مشترك: يجلب أحدث نسخة فعلية من الخادم ويدمج فرق (before → after)
  // فوقها صنف بصنف. يُستخدم من persist() مباشرة، ومن flush() لاحقاً عند
  // مزامنة تعديلات حُفظت محلياً أثناء انقطاع الاتصال.
  const mergeWithLatest = useCallback(async (before, after) => {
    try {
      const latest = await window.storage?.get(STORE_KEY, false);
      if (latest?.value) {
        const latestData = JSON.parse(latest.value);
        knownRemoteRef.current = latest.value;
        return withDefaults(smartMergeData(latestData, before, after));
      }
    } catch {
      // تعذّر جلب أحدث نسخة (غالباً بسبب انقطاع الاتصال) — نكمل بنسختنا المحلية
    }
    return after;
  }, []);

  const persist = useCallback(async (next) => {
    // نسخة "قبل" هذا التعديل تحديداً، لأجل الدمج الذكي
    const beforeThisEdit = dataRef.current;
    const finalNext = await mergeWithLatest(beforeThisEdit, next);

    const serialized = JSON.stringify(finalNext);
    dataRef.current = finalNext;
    setData(finalNext);
    setSaving(true);
    lastLocalWriteRef.current = serialized;
    try {
      await window.storage?.set(STORE_KEY, serialized, false);
      knownRemoteRef.current = serialized;
      setOnline(true);
      setLastSynced(Date.now());
      try {
        localStorage.removeItem(OFFLINE_KEY);
        localStorage.removeItem(OFFLINE_BEFORE_KEY);
        localStorage.setItem(READ_CACHE_KEY, serialized);
      } catch {}
    } catch {
      // لا يوجد اتصال بالإنترنت: نحفظ التعديل محلياً وننتظر عودة الاتصال.
      // نحافظ على أقدم نسخة "قبل" ضمن سلسلة تعديلات أوفلاين متتالية، حتى
      // نقدر عند عودة الاتصال نعرف بالضبط وش تغيّر محلياً وندمجه صح، بدل
      // ما نكتب فوق كل شي.
      setOnline(false);
      try {
        if (!localStorage.getItem(OFFLINE_BEFORE_KEY)) {
          localStorage.setItem(OFFLINE_BEFORE_KEY, JSON.stringify(beforeThisEdit));
        }
        localStorage.setItem(OFFLINE_KEY, JSON.stringify(finalNext));
      } catch {}
    } finally {
      setSaving(false);
    }
  }, [mergeWithLatest]);



  // عند عودة الاتصال، حاول مزامنة أي تعديلات محفوظة محلياً أثناء الانقطاع
  useEffect(() => {
    const flush = async () => {
      let pending = null, pendingBefore = null;
      try {
        pending = localStorage.getItem(OFFLINE_KEY);
        pendingBefore = localStorage.getItem(OFFLINE_BEFORE_KEY);
      } catch {}
      if (!pending) return;
      try {
        const afterData = withDefaults(JSON.parse(pending));
        const beforeData = pendingBefore ? withDefaults(JSON.parse(pendingBefore)) : afterData;
        const merged = await mergeWithLatest(beforeData, afterData);
        const serialized = JSON.stringify(merged);
        lastLocalWriteRef.current = serialized;
        await window.storage?.set(STORE_KEY, serialized, false);
        knownRemoteRef.current = serialized;
        dataRef.current = merged;
        setData(merged);
        try {
          localStorage.removeItem(OFFLINE_KEY);
          localStorage.removeItem(OFFLINE_BEFORE_KEY);
          localStorage.setItem(READ_CACHE_KEY, serialized);
        } catch {}
        setOnline(true);
        setLastSynced(Date.now());
      } catch {}
    };
    window.addEventListener("online", flush);
    flush();
    return () => window.removeEventListener("online", flush);
  }, [mergeWithLatest]);

  return [data, persist, saving, { online, lastSynced }];
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(todayISO() + "T00:00:00");
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / 86400000);
}

function expiryTier(daysLeft) {
  if (daysLeft === null) return null;
  if (daysLeft <= 0) return "expired";
  if (daysLeft <= 7) return "critical";
  if (daysLeft <= 15) return "warning";
  if (daysLeft <= 30) return "notice";
  return null;
}

const EXPIRY_TIER_META = {
  expired: { label: "منتهي الصلاحية", ink: "var(--red)", bg: "var(--red-bg)" },
  critical: { label: "ينتهي خلال 7 أيام", ink: "var(--red)", bg: "var(--red-bg)" },
  warning: { label: "ينتهي خلال 15 يوماً", ink: "var(--amber)", bg: "var(--amber-bg)" },
  notice: { label: "ينتهي خلال 30 يوماً", ink: "var(--olive)", bg: "var(--olive-bg)" },
};

function computeInventory(data) {
  const { items, incoming, outgoing } = data;
  return items.map((item) => {
    const inQty = incoming.filter((r) => r.code === item.code).reduce((s, r) => s + Number(r.qty || 0), 0);
    const outQty = outgoing.filter((r) => r.code === item.code).reduce((s, r) => s + Number(r.qty || 0), 0);
    const balance = Math.round((inQty - outQty) * 100) / 100;
    const threshold = Number(item.minQty) > 0 ? Number(item.minQty) : LOW_STOCK_THRESHOLD;
    let status = "available";
    if (balance <= 0) status = "empty";
    else if (balance <= threshold) status = "low";
    const daysLeft = daysUntil(item.expiryDate);
    const expiry = expiryTier(daysLeft);
    return { ...item, inQty, outQty, balance, status, threshold, daysLeft, expiry };
  });
}

/*     فيه رئيس الموقع، حتى لو أغلق المتصفح تماماً أو قفل الجوال، عبر   */
/*     Supabase Edge Function (send-push) + مفاتيح VAPID. راجع ملفات    */
/*     manifest.json و sw.js و supabase_functions_send-push_index.ts.   */
/* ------------------------------------------------------------------ */

// ولا يظهر أبداً هنا. راجع تعليمات التوليد والنشر المرفقة.
const VAPID_PUBLIC_KEY = "BCmms7WV2tCOjCQ0UENen6HZ6stQoZujscs1Wtifu9XjfkcQuKJljyRtFLidfvf-iV7pabHl4JRm4fZu-J36gGA";

function fireSystemNotification(title, body, tag) {
  if (typeof Notification === "undefined") return;
  const send = () => { try { new Notification(title, { body, tag }); } catch {} };
  if (Notification.permission === "granted") send();
  else if (Notification.permission !== "denied") {
    Notification.requestPermission().then((p) => { if (p === "granted") send(); });
  }
}

/* ---------------------- Web Push (PWA) ---------------------- */

function pushIsSupported() {
  return typeof navigator !== "undefined" && "serviceWorker" in navigator && "PushManager" in window;
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function registerServiceWorker() {
  if (!pushIsSupported()) return null;
  try { return await navigator.serviceWorker.register("/sw.js"); } catch { return null; }
}

// حالة الاشتراك بهذا الجهاز/المتصفح تحديداً: "unsupported" | "not-subscribed" | "subscribed"
async function getPushSubscriptionState() {
  if (!pushIsSupported()) return "unsupported";
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return "not-subscribed";
    const sub = await reg.pushManager.getSubscription();
    return sub ? "subscribed" : "not-subscribed";
  } catch { return "not-subscribed"; }
}

// تفعيل التنبيهات اللحظية على هذا الجهاز: يطلب إذن الإشعارات، يسجّل Service Worker،
// يشترك في Push، ثم يحفظ الاشتراك في Supabase مربوطاً بمعرّف رئيس الموقع الحالي.
async function subscribeToPush(ownerId) {
  if (!pushIsSupported()) throw new Error("هذا المتصفح/الجهاز لا يدعم التنبيهات اللحظية");
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("لم يتم السماح بالتنبيهات من إعدادات المتصفح");

  const reg = (await navigator.serviceWorker.getRegistration()) || (await registerServiceWorker());
  if (!reg) throw new Error("تعذّر تسجيل Service Worker");
  await navigator.serviceWorker.ready;

  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }

  // ملاحظة: التنبيهات اللحظية (Push) ما زالت تعتمد على Supabase (جدول
  // push_subscriptions + Edge Function) ولم تُرحَّل لفايربيس بعد — هذا الجزء
  // معطّل مؤقتاً حتى تُعاد كتابته لاحقاً (Cloud Functions أو بديل مشابه).
  if (!window.supabase) throw new Error("التنبيهات اللحظية غير مفعّلة حالياً بعد الانتقال لفايربيس");

  const json = sub.toJSON();
  const { error } = await window.supabase.from("push_subscriptions").upsert(
    {
      owner_id: String(ownerId || "unknown"),
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth,
      device_label: navigator.userAgent.slice(0, 200),
    },
    { onConflict: "endpoint" }
  );
  if (error) throw error;
  return sub;
}

// إلغاء التنبيهات اللحظية على هذا الجهاز فقط.
async function unsubscribeFromPush() {
  if (!pushIsSupported()) return;
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  if (window.supabase) {
    try { await window.supabase.from("push_subscriptions").delete().eq("endpoint", sub.endpoint); } catch {}
  }
  await sub.unsubscribe();
}

// يستدعي Supabase Edge Function (send-push) لإرسال إشعار فعلي لكل أجهزة رئيس
// الموقع المشتركة. لا يعطّل الواجهة أبداً حتى لو فشل الإرسال (fire-and-forget).
async function sendPushToOwner(ownerId, title, body, tag) {
  if (!ownerId || !window.supabase) return;
  try {
    await window.supabase.functions.invoke("send-push", {
      body: { ownerId: String(ownerId), title, body, tag },
    });
  } catch {
    // تجاهل: فشل إرسال الـ Push الحقيقي لا يجب أن يوقف بقية التطبيق أبداً
  }
}

// نقطة دخول موحّدة يستدعيها أي جزء من الموقع عند وقوع حدث؛ تقرر بنفسها
// هل ترسل تنبيه نظام فعلياً حسب صلاحية المستخدم الحالي وإعداداته.
// level الحدث: "shortage" (نقص/نفاد) يظهر دائماً إن لم تكن التنبيهات موقوفة،
// أما "all" (إضافة/حركة عادية) فيظهر فقط إذا اختار رئيس الموقع "كل التنبيهات".
function notifySystemEvent({ isOwner, ownerId, settings, eventLevel, title, body, tag }) {
  if (!isOwner) return;
  if (settings.level === "off") return;
  if (eventLevel === "all" && settings.level !== "all") return;
  fireSystemNotification(title, body, tag);       // تنبيه محلي فوري لهذا التبويب
  sendPushToOwner(ownerId, title, body, tag);      // تنبيه Push حقيقي لكل أجهزة رئيس الموقع
}

function fmtDate(d) {
  if (!d) return "—";
  try {
    return new Intl.DateTimeFormat("ar-SA-u-nu-latn", { day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(d));
  } catch {
    return d;
  }
}

function toCSV(rows, headers) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(esc).join(",")];
  rows.forEach((r) => lines.push(headers.map((h) => esc(r[h])).join(",")));
  return lines.join("\n");
}

function downloadCSV(filename, rows, headers) {
  const csv = "\uFEFF" + toCSV(rows, headers);
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

const LAST_BACKUP_KEY = "warehouse-last-full-backup";

function markBackupDone() {
  try { localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); } catch {}
}
function daysSinceBackup() {
  try {
    const raw = localStorage.getItem(LAST_BACKUP_KEY);
    if (!raw) return Infinity;
    return (Date.now() - Number(raw)) / (24 * 3600 * 1000);
  } catch { return Infinity; }
}
function downloadFullBackup(data, auditLog) {
  const payload = {
    exportedAt: new Date().toISOString(),
    fullSiteBackup: true,
    ...FULL_BACKUP_FIELDS.reduce((acc, f) => { acc[f] = data[f]; return acc; }, {}),
    auditLog: Array.isArray(auditLog) ? auditLog : undefined,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `نسخة_احتياطية_كاملة_${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  markBackupDone();
  return payload;
}

/* ------------------------------------------------------------------ */
/*  استيراد نسخة احتياطية (JSON) من جهاز رئيس الموقع — يقرأ الملف الذي    */
/*  نزّله downloadFullBackup سابقاً، ويستبدل به كل معلومات الموقع: الأصناف  */
/*  والحركات والمستخدمين والمجموعات والأقسام والمهام، وأيضاً حسابات        */
/*  الرؤساء وكلمات مرورهم وإعدادات شاشة البداية وسجل النشاط — أي كل شيء   */
/*  محفوظ بالملف. تنبيه: الملف نفسه يحتوي كلمات المرور نصّاً صريحاً،        */
/*  فاحفظه بمكان آمن.                                                     */
/* ------------------------------------------------------------------ */
const FULL_BACKUP_FIELDS = [
  "items", "incoming", "outgoing", "barcodes", "users", "itemGroups",
  "branches", "tasks", "activities", "owners", "guestScreen", "guestWelcomeText", "guestListsConfig",
];

function parseBackupFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object" || !FULL_BACKUP_FIELDS.some((f) => parsed[f] !== undefined)) {
          reject(new Error("الملف لا يبدو نسخة احتياطية صالحة من هذا الموقع"));
          return;
        }
        resolve(parsed);
      } catch {
        reject(new Error("تعذّر قراءة الملف — تأكد أنه ملف JSON صالح"));
      }
    };
    reader.onerror = () => reject(new Error("تعذّر قراءة الملف"));
    reader.readAsText(file, "utf-8");
  });
}

function mergeBackupIntoData(currentData, backupPayload) {
  const next = { ...currentData };
  FULL_BACKUP_FIELDS.forEach((f) => {
    if (backupPayload[f] !== undefined) next[f] = backupPayload[f];
  });
  return withDefaults(next);
}

/* ------------------------------------------------------------------ */
/*  نسخ احتياطي تلقائي محلي على جهاز رئيس الموقع (File System Access    */
/*  API) — يختار رئيس الموقع مجلداً على جهازه مرة واحدة، والموقع يكتب     */
/*  ملف نسخة احتياطية بداخله تلقائياً كل فترة يحددها، بدون أي نافذة       */
/*  حفظ تظهر كل مرة. تعمل حالياً فقط على متصفحات تدعم هذه الميزة          */
/*  (Chrome/Edge على الكمبيوتر بالدرجة الأولى)، وفقط أثناء فتح الموقع     */
/*  فعلياً بالمتصفح — لا يوجد تطبيق يعمل بالخلفية.                        */
const AUTO_BACKUP_DB = "warehouse-auto-backup-db";
const AUTO_BACKUP_STORE = "handles";
const AUTO_BACKUP_SETTINGS_KEY = "warehouse-auto-backup-settings-v1";
const AUTO_BACKUP_LAST_KEY = "warehouse-auto-backup-last-v1";

function isAutoBackupSupported() {
  return typeof window !== "undefined" && "showDirectoryPicker" in window && typeof indexedDB !== "undefined";
}

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(AUTO_BACKUP_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(AUTO_BACKUP_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveDirHandle(handle) {
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUTO_BACKUP_STORE, "readwrite");
    tx.objectStore(AUTO_BACKUP_STORE).put(handle, "backup-dir");
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function getDirHandle() {
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUTO_BACKUP_STORE, "readonly");
    const req = tx.objectStore(AUTO_BACKUP_STORE).get("backup-dir");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function clearDirHandle() {
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(AUTO_BACKUP_STORE, "readwrite");
    tx.objectStore(AUTO_BACKUP_STORE).delete("backup-dir");
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function getAutoBackupSettings() {
  try {
    const raw = localStorage.getItem(AUTO_BACKUP_SETTINGS_KEY);
    return raw ? JSON.parse(raw) : { enabled: false, everyDays: 1 };
  } catch { return { enabled: false, everyDays: 1 }; }
}
function saveAutoBackupSettings(s) {
  try { localStorage.setItem(AUTO_BACKUP_SETTINGS_KEY, JSON.stringify(s)); } catch {}
}
function daysSinceAutoBackup() {
  try {
    const raw = localStorage.getItem(AUTO_BACKUP_LAST_KEY);
    if (!raw) return Infinity;
    return (Date.now() - Number(raw)) / (24 * 3600 * 1000);
  } catch { return Infinity; }
}
function markAutoBackupDone() {
  try { localStorage.setItem(AUTO_BACKUP_LAST_KEY, String(Date.now())); } catch {}
}

// يكتب ملف نسخة احتياطية جديد داخل المجلد المختار — يفترض أن الإذن ممنوح مسبقاً
async function writeAutoBackupFile(dirHandle, data, auditLog) {
  const payload = {
    exportedAt: new Date().toISOString(),
    fullSiteBackup: true,
    ...FULL_BACKUP_FIELDS.reduce((acc, f) => { acc[f] = data[f]; return acc; }, {}),
    auditLog: Array.isArray(auditLog) ? auditLog : undefined,
  };
  const fileHandle = await dirHandle.getFileHandle(`نسخة_احتياطية_تلقائية_${todayISO()}.json`, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(JSON.stringify(payload, null, 2));
  await writable.close();
  markAutoBackupDone();
}

/* -------------------- CAMERA BARCODE SCANNER -------------------- */
/* Uses the phone/laptop camera with the browser's native BarcodeDetector
   API — no external library needed. Falls back to manual entry when the
   browser doesn't support live detection (e.g. Safari on iPhone today). */

function BarcodeCameraModal({ onDetect, onClose }) {
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const [status, setStatus] = useState("initializing"); // initializing | scanning | unsupported | denied | error
  const [manualCode, setManualCode] = useState("");

  useEffect(() => {
    let cancelled = false;

    function cleanup() {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      streamRef.current?.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }

    async function start() {
      if (typeof window === "undefined" || !("BarcodeDetector" in window)) {
        setStatus("unsupported");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        setStatus("scanning");

        let detector;
        try {
          detector = new window.BarcodeDetector({
            formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "codabar", "itf", "qr_code"],
          });
        } catch {
          detector = new window.BarcodeDetector();
        }

        const tick = async () => {
          if (cancelled || !videoRef.current) return;
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes && codes.length > 0) {
              const raw = (codes[0].rawValue || "").trim();
              // لو الكود المقروء QR نحوّل محتواه لأرقام فقط (نتجاهل أي حروف
              // أو رموز أخرى بداخله)، بينما باقي أنواع الباركود (EAN وغيرها)
              // تُستخدم كما هي لأنها أرقام أصلاً
              const value = codes[0].format === "qr_code" ? raw.replace(/\D+/g, "") : raw;
              if (value) {
                cancelled = true;
                cleanup();
                playBeep("success");
                hapticPulse("success");
                onDetect(value);
                return;
              }
            }
          } catch {
            /* ignore per-frame decode errors */
          }
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
      } catch (err) {
        setStatus(err && err.name === "NotAllowedError" ? "denied" : "error");
      }
    }

    start();
    return () => {
      cancelled = true;
      cleanup();
    };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  const submitManual = () => {
    const v = manualCode.trim();
    if (v) onDetect(v);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-sheet camera-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <span className="modal-title"><Camera size={16} style={{ verticalAlign: "-2px", marginLeft: 6 }} /> مسح بالكاميرا</span>
          <button className="icon-btn" onClick={onClose}><X size={18} /></button>
        </div>
        <div className="modal-body camera-body">
          {status === "scanning" || status === "initializing" ? (
            <div className="camera-frame">
              <video ref={videoRef} className="camera-video" muted playsInline />
              <div className="camera-reticle">
                <span className="reticle-corner tl" /><span className="reticle-corner tr" />
                <span className="reticle-corner bl" /><span className="reticle-corner br" />
                <div className="reticle-line" />
              </div>
              <div className="camera-status">
                {status === "initializing" ? "جارٍ تشغيل الكاميرا…" : "وجّه الكاميرا نحو الباركود"}
              </div>
            </div>
          ) : (
            <div className="camera-fallback">
              <ShieldAlert size={26} strokeWidth={1.5} />
              {status === "unsupported" && (
                <p>
                  متصفحك الحالي لا يدعم القراءة المباشرة للباركود بالكاميرا (مدعوم حالياً في Chrome على أندرويد بشكل أساسي).
                  اكتب الكود يدوياً بالأسفل، أو استخدم قارئ الباركود اليدوي.
                </p>
              )}
              {status === "denied" && <p>تم رفض إذن الكاميرا. فعّل إذن الكاميرا لهذا الموقع من إعدادات المتصفح ثم أعد المحاولة، أو اكتب الكود يدوياً.</p>}
              {status === "error" && <p>تعذّر تشغيل الكاميرا. تأكد من عدم استخدامها في تطبيق آخر، أو اكتب الكود يدوياً.</p>}
              <div className="camera-manual">
                <input
                  className="input mono"
                  autoFocus
                  placeholder="اكتب الكود هنا"
                  value={manualCode}
                  onChange={(e) => setManualCode(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); submitManual(); } }}
                />
                <button className="btn-primary" onClick={submitManual}><Check size={15} /> استخدام هذا الكود</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Dashboard({ inventory, data, go, readOnly, onPrint, isOwner }) {
  const total = inventory.length;
  const low = inventory.filter((i) => i.status === "low").length;
  const empty = inventory.filter((i) => i.status === "empty").length;
  // تذكير بأخذ نسخة احتياطية كاملة إذا مرّ أكثر من 7 أيام على آخر نسخة
  // (أو ما أُخذت نسخة أبداً) — رئيس الموقع فقط، حتى لا يُزعج بقية المنظمين
  const [backupStale, setBackupStale] = useState(false);
  useEffect(() => {
    if (isOwner) setBackupStale(daysSinceBackup() > 7);
  }, [isOwner]);
  const available = total - low - empty;
  const critical = useMemo(
    () => inventory.filter((i) => i.status !== "available").sort((a, b) => a.balance - b.balance).slice(0, 12),
    [inventory]
  );
  const expiring = useMemo(
    () => inventory.filter((i) => i.expiry).sort((a, b) => a.daysLeft - b.daysLeft).slice(0, 12),
    [inventory]
  );

  // إشعار نظام حقيقي (خارج المتصفح) عند وجود أصناف حرجة الصلاحية — يُطلب الإذن مرة واحدة فقط
  useEffect(() => {
    const urgentExpiring = inventory.filter((i) => i.expiry === "critical" || i.expiry === "expired");
    if (!urgentExpiring.length || typeof Notification === "undefined") return;
    const fire = () => {
      try {
        new Notification("المستودع — تنبيه صلاحية", {
          body: `${urgentExpiring.length} صنفاً قريب من انتهاء الصلاحية أو منتهي بالفعل`,
          tag: "warehouse-expiry",
        });
      } catch {}
    };
    if (Notification.permission === "granted") fire();
    else if (Notification.permission !== "denied") {
      Notification.requestPermission().then((p) => { if (p === "granted") fire(); });
    }
  }, [inventory]);

  const recent = useMemo(() => {
    const emojiByCode = new Map(data.items.map((it) => [it.code, it.emoji]));
    const inRows = data.incoming.map((r) => ({ ...r, kind: "in", emoji: emojiByCode.get(r.code) }));
    const outRows = data.outgoing.map((r) => ({ ...r, kind: "out", emoji: emojiByCode.get(r.code) }));
    return [...inRows, ...outRows]
      .sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id.localeCompare(a.id))
      .slice(0, 8);
  }, [data]);

  // توزيع الأصناف حسب المجموعة (نوع الصنف: بلاستيك، صحون...) — مع النسبة المئوية
  const byGroup = useMemo(() => {
    const nameOf = (id) => data.itemGroups.find((g) => g.id === id)?.name;
    const map = new Map();
    inventory.forEach((i) => {
      const g = nameOf(i.group) || "بدون مجموعة";
      map.set(g, (map.get(g) || 0) + 1);
    });
    const totalItems = inventory.length || 1;
    return [...map.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([name, count]) => ({ name, count, pct: Math.round((count / totalItems) * 100) }));
  }, [inventory, data.itemGroups]);

  const stats = [
    { label: "إجمالي الأصناف", value: total, icon: Boxes, tone: "navy", action: () => go(readOnly ? "inventory" : "items") },
    { label: "متوفرة", value: available, icon: Check, tone: "green", action: () => go("inventory") },
    { label: "مخزون منخفض", value: low, icon: TriangleAlert, tone: "amber", action: () => go("inventory") },
    { label: "نفدت كمياتها", value: empty, icon: AlertTriangle, tone: "red", action: () => go("inventory") },
  ];

  const maxGroup = Math.max(1, ...byGroup.map((g) => g.count));

  return (
    <div className="page">
      <PageHeader
        eyebrow="نظرة عامة" title="لوحة التحكم" subtitle="ملخص سريع لحالة المستودع اليوم"
        action={<button className="btn-ghost" onClick={() => (onPrint ? onPrint() : window.print())}><Download size={15} /> طباعة / PDF</button>}
      />

      {backupStale && (
        <div className="alert-banner" style={{ background: "var(--amber-bg)", color: "var(--amber)", borderColor: "var(--amber)" }}>
          <Download size={18} />
          <div className="alert-banner-text">
            <strong>ما أُخذت نسخة احتياطية كاملة من المستودع منذ فترة.</strong>{" "}
            خذ نسخة الآن (ملف JSON يحتوي كل البيانات) تحسّباً لأي خطأ أو حذف غير مقصود.
          </div>
          <button className="btn-ghost alert-banner-btn" onClick={() => { downloadFullBackup(data); setBackupStale(false); }}>
            <Download size={14} /> نسخة احتياطية الآن
          </button>
        </div>
      )}

      {critical.length > 0 && (
        <div className="alert-banner">
          <TriangleAlert size={18} />
          <div className="alert-banner-text">
            <strong>{critical.length} صنفاً بحاجة لانتباه:</strong>{" "}
            {critical.map((i) => i.name).join("، ")}
          </div>
          <button className="btn-ghost alert-banner-btn" onClick={() => go("inventory")}>عرض المخزون</button>
        </div>
      )}

      {expiring.length > 0 && (
        <div className="alert-banner alert-banner-expiry">
          <Clock size={18} />
          <div className="alert-banner-text">
            <strong>{expiring.length} صنفاً قريب من انتهاء الصلاحية:</strong>{" "}
            {expiring.map((i) => `${i.name} (${i.daysLeft <= 0 ? "منتهي" : i.daysLeft + "ي"})`).join("، ")}
          </div>
        </div>
      )}

      <div className="stat-grid">
        {stats.map((s) => (
          <button key={s.label} className={`stat-card tone-${s.tone}`} onClick={s.action}>
            <s.icon size={20} strokeWidth={2} />
            <div className="stat-value">{s.value}</div>
            <div className="stat-label">{s.label}</div>
          </button>
        ))}
      </div>

      <div className="panel">
        <div className="panel-head">
          <span className="panel-title">توزيع الأصناف حسب المجموعة</span>
          <span className="panel-sub">نسبة كل مجموعة من إجمالي عدد الأصناف — بلاستيك، صحون، ورقيات…</span>
        </div>
        <div className="mini-chart">
          {byGroup.length === 0 ? (
            <EmptyState icon={Layers} title="لا توجد مجموعات مسجّلة" />
          ) : byGroup.map((g) => (
            <div className="mini-chart-row" key={g.name}>
              <span className="mini-chart-label">{suggestEmojiForGroup(g.name) ? `${suggestEmojiForGroup(g.name)} ` : ""}{g.name}</span>
              <div className="mini-chart-track">
                <div className="mini-chart-bar mini-chart-bar-amber" style={{ width: `${(g.count / maxGroup) * 100}%` }} />
              </div>
              <span className="mini-chart-val">{g.count} <span className="mini-chart-pct">({g.pct}%)</span></span>
            </div>
          ))}
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <span className="panel-title">آخر الحركات</span>
          <span className="panel-sub">أحدث 8 عمليات دخول وخروج</span>
        </div>
        {recent.length === 0 ? (
          <EmptyState icon={Clock} title="لا توجد حركات بعد" hint="سجّل أول عملية دخول أو خروج ليظهر السجل هنا" />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>النوع</th>
                  <th>الصنف</th>
                  <th>الكود</th>
                  <th>الكمية</th>
                  <th>التاريخ</th>
                </tr>
              </thead>
              <tbody>
                {recent.map((r) => (
                  <tr key={r.kind + r.id}>
                    <td>
                      <span className={`move-pill move-${r.kind}`}>
                        {r.kind === "in" ? <ArrowDownToLine size={13} /> : <ArrowUpFromLine size={13} />}
                        {r.kind === "in" ? "داخل" : "خارج"}
                      </span>
                    </td>
                    <td className="cell-strong">{r.emoji ? `${r.emoji} ` : ""}{r.name}</td>
                    <td><CodeTag code={r.code} /></td>
                    <td className="cell-mono">{r.qty}</td>
                    <td className="cell-mono">{fmtDate(r.date)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function ItemsPage({ data, setData, notify, readOnly, onPrint, systemNotify, currentUser, isOwner, inventory }) {
  const [query, setQuery] = useState("");
  const [modal, setModal] = useState(null); // { mode: 'add'|'edit', item }
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);
  const [branchFilter, setBranchFilter] = useState("all");
  const [groupFilter, setGroupFilter] = useState("all");
  const [locationFilter, setLocationFilter] = useState("all");

  // وضع التسجيل السريع: يخلي المستخدم يسجّل دخول/خروج البضاعة مباشرة من
  // قائمة الأغراض نفسها بضغطة وحدة، بدل ما يروح لصفحة منفصلة
  const [quickMode, setQuickMode] = useState("off"); // "off" | "in" | "out"
  const [qtyDrafts, setQtyDrafts] = useState({}); // { [code]: "3" }
  const [view, setView] = useSharedViewMode("grid"); // بطاقات/جدول — مشترك مع صفحة المخزون
  const balanceFor = (code) => inventory?.find((i) => i.code === code)?.balance ?? 0;

  const logQuick = (item) => {
    const raw = qtyDrafts[item.code];
    const qty = Number(raw);
    if (!raw || !qty || qty <= 0) {
      notify("أدخل كمية صحيحة أكبر من صفر", "error");
      return;
    }
    const isOut = quickMode === "out";
    if (isOut) {
      const bal = balanceFor(item.code);
      if (qty > bal) {
        notify(`الكمية غير كافية — المتوفر حالياً ${bal} فقط`, "error");
        return;
      }
    }
    const entry = {
      id: (isOut ? "out" : "in") + "-" + Date.now(), code: item.code, name: item.name, date: todayISO(), qty,
      notes: "تسجيل سريع من قائمة الأغراض",
      ...(isOut ? { returnType: "consume", returned: false } : {}),
    };
    const key = isOut ? "outgoing" : "incoming";
    setData({ ...data, [key]: [entry, ...data[key]] });
    setQtyDrafts((d) => ({ ...d, [item.code]: "" }));
    notify(isOut ? `تم تسجيل خروج ${qty} من «${item.name}»` : `تم تسجيل دخول ${qty} من «${item.name}»`);
    if (systemNotify) {
      systemNotify({
        eventLevel: "all",
        title: isOut ? "المستودع — تسجيل خروج" : "المستودع — تسجيل دخول",
        body: `${item.name} — الكمية ${qty}`,
        tag: "warehouse-movement",
      });
    }
  };

  // منظم مقيّد بقسم معيّن يشوف بس أصناف قسمه؛ رئيس الموقع يشوف كل شيء دائماً
  const myBranch = !isOwner && currentUser?.restrictedBranch;
  const branchItems = myBranch ? data.items.filter((i) => i.branch === myBranch) : data.items;
  const branchName = (id) => (data.branches || []).find((b) => b.id === id)?.name || "";
  const itemName = (code) => data.items.find((i) => i.code === code)?.name || "";
  const [boxView, setBoxView] = useState(null);
  const boxContents = boxView ? data.items.filter((i) => i.parentCode === boxView.code) : [];

  const filtered = branchItems
    .filter((it) => fuzzyIncludes(it.name + it.code + it.category, query))
    .filter((it) => branchFilter === "all" || it.branch === branchFilter)
    .filter((it) => locationFilter === "all" || it.category === locationFilter)
    .filter((it) => groupFilter === "all" || it.group === groupFilter);

  // خانة "المواقع" بالفلاتر تعتمد على القسم المختار: لو اخترت قسم معيّن
  // تعرض مواقع هذا القسم فقط، ولو "كل الأقسام" تعرض كل المواقع بدون تمييز
  const locationsScope = branchFilter === "all" ? branchItems : branchItems.filter((it) => it.branch === branchFilter);
  const locations = useMemo(
    () => [...new Set(locationsScope.map((it) => it.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ar")),
    [locationsScope]
  );

  // لو الموقع المختار حالياً مو موجود بقائمة مواقع القسم الجديد، نرجّع
  // فلتر الموقع لـ"الكل" حتى ما تصير نتيجة فاضية بصمت
  useEffect(() => {
    if (locationFilter !== "all" && !locations.includes(locationFilter)) {
      setLocationFilter("all");
    }
  }, [branchFilter, locations]);

  // تحديد جماعي (بمربعات اختيار) لتطبيق نفس كمية الدخول/الخروج على عدة
  // أصناف دفعة وحدة — متاح فقط داخل وضع التسجيل السريع (دخول/خروج)
  const [selectedCodes, setSelectedCodes] = useState(() => new Set());
  const [bulkQty, setBulkQty] = useState("");
  const [confirmBulkDelete, setConfirmBulkDelete] = useState(false);
  const changeQuickMode = (mode) => {
    setQuickMode((m) => (m === mode ? "off" : mode));
    setSelectedCodes(new Set());
    setBulkQty("");
  };
  const toggleSelect = (code) => setSelectedCodes((prev) => {
    const next = new Set(prev);
    if (next.has(code)) next.delete(code); else next.add(code);
    return next;
  });
  const allSelected = filtered.length > 0 && filtered.every((it) => selectedCodes.has(it.code));
  const toggleSelectAll = () => setSelectedCodes(allSelected ? new Set() : new Set(filtered.map((it) => it.code)));
  const applyBulk = () => {
    const qty = Number(bulkQty);
    if (!bulkQty || !qty || qty <= 0) {
      notify("أدخل كمية صحيحة أكبر من صفر", "error");
      return;
    }
    const codes = Array.from(selectedCodes);
    if (codes.length === 0) {
      notify("حدد صنفاً واحداً على الأقل", "error");
      return;
    }
    const isOut = quickMode === "out";
    if (isOut) {
      const short = codes.filter((code) => qty > balanceFor(code));
      if (short.length > 0) {
        notify(`الكمية غير كافية لـ ${short.length} من الأصناف المحددة`, "error");
        return;
      }
    }
    const now = Date.now();
    const entries = codes.map((code, idx) => {
      const it = data.items.find((i) => i.code === code);
      return {
        id: (isOut ? "out" : "in") + "-" + now + "-" + idx, code, name: it?.name || "", date: todayISO(), qty,
        notes: "تسجيل جماعي من قائمة الأغراض",
        ...(isOut ? { returnType: "consume", returned: false } : {}),
      };
    });
    const key = isOut ? "outgoing" : "incoming";
    setData({ ...data, [key]: [...entries, ...data[key]] });
    notify(isOut ? `تم تسجيل خروج ${qty} لكل صنف من ${codes.length} صنفاً محدداً` : `تم تسجيل دخول ${qty} لكل صنف من ${codes.length} صنفاً محدداً`);
    setSelectedCodes(new Set());
    setBulkQty("");
    if (systemNotify) {
      systemNotify({
        eventLevel: "all",
        title: isOut ? "المستودع — تسجيل خروج جماعي" : "المستودع — تسجيل دخول جماعي",
        body: `${codes.length} صنفاً — الكمية ${qty} لكل صنف`,
        tag: "warehouse-bulk-movement",
      });
    }
  };

  const removeBulk = () => {
    const codes = new Set(selectedCodes);
    setData({ ...data, items: data.items.filter((i) => !codes.has(i.code)) });
    notify(`تم حذف ${codes.size} صنفاً`);
    setSelectedCodes(new Set());
    setConfirmBulkDelete(false);
  };

  // لو المستخدم فلتر القائمة حالياً على قسم و/أو مجموعة معيّنة، نعبّي حقلي
  // "القسم" و"المجموعة" في نموذج الإضافة تلقائياً بنفس الفلتر بدل ما يضطر
  // يختارهم يدوياً من جديد — يبقيان قابلين للتغيير يدوياً بالطبع
  const openAdd = () => setModal({ mode: "add", item: { code: "", name: "", category: locationFilter !== "all" ? locationFilter : "", notes: "", minQty: "", expiryDate: "", emoji: "", group: groupFilter !== "all" ? groupFilter : "", branch: myBranch || (branchFilter !== "all" ? branchFilter : ""), isContainer: false, parentCode: "", initialQty: "1", image: "" } });
  const openEdit = (item) => setModal({ mode: "edit", item: { ...item } });

  const save = (item) => {
    if (!item.code.trim() || !item.name.trim()) {
      notify("الكود واسم المنتج مطلوبان", "error");
      return;
    }
    const exists = data.items.some((i) => i.code === item.code && i.code !== modal.item.__originalCode);
    if (modal.mode === "add" && data.items.some((i) => i.code === item.code)) {
      notify("هذا الكود مسجّل مسبقاً لصنف آخر", "error");
      return;
    }
    // حقل الكمية موجود بنموذج الإضافة والتعديل، وليس جزءاً من شكل بيانات
    // الصنف نفسه (الرصيد يُحسب دائماً من حركات الداخل/الخارج)، فنفصله هنا
    // ونحوّله لحركة "داخل" أو "خارج" عند الحفظ حسب الفرق عن الرصيد الحالي
    const { initialQty, ...cleanItem } = item;
    let items;
    if (modal.mode === "add") {
      items = [...data.items, cleanItem];
    } else {
      items = data.items.map((i) => (i.code === modal.item.code ? cleanItem : i));
    }
    const qty = Number(initialQty);
    let nextIncoming = data.incoming;
    let nextOutgoing = data.outgoing;
    if (modal.mode === "add" && qty > 0) {
      nextIncoming = [
        {
          id: genId("in"),
          code: cleanItem.code,
          name: cleanItem.name,
          date: todayISO(),
          qty,
          notes: "رصيد ابتدائي عند إضافة الصنف",
        },
        ...data.incoming,
      ];
    } else if (modal.mode === "edit" && initialQty !== "" && initialQty !== undefined) {
      const currentBalance = inventory?.find((i) => i.code === modal.item.code)?.balance ?? 0;
      const diff = qty - currentBalance;
      if (diff > 0) {
        nextIncoming = [
          { id: genId("in"), code: cleanItem.code, name: cleanItem.name, date: todayISO(), qty: diff, notes: "تعديل يدوي للكمية عند تحديث الصنف" },
          ...data.incoming,
        ];
      } else if (diff < 0) {
        nextOutgoing = [
          { id: genId("out"), code: cleanItem.code, name: cleanItem.name, date: todayISO(), qty: -diff, notes: "تعديل يدوي للكمية عند تحديث الصنف", returnType: "consume", returned: false },
          ...data.outgoing,
        ];
      }
    }
    setData({ ...data, items, incoming: nextIncoming, outgoing: nextOutgoing });
    setModal(null);
    notify(modal.mode === "add" ? "تمت إضافة الصنف" : "تم حفظ التعديلات");
    if (modal.mode === "add" && systemNotify) {
      systemNotify({
        eventLevel: "all",
        title: "المستودع — صنف جديد",
        body: `تمت إضافة الصنف «${item.name}» إلى قائمة الأغراض`,
        tag: "warehouse-newitem",
      });
    }
  };

  const remove = (code) => {
    setData({
      ...data,
      items: data.items.filter((i) => i.code !== code),
    });
    setConfirmDelete(null);
    notify("تم حذف الصنف");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="الجرد"
        title="قائمة الأغراض"
        subtitle={`${data.items.length} صنفاً مسجلاً في المستودع`}
        action={
          !readOnly && (
            <button className="btn-primary" onClick={openAdd}>
              <Plus size={16} /> إضافة غرض
            </button>
          )
        }
      />

      <div className="toolbar">
        <div className="search-box">
          <Search size={16} />
          <input placeholder="ابحث بالاسم أو الكود أو الموقع…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
            <Camera size={15} />
          </button>
        </div>
        {!readOnly && (
          <div className="filter-chips">
            <button
              className={`chip quick-chip-in ${quickMode === "in" ? "chip-active" : ""}`}
              onClick={() => changeQuickMode("in")}
            >
              <ArrowDownToLine size={13} /> وضع الإدخال
            </button>
            <button
              className={`chip quick-chip-out ${quickMode === "out" ? "chip-active" : ""}`}
              onClick={() => changeQuickMode("out")}
            >
              <ArrowUpFromLine size={13} /> وضع الإخراج
            </button>
            <button
              className={`chip quick-chip-select ${quickMode === "select" ? "chip-active" : ""}`}
              onClick={() => changeQuickMode("select")}
            >
              <ListChecks size={13} /> تحديد للحذف
            </button>
          </div>
        )}
        {(data.itemGroups || []).length > 0 && (
          <select className="input location-select" value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)}>
            <option value="all">كل المجموعات</option>
            {data.itemGroups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
        )}
        {locations.length > 0 && (
          <select className="input location-select" value={locationFilter} onChange={(e) => setLocationFilter(e.target.value)}>
            <option value="all">كل المواقع</option>
            {locations.map((loc) => <option key={loc} value={loc}>{loc}</option>)}
          </select>
        )}
        {(isOwner || !myBranch) && (data.branches || []).length > 0 && (
          <select className="input location-select" value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)}>
            <option value="all">كل الأقسام</option>
            {data.branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        )}
        {quickMode === "off" && (
          <div className="view-toggle">
            <button className={`chip ${view === "grid" ? "chip-active" : ""}`} onClick={() => setView("grid")}>بطاقات</button>
            <button className={`chip ${view === "list" ? "chip-active" : ""}`} onClick={() => setView("list")}>جدول</button>
          </div>
        )}
        <button className="btn-ghost" onClick={() => downloadCSV("قائمة_الاغراض.csv", data.items, ["code", "name", "category", "notes", "minQty"])}>
          <Download size={15} /> تصدير CSV
        </button>
        <button className="btn-ghost" onClick={() => (onPrint ? onPrint() : window.print())}>
          <Download size={15} /> طباعة / PDF
        </button>
        {!readOnly && (
          <label className="btn-ghost" style={{ cursor: "pointer" }}>
            <Download size={15} style={{ transform: "rotate(180deg)" }} /> استيراد CSV
            <input
              type="file" accept=".csv,text/csv" style={{ display: "none" }}
              onChange={(e) => {
                const file = e.target.files?.[0];
                e.target.value = "";
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  const rows = parseCSV(String(reader.result || ""));
                  const byCode = new Map(data.items.map((it) => [it.code, it]));
                  let added = 0, updated = 0;
                  rows.forEach((r) => {
                    const code = (r.code || r["الكود"] || "").trim();
                    if (!code) return;
                    const item = {
                      code,
                      name: r.name || r["اسم المنتج"] || r["الاسم"] || "",
                      category: r.category || r["الموقع"] || r["الفئة"] || "",
                      notes: r.notes || r["ملاحظات"] || "",
                      minqty: undefined,
                    };
                    item.minQty = r.minqty || r["minQty"] || r["حد التنبيه"] || "";
                    if (byCode.has(code)) updated++; else added++;
                    byCode.set(code, item);
                  });
                  setData({ ...data, items: Array.from(byCode.values()) });
                  notify(`تم الاستيراد: ${added} صنفاً جديداً، ${updated} محدَّثاً`);
                };
                reader.readAsText(file, "UTF-8");
              }}
            />
          </label>
        )}
      </div>

      {quickMode !== "off" && (
        <div className="bulk-bar">
          <label className="bulk-bar-selectall">
            <input type="checkbox" checked={allSelected} onChange={toggleSelectAll} />
            تحديد الكل ({filtered.length})
          </label>
          <span className="bulk-bar-count">{selectedCodes.size} محدد</span>
          {(quickMode === "in" || quickMode === "out") && (
            <>
              <input
                type="number" lang="en" min="0" step="1" className="input mono bulk-bar-qty"
                placeholder="الكمية لكل صنف"
                value={bulkQty}
                onChange={(e) => setBulkQty(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") applyBulk(); }}
              />
              <button
                className={`btn-primary bulk-bar-apply ${quickMode === "out" ? "btn-danger" : ""}`}
                onClick={applyBulk}
                disabled={selectedCodes.size === 0}
              >
                {quickMode === "in" ? <ArrowDownToLine size={15} /> : <ArrowUpFromLine size={15} />}
                تطبيق على المحدد
              </button>
            </>
          )}
          {!readOnly && (
            <button
              className="btn-danger bulk-bar-delete"
              onClick={() => setConfirmBulkDelete(true)}
              disabled={selectedCodes.size === 0}
            >
              <Trash2 size={15} /> حذف المحددين
            </button>
          )}
          {selectedCodes.size > 0 && (
            <button className="btn-ghost bulk-bar-clear" onClick={() => setSelectedCodes(new Set())}>
              إلغاء التحديد
            </button>
          )}
        </div>
      )}

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon={Package} title="لا توجد أصناف مطابقة" hint="جرّب كلمة بحث مختلفة أو أضف صنفاً جديداً" />
        ) : quickMode === "off" && view === "grid" ? (
          <div className="inv-card-grid">
            {filtered.map((it) => (
              <div className={`inv-card ${getCardTheme(it, data.itemGroups) ? `inv-card-${getCardTheme(it, data.itemGroups)}` : ""}`} key={it.code}>
                {it.image && <img className="inv-card-photo" src={it.image} alt={it.name} />}
                <div className="inv-card-head">
                  <span className="cell-strong">
                    {it.emoji ? `${it.emoji} ` : ""}{it.name}
                    {it.isContainer && <span className="box-badge">📦 صندوق</span>}
                  </span>
                </div>
                <CodeTag code={it.code} />
                <div className="inv-card-loc">
                  <MapPin size={12} style={{ opacity: 0.55 }} /> {it.category || "—"}
                  {branchName(it.branch) ? ` · ${branchName(it.branch)}` : ""}
                  {it.parentCode && <span className="box-badge">↳ داخل: {itemName(it.parentCode) || "—"}</span>}
                </div>
                {it.notes && <div className="inv-card-loc">{it.notes}</div>}
                {!readOnly && (
                  <div className="row-actions" style={{ marginTop: "auto", paddingTop: 4 }}>
                    {it.isContainer && (
                      <button className="icon-btn" title="عرض المحتويات" onClick={() => setBoxView(it)}><Boxes size={15} /></button>
                    )}
                    <button className="icon-btn" onClick={() => openEdit(it)}><Pencil size={15} /></button>
                    <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(it)}><Trash2 size={15} /></button>
                  </div>
                )}
              </div>
            ))}
          </div>
        ) : (quickMode === "in" || quickMode === "out") ? (
          <div className="quick-log-list">
            {filtered.map((it) => (
              <div className={`quick-log-card ${selectedCodes.has(it.code) ? "row-selected" : ""}`} key={it.code}>
                <div className="quick-log-card-top">
                  <input type="checkbox" checked={selectedCodes.has(it.code)} onChange={() => toggleSelect(it.code)} />
                  <div className="quick-log-card-info">
                    <div className="cell-strong">
                      {it.image && <img className="row-thumb" src={it.image} alt={it.name} />}
                      {it.emoji ? `${it.emoji} ` : ""}{it.name}
                      {it.isContainer && <span className="box-badge">📦 صندوق</span>}
                    </div>
                    <div className="cell-muted quick-log-card-meta">
                      <CodeTag code={it.code} />
                      <span>· {it.category || "—"}</span>
                      {branchName(it.branch) && <span>· {branchName(it.branch)}</span>}
                      {it.parentCode && <span className="box-badge">↳ داخل: {itemName(it.parentCode) || "—"}</span>}
                    </div>
                  </div>
                  <div className="quick-log-card-balance">
                    <span className="quick-log-card-balance-label">الرصيد الحالي</span>
                    <span className="cell-mono cell-strong">{balanceFor(it.code)}</span>
                  </div>
                </div>
                {!readOnly && (
                  <div className={`quick-log-row quick-log-${quickMode}`}>
                    <div className="qty-stepper">
                      <button
                        type="button" className="qty-stepper-btn" title="إنقاص"
                        onClick={() => setQtyDrafts((d) => {
                          const cur = Number(d[it.code] || 0);
                          const next = Math.max(0, cur - 1);
                          return { ...d, [it.code]: next ? String(next) : "" };
                        })}
                      >
                        <Minus size={13} />
                      </button>
                      <input
                        type="number" lang="en" min="0" step="1" className="input mono quick-log-qty"
                        placeholder="الكمية"
                        value={qtyDrafts[it.code] || ""}
                        onChange={(e) => setQtyDrafts((d) => ({ ...d, [it.code]: e.target.value }))}
                        onKeyDown={(e) => { if (e.key === "Enter") logQuick(it); }}
                      />
                      <button
                        type="button" className="qty-stepper-btn" title="زيادة"
                        onClick={() => setQtyDrafts((d) => ({ ...d, [it.code]: String(Number(d[it.code] || 0) + 1) }))}
                      >
                        <Plus size={13} />
                      </button>
                    </div>
                    <button
                      className={`icon-btn quick-log-btn ${quickMode === "in" ? "quick-log-btn-in" : "quick-log-btn-out"}`}
                      title={quickMode === "in" ? "تسجيل دخول" : "تسجيل خروج"}
                      onClick={() => logQuick(it)}
                    >
                      {quickMode === "in" ? <ArrowDownToLine size={17} /> : <ArrowUpFromLine size={17} />}
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  {quickMode !== "off" && (
                    <th className="table-select-col">
                      <input type="checkbox" checked={allSelected} onChange={toggleSelectAll} title="تحديد الكل" />
                    </th>
                  )}
                  <th>م</th>
                  <th>الكود</th>
                  <th>اسم المنتج</th>
                  <th>الموقع / الفئة</th>
                  <th>القسم</th>
                  <th>ملاحظات</th>
                  {!readOnly && <th></th>}
                </tr>
              </thead>
              <tbody>
                {filtered.map((it, idx) => (
                  <tr key={it.code} className={quickMode !== "off" && selectedCodes.has(it.code) ? "row-selected" : ""}>
                    {quickMode !== "off" && (
                      <td className="table-select-col">
                        <input type="checkbox" checked={selectedCodes.has(it.code)} onChange={() => toggleSelect(it.code)} />
                      </td>
                    )}
                    <td className="cell-mono">{idx + 1}</td>
                    <td><CodeTag code={it.code} /></td>
                    <td className="cell-strong">
                      {it.image && <img className="row-thumb" src={it.image} alt={it.name} />}
                      {it.emoji ? `${it.emoji} ` : ""}{it.name}
                      {it.isContainer && <span className="box-badge">📦 صندوق</span>}
                    </td>
                    <td className="cell-muted">
                      <MapPin size={12} style={{ opacity: 0.5, marginLeft: 4 }} />{it.category || "—"}
                      {it.parentCode && <span className="box-badge">↳ داخل: {itemName(it.parentCode) || "—"}</span>}
                    </td>
                    <td className="cell-muted">{branchName(it.branch) || "—"}</td>
                    <td className="cell-muted">{it.notes || "—"}</td>
                    {!readOnly && (
                      <td>
                        <div className="row-actions">
                          {it.isContainer && (
                            <button className="icon-btn" title="عرض المحتويات" onClick={() => setBoxView(it)}><Boxes size={15} /></button>
                          )}
                          <button className="icon-btn" onClick={() => openEdit(it)}><Pencil size={15} /></button>
                          <button className="icon-btn icon-btn-danger" onClick={() => setConfirmDelete(it)}><Trash2 size={15} /></button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <Modal wide title={modal.mode === "add" ? "إضافة غرض جديد" : "تعديل بيانات الصنف"} onClose={() => setModal(null)}>
          <ItemForm item={modal.item} itemGroups={data.itemGroups} branches={data.branches} allItems={data.items} barcodes={data.barcodes} mode={modal.mode} currentBalance={balanceFor(modal.item.code)} onCancel={() => setModal(null)} onSave={save} />
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">
            هل أنت متأكد من حذف «{confirmDelete.name}»؟ لن يؤثر هذا على السجلات السابقة في الداخل والخارج.
          </p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => remove(confirmDelete.code)}>حذف نهائياً</button>
          </div>
        </Modal>
      )}

      {confirmBulkDelete && (
        <Modal title="تأكيد حذف المحددين" onClose={() => setConfirmBulkDelete(false)}>
          <p className="confirm-text">
            هل أنت متأكد من حذف {selectedCodes.size} صنفاً محدداً؟ لن يؤثر هذا على السجلات السابقة في الداخل والخارج.
          </p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmBulkDelete(false)}>إلغاء</button>
            <button className="btn-danger" onClick={removeBulk}>حذف نهائياً</button>
          </div>
        </Modal>
      )}

      {boxView && (
        <Modal
          title={`📦 محتويات «${boxView.name}»`}
          onClose={() => setBoxView(null)}
        >
          {boxContents.length === 0 ? (
            <EmptyState icon={Boxes} title="الصندوق فاضي" hint="ما فيه أي منتج مضاف داخل هذا الصندوق حتى الآن" />
          ) : (
            <div className="box-contents-list">
              {boxContents.map((c) => (
                <div className="box-contents-row" key={c.code}>
                  <div>
                    <div className="cell-strong">{c.emoji ? `${c.emoji} ` : ""}{c.name}</div>
                    <div className="cell-muted" style={{ fontSize: 12 }}>{c.code} · الرصيد: {balanceFor(c.code)}</div>
                  </div>
                  {!readOnly && (
                    <button className="icon-btn" onClick={() => { setBoxView(null); openEdit(c); }}><Pencil size={15} /></button>
                  )}
                </div>
              ))}
            </div>
          )}
          {!readOnly && (
            <div className="modal-actions">
              <button
                className="btn-primary"
                onClick={() => {
                  setBoxView(null);
                  setModal({
                    mode: "add",
                    item: { code: "", name: "", category: boxView.category || "", notes: "", minQty: "", expiryDate: "", emoji: "", group: "", branch: boxView.branch || myBranch || "", isContainer: false, parentCode: boxView.code, image: "" },
                  });
                }}
              >
                <Plus size={16} /> إضافة منتج داخل هذا الصندوق
              </button>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}
