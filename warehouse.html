function GuestListsScreen({ data, inventory, quickFilter, onSectionClick, onLocationClick }) {
  const cfg = data.guestListsConfig || {};
  const branches = data.branches || [];
  const sectionTitles = cfg.sectionTitles || {};
  const locationTitles = cfg.locationTitles || {};

  const sectionLabel = (b) => sectionTitles[b.id]?.trim() || b.name || b.id;
  const locationLabel = (branchId, loc) => locationTitles[`${branchId}::${loc}`]?.trim() || loc;

  const isActiveBranch = (id) => quickFilter?.kind === "branch" && quickFilter.branchId === id;
  const isActiveLocation = (branchId, loc) => quickFilter?.kind === "location" && quickFilter.branchId === branchId && quickFilter.loc === loc;

  // إجمالي عدد الأصناف بكل قسم (لقائمة الأقسام)
  const sectionCounts = React.useMemo(() => {
    const m = {};
    inventory.forEach((i) => { if (i.branch) m[i.branch] = (m[i.branch] || 0) + 1; });
    return m;
  }, [inventory]);

  // المواقع مجمّعة حسب القسم (لقائمة المواقع) — نفس منطق صفحة المخزون
  const locationGroups = React.useMemo(() => {
    const byBranch = new Map();
    inventory.forEach((i) => {
      if (!i.category) return;
      const bKey = i.branch || "";
      if (!byBranch.has(bKey)) byBranch.set(bKey, new Map());
      const inner = byBranch.get(bKey);
      inner.set(i.category, (inner.get(i.category) || 0) + 1);
    });
    const groups = [...byBranch.entries()].map(([bKey, inner]) => {
      const b = branches.find((x) => x.id === bKey);
      return {
        branchId: bKey,
        branchLabel: bKey ? (b ? sectionLabel(b) : bKey) : "بدون قسم",
        locations: [...inner.entries()]
          .map(([loc, count]) => ({ loc, count }))
          .sort((a, b2) => a.loc.localeCompare(b2.loc, "ar")),
      };
    });
    groups.sort((a, b2) => {
      if (!a.branchId) return 1;
      if (!b2.branchId) return -1;
      return a.branchLabel.localeCompare(b2.branchLabel, "ar");
    });
    return groups;
  }, [inventory, branches, sectionTitles]);

  const showSections = cfg.showSections !== false;
  const showLocations = cfg.showLocations !== false;

  if (!showSections && !showLocations) {
    return (
      <div style={{ textAlign: "center", padding: "40px 20px", color: "var(--ink-soft)", fontSize: 13.5 }}>
        لا توجد قوائم مفعّلة للعرض حالياً.
      </div>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {showSections && (
        <div className="panel cat-list-panel">
          <div className="cat-list-title"><MapPin size={14} /> {cfg.sectionsTitle?.trim() || "قائمة الأقسام"}</div>
          <div className="cat-list-row">
            {branches.map((b) => (
              <button
                key={b.id}
                type="button"
                className={`list-chip ${isActiveBranch(b.id) ? "list-chip-active" : ""}`}
                onClick={() => onSectionClick && onSectionClick(b.id)}
              >
                {sectionLabel(b)} <span className="cat-count">{sectionCounts[b.id] || 0}</span>
              </button>
            ))}
            {branches.length === 0 && <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>لا توجد أقسام مسجّلة بعد</span>}
          </div>
        </div>
      )}
      {showLocations && (
        <div className="panel cat-list-panel">
          <div className="cat-list-title"><MapPin size={14} /> {cfg.locationsTitle?.trim() || "قائمة المواقع"}</div>
          <div className="cat-list-row">
            <button
              type="button"
              className={`list-chip ${!quickFilter ? "list-chip-active" : ""}`}
              onClick={() => onLocationClick && onLocationClick(null, null)}
            >
              كل المواقع <span className="cat-count">{inventory.length}</span>
            </button>
          </div>
          {locationGroups.map((g) => (
            <div className="cat-branch-group" key={g.branchId || "none"}>
              <div className="cat-branch-label">{g.branchLabel}</div>
              <div className="cat-list-row">
                {g.locations.map(({ loc, count }) => (
                  <button
                    key={loc}
                    type="button"
                    className={`list-chip ${isActiveLocation(g.branchId, loc) ? "list-chip-active" : ""}`}
                    onClick={() => onLocationClick && onLocationClick(g.branchId, loc)}
                  >
                    {locationLabel(g.branchId, loc)} <span className="cat-count">{count}</span>
                  </button>
                ))}
              </div>
            </div>
          ))}
          {locationGroups.length === 0 && <span style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>لا توجد مواقع مسجّلة بعد</span>}
        </div>
      )}
    </div>
  );
}

// يجمع "قوائم الأقسام/المواقع" مع جدول المخزون تحتها، ويربطهم ببعض: ضغطة
// على قسم أو موقع بالقائمة فوق تفلتر الجدول تلقائياً وتنزل له
function GuestListsWithInventory({ data, inventory, triggerPrint }) {
  const [quickFilter, setQuickFilter] = useState(null);
  const seqRef = React.useRef(0);

  const selectBranch = (branchId) => {
    seqRef.current += 1;
    setQuickFilter({ kind: "branch", branchId: branchId || "", seq: seqRef.current });
  };
  const selectLocation = (branchId, loc) => {
    if (loc === null) { setQuickFilter(null); return; }
    seqRef.current += 1;
    setQuickFilter({ kind: "location", branchId: branchId || "", loc, seq: seqRef.current });
  };

  const showInventoryTable = data.guestListsConfig?.showInventoryTable !== false;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <GuestListsScreen data={data} inventory={inventory} quickFilter={quickFilter} onSectionClick={selectBranch} onLocationClick={selectLocation} />
      {showInventoryTable && (
        <InventoryPage
          inventory={inventory} itemGroups={data.itemGroups} branches={data.branches}
          onPrint={() => triggerPrint("inventory")}
          hideLocationsPanel={data.guestListsConfig?.showLocations !== false}
          showBranchFilter
          quickFilter={quickFilter}
        />
      )}
    </div>
  );
}

// إلى وضع التحكم والتعديل (مستخدم أو رئيس الموقع)، محمية بكلمة مرور
function ControlLoginModal({ onEnter, onClose, data }) {
  const [mode, setMode] = useState(null); // null | 'owner' | 'user'
  const [password, setPassword] = useState("");
  const [username, setUsername] = useState("");
  const [ownerName, setOwnerName] = useState(() => {
    try { return localStorage.getItem("warehouse-owner-display-name") || ""; } catch { return ""; }
  });
  const [error, setError] = useState("");
  const [showForgot, setShowForgot] = useState(false);

  const submitOwner = (e) => {
    e.preventDefault();
    if (!data) return;
    const name = ownerName.trim();
    if (!name) { setError("اسم الرئيس مطلوب"); return; }
    const owner = (data.owners || []).find((o) => o.name === name);
    if (!owner || password !== owner.password) {
      setError("اسم الرئيس أو كلمة المرور غير صحيحة");
      return;
    }
    setError("");
    try { localStorage.setItem("warehouse-owner-display-name", name); } catch {}
    onEnter({ type: "owner", ownerId: owner.id, ownerName: owner.name });
  };

  const submitUser = (e) => {
    e.preventDefault();
    if (!data) return;
    const u = data.users.find((x) => x.username === username.trim());
    if (!u || u.password !== password) {
      setError("اسم المستخدم أو كلمة المرور غير صحيحة");
      return;
    }
    if (isTempExpired(u)) {
      setError("انتهت صلاحية كلمة المرور المؤقتة — تواصل مع رئيس الموقع لتجديدها");
      return;
    }
    setError("");
    onEnter({ type: "user", userId: u.id });
  };

  return (
    <Modal title="الدخول لوضع التحكم" onClose={onClose}>
      {!data ? (
        <div className="login-sub">جارٍ التحضير…</div>
      ) : mode === null ? (
        <div className="login-choices">
          <button className="login-choice" onClick={() => { setMode("user"); setError(""); setUsername(""); setPassword(""); }}>
            <div className="login-choice-icon"><Users size={18} /></div>
            <div className="login-choice-text">
              <div className="login-choice-title">دخول مستخدم</div>
              <div className="login-choice-hint">حساب باسم مستخدم وكلمة مرور، بصلاحية محددة</div>
            </div>
          </button>
          <button className="login-choice" onClick={() => { setMode("owner"); setError(""); setPassword(""); }}>
            <div className="login-choice-icon"><ShieldAlert size={18} /></div>
            <div className="login-choice-text">
              <div className="login-choice-title">رئيس الموقع</div>
              <div className="login-choice-hint">تحكم كامل بالموقع + إدارة المستخدمين والمجموعات</div>
            </div>
          </button>
        </div>
      ) : mode === "owner" ? (
        <form className="login-admin-form" onSubmit={submitOwner}>
          <Field label="اسم الرئيس">
            <input
              autoFocus className="input" list="owner-names-list"
              value={ownerName} onChange={(e) => setOwnerName(e.target.value)}
              placeholder="مثال: حسن"
            />
            <datalist id="owner-names-list">
              {(data.owners || []).map((o) => <option key={o.id} value={o.name} />)}
            </datalist>
          </Field>
          <Field label="كلمة مرور رئيس الموقع">
            <input
              type="password" className="input"
              value={password} onChange={(e) => setPassword(e.target.value)}
              placeholder="أدخل كلمة المرور"
            />
          </Field>
          {error && <div className="alert alert-error"><AlertTriangle size={15} /> {error}</div>}
          <button type="button" className="link-btn" onClick={() => setShowForgot(true)}>نسيت كلمة المرور؟</button>
          <div className="login-admin-actions">
            <button type="button" className="btn-ghost" onClick={() => { setMode(null); setError(""); }}>رجوع</button>
            <button type="submit" className="btn-primary"><Check size={15} /> دخول</button>
          </div>
        </form>
      ) : (
        <form className="login-admin-form" onSubmit={submitUser}>
          <Field label="اسم المستخدم">
            <input autoFocus className="input" value={username} onChange={(e) => setUsername(e.target.value)} placeholder="اسم المستخدم" />
          </Field>
          <Field label="كلمة المرور">
            <input type="password" className="input" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="كلمة المرور" />
          </Field>
          {error && <div className="alert alert-error"><AlertTriangle size={15} /> {error}</div>}
          <button type="button" className="link-btn" onClick={() => setShowForgot(true)}>نسيت كلمة المرور؟</button>
          <div className="login-admin-actions">
            <button type="button" className="btn-ghost" onClick={() => { setMode(null); setError(""); }}>رجوع</button>
            <button type="submit" className="btn-primary"><Check size={15} /> دخول</button>
          </div>
        </form>
      )}
      {showForgot && <ForgotPasswordPanel mode={mode || "owner"} data={data} ownerNameInput={ownerName} onClose={() => setShowForgot(false)} />}
    </Modal>
  );
}

// نافذة «النسخ الاحتياطي والاستعادة» — لرئيس الموقع بتحكم كامل فقط، لأنها
// تتيح استبدال كل بيانات المخزون دفعة واحدة (عملية حسّاسة).
function BackupSettingsModal({ data, auditLog, notify, onClose, onRestore }) {
  const [importing, setImporting] = useState(false);
  const [pendingBackup, setPendingBackup] = useState(null); // { payload, fileName } بانتظار تأكيد المستخدم
  const fileInputRef = React.useRef(null);

  const supported = isAutoBackupSupported();
  const [autoSettings, setAutoSettings] = useState(() => getAutoBackupSettings());
  const [dirName, setDirName] = useState(null);
  const [dirBusy, setDirBusy] = useState(false);
  const [dirError, setDirError] = useState("");
  const [lastAutoDays, setLastAutoDays] = useState(() => daysSinceAutoBackup());

  useEffect(() => {
    if (!supported) return;
    getDirHandle().then((h) => setDirName(h?.name || null)).catch(() => {});
  }, [supported]);

  const pickFolder = async () => {
    setDirBusy(true);
    setDirError("");
    try {
      const handle = await window.showDirectoryPicker({ mode: "readwrite" });
      await saveDirHandle(handle);
      setDirName(handle.name);
      const next = { ...autoSettings, enabled: true };
      setAutoSettings(next);
      saveAutoBackupSettings(next);
      notify("تم اختيار المجلد — ستُحفظ النسخ الاحتياطية بداخله تلقائياً");
    } catch (e) {
      if (e?.name !== "AbortError") setDirError("تعذّر اختيار المجلد");
    } finally {
      setDirBusy(false);
    }
  };

  const stopAuto = async () => {
    await clearDirHandle().catch(() => {});
    setDirName(null);
    const next = { ...autoSettings, enabled: false };
    setAutoSettings(next);
    saveAutoBackupSettings(next);
  };

  const setFrequency = (everyDays) => {
    const next = { ...autoSettings, everyDays };
    setAutoSettings(next);
    saveAutoBackupSettings(next);
  };

  const backupNow = async () => {
    setDirBusy(true);
    setDirError("");
    try {
      const handle = await getDirHandle();
      if (!handle) { setDirError("اختر مجلداً أولاً"); return; }
      const perm = await handle.queryPermission({ mode: "readwrite" });
      if (perm !== "granted") {
        const req = await handle.requestPermission({ mode: "readwrite" });
        if (req !== "granted") { setDirError("لم يُمنح إذن الكتابة على المجلد"); return; }
      }
      await writeAutoBackupFile(handle, data, auditLog);
      setLastAutoDays(0);
      notify("تم حفظ نسخة احتياطية بالمجلد المختار");
    } catch (e) {
      setDirError("تعذّر الحفظ — قد تحتاج تختار المجلد من جديد");
    } finally {
      setDirBusy(false);
    }
  };

  const onFileChosen = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true);
    try {
      const payload = await parseBackupFile(file);
      setPendingBackup({ payload, fileName: file.name });
    } catch (err) {
      notify(err.message || "تعذّر قراءة الملف", "error");
    } finally {
      setImporting(false);
    }
  };

  const confirmRestore = () => {
    if (!pendingBackup) return;
    onRestore(pendingBackup.payload);
    setPendingBackup(null);
    onClose();
  };

  return (
    <Modal title="النسخ الاحتياطي والاستعادة" onClose={onClose}>
      <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>

        <div>
          <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 4 }}>تنزيل نسخة احتياطية كاملة الآن</div>
          <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 8px" }}>
            ملف JSON واحد يحتوي <strong>كل</strong> معلومات الموقع: الأصناف والحركات والباركودات والمستخدمين
            والمجموعات والأقسام والمهام والأنشطة، وأيضاً حسابات الرؤساء وكلمات مرورهم وإعدادات شاشة البداية
            وسجل النشاط.
          </p>
          <p style={{ fontSize: 11.5, color: "var(--red, #c92a2a)", margin: "0 0 8px" }}>
            تنبيه: الملف يحتوي كلمات المرور نصّاً صريحاً غير مشفّر — احفظه بمكان آمن ولا ترسله لأي شخص لا تثق فيه.
          </p>
          <button className="btn-ghost" onClick={() => downloadFullBackup(data, auditLog)}>
            <Download size={15} /> تنزيل الآن
          </button>
        </div>

        <div style={{ borderTop: "1px solid var(--line)", paddingTop: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 4 }}>استيراد نسخة احتياطية كاملة</div>
          <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 8px" }}>
            يستبدل <strong>كل</strong> معلومات الموقع الحالية بما في الملف — شامل حسابات الرؤساء وكلمات المرور
            وإعدادات شاشة البداية وسجل النشاط، إن كانت موجودة بالملف.
          </p>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={onFileChosen} />
          <button className="btn-ghost" disabled={importing} onClick={() => fileInputRef.current?.click()}>
            <Upload size={15} /> {importing ? "جارٍ القراءة…" : "اختيار ملف نسخة احتياطية"}
          </button>

          {pendingBackup && (
            <div className="alert alert-error" style={{ marginTop: 10 }}>
              <AlertTriangle size={15} />
              <div>
                <div>
                  سيتم استبدال <strong>كل</strong> معلومات الموقع الحالية بمحتوى الملف «{pendingBackup.fileName}»
                  {pendingBackup.payload.exportedAt ? ` (بتاريخ ${new Date(pendingBackup.payload.exportedAt).toLocaleDateString("ar-SA-u-nu-latn")})` : ""}
                  {pendingBackup.payload.owners ? " — بما في ذلك حسابات الرؤساء وكلمات المرور" : ""}.
                  هذا الإجراء لا يمكن التراجع عنه إلا باستعادة نسخة أخرى، وقد يسجّل خروجك من هذا الحساب لو تغيّرت كلمة مروره.
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <button className="btn-ghost" onClick={() => setPendingBackup(null)}>إلغاء</button>
                  <button className="btn-primary" onClick={confirmRestore}><Check size={14} /> نعم، استبدل كل البيانات</button>
                </div>
              </div>
            </div>
          )}
        </div>

        <div style={{ borderTop: "1px solid var(--line)", paddingTop: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 4 }}>نسخة احتياطية تلقائية على هذا الجهاز</div>
          {!supported ? (
            <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: 0 }}>
              هذه الميزة تحتاج متصفح يدعم اختيار مجلد على الجهاز مباشرة (Chrome أو Edge على كمبيوتر، عبر اتصال https).
              غير مدعومة حالياً على هذا المتصفح أو الجهاز — استخدم «تنزيل نسخة احتياطية الآن» يدوياً بدلاً منها.
            </p>
          ) : (
            <>
              <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 8px" }}>
                اختر مجلداً على جهازك مرة واحدة، وسيحفظ الموقع بداخله ملف نسخة احتياطية تلقائياً كل ما فتحت الموقع بعد المدة التي تحددها — بدون أي نافذة حفظ تظهر لك في كل مرة. تعمل فقط أثناء فتح الموقع فعلياً بهذا المتصفح على هذا الجهاز (وليس بالخلفية إذا كان المتصفح مغلقاً بالكامل).
              </p>

              {dirName ? (
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 5 }}>
                    <FolderOpen size={14} /> المجلد: <strong>{dirName}</strong>
                  </span>
                  <button className="btn-ghost" disabled={dirBusy} onClick={backupNow}>
                    <HardDriveDownload size={14} /> نسخ الآن
                  </button>
                  <button className="btn-ghost" onClick={stopAuto}>إيقاف</button>
                </div>
              ) : (
                <button className="btn-ghost" disabled={dirBusy} onClick={pickFolder}>
                  <FolderOpen size={15} /> اختيار مجلد على هذا الجهاز
                </button>
              )}

              {dirName && (
                <div style={{ marginTop: 10 }}>
                  <Field label="كل كم مدة يأخذ نسخة تلقائية؟">
                    <select className="input" value={autoSettings.everyDays} onChange={(e) => setFrequency(Number(e.target.value))}>
                      <option value={1}>كل يوم (عند أول فتح للموقع بذلك اليوم)</option>
                      <option value={3}>كل 3 أيام</option>
                      <option value={7}>كل أسبوع</option>
                    </select>
                  </Field>
                  <div style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>
                    {lastAutoDays === Infinity ? "لم تُؤخذ نسخة تلقائية بعد" : `آخر نسخة تلقائية: منذ ${Math.floor(lastAutoDays)} يوم تقريباً`}
                  </div>
                </div>
              )}

              {dirError && <div className="alert alert-error" style={{ marginTop: 8 }}><AlertTriangle size={14} /> {dirError}</div>}
            </>
          )}
        </div>

        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>إغلاق</button>
        </div>
      </div>
    </Modal>
  );
}

// نافذة إعدادات التنبيهات — لرئيس الموقع فقط
function NotificationSettingsModal({ settings, onSave, onClose, ownerId }) {
  const [level, setLevel] = useState(settings.level);
  const permission = typeof Notification !== "undefined" ? Notification.permission : "unsupported";

  const OPTIONS = [
    { key: "all", title: "كل التنبيهات", hint: "أي إضافة صنف، أو تسجيل دخول/خروج بضاعة، بالإضافة لتنبيهات النقص والصلاحية" },
    { key: "shortage", title: "تنبيهات النقص فقط", hint: "فقط عند وصول صنف لحد النقص أو نفاده، وقرب انتهاء الصلاحية" },
    { key: "off", title: "إيقاف التنبيهات", hint: "لا تصلك أي تنبيهات من هذا الجهاز" },
  ];

  const requestPermission = () => {
    if (typeof Notification === "undefined") return;
    Notification.requestPermission().then(() => onSave(level)); // force re-render of permission state
  };

  // حالة اشتراك التنبيهات اللحظية (Push) على هذا الجهاز تحديداً
  const [pushState, setPushState] = useState("checking"); // checking | unsupported | not-subscribed | subscribed
  const [pushBusy, setPushBusy] = useState(false);
  const [pushError, setPushError] = useState("");

  useEffect(() => {
    getPushSubscriptionState().then(setPushState);
  }, []);

  const enablePush = async () => {
    setPushBusy(true);
    setPushError("");
    try {
      await subscribeToPush(ownerId);
      setPushState("subscribed");
    } catch (e) {
      setPushError(e?.message || "تعذّر تفعيل التنبيهات اللحظية");
    } finally {
      setPushBusy(false);
    }
  };

  const disablePush = async () => {
    setPushBusy(true);
    setPushError("");
    try {
      await unsubscribeFromPush();
      setPushState("not-subscribed");
    } catch (e) {
      setPushError(e?.message || "تعذّر إلغاء التنبيهات اللحظية");
    } finally {
      setPushBusy(false);
    }
  };

  return (
    <Modal title="إعدادات التنبيهات" onClose={onClose}>
      <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
        {permission !== "granted" && (
          <div className="alert alert-info">
            <ShieldAlert size={15} />
            {permission === "denied"
              ? "التنبيهات محظورة من إعدادات المتصفح لهذا الموقع — فعّلها يدوياً من إعدادات الموقع بالمتصفح أولاً."
              : "لازم تسمح لهذا المتصفح بإرسال التنبيهات أولاً حتى تصلك."}
            {permission === "default" && (
              <div style={{ marginTop: 8 }}>
                <button className="btn-primary" onClick={requestPermission}>السماح بالتنبيهات</button>
              </div>
            )}
          </div>
        )}

        {ownerId && pushState !== "unsupported" && (
          <div className="notif-option" style={{ padding: "10px 12px", border: "1px solid var(--line)", borderRadius: 10 }}>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 13.5 }}>تنبيهات الجوال اللحظية (Push)</div>
                <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>
                  تصلك حتى لو أغلقت المتصفح تماماً أو قفلت الجوال — فعّلها من كل جهاز تريد أن تصلك عليه التنبيهات.
                </div>
              </div>
              {pushState === "subscribed" ? (
                <button className="btn-ghost" disabled={pushBusy} onClick={disablePush}>
                  {pushBusy ? "..." : "إلغاء"}
                </button>
              ) : (
                <button className="btn-primary" disabled={pushBusy || pushState === "checking"} onClick={enablePush}>
                  {pushBusy ? "..." : "تفعيل"}
                </button>
              )}
            </div>
            {pushState === "subscribed" && (
              <div style={{ fontSize: 12, color: "var(--ok, #1a7f37)", marginTop: 6 }}>✓ مفعّلة على هذا الجهاز</div>
            )}
            {pushError && (
              <div style={{ fontSize: 12, color: "var(--danger, #c92a2a)", marginTop: 6 }}>{pushError}</div>
            )}
          </div>
        )}

        {OPTIONS.map((o) => (
          <label key={o.key} className="notif-option" style={{
            display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 12px",
            border: `1px solid ${level === o.key ? "var(--navy)" : "var(--line)"}`,
            borderRadius: 10, cursor: "pointer", background: level === o.key ? "var(--chip-bg)" : "transparent",
          }}>
            <input type="radio" name="notif-level" checked={level === o.key} onChange={() => setLevel(o.key)} style={{ marginTop: 3 }} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{o.title}</div>
              <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>{o.hint}</div>
            </div>
          </label>
        ))}
        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>إلغاء</button>
          <button className="btn-primary" onClick={() => { onSave(level); onClose(); }}><Check size={15} /> حفظ</button>
        </div>
        <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 4 }}>
          ملاحظة: الخيارات أعلاه (كل التنبيهات / النقص فقط / إيقاف) تتحكم في نوع الأحداث التي تُرسل تنبيهاً، وتطبَّق على كلا النوعين معاً: التنبيه الفوري داخل المتصفح وتنبيهات الجوال اللحظية (Push).
        </p>
      </div>
    </Modal>
  );
}

// نافذة «إعدادات شاشة البداية» — لرئيس الموقع (بتحكم كامل) فقط. تتحكم بما
// يظهر لأي زائر يفتح الموقع قبل تسجيل الدخول (وضع العرض): إما المخزون
// للقراءة فقط (الوضع الافتراضي السابق)، أو لوحة معلومات مختصرة، أو شاشة
// ترحيب بسيطة بدون أي بيانات (مفيدة لو ما يريد رئيس الموقع أن يشوف الزوّار
// أي شيء من المخزون قبل تسجيل الدخول).
function GuestScreenSettingsModal({ data, onSave, onClose }) {
  const [screen, setScreen] = useState(data.guestScreen || "inventory");
  const [welcomeText, setWelcomeText] = useState(data.guestWelcomeText || "");

  const savedCfg = data.guestListsConfig || {};
  const [showSections, setShowSections] = useState(savedCfg.showSections !== false);
  const [sectionsTitle, setSectionsTitle] = useState(savedCfg.sectionsTitle || "قائمة الأقسام");
  const [sectionTitles, setSectionTitles] = useState({ ...(savedCfg.sectionTitles || {}) });
  const [showLocations, setShowLocations] = useState(savedCfg.showLocations !== false);
  const [locationsTitle, setLocationsTitle] = useState(savedCfg.locationsTitle || "قائمة المواقع");
  const [locationTitles, setLocationTitles] = useState({ ...(savedCfg.locationTitles || {}) });
  const [showInventoryTable, setShowInventoryTable] = useState(savedCfg.showInventoryTable !== false);

  const branches = data.branches || [];
  const branchName = (id) => branches.find((b) => b.id === id)?.name || "";

  // كل المواقع (حقل category بكل صنف) مجمّعة حسب القسم، لعرض حقل عنوان
  // مخصص لكل واحد منها — نفس التجميع المستخدم بشاشة العرض نفسها
  const locationGroups = React.useMemo(() => {
    const byBranch = new Map();
    (data.items || []).forEach((i) => {
      if (!i.category) return;
      const bKey = i.branch || "";
      if (!byBranch.has(bKey)) byBranch.set(bKey, new Set());
      byBranch.get(bKey).add(i.category);
    });
    const groups = [...byBranch.entries()].map(([bKey, set]) => ({
      branchId: bKey,
      branchLabel: bKey ? (branchName(bKey) || bKey) : "بدون قسم",
      locations: [...set].sort((a, b) => a.localeCompare(b, "ar")),
    }));
    groups.sort((a, b) => {
      if (!a.branchId) return 1;
      if (!b.branchId) return -1;
      return a.branchLabel.localeCompare(b.branchLabel, "ar");
    });
    return groups;
  }, [data.items, branches]);

  const OPTIONS = [
    { key: "inventory", title: "المخزون (قراءة فقط)", hint: "يشوف الزائر كل الأصناف وأرصدتها، بدون إمكانية تعديل — هذا كان السلوك الافتراضي" },
    { key: "dashboard", title: "لوحة معلومات مختصرة", hint: "إحصائيات عامة فقط (عدد الأصناف، حالات النقص...) بدون تفاصيل كل صنف" },
    { key: "lists", title: "قوائم الأقسام/المواقع", hint: "تعرض قائمة الأقسام و/أو قائمة المواقع بالأعلى (بعناوين تحددها)، مع خيار لإظهار أو إخفاء جدول المخزون الكامل تحتها" },
    { key: "welcome", title: "شاشة ترحيب فقط", hint: "لا تُعرض أي بيانات مخزون إطلاقاً — فقط شعار الموقع ورسالة ترحيب وزر الدخول" },
  ];

  const handleSave = () => {
    onSave({
      guestScreen: screen,
      guestWelcomeText: welcomeText,
      guestListsConfig: { showSections, sectionsTitle, sectionTitles, showLocations, locationsTitle, locationTitles, showInventoryTable },
    });
    onClose();
  };

  return (
    <Modal title="إعدادات شاشة البداية" onClose={onClose}>
      <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
        <p style={{ fontSize: 12.5, color: "var(--ink-soft)", margin: 0 }}>
          هذا يحدد أول شيء يشوفه أي شخص يفتح رابط الموقع، قبل ما يسجّل دخول.
        </p>
        {OPTIONS.map((o) => (
          <label key={o.key} className="notif-option" style={{
            display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 12px",
            border: `1px solid ${screen === o.key ? "var(--navy)" : "var(--line)"}`,
            borderRadius: 10, cursor: "pointer", background: screen === o.key ? "var(--chip-bg)" : "transparent",
          }}>
            <input type="radio" name="guest-screen" checked={screen === o.key} onChange={() => setScreen(o.key)} style={{ marginTop: 3 }} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{o.title}</div>
              <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>{o.hint}</div>
            </div>
          </label>
        ))}
        {screen === "welcome" && (
          <Field label="رسالة الترحيب (اختياري)">
            <textarea
              className="input" rows={3} value={welcomeText}
              onChange={(e) => setWelcomeText(e.target.value)}
              placeholder="مثال: مرحباً بك — لعرض المخزون أو التعديل، سجّل الدخول من الزر أدناه."
            />
          </Field>
        )}
        {screen === "lists" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {/* -------- قائمة الأقسام -------- */}
            <div style={{ border: "1px solid var(--line)", borderRadius: 10, padding: "10px 12px" }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                <input type="checkbox" checked={showSections} onChange={(e) => setShowSections(e.target.checked)} />
                <span style={{ fontWeight: 700, fontSize: 13.5 }}>إظهار قائمة الأقسام</span>
              </label>
              {showSections && (
                <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                  <Field label="عنوان القائمة">
                    <input className="input" value={sectionsTitle} onChange={(e) => setSectionsTitle(e.target.value)} placeholder="قائمة الأقسام" />
                  </Field>
                  {branches.length > 0 && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                      <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>عنوان مخصص لكل قسم (اختياري — يترك فارغاً لاستخدام اسم القسم الأصلي):</div>
                      {branches.map((b) => (
                        <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontSize: 12.5, minWidth: 110, color: "var(--ink-soft)" }}>{b.name}</span>
                          <input
                            className="input" style={{ flex: 1 }}
                            value={sectionTitles[b.id] || ""}
                            onChange={(e) => setSectionTitles((s) => ({ ...s, [b.id]: e.target.value }))}
                            placeholder={b.name}
                          />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
            {/* -------- قائمة المواقع -------- */}
            <div style={{ border: "1px solid var(--line)", borderRadius: 10, padding: "10px 12px" }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                <input type="checkbox" checked={showLocations} onChange={(e) => setShowLocations(e.target.checked)} />
                <span style={{ fontWeight: 700, fontSize: 13.5 }}>إظهار قائمة المواقع</span>
              </label>
              {showLocations && (
                <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
                  <Field label="عنوان القائمة">
                    <input className="input" value={locationsTitle} onChange={(e) => setLocationsTitle(e.target.value)} placeholder="قائمة المواقع" />
                  </Field>
                  {locationGroups.length > 0 && (
                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <div style={{ fontSize: 12, color: "var(--ink-soft)" }}>عنوان مخصص لكل موقع (اختياري — يترك فارغاً لاستخدام اسم الموقع الأصلي):</div>
                      {locationGroups.map((g) => (
                        <div key={g.branchId || "none"} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          <div style={{ fontSize: 12, fontWeight: 700, color: "var(--ink-soft)" }}>{g.branchLabel}</div>
                          {g.locations.map((loc) => {
                            const key = `${g.branchId}::${loc}`;
                            return (
                              <div key={key} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                <span style={{ fontSize: 12.5, minWidth: 110, color: "var(--ink-soft)" }}>{loc}</span>
                                <input
                                  className="input" style={{ flex: 1 }}
                                  value={locationTitles[key] || ""}
                                  onChange={(e) => setLocationTitles((s) => ({ ...s, [key]: e.target.value }))}
                                  placeholder={loc}
                                />
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
            {/* -------- إظهار/إخفاء جدول المخزون تحت القوائم -------- */}
            <div style={{ border: "1px solid var(--line)", borderRadius: 10, padding: "10px 12px" }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                <input type="checkbox" checked={showInventoryTable} onChange={(e) => setShowInventoryTable(e.target.checked)} />
                <span style={{ fontWeight: 700, fontSize: 13.5 }}>إظهار جدول المخزون الكامل تحت القوائم</span>
              </label>
              <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 6 }}>
                {showInventoryTable
                  ? "الزائر يشوف قوائم الأقسام/المواقع بالأعلى، وتحتها جدول المخزون كامل بأرصدته."
                  : "الزائر يشوف فقط قوائم الأقسام/المواقع بدون أي بيانات أرصدة أو تفاصيل أصناف."}
              </div>
            </div>
          </div>
        )}
        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>إلغاء</button>
          <button className="btn-primary" onClick={handleSave}>
            <Check size={15} /> حفظ
          </button>
        </div>
      </div>
    </Modal>
  );
}

// زر تبديل الوضع الليلي/النهاري — قائمة صغيرة بثلاث خيارات: فاتح / داكن / تلقائي (النظام)
function ThemeToggle({ themePref, effectiveTheme, onSet }) {
  const [open, setOpen] = useState(false);
  const wrapRef = React.useRef(null);

  useEffect(() => {
    if (!open) return;
    const onClickOutside = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onClickOutside);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onClickOutside);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);

  const OPTIONS = [
    { key: "light", label: "فاتح", icon: Sun },
    { key: "dark", label: "داكن", icon: Moon },
    { key: "system", label: "تلقائي (النظام)", icon: Monitor },
  ];
  const CurrentIcon = effectiveTheme === "dark" ? Moon : Sun;

  return (
    <div className="theme-toggle-wrap" ref={wrapRef}>
      <button className="icon-btn" title="المظهر" onClick={() => setOpen((v) => !v)}>
        <CurrentIcon size={17} />
      </button>
      {open && (
        <div className="theme-toggle-menu">
          {OPTIONS.map((o) => (
            <button
              key={o.key}
              className={`theme-toggle-item ${themePref === o.key ? "theme-toggle-item-active" : ""}`}
              onClick={() => { onSet(o.key); setOpen(false); }}
            >
              <o.icon size={14} /> {o.label}
              {themePref === o.key && <Check size={13} style={{ marginInlineStart: "auto" }} />}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  REPORTS PAGE (site owner only) — تقارير وإحصائيات وتحليلات شاملة     */
/*  لكل الموقع: توزيع الأصناف، حركة المخزون، أكثر الأصناف تداولاً،        */
/*  حالة المهام، ونشاط المستخدمين — كلها مشتقّة من البيانات الحالية       */
/*  دون الحاجة لأي حقول أو تخزين إضافي.                                  */
/* ------------------------------------------------------------------ */

function ReportsPage({ data, inventory, auditLog }) {
  const total = inventory.length;
  const availableCount = inventory.filter((i) => i.status === "available").length;
  const lowCount = inventory.filter((i) => i.status === "low").length;
  const emptyCount = inventory.filter((i) => i.status === "empty").length;
  const pct = (n) => (total ? Math.round((n / total) * 100) : 0);

  const totalBalance = useMemo(
    () => Math.round(inventory.reduce((s, i) => s + (Number(i.balance) || 0), 0) * 100) / 100,
    [inventory]
  );
  const totalIn = useMemo(
    () => (data.incoming || []).reduce((s, r) => s + (Number(r.qty) || 0), 0),
    [data.incoming]
  );
  const totalOut = useMemo(
    () => (data.outgoing || []).reduce((s, r) => s + (Number(r.qty) || 0), 0),
    [data.outgoing]
  );
  const maxFlow = Math.max(1, totalIn, totalOut);

  // توزيع الأصناف حسب القسم
  const byDepartment = useMemo(() => {
    const nameOf = (id) => (data.branches || []).find((b) => b.id === id)?.name;
    const map = new Map();
    inventory.forEach((i) => {
      const b = nameOf(i.branch) || "بدون قسم";
      map.set(b, (map.get(b) || 0) + 1);
    });
    const t = inventory.length || 1;
    return [...map.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => ({ name, count, pct: Math.round((count / t) * 100) }));
  }, [inventory, data.branches]);
  const maxDept = Math.max(1, ...byDepartment.map((d) => d.count));

  // توزيع الأصناف حسب المجموعة
  const byGroup = useMemo(() => {
    const nameOf = (id) => data.itemGroups.find((g) => g.id === id)?.name;
    const map = new Map();
    inventory.forEach((i) => {
      const g = nameOf(i.group) || "بدون مجموعة";
      map.set(g, (map.get(g) || 0) + 1);
    });
    const t = inventory.length || 1;
    return [...map.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => ({ name, count, pct: Math.round((count / t) * 100) }));
  }, [inventory, data.itemGroups]);
  const maxGroup = Math.max(1, ...byGroup.map((g) => g.count));

  // الأصناف الأكثر حركة (دخول + خروج) — أعلى 8
  const topMovers = useMemo(() => {
    return inventory
      .map((i) => ({ code: i.code, name: i.name, emoji: i.emoji, moves: (Number(i.inQty) || 0) + (Number(i.outQty) || 0) }))
      .filter((i) => i.moves > 0)
      .sort((a, b) => b.moves - a.moves)
      .slice(0, 8);
  }, [inventory]);
  const maxMoves = Math.max(1, ...topMovers.map((m) => m.moves));

  // تنبيهات الصلاحية حسب الفئة
  const expiryBreakdown = useMemo(() => {
    const tiers = ["expired", "critical", "warning", "notice"];
    return tiers
      .map((t) => ({ tier: t, meta: EXPIRY_TIER_META[t], count: inventory.filter((i) => i.expiry === t).length }))
      .filter((t) => t.count > 0);
  }, [inventory]);

  // إحصائيات المهام
  const tasks = data.tasks || [];
  const tasksDone = tasks.filter((t) => t.done).length;
  const tasksPending = tasks.length - tasksDone;
  const tasksOverdue = tasks.filter((t) => !t.done && t.dueDate && t.dueDate < todayISO()).length;
  const tasksDonePct = tasks.length ? Math.round((tasksDone / tasks.length) * 100) : 0;

  // أكثر المستخدمين نشاطاً (حسب سجل النشاط) — أعلى 6
  const topActors = useMemo(() => {
    const map = new Map();
    (auditLog || []).forEach((e) => { const k = e.by || "—"; map.set(k, (map.get(k) || 0) + 1); });
    return [...map.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([name, count]) => ({ name, count }));
  }, [auditLog]);
  const maxActor = Math.max(1, ...topActors.map((a) => a.count));

  const kpis = [
    { label: "إجمالي الأصناف", value: total, icon: Boxes, tone: "navy" },
    { label: "إجمالي الكمية المتوفرة", value: totalBalance, icon: Package, tone: "green" },
    { label: "نسبة الأصناف المتوفرة", value: `${pct(availableCount)}%`, icon: Percent, tone: "green" },
    { label: "نسبة النقص والنفاد", value: `${pct(lowCount + emptyCount)}%`, icon: TriangleAlert, tone: "amber" },
  ];

  return (
    <div className="page">
      <PageHeader
        eyebrow="تحليلات" title="التقارير والإحصائيات"
        subtitle="نظرة شاملة على أداء المستودع: توزيع الأصناف، حركة المخزون، المهام، ونشاط المستخدمين"
      />

      <div className="stat-grid">
        {kpis.map((s) => (
          <div key={s.label} className={`stat-card tone-${s.tone}`}>
            <s.icon size={20} strokeWidth={2} />
            <div className="stat-value">{s.value}</div>
            <div className="stat-label">{s.label}</div>
          </div>
        ))}
      </div>

      <div className="chart-grid">
        <div className="panel">
          <div className="panel-head">
            <span className="panel-title">توزيع الأصناف حسب القسم</span>

/* ------------------------------------------------------------------ */
/*  ماسح الباركود اللاسلكي عبر الجوال (Session Pairing عبر Firestore) */
/*  ------------------------------------------------------------------ */
/*  فكرة الربط: اللابتوب يولّد رمز جلسة من 4 أرقام ويكتب وثيقة مؤقتة   */
/*  في نفس مخزن Firestore الموجود أصلاً (window.storage) تحت مفتاح     */
/*  "scanner_session_<code>". الجوال (صفحة index.html?scanner=1)      */
/*  يقرأ نفس الوثيقة بعد إدخال الرمز، ثم يكتب كل باركود يمسحه بداخلها. */
/*  اللابتوب يستمع لنفس الوثيقة لحظياً (window.subscribeStorage) ويوصّل */
/*  الرقم تلقائياً — دون أي تعديل على نماذج/حقول الباركود القائمة.     */
/* ------------------------------------------------------------------ */

const SCANNER_SESSION_PREFIX = "scanner_session_";
const SCANNER_SESSION_TTL_MS = 2 * 60 * 60 * 1000; // ساعتان — بعدها يُعتبر الرمز منتهي الصلاحية

function genScannerCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

function scannerSessionKey(code) {
  return SCANNER_SESSION_PREFIX + String(code || "").trim();
}

function scannerMobileUrl(code) {
  try {
    const url = new URL(window.location.href);
    url.hash = "";
    url.search = "";
    url.searchParams.set("scanner", "1");
    url.searchParams.set("code", code);
    return url.toString();
  } catch {
    return "";
  }
}

/* إيصال الباركود القادم من الجوال إلى حقل الباركود المفتوح حالياً على
   اللابتوب — بنفس أسلوب أي قارئ باركود USB/بلوتوث فعلي متصل بالجهاز
   (محاكاة ضغطات لوحة مفاتيح حقيقية)، حتى يعمل تلقائياً مع أي حقل باركود
   موجود بالموقع (البحث، نموذج إضافة صنف، نموذج وارد/صادر، صفحة
   الباركودات...) دون أي تعديل على تلك النماذج نفسها.
   - لو فيه حقل نص مُركَّز عليه حالياً: نكتب القيمة بداخله فعلياً (عبر
     الـ setter الأصلي لعنصر input حتى يلتقطها React) ثم نرسل Enter.
   - لو ما فيه أي حقل مُركَّز عليه: نرسل ضغطات مفاتيح منفصلة على الصفحة
     تحاكي قارئ USB/بلوتوث فعلي — وهذا بالضبط ما تلتقطه صفحة الوارد/الصادر
     من قبل (دعم قارئ الباركود اليدوي العام بالصفحة). */
function deliverScannedBarcode(rawValue) {
  const value = String(rawValue || "").trim();
  if (!value) return;

  const active = document.activeElement;
  const isEditableField =
    active &&
    (active.tagName === "INPUT" || active.tagName === "TEXTAREA") &&
    !active.disabled && !active.readOnly &&
    document.body.contains(active);

  if (isEditableField) {
    const proto = active.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
    const setter = Object.getOwnPropertyDescriptor(proto, "value")?.set;
    if (setter) {
      setter.call(active, value);
      active.dispatchEvent(new Event("input", { bubbles: true }));
    }
    active.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", code: "Enter", bubbles: true, cancelable: true }));
    active.dispatchEvent(new KeyboardEvent("keyup", { key: "Enter", code: "Enter", bubbles: true, cancelable: true }));
  } else if (!document.querySelector(".modal-overlay")) {
    for (const ch of value) {
      document.body.dispatchEvent(new KeyboardEvent("keydown", { key: ch, bubbles: true, cancelable: true }));
    }
    document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", code: "Enter", bubbles: true, cancelable: true }));
  }

  playBeep("success");
  hapticPulse("success");
}

function ScannerPairing({ isOwner }) {
  const [open, setOpen] = useState(false);
  const [session, setSession] = useState(null); // { code, status, lastBarcode, scanId, createdAt }
  const [copied, setCopied] = useState(false);
  const unsubRef = React.useRef(null);
  const lastScanIdRef = React.useRef(0);

  const stopListening = () => {
    if (unsubRef.current) { try { unsubRef.current(); } catch {} unsubRef.current = null; }
  };

  const listen = (code) => {
    stopListening();
    lastScanIdRef.current = 0;
    unsubRef.current = window.subscribeStorage
      ? window.subscribeStorage(scannerSessionKey(code), (rawValue) => {
          let parsed;
          try { parsed = JSON.parse(rawValue); } catch { return; }
          if (!parsed) return;
          setSession((s) => (s ? { ...s, ...parsed } : parsed));
          if (parsed.scanId && parsed.scanId > lastScanIdRef.current && parsed.lastBarcode) {
            lastScanIdRef.current = parsed.scanId;
            deliverScannedBarcode(parsed.lastBarcode);
          }
        })
      : null;
  };

  const startSession = async () => {
    const code = genScannerCode();
    const value = { code, createdAt: Date.now(), status: "waiting", lastBarcode: null, scanId: 0, phoneConnectedAt: null };
    setSession(value);
    try { await window.storage?.set(scannerSessionKey(code), JSON.stringify(value)); } catch {}
    listen(code);
  };

  const endSession = async (silentCode) => {
    stopListening();
    const code = silentCode || session?.code;
    if (code) { try { await window.storage?.delete(scannerSessionKey(code)); } catch {} }
    setSession(null);
  };

  const regenerate = async () => {
    const oldCode = session?.code;
    stopListening();
    if (oldCode) { try { await window.storage?.delete(scannerSessionKey(oldCode)); } catch {} }
    setSession(null);
    await startSession();
  };

  useEffect(() => {
    if (open && !session) startSession();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [open]);

  useEffect(() => () => stopListening(), []);

  if (!isOwner) return null;

  const connected = session?.status === "connected";
  const link = session?.code ? scannerMobileUrl(session.code) : "";

  const copyLink = async () => {
    if (!link) return;
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch {}
  };

  return (
    <>
      <button className="icon-btn" title="ربط ماسح الجوال" onClick={() => setOpen(true)}>
        <Smartphone size={17} />
      </button>
      {open && (
        <Modal
          title={<><Smartphone size={16} style={{ verticalAlign: "-2px", marginLeft: 6 }} /> ربط ماسح الجوال</>}
          onClose={() => setOpen(false)}
        >
          <div className="scanner-pair-body">
            <div className={`scanner-status ${connected ? "scanner-status-on" : "scanner-status-wait"}`}>
              {connected ? <><Wifi size={14} /> متصل بالماسح 🟢</> : <><WifiOff size={14} /> جاري الانتظار…</>}
            </div>

            {!connected && link && (
              <div className="scanner-qr-wrap">
                <img
                  className="scanner-qr-img"
                  alt="باركود ربط الجوال"
                  src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(link)}`}
                />
              </div>
            )}

            <p className="scanner-hint">
              {connected
                ? "الجوال متصل الآن — أي باركود يمسحه يوصل هنا مباشرة"
                : "صوّر هذا الباركود بكاميرا جوالك (أو أي تطبيق قارئ QR) ليفتح صفحة المسح ويرتبط بجهازك تلقائياً"}
            </p>

            <details className="scanner-manual-fallback">
              <summary>الرمز ما اشتغل؟ أدخله يدوياً</summary>
              <div className="scanner-code-display">{session?.code ? session.code.split("").join(" ") : "‑ ‑ ‑ ‑"}</div>
              <div className="scanner-link-row">
                <input className="input scanner-link-input mono" readOnly value={link} onFocus={(e) => e.target.select()} />
                <button type="button" className="icon-btn" title="نسخ الرابط" onClick={copyLink}>
                  {copied ? <Check size={16} /> : <Copy size={16} />}
                </button>
              </div>
            </details>

            {connected && session?.lastBarcode && (
              <div className="scanner-last-scan">
                <ScanLine size={13} /> آخر باركود مستلم: <strong>{session.lastBarcode}</strong>
              </div>
            )}

            <div className="scanner-actions">
              <button type="button" className="btn-ghost" onClick={regenerate}><RefreshCw size={14} /> رمز جديد</button>
              <button type="button" className="btn-danger" onClick={() => { endSession(); setOpen(false); }}><X size={14} /> إنهاء الجلسة</button>
            </div>
          </div>
        </Modal>
      )}
    </>
  );
}
