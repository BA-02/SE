        background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 8px; cursor: pointer;
        text-align: right; transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(35,48,58,0.08); }
      .stat-value { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 26px; }
      .stat-label { font-size: 12.5px; color: var(--ink-soft); }
      .tone-navy svg { color: var(--navy); } .tone-navy .stat-value { color: var(--navy); }

      /* ---------- شارات نوع الحدث بسجل النشاط ---------- */
      .audit-tone-green { color: var(--green); border-color: var(--green); background: var(--green-bg); }
      .audit-tone-red { color: var(--red); border-color: var(--red); background: var(--red-bg); }
      .audit-tone-amber { color: var(--amber); border-color: var(--amber); background: var(--amber-bg); }
      .audit-tone-navy { color: var(--navy); border-color: var(--navy); background: var(--chip-bg); }
      .tone-green svg { color: var(--green); } .tone-green .stat-value { color: var(--green); }
      .tone-amber svg { color: var(--amber); } .tone-amber .stat-value { color: var(--amber); }
      .tone-red svg { color: var(--red); } .tone-red .stat-value { color: var(--red); }

      /* ---------- PANEL / TABLE ---------- */
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }

      /* ---------- TASKS ---------- */
      .task-list { display: flex; flex-direction: column; }
      .task-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); }
      .task-row:last-child { border-bottom: none; }
      .task-row-done { opacity: 0.55; }
      .task-check {
        flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line);
        background: var(--surface); color: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;
        margin-top: 1px;
      }
      .task-row-done .task-check { background: var(--green); border-color: var(--green); color: #fff; }
      .task-check:hover { border-color: var(--navy); }
      .task-body { flex: 1; min-width: 0; }
      .task-text { font-size: 13.5px; font-weight: 600; }
      .task-row-done .task-text { text-decoration: line-through; }
      .task-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }
      .task-overdue { color: var(--red); font-weight: 700; }
      .panel-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 10px; }
      .panel-title { font-family: 'Almarai', sans-serif; font-weight: 700; font-size: 14.5px; }
      .panel-sub { font-size: 11.5px; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; }

      .table-wrap { overflow-x: auto; }
      .ledger-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .ledger-table th {
        text-align: right; font-family: 'Tajawal'; font-weight: 700; font-size: 11.5px; color: var(--ink-soft);
        padding: 8px 14px; border-top: 1px dashed var(--line); border-bottom: 1px solid var(--line); white-space: nowrap;
      }
      .ledger-table th.sortable { cursor: pointer; user-select: none; }
      .ledger-table td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
      .ledger-table tr:last-child td { border-bottom: none; }
      .ledger-table tr:hover td { background: #FBF8F0; }
      .cell-strong { font-weight: 700; }
      .cell-muted { color: var(--ink-soft); font-size: 12.5px; }
      .cell-mono { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
      .cell-balance { font-weight: 700; }

      .code-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--chip-bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; font-size: 11.5px; color: var(--ink); }

      .stamp-badge {
        display: inline-block; font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 11px;
        padding: 4px 10px; border: 1.5px solid; border-radius: 7px; letter-spacing: 0.01em;
      }

      .move-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 7px; }
      .move-in { background: var(--green-bg); color: var(--green); }
      .move-out { background: var(--red-bg); color: var(--red); }

      /* ---------- TOOLBAR ---------- */
      .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 13px; flex: 1; min-width: 220px; color: var(--ink-soft); }
      .search-box input { border: none; outline: none; background: transparent; font-family: 'Tajawal'; font-size: 13px; flex: 1; color: var(--ink); }
      .search-cam-btn {
        display: inline-flex; align-items: center; justify-content: center; flex: none;
        width: 28px; height: 28px; border-radius: 7px; border: none; cursor: pointer;
        background: var(--navy); color: #F3EEDD; margin-inline-start: 2px;
      }
      .search-cam-btn:hover { background: #1E2A33; }
      .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 12px; font-family: 'Tajawal'; font-weight: 500; cursor: pointer; color: var(--ink-soft); }
      .chip-active { background: var(--navy); border-color: var(--navy); color: #F3EEDD; }
      /* عناصر قوائم "الأقسام/المواقع" بشاشة البداية للزوّار — شكل شبه مستطيل
         (زوايا أقل استدارة) بدل الشكل البيضاوي الكامل المستخدم بباقي الشيبس */
      .list-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-family: 'Tajawal'; font-weight: 600; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, color .15s; }
      .list-chip:hover { border-color: var(--navy); }
      .list-chip-active { background: var(--navy); border-color: var(--navy); color: #F3EEDD; }
      .list-chip-active .cat-count { color: #F3EEDD; opacity: .85; }

      /* ---------- التسجيل السريع (دخول/خروج مباشرة من قائمة الأغراض) ---------- */
      .quick-chip-in.chip-active { background: var(--green); border-color: var(--green); color: #fff; }
      .quick-chip-out.chip-active { background: var(--red); border-color: var(--red); color: #fff; }
      /* بطاقات وضع الإدخال/الإخراج بقائمة الأغراض — عمود واحد يلف عمودياً
         بدل جدول عريض، حتى لا تحتاج الصفحة لأي تمرير أفقي على الجوال */
      .quick-log-list { display: flex; flex-direction: column; gap: 8px; }
      .quick-log-card { border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
      .quick-log-card.row-selected { background: #FBF6E9; border-color: #E4C77A; }
      [data-theme="dark"] .quick-log-card.row-selected { background: rgba(228,199,122,0.12); }
      .quick-log-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
      .quick-log-card-top input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--navy); flex-shrink: 0; }
      .quick-log-card-info { flex: 1; min-width: 0; }
      .quick-log-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; }
      .quick-log-card-balance { flex-shrink: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .quick-log-card-balance-label { font-size: 10.5px; color: var(--ink-soft); }
      .quick-log-card .quick-log-row { justify-content: flex-start; flex-wrap: wrap; }
      .quick-log-row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
      .quick-log-qty { width: 72px; padding: 6px 8px; text-align: center; }
      .quick-log-btn { border-radius: 8px; padding: 8px; }
      .quick-log-btn-in { background: var(--green-bg); color: var(--green); }
      .quick-log-btn-in:hover { background: var(--green); color: #fff; }
      .quick-log-btn-out { background: var(--red-bg); color: var(--red); }
      .quick-log-btn-out:hover { background: var(--red); color: #fff; }
      .qty-stepper { display: flex; align-items: center; gap: 2px; }
      .qty-stepper-btn {
        display: flex; align-items: center; justify-content: center;
        width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink-soft); cursor: pointer; flex: none;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .qty-stepper-btn:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
      .qty-stepper .quick-log-qty { width: 56px; }
      @media (max-width: 520px) {
        .quick-log-qty { width: 56px; }
        .qty-stepper .quick-log-qty { width: 44px; }
        .qty-stepper-btn { width: 22px; height: 22px; }
      }

      /* ---------- تحديد جماعي لتطبيق كمية على عدة أصناف دفعة وحدة ---------- */
      .bulk-bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        background: var(--kraft); border: 1px solid var(--line); border-radius: 10px;
        padding: 10px 14px; margin-top: 10px;
      }
      .bulk-bar-selectall {
        display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700;
        color: var(--ink); cursor: pointer; white-space: nowrap;
      }
      .bulk-bar-selectall input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
      .bulk-bar-count {
        font-size: 12px; font-weight: 700; color: var(--ink-soft); background: var(--chip-bg);
        border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; white-space: nowrap;
      }
      .bulk-bar-qty { width: 130px; }
      .bulk-bar-apply:disabled, .bulk-bar-delete:disabled { opacity: 0.5; cursor: not-allowed; }
      .bulk-bar-clear { margin-inline-start: auto; }
      .table-select-col { width: 34px; text-align: center; }
      .table-select-col input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
      tr.row-selected { background: var(--surface-hover); }
      @media (max-width: 520px) {
        .bulk-bar { padding: 9px 10px; }
        .bulk-bar-qty { width: 100px; }
        .bulk-bar-clear { margin-inline-start: 0; }
      }

      /* ---------- BUTTONS ---------- */
      .btn-primary, .btn-ghost, .btn-danger {
        display: inline-flex; align-items: center; gap: 7px; font-family: 'Tajawal'; font-weight: 700; font-size: 13px;
        border-radius: 9px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
      }
      .btn-primary { background: var(--navy); color: #F3EEDD; }
      .btn-primary:hover { background: #1E2A33; }
      .btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
      .btn-ghost:hover { background: var(--surface-hover); }
      .btn-danger { background: var(--red); color: #fff; }
      .btn-danger:hover { background: #98301F; }

      .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 7px; color: var(--ink-soft); display: inline-flex; }
      .topbar-logout-btn {
        display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        background: var(--red-bg, #FAE6E2); color: var(--red, #B23A2E); border: 1px solid var(--red, #B23A2E);
        border-radius: 8px; padding: 8px 14px; font-family: 'Tajawal'; font-weight: 700; font-size: 12.5px;
        cursor: pointer; white-space: nowrap;
      }
      .topbar-logout-btn:hover { background: var(--red, #B23A2E); color: #fff; }
      @media (max-width: 520px) {
        .topbar-logout-btn span { display: none; }
        .topbar-logout-btn { padding: 8px; }
      }
      .icon-btn:hover { background: var(--surface-hover); color: var(--ink); }
      .theme-toggle-wrap { position: relative; }
      .theme-toggle-menu {
        position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; min-width: 168px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
        box-shadow: 0 10px 26px rgba(var(--shadow-color),0.16);
      }
      .theme-toggle-item {
        display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none; text-align: right;
        padding: 8px 10px; border-radius: 7px; font-family: 'Tajawal'; font-size: 12.5px; color: var(--ink); cursor: pointer;
      }
      .theme-toggle-item:hover { background: var(--surface-hover); }
      .theme-toggle-item-active { color: var(--navy); font-weight: 700; }
      .icon-btn-danger:hover { background: var(--red-bg); color: var(--red); }
      .row-actions { display: flex; gap: 2px; }

      /* ---------- FORMS ---------- */
      .form-panel { padding: 18px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 0; }
      .form-grid-move { grid-template-columns: 1fr 1fr 1fr; }
      .field { display: flex; flex-direction: column; gap: 6px; position: relative; min-width: 0; }
      .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); background: var(--surface-hover); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
      .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
      .box-contents-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
      .box-contents-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface-hover); }
      .box-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); background: var(--chip-bg); border-radius: 6px; padding: 2px 8px; margin-inline-start: 6px; }
      .field-full { grid-column: 1 / -1; }
      .field-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
      .field-hint { font-size: 11px; color: var(--ink-soft); opacity: 0.85; line-height: 1.5; }
      .perm-toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
      .perm-toolbar-btn {
        font-size: 11.5px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line);
        background: var(--surface); color: var(--ink-soft); cursor: pointer;
      }
      .perm-toolbar-btn:hover { background: var(--kraft); }
      .perm-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .perm-check {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px;
        border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .perm-check input { accent-color: var(--navy); }
      .perm-check-active { border-color: var(--navy); background: var(--navy-bg, var(--kraft)); }
      @media (max-width: 520px) {
        .perm-grid { grid-template-columns: 1fr; }
      }
      .scan-label { display: inline-flex; align-items: center; gap: 5px; }
      .scan-hint {
        font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; color: var(--green);
        background: var(--green-bg); padding: 1.5px 7px; border-radius: 10px; letter-spacing: 0.02em;
        animation: scan-breathe 1.6s ease-in-out infinite;
      }
      @keyframes scan-breathe { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
      .scan-input { border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,109,78,0.08); }
      .scan-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(63,109,78,0.14); }
      .scan-flash { animation: scan-flash-anim 0.35s ease; }
      @keyframes scan-flash-anim {
        0% { background: var(--green-bg); border-color: var(--green); }
        100% { background: var(--paper); }
      }

      .scan-input-row { display: flex; gap: 6px; align-items: stretch; }
      .scan-input-row .scan-input { flex: 1; min-width: 0; }
      .scan-camera-btn {
        display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        background: var(--navy); color: #F3EEDD; border: none; border-radius: 8px; padding: 0 12px;
        font-family: 'Tajawal'; font-weight: 700; font-size: 12px; cursor: pointer;
      }
      .scan-camera-btn:hover { background: #1E2A33; }

      .camera-sheet { max-width: 460px; }
      .camera-body { padding: 0; }
      .camera-frame { position: relative; width: 100%; aspect-ratio: 4 / 5; background: #111; overflow: hidden; }
      .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
      .camera-reticle { position: absolute; inset: 14% 10%; pointer-events: none; }
      .reticle-corner { position: absolute; width: 26px; height: 26px; border: 3px solid #7FE0A0; }
      .reticle-corner.tl { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 6px 0 0 0; }
      .reticle-corner.tr { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 0 6px 0 0; }
      .reticle-corner.bl { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 0 6px; }
      .reticle-corner.br { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 6px 0; }
      .reticle-line { position: absolute; right: 0; left: 0; top: 50%; height: 2px; background: #7FE0A0; box-shadow: 0 0 8px #7FE0A0; animation: reticle-sweep 1.6s ease-in-out infinite; }
      @keyframes reticle-sweep { 0%,100% { top: 12%; } 50% { top: 88%; } }
      .camera-status {
        position: absolute; bottom: 12px; right: 50%; transform: translateX(50%);
        background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; font-family: 'Tajawal'; font-weight: 600;
        padding: 6px 14px; border-radius: 8px; white-space: nowrap;
      }
      .camera-fallback { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 26px 22px; color: var(--ink-soft); }
      .camera-fallback svg { color: var(--amber); }
      .camera-fallback p { font-size: 12.5px; line-height: 1.8; margin: 0; }
      .camera-manual { display: flex; gap: 8px; width: 100%; margin-top: 4px; }
      .camera-manual .input { flex: 1; }
      .input {
        border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-family: 'Tajawal'; font-size: 13.5px;
        background: var(--paper); color: var(--ink); outline: none;
        width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box;
      }
      select.input { text-overflow: ellipsis; }
      .input:focus { border-color: var(--navy); background: var(--surface); }
      .input:disabled { color: var(--ink-soft); }

      /* إصلاح حقول التاريخ داخل صفحة RTL: بدون هذا، بعض المتصفحات تعكس
         ترتيب يوم/شهر/سنة داخل صندوق input[type=date] الأصلي فيصير
         مقروء بشكل معكوس. نجبر اتجاه محتوى الحقل نفسه LTR بينما يبقى
         الحقل والتسمية بجانبه بشكل RTL طبيعي كبقية الواجهة */
      input[type="date"], input[type="time"], input[type="datetime-local"] {
        direction: ltr;
        text-align: right;
      }
      input[type="date"]::-webkit-calendar-picker-indicator { margin-inline-start: 6px; margin-inline-end: 0; }
      .form-actions { display: flex; justify-content: flex-start; margin-top: 14px; }

      .autocomplete { position: relative; }
      .suggest-list { position: absolute; top: 42px; right: 0; left: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 20px rgba(var(--shadow-color),0.12); z-index: 15; max-height: 220px; overflow-y: auto; }
      .suggest-item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 11px; background: none; border: none; border-bottom: 1px solid var(--line-soft); cursor: pointer; text-align: right; font-size: 12.5px; }
      .suggest-item:last-child { border-bottom: none; }
      .suggest-item:hover { background: var(--surface-hover); }

      .alert { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 10px 13px; border-radius: 8px; margin-top: 12px; }
      .alert-error { background: var(--red-bg); color: var(--red); }
      .alert-info { background: #EAF1F5; color: var(--navy); }

      /* ---------- MODAL ---------- */
      .modal-overlay { position: fixed; inset: 0; background: rgba(35,48,58,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
      .modal-sheet { background: var(--paper); border-radius: 14px; width: 100%; max-width: 420px; border: 1px solid var(--line); display: flex; flex-direction: column; max-height: calc(100vh - 40px); overflow-x: hidden; }
      .modal-sheet-wide { max-width: 640px; }
      .modal-sheet-wide .modal-body { padding: 24px 26px; }
      .modal-sheet-wide .form-grid { gap: 18px 22px; }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px dashed var(--line); flex-shrink: 0; }
      .modal-title { font-family: 'Almarai'; font-weight: 800; font-size: 14.5px; }
      .modal-body { padding: 18px; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; min-width: 0; box-sizing: border-box; }
      .modal-body * { max-width: 100%; box-sizing: border-box; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; grid-column: 1 / -1; flex-wrap: wrap; min-width: 0; }
      .modal-section-divider {
        grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; color: var(--ink-soft);
        border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 4px;
      }
      .confirm-text { font-size: 13px; color: var(--ink); line-height: 1.7; margin: 0; }

      /* ---------- EMPTY STATE ---------- */
      .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 46px 20px; color: var(--ink-soft); text-align: center; }
      .empty-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
      .empty-hint { font-size: 12px; }

      /* ---------- BARCODE CARDS ---------- */
      .barcode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 14px; }
      .barcode-card { position: relative; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      /* الباركود لازم يبقى خلفية فاتحة وخطوط داكنة دائماً بأي وضع (فاتح/داكن) عشان يبقى قابلاً للمسح والطباعة */
      .barcode-card { background: #FFFFFF; }
      .barcode-name { color: #23303A; }
      .barcode-stripes { display: flex; gap: 1.5px; height: 32px; align-items: stretch; }
      .barcode-stripes span { background: var(--ink); display: block; }
      .barcode-number { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.05em; margin-top: 4px; }
      .barcode-name { font-size: 12.5px; font-weight: 700; text-align: center; }
      .barcode-actions { position: absolute; top: 6px; left: 6px; }
      .barcode-linked-badge {
        position: absolute; top: 6px; right: 6px;
        display: flex; align-items: center; gap: 3px;
        font-size: 10px; font-weight: 700; color: #FFFFFF;
        background: var(--green); border-radius: 999px; padding: 3px 8px;
        line-height: 1;
      }
      .barcode-section-tag {
        font-size: 10.5px; font-weight: 600; color: var(--ink-soft);
        background: var(--bg); border: 1px solid var(--line);
        border-radius: 6px; padding: 2px 9px; margin-top: 2px;
      }

      /* ---------- تحديد أكواد للطباعة (وضع اختياري) ---------- */
      .print-selection-bar {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        background: var(--surface); border: 1px dashed var(--line); border-radius: 10px;
        padding: 9px 14px; margin: 0 0 12px; font-size: 12.5px; color: var(--ink-soft);
      }
      .print-selectall-box {
        display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink);
        cursor: pointer; user-select: none; white-space: nowrap;
      }
      .print-selectall-box input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }
      .print-selection-sep { width: 1px; align-self: stretch; background: var(--line); }
      .print-selection-clear { margin-inline-start: auto; padding: 4px 10px !important; font-size: 12px !important; }
      /* لما يكون وضع التحديد فعّالاً، نرفع محتوى البطاقة لتحت عشان شريط
         التحديد (فوق البطاقة بعرضها الكامل) ما يتداخل مع الباركود أو الاسم */
      .barcode-card-selectable { cursor: pointer; padding-top: 44px; }
      .barcode-card-selected { border: 1px solid var(--navy) !important; box-shadow: 0 0 0 2px rgba(35,48,58,0.12); }
      .barcode-select-box {
        position: absolute; top: 0; left: 0; right: 0; z-index: 3;
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        background: var(--bg); border-bottom: 1px solid var(--line);
        border-radius: 10px 10px 0 0;
        padding: 7px 10px;
      }
      .barcode-select-box input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
      .barcode-select-count { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
      .barcode-select-count button {
        border: none; background: var(--surface); color: var(--navy); border-radius: 5px;
        width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      }
      .barcode-select-count input {
        width: 30px; text-align: center; border: none; background: transparent;
        font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink);
      }
      .barcode-select-count input::-webkit-outer-spin-button,
      .barcode-select-count input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      .print-selection-grid { display: none; }
      @media print {
        body.printing-selection .barcode-grid:not(.print-selection-grid) { display: none !important; }
        body.printing-selection .print-selection-grid { display: grid !important; }
      }

      /* ---------- TOAST ---------- */
      .toast {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 10px;
        font-family: 'Tajawal'; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(35,48,58,0.2); z-index: 200;
        animation: toast-in 0.2s ease;
      }
      @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
      .toast-success { background: var(--navy); color: #F3EEDD; }
      .toast-error { background: var(--red); color: #fff; }

      /* ---------- LOGIN GATE ---------- */
      .login-screen {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--kraft); padding: 20px;
      }
      .login-card {
        background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
        padding: 34px 30px; width: 100%; max-width: 380px; text-align: center;
        box-shadow: 0 14px 40px rgba(35,48,58,0.12);
      }
      .login-mark {
        width: 52px; height: 52px; border-radius: 14px; background: var(--navy); color: #F3EEDD;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
      }
      .login-title { font-family: 'Almarai'; font-weight: 800; font-size: 19px; color: var(--ink); }
      .login-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; margin-bottom: 22px; }
      .login-choices { display: flex; flex-direction: column; gap: 10px; }
      .login-choice {
        display: flex; align-items: center; gap: 12px; text-align: right;
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
        cursor: pointer; font-family: 'Tajawal';
      }
      .login-choice:hover { background: var(--surface-hover); border-color: var(--navy); }
      .login-choice-icon {
        width: 36px; height: 36px; border-radius: 10px; background: var(--kraft);
        display: flex; align-items: center; justify-content: center; color: var(--navy); flex-shrink: 0;
      }
      .login-choice-title { font-weight: 700; font-size: 13.5px; color: var(--ink); }
      .login-choice-hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
      .login-admin-form { display: flex; flex-direction: column; gap: 4px; text-align: right; }
      .login-admin-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
      .link-btn {
        background: none; border: none; padding: 0; margin-top: 8px; text-align: right;
        color: var(--navy); font-family: 'Tajawal'; font-size: 12px; font-weight: 700;
        text-decoration: underline; cursor: pointer; align-self: flex-start;
      }
      .recovered-pass {
        font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
        background: var(--kraft); border: 1px dashed var(--line); border-radius: 10px;
        padding: 10px; text-align: center; letter-spacing: 0.04em;
      }

      /* ---------- VIEW MODE (لوحة العرض) — واجهة مبسّطة للزوار ---------- */
      .view-shell { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); }
      .view-topbar {
        display: flex; align-items: center; gap: 12px; padding: 14px 20px;
        border-bottom: 1px dashed var(--line); background: var(--paper); position: sticky; top: 0; z-index: 5;
      }
      .view-topbar .brand { display: flex; align-items: center; gap: 10px; flex: 1; }
      .view-control-btn { white-space: nowrap; }
      .view-main { flex: 1; padding: 20px 24px 40px; }
      @media (max-width: 520px) {
        .view-topbar { padding: 12px 14px; }
        .view-main { padding: 16px 14px 60px; }
        .view-control-btn span { display: none; }
      }

      /* ---------- ROLE BADGE ---------- */
      .role-badge {
        display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
        padding: 7px 12px; border-radius: 8px; margin: 0 16px 10px;
      }
      .role-badge-guest { background: var(--amber-bg); color: var(--amber); }
      .role-badge-admin { background: var(--green-bg); color: var(--green); }

      .logout-btn {
        display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
        font-family: 'Tajawal'; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); padding: 6px 2px; margin-top: 6px;
      }
      .logout-btn:hover { color: var(--red); }

      /* ---------- ALERT BANNER ---------- */
      .alert-banner {
        display: flex; align-items: center; gap: 10px; background: var(--amber-bg); color: var(--amber);
        border: 1px solid var(--amber); border-radius: 10px; padding: 11px 14px; margin-bottom: 16px; font-size: 12.5px;
      }
      .alert-banner-text { flex: 1; line-height: 1.7; }
      .alert-banner-btn { flex-shrink: 0; }
      .alert-banner-expiry { background: var(--red-bg); color: var(--red); border-color: var(--red); }

      /* ---------- CHARTS ---------- */
      .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
      .mini-chart { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
      .mini-chart-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; }
      .mini-chart-label { font-size: 11.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mini-chart-track { background: var(--kraft); border-radius: 6px; height: 10px; overflow: hidden; }
      .mini-chart-bar { background: var(--navy); height: 100%; border-radius: 6px; transition: width 0.3s ease; }
      .mini-chart-bar-amber { background: var(--amber); }
      .mini-chart-val { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: left; }
      .mini-chart-pct { color: var(--ink-soft); font-size: 10.5px; }

      /* ---------- INVENTORY GRID CARDS ---------- */
      .location-select { max-width: 180px; }
      .view-toggle { display: flex; gap: 4px; }
      .page-check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .page-check-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }

      /* ---------- EMOJI PICKER ---------- */
      .emoji-picker-wrap { position: relative; }
      .emoji-trigger {
        display: flex; align-items: center; gap: 8px; width: 100%; background: var(--surface); border: 1px solid var(--line);
        border-radius: 8px; padding: 9px 12px; font-family: 'Tajawal'; font-size: 13px; color: var(--ink); cursor: pointer;
      }
      .emoji-trigger-glyph { font-size: 18px; }
      .emoji-popover {
        position: absolute; z-index: 40; top: calc(100% + 6px); right: 0; left: 0; background: var(--surface); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px; box-shadow: 0 10px 28px rgba(var(--shadow-color),0.18);
      }
      .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 8px; }
      .emoji-cell { font-size: 18px; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px; cursor: pointer; }
      .emoji-cell:hover { background: var(--kraft); }
      .emoji-cell-active { border-color: var(--navy); background: var(--kraft); }
      .emoji-custom-row { display: flex; gap: 6px; }
      .inv-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 16px; }
      .inv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
      .inv-card-photo { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 2px; }
      .row-thumb { width: 26px; height: 26px; object-fit: cover; border-radius: 5px; vertical-align: middle; margin-left: 6px; }
      .inv-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      .inv-card-head .cell-strong { font-size: 15px; }
      .inv-card-loc { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; }
      .inv-card-balance { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 6px; }
      .inv-card-balance-unit { font-family: 'Tajawal'; font-size: 12px; font-weight: 400; color: var(--ink-soft); }
      .inv-card-box-btn { margin-top: 4px; width: 100%; justify-content: center; }

      /* بطاقة "كتاب" — خلفية بلون جلدي/خشبي تحاكي غلاف كتاب بدل البطاقة
         العادية، تُطبّق تلقائياً على أي صنف من مجموعة كتب/مكتبة أو باسم
         يحتوي كلمة "كتاب" — مجرد تمييز بصري، بدون أي تغيير بالبيانات */
      .inv-card-book, .item-card-book {
        background: linear-gradient(155deg, #6b4327 0%, #8a5a33 45%, #5a3720 100%);
        border: 1px solid #402a17;
        color: #f4e9d8;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(244,233,216,0.08);
      }
      .inv-card-book::before, .item-card-book::before {
        content: "";
        position: absolute;
        inset-inline-start: 0; top: 0; bottom: 0;
        width: 10px;
        background: linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.05));
        box-shadow: 2px 0 4px rgba(0,0,0,0.25);
      }
      .inv-card-book::after, .item-card-book::after {
        content: "📖";
        position: absolute;
        left: -14px; bottom: -18px;
        font-size: 72px;
        opacity: 0.16;
        transform: rotate(-8deg);
        pointer-events: none;
      }
      .inv-card-book .inv-card-loc, .item-card-book .cell-muted { color: #e4d3ba !important; }
      .inv-card-book .inv-card-balance-unit { color: #e4d3ba; }
      .inv-card-book .cell-strong, .item-card-book .cell-strong { color: #f4e9d8; }

      /* بطاقات المواد — كل مجموعة تاخذ شكل بطاقة يحاكي مادتها الحقيقية بدل
         الشكل العادي الموحّد، بنفس فكرة بطاقة "غلاف الكتاب" أعلاه. كل الأشكال
         التالية مجرد تمييز بصري ولا تُغيّر أي بيانات. */

      /* بلاستيك — قنينة شفافة بلمعة زجاجية */
      .inv-card-plastic {
        background: linear-gradient(155deg, #0b6e77 0%, #12959f 45%, #085158 100%);
        border: 1px solid #063e44;
        color: #eafcfb;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(234,252,251,0.10);
      }
      .inv-card-plastic::before {
        content: "";
        position: absolute;
        inset-inline-start: 22%; top: -20%; bottom: -20%;
        width: 26%;
        background: linear-gradient(rgba(255,255,255,0.22), rgba(255,255,255,0.02));
        transform: rotate(9deg);
        pointer-events: none;
      }
      .inv-card-plastic::after {
        content: "🧴";
        position: absolute;
        left: -10px; bottom: -20px;
        font-size: 70px;
        opacity: 0.16;
        transform: rotate(-6deg);
        pointer-events: none;
      }
      .inv-card-plastic .inv-card-loc, .inv-card-plastic .cell-muted { color: #c9f1ee !important; }
      .inv-card-plastic .inv-card-balance-unit { color: #c9f1ee; }
      .inv-card-plastic .cell-strong { color: #f2fffd; }

      /* صحون وأدوات مائدة — طبق خزفي بحافة ذهبية */
      .inv-card-dishes {
        background: radial-gradient(circle at 32% 24%, #FFFDF8 0%, #F3ECE0 72%);
        border: 1px solid #d8c9a8;
        color: var(--ink);
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 0 0 3px rgba(201,162,39,0.30), inset 0 0 0 5px rgba(201,162,39,0.10);
      }
      .inv-card-dishes::after {
        content: "🍽️";
        position: absolute;
        left: -8px; bottom: -20px;
        font-size: 64px;
        opacity: 0.13;
        transform: rotate(-4deg);
        pointer-events: none;
      }
      .inv-card-dishes .inv-card-loc { color: var(--ink-soft) !important; }

      /* ورقيات — صفحة دفتر مسطّرة بحاشية حمراء وطية زاوية */
      .inv-card-paper {
        background:
          repeating-linear-gradient(180deg, transparent 0 27px, rgba(43,59,71,0.08) 27px 28px),
          #FAF6EC;
        border: 1px solid var(--line);
        border-inline-start: 3px solid #B23A2E;
        color: var(--ink);
        position: relative;
        overflow: hidden;
      }
      .inv-card-paper::after {
        content: "";
        position: absolute;
        top: 0; inset-inline-end: 0;
        width: 0; height: 0;
        border-style: solid;
        border-width: 0 18px 18px 0;
        border-color: transparent var(--kraft-deep) transparent transparent;
        opacity: 0.9;
      }
      .inv-card-paper .inv-card-loc { color: var(--ink-soft) !important; }

      /* منظفات — فقاعات صابون منعشة */
      .inv-card-cleaning {
        background:
          radial-gradient(circle at 18% 30%, rgba(255,255,255,0.55) 0 10px, transparent 11px),
          radial-gradient(circle at 78% 18%, rgba(255,255,255,0.40) 0 6px, transparent 7px),
          radial-gradient(circle at 65% 62%, rgba(255,255,255,0.35) 0 14px, transparent 15px),
          radial-gradient(circle at 30% 78%, rgba(255,255,255,0.45) 0 8px, transparent 9px),
          linear-gradient(155deg, #1f9fae 0%, #6fd9c8 100%);
        border: 1px solid #16636e;
        color: #ffffff;
        position: relative;
        overflow: hidden;
      }
      .inv-card-cleaning::after {
        content: "🧼";
        position: absolute;
        left: -8px; bottom: -18px;
        font-size: 62px;
        opacity: 0.18;
        transform: rotate(-8deg);
        pointer-events: none;
      }
      .inv-card-cleaning .inv-card-loc, .inv-card-cleaning .cell-muted { color: #eafffb !important; }
      .inv-card-cleaning .inv-card-balance-unit { color: #eafffb; }
      .inv-card-cleaning .cell-strong { color: #ffffff; }

      /* ماء — قطرات وموجة هادئة */
      .inv-card-water {
        background: linear-gradient(180deg, #EAF6FB 0%, #CFEAF5 60%, #A9D9EA 100%);
        border: 1px solid #8FC3D8;
        color: #0B3B4A;
        position: relative;
        overflow: hidden;
      }
      .inv-card-water::after {
        content: "💧";
        position: absolute;
        left: -6px; bottom: -16px;
        font-size: 60px;
        opacity: 0.20;
        pointer-events: none;
      }
      .inv-card-water .inv-card-loc { color: #3D6B7A !important; }
      .inv-card-water .inv-card-balance-unit { color: #3D6B7A; }

      /* كرتون — صندوق تعبئة مموّج بشريط لاصق */
      .inv-card-cardboard {
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,0.07) 0 2px, transparent 2px 7px),
          linear-gradient(155deg, #B98C55 0%, #96703F 55%, #7A5A31 100%);
        border: 1px solid #5E4526;
        color: #F6ECD9;
        position: relative;
        overflow: hidden;
      }
      .inv-card-cardboard::before {
        content: "";
        position: absolute;
        inset-inline-start: -10%; top: 38%;
        width: 120%; height: 22px;
        background: rgba(230,210,175,0.35);
        transform: rotate(-4deg);
        pointer-events: none;
      }
      .inv-card-cardboard::after {
        content: "📦";
        position: absolute;
        left: -8px; bottom: -18px;
        font-size: 62px;
        opacity: 0.18;
        pointer-events: none;
      }
      .inv-card-cardboard .inv-card-loc, .inv-card-cardboard .cell-muted { color: #E9D9BC !important; }
      .inv-card-cardboard .inv-card-balance-unit { color: #E9D9BC; }
      .inv-card-cardboard .cell-strong { color: #FBF3E4; }

      /* كهرباء — تحذير جهد عالٍ بشريط أصفر/أسود */
      .inv-card-electrical {
        background: linear-gradient(160deg, #1B1F22 0%, #262C30 100%);
        border: 1px solid #000000;
        color: #F5E9C8;
        position: relative;
        overflow: hidden;
      }
      .inv-card-electrical::before {
        content: "";
        position: absolute;
        top: 0; inset-inline-start: 0; inset-inline-end: 0;
        height: 7px;
        background: repeating-linear-gradient(45deg, #F2C230 0 10px, #1B1F22 10px 20px);
      }
      .inv-card-electrical::after {
        content: "⚡";
        position: absolute;
        left: -6px; bottom: -16px;
        font-size: 60px;
        opacity: 0.20;
        color: #F2C230;
        pointer-events: none;
      }
      .inv-card-electrical .inv-card-loc, .inv-card-electrical .cell-muted { color: #C9BC96 !important; }
      .inv-card-electrical .inv-card-balance-unit { color: #C9BC96; }
      .inv-card-electrical .cell-strong { color: #F9EFD3; }

      /* سلامة وإطفاء — إنذار أحمر بشريط تحذيري */
      .inv-card-safety {
        background: linear-gradient(155deg, #7A1F1F 0%, #A8302A 55%, #5C1414 100%);
        border: 1px solid #3D0E0E;
        color: #FBE4E0;
        position: relative;
        overflow: hidden;
      }
      .inv-card-safety::before {
        content: "";
        position: absolute;
        top: 0; inset-inline-start: 0;
        width: 40px; height: 40px;
        background: repeating-linear-gradient(45deg, #FBE4E0 0 6px, transparent 6px 12px);
        opacity: 0.25;
        clip-path: polygon(0 0, 100% 0, 0 100%);
      }
      .inv-card-safety::after {
        content: "🧯";
        position: absolute;
        left: -8px; bottom: -18px;
        font-size: 62px;
        opacity: 0.18;
        pointer-events: none;
      }
      .inv-card-safety .inv-card-loc, .inv-card-safety .cell-muted { color: #F0C6C0 !important; }
      .inv-card-safety .inv-card-balance-unit { color: #F0C6C0; }
      .inv-card-safety .cell-strong { color: #FDEEEB; }

      /* أدوات وصيانة — معدن مصقول */
      .inv-card-tools {
        background:
          repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 9px),
          linear-gradient(155deg, #5C6670 0%, #7C8894 45%, #454E56 100%);
        border: 1px solid #333B41;
        color: #EEF1F3;
        position: relative;
        overflow: hidden;
      }
      .inv-card-tools::after {
        content: "🛠️";
        position: absolute;
        left: -8px; bottom: -18px;
        font-size: 62px;
        opacity: 0.16;
        transform: rotate(-6deg);
        pointer-events: none;
      }
      .inv-card-tools .inv-card-loc, .inv-card-tools .cell-muted { color: #CBD2D8 !important; }
      .inv-card-tools .inv-card-balance-unit { color: #CBD2D8; }
      .inv-card-tools .cell-strong { color: #F7F9FA; }

      /* قرطاسية ومكتب — دفتر رسم بيانياً كحلي */
      .inv-card-stationery {
        background:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 18px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 18px),
          var(--navy);
        border: 1px solid #16202A;
        color: #EEF3F7;
        position: relative;
        overflow: hidden;
      }
      .inv-card-stationery::after {
        content: "📎";
        position: absolute;
        left: -6px; bottom: -16px;
        font-size: 58px;
        opacity: 0.18;
        transform: rotate(12deg);
        pointer-events: none;
      }
      .inv-card-stationery .inv-card-loc, .inv-card-stationery .cell-muted { color: #B9C6D2 !important; }
      .inv-card-stationery .inv-card-balance-unit { color: #B9C6D2; }
      .inv-card-stationery .cell-strong { color: #F7FAFC; }

      /* تمييز لحظي للصنف بعد وصوله من نتيجة البحث العام: هالة تنبض ثم
         تختفي تدريجياً، تعمل على البطاقة وعلى صف الجدول معاً */
      .inv-card-highlight {
        animation: inv-pulse 2.2s ease-out 1;
        border-color: var(--navy) !important;
        position: relative;
        z-index: 1;
      }
      tr.inv-card-highlight { background: var(--kraft) !important; }
      @keyframes inv-pulse {
        0% { box-shadow: 0 0 0 0 rgba(43,59,71,0.45); }
        60% { box-shadow: 0 0 0 10px rgba(43,59,71,0); }
        100% { box-shadow: 0 0 0 0 rgba(43,59,71,0); }
      }

      /* ---------- قائمة الأقسام (المخزون) ---------- */
      .cat-list-panel { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
      .cat-list-title { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
      .cat-list-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .cat-count { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; opacity: 0.7; margin-inline-start: 4px; }
      .cat-branch-group { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--line-soft); }
      .cat-branch-group:first-of-type { border-top: none; padding-top: 0; }
      .cat-branch-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); }

      /* تلميح "تم التعرف عليه من قائمة الباركودات" أسفل حقل الكود بنموذج
         إضافة الصنف */
      .barcode-match-hint { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--olive); margin-top: 6px; }
      .scan-duplicate-warning { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #B23A3A; margin-top: 6px; }

      /* ---------- ربط ماسح الجوال (Scanner Pairing) ---------- */
      .scanner-pair-body { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 4px 2px 8px; }
      .scanner-status { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; }
      .scanner-status-wait { background: var(--amber-bg); color: var(--amber); }
      .scanner-status-on { background: var(--green-bg); color: var(--green); }
      .scanner-code-display {
        font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; letter-spacing: 6px;
        background: var(--chip-bg); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 20px; color: var(--ink);
      }
      .scanner-qr-wrap {
        background: #FFFFFF; border-radius: 14px; padding: 14px;
        border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
      }
      .scanner-qr-img { width: 200px; height: 200px; display: block; }
      .scanner-manual-fallback { width: 100%; font-size: 12.5px; color: var(--ink-soft); }
      .scanner-manual-fallback summary {
        cursor: pointer; text-align: center; padding: 6px; user-select: none;
        color: var(--navy); font-weight: 700;
      }
      .scanner-manual-fallback[open] summary { margin-bottom: 10px; }
      .scanner-manual-fallback > .scanner-code-display { font-size: 26px; padding: 8px 16px; margin: 0 auto 10px; width: fit-content; }
      .scanner-hint { font-size: 12.5px; color: var(--ink-soft); margin: 0; max-width: 320px; }
      .scanner-link-row { display: flex; gap: 6px; width: 100%; }
      .scanner-link-input { flex: 1; font-size: 12px; direction: ltr; text-align: left; }
      .scanner-last-scan { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
      .scanner-actions { display: flex; gap: 8px; width: 100%; margin-top: 4px; }
      .scanner-actions button { flex: 1; }

      /* ---------- الأنشطة المؤقتة ---------- */
      .activity-list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
      .activity-card { padding: 0; overflow: hidden; }
      .activity-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; cursor: pointer; }
      .activity-card-head:hover { background: var(--surface-hover); }
      .activity-card-body { padding: 0 16px 16px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
      .activity-add-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .activity-add-row .input { flex: 1; min-width: 160px; }

      /* ---------- REAL BARCODE ---------- */
      .real-barcode { width: 100%; max-width: 170px; height: 34px; }

      /* ---------- SIDEBAR BACKDROP (mobile) ---------- */
      .sidebar-backdrop { display: none; }

      /* ---------- PRINT / PDF EXPORT ---------- */
      @media print {
        .sidebar, .sidebar-backdrop, .topbar, .toolbar, .toast, .row-actions, .barcode-actions,
        .stat-grid button, .modal-overlay, .alert-banner-btn, .btn-primary, .btn-ghost { display: none !important; }
        body, .app-shell { background: #fff !important; }
        .main-col { margin: 0 !important; }
        .panel, .ledger-table, .barcode-grid { box-shadow: none !important; border: 1px solid #999 !important; }
        .page { padding: 0 !important; }
      }

      /* ---------- طباعة استكرات (ملصقات صغيرة للباركود فقط) ---------- */
      /* يفعَّل فقط أثناء الطباعة عبر كلاس body.printing-stickers، ولا يؤثر
         إطلاقاً على العرض العادي في الشاشة */
      @media print {
        body.printing-stickers .page-head,
        body.printing-stickers .filter-chips,
        body.printing-stickers .cat-list-panel,
        body.printing-stickers .barcode-name,
        body.printing-stickers .barcode-linked-badge,
        body.printing-stickers .barcode-section-tag,
        body.printing-stickers .barcode-thumb {
          display: none !important;
        }
        body.printing-stickers .page { padding: 0 !important; margin: 0 !important; }
        body.printing-stickers .panel {
          padding: 0 !important; margin: 0 !important; border: none !important; box-shadow: none !important;
        }
        body.printing-stickers .barcode-grid {
          display: grid !important;
          grid-template-columns: repeat(auto-fill, minmax(38mm, 1fr)) !important;
          gap: 2mm !important;
          padding: 0 !important;
        }
        body.printing-stickers .barcode-card {
          border: none !important;
          padding: 1mm !important;
          gap: 0.5mm !important;
          break-inside: avoid;
          page-break-inside: avoid;
        }
        body.printing-stickers .real-barcode {
          max-width: 34mm !important;
          height: 12mm !important;
        }
        body.printing-stickers .barcode-number {
          font-size: 8px !important;
          margin-top: 0.5mm !important;
        }
      }

      /* ---------- رفع صورة المنتج (اختياري) ---------- */
      .image-upload-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .image-upload-actions { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
      .image-upload-preview { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
      .image-upload-preview img {
        width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line);
      }
      .image-upload-preview-actions { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
      .barcode-thumb {
        width: 100%; max-width: 90px; height: 60px; object-fit: cover; border-radius: 6px; margin-bottom: 2px;
      }

      /* ---------- تقرير الطباعة/PDF (تصميم مستند مستقل عن واجهة الموقع) ---------- */
      .print-report { display: none; }
      body.printing-report .app-shell,
      body.printing-report .view-shell,
      body.printing-report .toast { display: none !important; }
      @media print {
        body.printing-report .print-report {
          display: block !important; background: #fff; color: #23303A;
          font-family: 'Tajawal', sans-serif; padding: 10mm 6mm; direction: rtl;
        }
      }
      .print-report-header {
        display: flex; align-items: flex-start; justify-content: space-between;
        border-bottom: 2px solid #23303A; padding-bottom: 10px; margin-bottom: 16px;
      }
      .print-report-brand { display: flex; align-items: center; gap: 10px; }
      .print-report-brand-mark { font-size: 26px; }
      .print-report-brand-title { font-family: 'Almarai'; font-weight: 800; font-size: 16px; }
      .print-report-brand-sub { font-size: 10.5px; color: #5B6570; }
      .print-report-meta { text-align: left; font-size: 11px; color: #5B6570; }
      .print-report-doc-title { font-family: 'Almarai'; font-weight: 800; font-size: 14px; color: #23303A; margin-bottom: 3px; }
      .print-stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
      .print-stat {
        flex: 1; border: 1px solid #C9BA96; border-radius: 8px; padding: 10px;
        text-align: center; font-size: 11px; color: #5B6570;
      }
      .print-stat span { display: block; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #23303A; margin-bottom: 2px; }
      .print-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .print-table th, .print-table td { border: 1px solid #999; padding: 5px 7px; text-align: right; }
      .print-table th { background: #ECE2CC; font-weight: 700; }
      .print-table tr { break-inside: avoid; }
      .print-report-footer { margin-top: 18px; padding-top: 8px; border-top: 1px dashed #C9BA96; font-size: 10px; color: #5B6570; text-align: center; }
      @page { margin: 12mm; }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 860px) {
        .stat-grid { grid-template-columns: repeat(2, 1fr); }
        .chart-grid { grid-template-columns: 1fr; }
        .form-grid, .form-grid-move { grid-template-columns: 1fr 1fr; }
        .sidebar {
          position: fixed; top: 0; bottom: 0; right: 0; z-index: 70; width: min(78vw, 300px);
          transform: translateX(100%); transition: transform 0.18s ease-out;
          box-shadow: -8px 0 24px rgba(0,0,0,0.18);
        }
        .sidebar-open { transform: translateX(0); }
        .sidebar-backdrop {
          display: block; position: fixed; inset: 0; z-index: 65;
          background: rgba(20,26,32,0.4); backdrop-filter: blur(1px);
          animation: backdropFadeIn 0.15s ease-out;
        }
        @keyframes backdropFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hamburger { display: flex; padding: 10px; margin: -10px; touch-action: manipulation; }
        .main-area { padding: 18px 16px 24px; }

        /* يمنع تكبير سفاري لصفحة الجوال تلقائياً عند الضغط داخل أي حقل —
           أي خط أصغر من 16px يشغّل تكبير iOS التلقائي عند التركيز. */
        .input, select.input, textarea.input { font-size: 16px; }

        /* أهداف لمس أكبر (44px تقريباً) لكل الأزرار الأساسية بالجوال */
        .btn-primary, .btn-ghost, .btn-danger { padding: 11px 16px; min-height: 44px; }
        .icon-btn { padding: 10px; }
        .chip { padding: 9px 15px; }
      }
      @media (max-width: 520px) {
        .stat-grid { grid-template-columns: 1fr 1fr; }
        .form-grid, .form-grid-move { grid-template-columns: 1fr; }
        .page-title { font-size: 20px; }

        /* نافذة الإضافة/التعديل على الجوال: تلتصق بأسفل الشاشة بعرض كامل
           بدل الظهور كبطاقة صغيرة بمنتصف الشاشة — أسهل بالوصول وأريح
           للمس، وأزرار الحفظ/الإلغاء تصير بعرض كامل وفوق بعض بدل
           جنب بعض حتى ما تنضغط الأصابع الكبيرة بالخطأ */
        .modal-overlay { align-items: flex-end; padding: 0; }
        .modal-sheet { max-width: 100%; border-radius: 16px 16px 0 0; max-height: 88vh; }
        .modal-body { padding: 16px; }
        .modal-actions { flex-direction: column-reverse; gap: 8px; }
        .modal-actions .btn-primary, .modal-actions .btn-ghost, .modal-actions .btn-danger { width: 100%; }
      }
    `}</style>
  );
}

function RootRouter() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("scanner") === "1") {
    return <ScannerMobilePage initialCode={params.get("code") || ""} />;
  }
  if (params.get("photo") === "1") {
    return <PhotoCaptureMobilePage initialCode={params.get("code") || ""} initialMode={params.get("mode") || "camera"} />;
  }
  return <App />;
}

const root = createRoot(document.getElementById("root"));
root.render(<RootRouter />);
</script>
</body>
</html>
