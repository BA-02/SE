/* ------------------------------------------------------------------ */
/*  رفع صورة المنتج (اختياري)                                          */
/*  نضغط الصورة ونصغّرها بالمتصفح (Canvas) قبل تحويلها لنص Base64      */
/*  حتى لا تكبر بيانات المخزون بلا داعٍ عند رفع صور كبيرة من الجوال    */
/* ------------------------------------------------------------------ */
// يفرّق بين الجوال/التابلت (له كاميرا فعلية يفتحها زر "التقط صورة" مباشرة)
// وبين اللابتوب/الكمبيوتر (زر "التقط صورة" عليه يفتح نفس منتقي الملفات
// تماماً مثل "رفع صورة" — فلا داعي لتكراره، ونكتفي بـ"رفع صورة" أو
// "التصوير الآن (عبر الجوال)" لمن يريد كاميرا فعلية).
function isLikelyMobileDevice() {
  if (typeof navigator === "undefined") return false;
  return /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent || "");
}

async function fileToCompressedDataURL(file, maxDim = 640, quality = 0.72) {
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("تعذّرت قراءة الصورة"));
    reader.readAsDataURL(file);
  });
  try {
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error("تعذّر تحميل الصورة"));
      im.src = dataUrl;
    });
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale) || 1;
    const h = Math.round(img.height * scale) || 1;
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    return canvas.toDataURL("image/jpeg", quality);
  } catch {
    // لو فشل الضغط لأي سبب (مثلاً صورة غير مدعومة)، نستخدم الصورة الأصلية
    // كما هي بدل ما نفشل العملية بالكامل
    return dataUrl;
  }
}

function ImageUploadField({ value, onChange }) {
  const [busy, setBusy] = useState(false);
  // null = مغلق، "camera" = تصوير مباشر عبر الجوال، "gallery" = رفع من
  // معرض الجوال — كلاهما عبر نفس آلية ربط QR، والوضع يحدد ما يفتحه الجوال
  // تلقائياً فور الاتصال (بدون أي ضغطة إضافية على الجوال نفسه)
  const [phonePairMode, setPhonePairMode] = useState(null);
  const galleryRef = React.useRef(null);
  const cameraRef = React.useRef(null);
  // على اللابتوب/الكمبيوتر (بدون كاميرا جوال حقيقية) نخفي زر "التقط صورة"
  // لأنه سيفتح نفس منتقي الملفات تماماً مثل "رفع صورة" — تكرار بلا فائدة
  const isMobileDevice = React.useMemo(() => isLikelyMobileDevice(), []);

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // يسمح باختيار/تصوير نفس الملف مرة ثانية لاحقاً لو احتاج
    if (!file) return;
    setBusy(true);
    try {
      const dataUrl = await fileToCompressedDataURL(file);
      onChange(dataUrl);
    } catch {
      // تجاهل بصمت — المستخدم يقدر يعيد المحاولة
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="image-upload-field">
      {value ? (
        <div className="image-upload-preview">
          <img src={value} alt="صورة" />
          <div className="image-upload-preview-actions">
            <button type="button" className="btn-ghost" onClick={() => galleryRef.current?.click()}>
              <FolderOpen size={14} /> رفع صورة
            </button>
            {isMobileDevice && (
              <button type="button" className="btn-ghost" onClick={() => cameraRef.current?.click()}>
                <Camera size={14} /> تصوير
              </button>
            )}
            {/* أجهزة اللابتوب/الكمبيوتر عادة بدون كاميرا مناسبة — هذان
                الزران يعرضان باركود QR يفتح صفحة على الجوال تفتح الكاميرا
                أو المعرض تلقائياً فور الاتصال، وتصل الصورة هنا تلقائياً
                (بدون رفع/تنزيل يدوي، وبدون أي ضغطة إضافية على الجوال). */}
            <button type="button" className="btn-ghost" onClick={() => setPhonePairMode("camera")}>
              <Smartphone size={14} /> التصوير الآن
            </button>
            <button type="button" className="btn-ghost" onClick={() => setPhonePairMode("gallery")}>
              <Upload size={14} /> رفع من الجوال
            </button>
            <button type="button" className="btn-ghost" onClick={() => onChange("")}>
              <X size={14} /> إزالة
            </button>
          </div>
        </div>
      ) : (
        <div className="image-upload-actions">
          {/* رفع من المعرض/الملفات — يشتغل على الجوال والكمبيوتر */}
          <button type="button" className="btn-ghost" onClick={() => galleryRef.current?.click()} disabled={busy}>
            <FolderOpen size={15} /> {busy ? "جارٍ التحميل…" : "رفع صورة"}
          </button>
          {/* تصوير مباشر — يظهر فقط على الجوال/التابلت حيث يفتح الكاميرا
              الخلفية مباشرة (capture)؛ على اللابتوب/الكمبيوتر نخفيه لأنه
              كان سيفتح نفس منتقي الملفات مثل "رفع صورة" تماماً */}
          {isMobileDevice && (
            <button type="button" className="btn-ghost" onClick={() => cameraRef.current?.click()} disabled={busy}>
              <Camera size={15} /> {busy ? "جارٍ التحميل…" : "التقط صورة"}
            </button>
          )}
          {/* على جهاز لابتوب/كمبيوتر: اضغط هنا يظهر باركود QR، امسحه بجوالك
              فيفتح جوالك الكاميرا تلقائياً للالتقاط مباشرة — بدون فتح أي
              صفحة وسيطة أو ضغط أي زر إضافي على الجوال. */}
          <button type="button" className="btn-ghost" onClick={() => setPhonePairMode("camera")} disabled={busy}>
            <Smartphone size={15} /> التصوير الآن (عبر الجوال)
          </button>
          {/* بديل: امسح الباركود فيفتح جوالك معرض الصور تلقائياً لاختيار
              صورة محفوظة مسبقاً بدل التقاط صورة جديدة */}
          <button type="button" className="btn-ghost" onClick={() => setPhonePairMode("gallery")} disabled={busy}>
            <Upload size={15} /> رفع من الجوال
          </button>
        </div>
      )}
      <input ref={galleryRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleFile} />
      <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={handleFile} />
      {phonePairMode && (
        <PhotoCapturePairing
          mode={phonePairMode}
          onCapture={(img) => { onChange(img); setPhonePairMode(null); }}
          onClose={() => setPhonePairMode(null)}
        />
      )}
    </div>
  );
}

function ItemForm({ item, itemGroups, branches, allItems, barcodes, mode, currentBalance, onCancel, onSave }) {
  const [form, setForm] = useState({
    isContainer: false, parentCode: "",
    initialQty: mode === "edit" ? String(currentBalance ?? 0) : "1",
    ...item,
  });
  // الأصناف المؤهلة تكون "صندوق" يوضع بداخله هذا الصنف: أي صنف عليه علامة isContainer
  // باستثناء الصنف نفسه (لا يقدر يكون بداخل نفسه) وأي صندوق أصلاً بداخل هذا الصنف (يمنع الحلقات)
  const containerOptions = (allItems || []).filter(
    (i) => i.isContainer && i.code !== form.code && i.parentCode !== form.code
  );
  const [cameraOpen, setCameraOpen] = useState(false);
  const codeRef = React.useRef(null);
  const nameRef = React.useRef(null);

  useEffect(() => { codeRef.current?.focus(); }, []);

  // كل باركود مسجّل مسبقاً بصفحة "الباركودات" معروف بكل الموقع، فلو الكود
  // المدخل هنا (كتابة أو مسح) يطابق واحداً منها نعبّي اسم الصنف تلقائياً
  // منه بدل ما يعيد المستخدم كتابته يدوياً
  const matchedBarcode = React.useMemo(
    () => (barcodes || []).find((b) => b.number === (form.code || "").trim()),
    [form.code, barcodes]
  );
  useEffect(() => {
    if (matchedBarcode && !form.name.trim()) {
      // لو الباركود المطابق مرتبط بصورة مسبقاً (من صفحة الباركودات) نجلبها
      // ونعرضها تلقائياً مع بيانات الصنف، دون التأثير على صورة اختارها
      // المستخدم بنفسه لهذا الصنف مسبقاً (بوضع التعديل مثلاً)
      setForm((f) => ({ ...f, name: matchedBarcode.name, image: f.image || matchedBarcode.image || "" }));
    }
  }, [matchedBarcode]);

  // لو القسم المختار له "مجموعة افتراضية" (تُضبط من صفحة الأقسام)، نعبّيها
  // تلقائياً عند إضافة صنف جديد — فقط إن لم يختر المستخدم مجموعة بنفسه بعد،
  // حتى يقدر دائماً يغيّرها يدوياً لو حاب صنفاً من نوع مختلف
  const [groupTouched, setGroupTouched] = useState(false);
  useEffect(() => {
    if (mode !== "add" || groupTouched || form.group) return;
    const b = (branches || []).find((x) => x.id === form.branch);
    if (b && b.defaultGroup) {
      const g = itemGroups.find((x) => x.id === b.defaultGroup);
      setForm((f) => ({ ...f, group: b.defaultGroup, emoji: f.emoji || (g ? suggestEmojiForGroup(g.name) : f.emoji) }));
    }
  }, [form.branch, mode]);

  const handleCodeKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      nameRef.current?.focus();
    }
  };

  const handleCameraDetect = (value) => {
    setCameraOpen(false);
    setForm((f) => ({ ...f, code: value.trim() }));
    setTimeout(() => nameRef.current?.focus(), 0);
  };

  const pickGroup = (groupId) => {
    setGroupTouched(true);
    const g = itemGroups.find((x) => x.id === groupId);
    // إذا ما اختار المستخدم إيموجي بعد، نقترح له واحداً يناسب المجموعة
    const suggested = !form.emoji && g ? suggestEmojiForGroup(g.name) : form.emoji;
    setForm({ ...form, group: groupId, emoji: suggested });
  };

  // مواقع مقترحة (Autocomplete) لحقل "الموقع" بناءً على المواقع المستخدمة
  // فعلياً داخل نفس القسم المختار — لأن المواقع منطقياً موجودة داخل الأقسام
  // (مثال: قسم المكتبة بداخله مواقع مثل "الرف الأول")
  const suggestedLocations = React.useMemo(() => {
    const pool = (allItems || []).filter((i) => !form.branch || i.branch === form.branch);
    return [...new Set(pool.map((i) => i.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ar"));
  }, [allItems, form.branch]);

  return (
    <>
    <div className="form-grid">
      <Field label={<span className="scan-label"><ScanLine size={13} /> الكود (الباركود) <span className="scan-hint">جاهز للمسح</span></span>}>
        <div className="scan-input-row">
          <input
            ref={codeRef}
            className="input mono scan-input"
            value={form.code}
            onChange={(e) => setForm({ ...form, code: e.target.value.trim() })}
            onKeyDown={handleCodeKeyDown}
            placeholder="امسح الباركود أو اكتب الكود يدوياً"
            autoComplete="off"
          />
          <ScanCameraButton onClick={() => setCameraOpen(true)} />
        </div>
        {matchedBarcode && (
          <div className="barcode-match-hint">
            <Barcode size={12} /> تم التعرف عليه من قائمة الباركودات: «{matchedBarcode.name}»
          </div>
        )}
      </Field>
      <Field label="اسم المنتج">
        <input ref={nameRef} className="input" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="اسم الصنف" />
      </Field>
      <Field label="أيقونة الصنف (اختياري)">
        <EmojiPicker value={form.emoji} onChange={(em) => setForm({ ...form, emoji: em })} />
      </Field>
      <Field label="صورة المنتج (اختياري)">
        <ImageUploadField value={form.image} onChange={(img) => setForm({ ...form, image: img })} />
        {matchedBarcode && matchedBarcode.image && !form.image && (
          <div className="field-hint">هذا الباركود مرتبط بصورة محفوظة مسبقاً — ستُعبّأ تلقائياً</div>
        )}
      </Field>
      <Field label="المجموعة (نوع الصنف)">
        <select className="input" value={form.group || ""} onChange={(e) => pickGroup(e.target.value)}>
          <option value="">بدون مجموعة</option>
          {itemGroups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
        </select>
      </Field>
      <Field label="القسم">
        <select className="input" value={form.branch || ""} onChange={(e) => setForm({ ...form, branch: e.target.value })}>
          <option value="">بدون قسم محدد</option>
          {(branches || []).map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
        </select>
      </Field>
      <Field label="الموقع (داخل القسم)">
        <input
          className="input" list="item-location-suggestions"
          value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}
          placeholder="مثال: الرف الأول"
        />
        <datalist id="item-location-suggestions">
          {suggestedLocations.map((loc) => <option key={loc} value={loc} />)}
        </datalist>
      </Field>
      <Field label="نوع الصنف">
        <label className="checkbox-row">
          <input
            type="checkbox"
            checked={!!form.isContainer}
            onChange={(e) => setForm({ ...form, isContainer: e.target.checked, parentCode: e.target.checked ? "" : form.parentCode })}
          />
          <span>📦 هذا الصنف صندوق/حاوية يحتوي منتجات أخرى بداخله</span>
        </label>
      </Field>
      {!form.isContainer && (
        <Field label="داخل صندوق (اختياري)">
          <select className="input" value={form.parentCode || ""} onChange={(e) => setForm({ ...form, parentCode: e.target.value })}>
            <option value="">بدون — غير موضوع داخل صندوق</option>
            {containerOptions.map((c) => <option key={c.code} value={c.code}>{c.emoji ? `${c.emoji} ` : ""}{c.name}</option>)}
          </select>
        </Field>
      )}
      <Field label="ملاحظات">
        <input className="input" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} placeholder="اختياري" />
      </Field>
      <Field label={mode === "add" ? "الكمية الابتدائية (اختياري)" : "الكمية الحالية"}>
        <input
          type="number" lang="en" min="0" step="1" className="input mono"
          value={form.initialQty ?? ""} onChange={(e) => setForm({ ...form, initialQty: e.target.value })}
          placeholder="1"
        />
        {mode === "edit" && (
          <div className="field-hint">تغيير الرقم هنا يسجّل حركة دخول/خروج تلقائية لتعديل الرصيد للقيمة الجديدة</div>
        )}
      </Field>
      <Field label={`حد التنبيه الأدنى (اختياري، افتراضي ${LOW_STOCK_THRESHOLD})`}>
        <input
          type="number" lang="en" min="0" step="0.5" className="input mono"
          value={form.minQty ?? ""} onChange={(e) => setForm({ ...form, minQty: e.target.value })}
          placeholder={String(LOW_STOCK_THRESHOLD)}
        />
      </Field>
      <Field label="تاريخ الصلاحية (اختياري)">
        <input
          type="date" lang="en" className="input mono"
          value={form.expiryDate ?? ""} onChange={(e) => setForm({ ...form, expiryDate: e.target.value })}
        />
      </Field>
      <div className="modal-actions">
        <button className="btn-ghost" onClick={onCancel}>إلغاء</button>
        <button className="btn-primary" onClick={() => onSave(form)}><Check size={15} /> حفظ</button>
      </div>
    </div>
    {cameraOpen && <BarcodeCameraModal onDetect={handleCameraDetect} onClose={() => setCameraOpen(false)} />}
    </>
  );
}

/* ------------------------------------------------------------------ */
/*  الأنشطة المؤقتة                                                    */
/*  نشاط مؤقت (مثل رحلة أو مناسبة) يمكن إخراج أغراض من المخزون له،     */
/*  وإرجاعها كلها دفعة واحدة عند انتهاء النشاط بضغطة زر واحدة بدل ما    */
/*  يرجّع كل غرض لوحده يدوياً. الإخراج والإرجاع يستخدمان نفس سجلّات     */
/*  الداخل/الخارج المعتادة، فتنعكس تلقائياً على رصيد المخزون.           */
/* ------------------------------------------------------------------ */
function ActivitiesPage({ data, setData, notify, readOnly, inventory }) {
  const activities = data.activities || [];
  const [createOpen, setCreateOpen] = useState(false);
  const [newActivity, setNewActivity] = useState({ name: "", notes: "" });
  const [openId, setOpenId] = useState(null);
  const [addForm, setAddForm] = useState({ code: "", qty: "" });
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmReturn, setConfirmReturn] = useState(null);

  const openActivities = activities.filter((a) => a.status !== "closed");
  const closedActivities = activities.filter((a) => a.status === "closed");

  const balanceFor = (code) => inventory?.find((i) => i.code === code)?.balance ?? 0;

  const createActivity = () => {
    if (!newActivity.name.trim()) {
      notify("اسم النشاط مطلوب", "error");
      return;
    }
    const act = {
      id: genId("act"),
      name: newActivity.name.trim(),
      notes: newActivity.notes.trim(),
      createdAt: todayISO(),
      status: "open",
      items: [],
    };
    setData({ ...data, activities: [act, ...activities] });
    setCreateOpen(false);
    setNewActivity({ name: "", notes: "" });
    setOpenId(act.id);
    notify("تم إنشاء النشاط");
  };

  const deleteActivity = (id) => {
    setData({ ...data, activities: activities.filter((a) => a.id !== id) });
    if (openId === id) setOpenId(null);
    setConfirmDelete(null);
    notify("تم حذف النشاط");
  };

  const addItemToActivity = (activity) => {
    const code = addForm.code.trim();
    const qty = Number(addForm.qty);
    const item = data.items.find((i) => i.code === code);
    if (!item) {
      notify("لم يتم العثور على صنف بهذا الكود", "error");
      return;
    }
    if (!qty || qty <= 0) {
      notify("أدخل كمية صحيحة أكبر من صفر", "error");
      return;
    }
    const bal = balanceFor(item.code);
    if (qty > bal) {
      notify(`الكمية المتوفرة فعلياً ${bal} فقط`, "error");
      return;
    }
    const outEntry = {
      id: genId("out"),
      code: item.code,
      name: item.name,
      date: todayISO(),
      qty,
      notes: `نشاط مؤقت: ${activity.name}`,
      activityId: activity.id,
    };
    const existingIdx = activity.items.findIndex((it) => it.code === item.code);
    let newItems;
    if (existingIdx >= 0) {
      newItems = activity.items.map((it, i) =>
        i === existingIdx ? { ...it, qty: Math.round((it.qty + qty) * 100) / 100 } : it
      );
    } else {
      newItems = [...activity.items, { code: item.code, name: item.name, qty }];
    }
    const newActivities = activities.map((a) => (a.id === activity.id ? { ...a, items: newItems } : a));
    setData({ ...data, activities: newActivities, outgoing: [outEntry, ...data.outgoing] });
    setAddForm({ code: "", qty: "" });
    notify(`تمت إضافة ${qty} من «${item.name}» للنشاط`);
  };

  const returnOneItem = (activity, it) => {
    const inEntry = {
      id: genId("in"),
      code: it.code,
      name: it.name,
      date: todayISO(),
      qty: it.qty,
      notes: `إرجاع من نشاط مؤقت: ${activity.name}`,
      activityId: activity.id,
    };
    const newItems = activity.items.filter((x) => x.code !== it.code);
    const newActivities = activities.map((a) => (a.id === activity.id ? { ...a, items: newItems } : a));
    setData({ ...data, activities: newActivities, incoming: [inEntry, ...data.incoming] });
    notify(`تم إرجاع «${it.name}» للمخزون`);
  };

  const returnAll = (activity) => {
    if (!activity.items.length) {
      notify("لا توجد أغراض بهذا النشاط لإرجاعها", "error");
      return;
    }
    const inEntries = activity.items.map((it) => ({
      id: genId("in"),
      code: it.code,
      name: it.name,
      date: todayISO(),
      qty: it.qty,
      notes: `إرجاع من نشاط مؤقت: ${activity.name}`,
      activityId: activity.id,
    }));
    const newActivities = activities.map((a) =>
      a.id === activity.id ? { ...a, items: [], status: "closed", closedAt: todayISO() } : a
    );
    setData({ ...data, activities: newActivities, incoming: [...inEntries, ...data.incoming] });
    setConfirmReturn(null);
    notify("تم إرجاع كل أغراض النشاط للمخزون");
  };

  return (
    <div className="page">
      <PageHeader
        eyebrow="المخزون"
        title="الأنشطة المؤقتة"
        subtitle="أخرج أغراضاً لنشاط مثل رحلة أو مناسبة، وأرجعها كلها دفعة واحدة عند الانتهاء"
        action={
          !readOnly && (
            <button className="btn-primary" onClick={() => setCreateOpen(true)}>
              <Plus size={16} /> نشاط جديد
            </button>
          )
        }
      />

      {activities.length === 0 ? (
        <EmptyState icon={Briefcase} title="لا توجد أنشطة بعد" hint="أنشئ نشاطاً مثل «رحلة البحر» وابدأ بإضافة الأغراض له" />
      ) : (
        <>
          <div className="activity-list">
            {openActivities.map((a) => {
              const isOpen = openId === a.id;
              return (
                <div className="panel activity-card" key={a.id}>
                  <div className="activity-card-head" onClick={() => setOpenId(isOpen ? null : a.id)}>
                    <div>
                      <div className="cell-strong">{a.name}</div>
                      <div className="cell-muted" style={{ fontSize: 12 }}>
                        {a.items.length} صنفاً بالنشاط · {a.createdAt}
                        {a.notes ? ` · ${a.notes}` : ""}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      {!readOnly && (
                        <button
                          className="btn-ghost"
                          onClick={(e) => { e.stopPropagation(); setConfirmDelete(a); }}
                        >
                          <Trash2 size={14} />
                        </button>
                      )}
                      <ChevronDown size={16} style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
                    </div>
                  </div>

                  {isOpen && (
                    <div className="activity-card-body">
                      {a.items.length === 0 ? (
                        <div className="cell-muted" style={{ fontSize: 12.5, padding: "6px 0" }}>لا توجد أغراض مضافة لهذا النشاط بعد</div>
                      ) : (
                        <div className="table-wrap">
                          <table className="ledger-table">
                            <thead>
                              <tr>
                                <th>الصنف</th>
                                <th>الكود</th>
                                <th>الكمية</th>
                                {!readOnly && <th></th>}
                              </tr>
                            </thead>
                            <tbody>
                              {a.items.map((it) => (
                                <tr key={it.code}>
                                  <td className="cell-strong">{it.name}</td>
                                  <td><CodeTag code={it.code} /></td>
                                  <td className="cell-mono">{it.qty}</td>
                                  {!readOnly && (
                                    <td>
                                      <button className="btn-ghost" onClick={() => returnOneItem(a, it)}>
                                        <Undo2 size={13} /> إرجاع
                                      </button>
                                    </td>
                                  )}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}

                      {!readOnly && (
                        <div className="activity-add-row">
                          <select
                            className="input"
                            value={addForm.code}
                            onChange={(e) => setAddForm({ ...addForm, code: e.target.value })}
                          >
                            <option value="">اختر صنفاً لإضافته…</option>
                            {data.items.map((it) => (
                              <option key={it.code} value={it.code}>
                                {it.emoji ? `${it.emoji} ` : ""}{it.name} — متوفر {balanceFor(it.code)}
                              </option>
                            ))}
                          </select>
                          <input
                            type="number" lang="en" min="0" step="0.5" className="input mono" style={{ maxWidth: 100 }}
                            placeholder="الكمية"
                            value={addForm.qty}
                            onChange={(e) => setAddForm({ ...addForm, qty: e.target.value })}
                          />
                          <button className="btn-ghost" onClick={() => addItemToActivity(a)}>
                            <Plus size={14} /> إضافة للنشاط
                          </button>
                        </div>
                      )}

                      {!readOnly && a.items.length > 0 && (
                        <div className="form-actions" style={{ marginTop: 10 }}>
                          <button className="btn-primary" onClick={() => setConfirmReturn(a)}>
                            <Undo2 size={15} /> إرجاع كل أغراض النشاط
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {closedActivities.length > 0 && (
            <div className="panel" style={{ marginTop: 16 }}>
              <div className="cat-list-title" style={{ marginBottom: 8 }}>أنشطة منتهية (تم إرجاعها)</div>
              <div className="table-wrap">
                <table className="ledger-table">
                  <thead>
                    <tr>
                      <th>النشاط</th>
                      <th>تاريخ الإنشاء</th>
                      <th>تاريخ الإرجاع</th>
                      {!readOnly && <th></th>}
                    </tr>
                  </thead>
                  <tbody>
                    {closedActivities.map((a) => (
                      <tr key={a.id}>
                        <td className="cell-strong">{a.name}</td>
                        <td className="cell-muted">{a.createdAt}</td>
                        <td className="cell-muted">{a.closedAt || "—"}</td>
                        {!readOnly && (
                          <td>
                            <button className="btn-ghost" onClick={() => setConfirmDelete(a)}>
                              <Trash2 size={13} />
                            </button>
                          </td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </>
      )}

      {createOpen && (
        <Modal title="نشاط مؤقت جديد" onClose={() => setCreateOpen(false)}>
          <div className="form-grid">
            <Field label="اسم النشاط">
              <input
                className="input" autoFocus
                value={newActivity.name}
                onChange={(e) => setNewActivity({ ...newActivity, name: e.target.value })}
                placeholder="مثال: رحلة البحر"
              />
            </Field>
            <Field label="ملاحظات (اختياري)">
              <input
                className="input"
                value={newActivity.notes}
                onChange={(e) => setNewActivity({ ...newActivity, notes: e.target.value })}
                placeholder="اختياري"
              />
            </Field>
            <div className="modal-actions">
              <button className="btn-ghost" onClick={() => setCreateOpen(false)}>إلغاء</button>
              <button className="btn-primary" onClick={createActivity}><Check size={15} /> إنشاء</button>
            </div>
          </div>
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="تأكيد الحذف" onClose={() => setConfirmDelete(null)}>
          <p className="confirm-text">
            هل أنت متأكد من حذف نشاط «{confirmDelete.name}»؟
            {confirmDelete.items && confirmDelete.items.length > 0
              ? " ملاحظة: يوجد أغراض غير مُرجَعة بعد بهذا النشاط، حذفه لن يرجّعها للمخزون تلقائياً."
              : ""}
          </p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmDelete(null)}>إلغاء</button>
            <button className="btn-danger" onClick={() => deleteActivity(confirmDelete.id)}><Trash2 size={15} /> حذف</button>
          </div>
        </Modal>
      )}

      {confirmReturn && (
        <Modal title="تأكيد الإرجاع" onClose={() => setConfirmReturn(null)}>
          <p className="confirm-text">
            هل تريد إرجاع كل أغراض نشاط «{confirmReturn.name}» ({confirmReturn.items.length} صنفاً) إلى المخزون؟
          </p>
          <div className="modal-actions">
            <button className="btn-ghost" onClick={() => setConfirmReturn(null)}>إلغاء</button>
            <button className="btn-primary" onClick={() => returnAll(confirmReturn)}><Undo2 size={15} /> إرجاع الكل</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  STOCK IN / STOCK OUT PAGES                                        */
/*  صفحتان منفصلتان (تسجيل الداخل / تسجيل الخارج) مبنيتان فوق مكوّن    */
/*  مشترك واحد (kind: "in" | "out") لتفادي تكرار نفس المنطق، مع أن كل  */
/*  صفحة مستقلة تماماً في التنقل (تبويب خاص بها بالقائمة الجانبية).    */
/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/*  QUICK ADD/MOVE MODAL — من صفحتي تسجيل الداخل/الخارج مباشرة        */
/*  زر "إضافة غرض" (داخل) يفتح نموذجاً مطابقاً لنموذج "إضافة غرض" في   */
/*  صفحة الأغراض، مع حقل كمية إضافي: لو الكود جديد كلياً يضيف الصنف    */
/*  للنظام ويسجّل كميته الأولى دفعة واحدة، ولو الكود ممسوح لصنف موجود  */
/*  مسبقاً يكتفي بعرض بياناته ويطلب الكمية فقط. زر "إخراج غرض" (خارج)  */
/*  نفس الفكرة لكن للأصناف الموجودة فقط (لا يمكن إخراج صنف غير مسجل).  */
/* ------------------------------------------------------------------ */

function AddOrMoveItemModal({ kind, data, setData, notify, inventory, onClose }) {
  const isOut = kind === "out";
  const dataKey = isOut ? "outgoing" : "incoming";

  const [form, setForm] = useState({
    code: "", name: "", category: "", notes: "", minQty: "", expiryDate: "",
    emoji: "", group: "", branch: "", qty: "",
  });
  const [codeTouched, setCodeTouched] = useState(false);
  const [cameraOpen, setCameraOpen] = useState(false);
  const codeRef = React.useRef(null);
  const qtyRef = React.useRef(null);

  useEffect(() => { codeRef.current?.focus(); }, []);

  const matchedItem = React.useMemo(
    () => data.items.find((it) => it.code === form.code.trim()),
    [data.items, form.code]
  );

  // كود مسجّل بقائمة الباركودات (صفحة "الباركودات") لكن ما له صنف فعلي
  // بالمخزون بعد — نستخدمه لتعبئة اسم المنتج تلقائياً بدل ما يكتبه المستخدم
  const matchedBarcode = React.useMemo(
    () => !matchedItem && (data.barcodes || []).find((b) => b.number === form.code.trim()),
    [data.barcodes, form.code, matchedItem]
  );

  const balance = React.useMemo(() => {
    if (!matchedItem) return null;
    return inventory?.find((i) => i.code === matchedItem.code)?.balance ?? 0;
  }, [inventory, matchedItem]);

  const applyScanned = (code) => {
    const item = data.items.find((it) => it.code === code);
    if (item) {
      // كود لصنف موجود مسبقاً: نعبّئ بياناته للعرض فقط وننتقل مباشرة لحقل الكمية
      setForm((f) => ({
        ...f, code, name: item.name, category: item.category || "", notes: "",
        emoji: item.emoji || "", group: item.group || "", branch: item.branch || "",
        minQty: item.minQty ?? "", expiryDate: item.expiryDate ?? "",
      }));
      setTimeout(() => qtyRef.current?.focus(), 0);
    } else {
      // صنف جديد كلياً — لو كوده مسجّل مسبقاً بقائمة الباركودات نعبّي اسمه منها تلقائياً
      const b = (data.barcodes || []).find((x) => x.number === code);
      setForm((f) => ({ ...f, code, name: b ? b.name : "" }));
    }
    setCodeTouched(true);
  };

  const handleCodeKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      applyScanned(form.code.trim());
    }
  };

  const handleCameraDetect = (value) => {
    setCameraOpen(false);
    applyScanned(value.trim());
  };

  const pickGroup = (groupId) => {
    const g = (data.itemGroups || []).find((x) => x.id === groupId);
    const suggested = !form.emoji && g ? suggestEmojiForGroup(g.name) : form.emoji;
    setForm((f) => ({ ...f, group: groupId, emoji: suggested }));
  };

  const qty = Number(form.qty);
  const qtyInvalid = !form.qty || !(qty > 0);
  const isNewItem = codeTouched && form.code.trim() && !matchedItem;
  const insufficient = isOut && matchedItem && !qtyInvalid && balance !== null && qty > balance;

  const save = () => {
    const code = form.code.trim();
    if (!code) {
      notify("امسح الكود أو اكتبه أولاً", "error");
      return;
    }
    if (isOut && !matchedItem) {
      notify("هذا الغرض غير مسجّل — لا يمكن إخراج كمية من صنف غير موجود", "error");
      return;
    }
    if (!matchedItem && !form.name.trim()) {
      notify("اسم المنتج مطلوب للصنف الجديد", "error");
      return;
    }
    if (qtyInvalid) {
      notify("أدخل كمية صحيحة أكبر من صفر", "error");
      return;
    }
    if (insufficient) {
      notify(`الكمية غير كافية — لا يوجد سوى ${balance} متاح فقط`, "error");
      return;
    }

    let items = data.items;
    let itemRef = matchedItem;
    if (!matchedItem) {
      itemRef = {
        code, name: form.name.trim(), category: form.category, notes: form.notes,
        minQty: form.minQty, expiryDate: form.expiryDate, emoji: form.emoji,
        group: form.group, branch: form.branch,
      };
      items = [...data.items, itemRef];
    }

    const entry = {
      id: (isOut ? "out" : "in") + "-" + Date.now(),
      code: itemRef.code, name: itemRef.name, date: todayISO(), qty,
      notes: matchedItem ? "" : "إضافة صنف جديد مع رصيد أولي",
    };

    setData({ ...data, items, [dataKey]: [entry, ...(data[dataKey] || [])] });
    notify(
      !matchedItem
        ? `تمت إضافة «${itemRef.name}» وتسجيل ${qty} كرصيد أولي`
        : isOut
          ? `تم تسجيل خروج ${qty} من «${itemRef.name}»`
          : `تم تسجيل دخول ${qty} من «${itemRef.name}»`
    );
    onClose();
  };

  return (
    <>
    <Modal title={isOut ? "إخراج غرض" : "إضافة غرض"} onClose={onClose}>
      <div className="form-grid">
        <Field label={<span className="scan-label"><ScanLine size={13} /> الكود (الباركود) <span className="scan-hint">جاهز للمسح</span></span>}>
          <div className="scan-input-row">
            <input
              ref={codeRef}
              className="input mono scan-input"
              value={form.code}
              onChange={(e) => { setForm((f) => ({ ...f, code: e.target.value })); setCodeTouched(false); }}
              onKeyDown={handleCodeKeyDown}
              onBlur={() => applyScanned(form.code.trim())}
              placeholder="امسح الباركود أو اكتب الكود يدوياً"
              autoComplete="off"
            />
            <ScanCameraButton onClick={() => setCameraOpen(true)} />
          </div>
          {matchedBarcode && (
            <div className="barcode-match-hint">
              <Barcode size={12} /> تم التعرف عليه من قائمة الباركودات: «{matchedBarcode.name}»
            </div>
          )}
        </Field>

        {isOut && codeTouched && form.code.trim() && !matchedItem && (
          <div className="alert alert-error">
            <AlertTriangle size={15} /> هذا الغرض غير مسجّل — أضفه أولاً من صفحة "قائمة الأغراض"
          </div>
        )}

        {matchedItem ? (
          <>
            <Field label="اسم المنتج">
              <input className="input" value={form.name} disabled />
            </Field>
            {isOut && balance !== null && (
              <div className="alert alert-info">
                <Boxes size={15} /> المتوفر حالياً من «{matchedItem.name}»: {balance}
              </div>
            )}
          </>
        ) : (
          codeTouched && form.code.trim() && !isOut && (
            <>
              <Field label="اسم المنتج">
                <input className="input" value={form.name} onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} placeholder="اسم الصنف" />
              </Field>
              <Field label="أيقونة الصنف (اختياري)">
                <EmojiPicker value={form.emoji} onChange={(em) => setForm((f) => ({ ...f, emoji: em }))} />
              </Field>
              <Field label="المجموعة (نوع الصنف)">
                <select className="input" value={form.group || ""} onChange={(e) => pickGroup(e.target.value)}>
                  <option value="">بدون مجموعة</option>
                  {(data.itemGroups || []).map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
                </select>
              </Field>
              <Field label="الموقع / الفئة">
                <input className="input" value={form.category} onChange={(e) => setForm((f) => ({ ...f, category: e.target.value }))} placeholder="مثال: الدولاب البني 1" />
              </Field>
              <Field label="القسم">
                <select className="input" value={form.branch || ""} onChange={(e) => setForm((f) => ({ ...f, branch: e.target.value }))}>
                  <option value="">بدون قسم محدد</option>
                  {(data.branches || []).map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
                </select>
              </Field>
              <Field label={`حد التنبيه الأدنى (اختياري، افتراضي ${LOW_STOCK_THRESHOLD})`}>
                <input
                  type="number" lang="en" min="0" step="0.5" className="input mono"
                  value={form.minQty ?? ""} onChange={(e) => setForm((f) => ({ ...f, minQty: e.target.value }))}
                  placeholder={String(LOW_STOCK_THRESHOLD)}
                />
              </Field>
              <Field label="تاريخ الصلاحية (اختياري)">
                <input
                  type="date" lang="en" className="input mono"
                  value={form.expiryDate ?? ""} onChange={(e) => setForm((f) => ({ ...f, expiryDate: e.target.value }))}
                />
              </Field>
            </>
          )
        )}

        <Field label={isOut ? "الكمية المراد إخراجها" : "الكمية"}>
          <input
            ref={qtyRef}
            type="number" lang="en" min="0" step="0.5" className="input mono"
            value={form.qty}
            onChange={(e) => setForm((f) => ({ ...f, qty: e.target.value }))}
            placeholder="0"
          />
        </Field>

        {!matchedItem && !isOut && codeTouched && form.code.trim() && (
          <Field label="ملاحظات">
            <input className="input" value={form.notes} onChange={(e) => setForm((f) => ({ ...f, notes: e.target.value }))} placeholder="اختياري" />
          </Field>
        )}

        {insufficient && (
          <div className="alert alert-error">
            <AlertTriangle size={15} /> الكمية غير كافية — لا يوجد سوى {balance} متاح فقط
          </div>
        )}

        <div className="modal-actions">
          <button className="btn-ghost" onClick={onClose}>إلغاء</button>
          <button className="btn-primary" onClick={save}>
            <Check size={15} /> {isNewItem ? "إضافة وتسجيل الرصيد" : isOut ? "تسجيل الخروج" : "تسجيل الدخول"}
          </button>
        </div>
      </div>
    </Modal>
    {cameraOpen && <BarcodeCameraModal onDetect={handleCameraDetect} onClose={() => setCameraOpen(false)} />}
    </>
  );
}

function StockMovementPage({ kind, data, setData, notify, readOnly, inventory }) {
  const isOut = kind === "out";
  const dataKey = isOut ? "outgoing" : "incoming";
  const log = data[dataKey] || [];

  const emptyForm = () => ({ code: "", name: "", date: todayISO(), qty: "", notes: "" });
  const [form, setForm] = useState(emptyForm());
  const [codeTouched, setCodeTouched] = useState(false); // صار عندنا محاولة بحث فعلية (Enter/كاميرا/اختيار من القائمة)
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [cameraOpen, setCameraOpen] = useState(false);
  const [quickModalOpen, setQuickModalOpen] = useState(false);

  const codeRef = React.useRef(null);
  const qtyRef = React.useRef(null);

  // نبقي حقل الكود جاهزاً للمسح فور فتح الصفحة، دون الحاجة لضغطة ماوس أولى
  useEffect(() => { codeRef.current?.focus(); }, []);

  const matchedItem = React.useMemo(
    () => data.items.find((it) => it.code === form.code.trim()),
    [data.items, form.code]
  );

  const balance = React.useMemo(() => {
    if (!matchedItem) return null;
    return inventory?.find((i) => i.code === matchedItem.code)?.balance ?? 0;
  }, [inventory, matchedItem]);

  const suggestions = React.useMemo(() => {
    const q = form.code.trim();
    if (!q || matchedItem) return [];
    return data.items.filter((it) => fuzzyIncludes(it.name + it.code, q)).slice(0, 6);
  }, [data.items, form.code, matchedItem]);

  // ---- دعم قارئ الباركود اليدوي (USB/بلوتوث) بشكل عام في الصفحة ----
  // القارئ الفعلي يعمل كلوحة مفاتيح: يكتب أرقام الكود بسرعة عالية جداً
  // (أسرع بكثير من الكتابة البشرية) ثم يرسل Enter تلقائياً. حقل الكود
  // نفسه يلتقط هذا مباشرة عبر onKeyDown بالأسفل طالما هو المُركَّز عليه —
  // وهذه الميزة موجودة وتبقى كما هي. هنا نضيف طبقة إضافية: لو المستخدم
  // (أو تركيز الصفحة) ليس داخل أي حقل إدخال حالياً — مثلاً بعد النقر في
  // مكان فارغ، أو التنقل بالجدول — نلتقط المسح من أي مكان في الصفحة
  // ونعبّئ به حقل الكود تلقائياً، دون أي تدخل في الكتابة اليدوية العادية
  // داخل بقية الحقول (لأننا لا نتدخل إطلاقاً إن كان أي حقل نشطاً بالفعل).
  useEffect(() => {
    if (readOnly) return;
    let buffer = "";
    let lastTime = 0;
    const RESET_GAP_MS = 400;

    const isFieldFocused = () => {
      const el = document.activeElement;
      return !!(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable));
    };

    const onGlobalKeyDown = (e) => {
      if (document.querySelector(".modal-overlay")) return; // نافذة (كالكاميرا) مفتوحة، خلّها تتكفّل
      if (isFieldFocused()) return; // فيه حقل نشط أصلاً — لا نتدخل حتى لا نكسر الكتابة العادية فيه
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      const now = Date.now();
      if (now - lastTime > RESET_GAP_MS) buffer = "";
      lastTime = now;

      if (e.key === "Enter") {
        const code = buffer.trim();
        buffer = "";
        if (code.length >= 3) {
          e.preventDefault();
          const item = data.items.find((it) => it.code === code);
          setForm((f) => ({ ...f, code, name: item ? item.name : "" }));
          setCodeTouched(true);
          setShowSuggestions(false);
          setTimeout(() => (item ? qtyRef.current : codeRef.current)?.focus(), 0);
        }
        return;
      }
      if (e.key.length === 1) buffer += e.key;
    };

    window.addEventListener("keydown", onGlobalKeyDown);
    return () => window.removeEventListener("keydown", onGlobalKeyDown);
  }, [readOnly, data.items]);

  const focusCode = () => setTimeout(() => codeRef.current?.focus(), 0);

  const applyMatch = (item) => {
    setForm((f) => ({ ...f, code: item.code, name: item.name }));
    setCodeTouched(true);
    setShowSuggestions(false);
    setTimeout(() => qtyRef.current?.focus(), 0);
  };

  const lookupCurrentCode = () => {
    setCodeTouched(true);
    const item = data.items.find((it) => it.code === form.code.trim());
    if (item) {
      setForm((f) => ({ ...f, name: item.name }));
      setShowSuggestions(false);
      setTimeout(() => qtyRef.current?.focus(), 0);
    } else {
      setForm((f) => ({ ...f, name: "" }));
    }
  };

  const handleCodeKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      lookupCurrentCode();
    }
  };

  const handleCameraDetect = (value) => {
    setCameraOpen(false);
    const code = value.trim();
    const item = data.items.find((it) => it.code === code);
    setForm((f) => ({ ...f, code, name: item ? item.name : "" }));
    setCodeTouched(true);
    setShowSuggestions(false);
    if (item) setTimeout(() => qtyRef.current?.focus(), 0);
  };

  const qty = Number(form.qty);
  const qtyInvalid = !form.qty || !(qty > 0);
  const codeMissing = codeTouched && form.code.trim() && !matchedItem;
  const insufficient = isOut && matchedItem && !qtyInvalid && balance !== null && qty > balance;

  const submit = () => {
    if (readOnly) return;
    setCodeTouched(true);
    if (!form.code.trim() || !matchedItem) {
      notify("هذا الكود غير مسجّل — أضفه أولاً من صفحة قائمة الأغراض", "error");
      return;
    }
    if (qtyInvalid) {
      notify("أدخل كمية صحيحة أكبر من صفر", "error");
      return;
    }
    if (isOut && balance !== null && qty > balance) {
      notify(`الكمية غير كافية — لا يوجد سوى ${balance} متاح فقط`, "error");
      return;
    }
    const entry = {
      id: (isOut ? "out" : "in") + "-" + Date.now(),
      code: matchedItem.code,
      name: matchedItem.name,
      date: form.date || todayISO(),
      qty,
      notes: form.notes || "",
    };
    setData({ ...data, [dataKey]: [entry, ...log] });
    notify(isOut ? `تم تسجيل خروج ${qty} من «${matchedItem.name}»` : `تم تسجيل دخول ${qty} من «${matchedItem.name}»`);
    setForm(emptyForm());
    setCodeTouched(false);
    setShowSuggestions(false);
    focusCode();
  };

  const handleQtyKeyDown = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submit();
    }
  };

  const sortedLog = React.useMemo(
    () => [...log].sort((a, b) => (b.date || "").localeCompare(a.date || "")),
    [log]
  );

  return (
    <div className="page">
      <PageHeader
        eyebrow="الحركة"
        title={isOut ? "تسجيل الخارج" : "تسجيل الداخل"}
        subtitle={isOut ? "امسح الكود أو اكتبه لتسجيل خروج بضاعة من المستودع" : "امسح الكود أو اكتبه لتسجيل دخول بضاعة جديدة للمستودع"}
        action={
          !readOnly && (
            <button className="btn-primary" onClick={() => setQuickModalOpen(true)}>
              <Plus size={16} /> {isOut ? "إخراج غرض" : "إضافة غرض"}
            </button>
          )
        }
      />

      {!readOnly && (
        <div className="panel" style={{ padding: 16 }}>
          <div className="form-grid-move">
            <Field label={<span className="scan-label"><ScanLine size={13} /> الكود (الباركود) <span className="scan-hint">جاهز للمسح</span></span>}>
              <div className="scan-input-row" style={{ position: "relative" }}>
                <input
                  ref={codeRef}
                  className="input mono scan-input"
                  value={form.code}
                  onChange={(e) => {
                    setForm((f) => ({ ...f, code: e.target.value, name: "" }));
                    setCodeTouched(false);
                    setShowSuggestions(true);
                  }}
                  onKeyDown={handleCodeKeyDown}
                  onFocus={() => setShowSuggestions(true)}
                  onBlur={() => { lookupCurrentCode(); setTimeout(() => setShowSuggestions(false), 150); }}
                  placeholder="امسح الباركود أو اكتب الكود يدوياً"
                  autoComplete="off"
                />
                <ScanCameraButton onClick={() => setCameraOpen(true)} />
                {showSuggestions && suggestions.length > 0 && (
                  <div className="global-results" style={{ position: "absolute", top: "calc(100% + 4px)", right: 0, left: 0, zIndex: 5 }}>
                    {suggestions.map((it) => (
                      <button key={it.code} className="global-result-item" onMouseDown={() => applyMatch(it)}>
                        <div>
                          <div className="cell-strong">{it.emoji ? `${it.emoji} ` : ""}{it.name}</div>
                          <CodeTag code={it.code} />
                        </div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </Field>
            <Field label="اسم المنتج">
              <input className="input" value={form.name} disabled placeholder="يُملأ تلقائياً بعد التعرف على الكود" />
            </Field>
            <Field label="التاريخ">
              <input
                type="date" lang="en" className="input mono"
                value={form.date} onChange={(e) => setForm((f) => ({ ...f, date: e.target.value }))}
              />
            </Field>
            <Field label="الكمية">
              <input
                ref={qtyRef}
                type="number" lang="en" min="0" step="0.5" className="input mono"
                value={form.qty}
                onChange={(e) => setForm((f) => ({ ...f, qty: e.target.value }))}
                onKeyDown={handleQtyKeyDown}
                placeholder="0"
              />
            </Field>
            <Field label="ملاحظات">
              <input
                className="input" value={form.notes}
                onChange={(e) => setForm((f) => ({ ...f, notes: e.target.value }))}
                placeholder="اختياري"
              />
            </Field>
          </div>

          {codeMissing && (
            <div className="alert alert-error">
              <AlertTriangle size={15} /> هذا الكود غير مسجّل — أضفه أولاً من صفحة "قائمة الأغراض"
            </div>
          )}
          {isOut && matchedItem && balance !== null && !insufficient && (
            <div className="alert alert-info">
              <Boxes size={15} /> المتوفر حالياً من «{matchedItem.name}»: {balance}
            </div>
          )}
          {insufficient && (
            <div className="alert alert-error">
              <AlertTriangle size={15} /> الكمية غير كافية — لا يوجد سوى {balance} متاح فقط
            </div>
          )}

          <div className="modal-actions" style={{ marginTop: 14 }}>
            <button className="btn-primary" onClick={submit}>
              {isOut ? <ArrowUpFromLine size={15} /> : <ArrowDownToLine size={15} />}
              {isOut ? " تسجيل الخروج" : " تسجيل الدخول"}
            </button>
          </div>
        </div>
      )}

      <div className="panel">
        {sortedLog.length === 0 ? (
          <EmptyState
            icon={isOut ? ArrowUpFromLine : ArrowDownToLine}
            title={isOut ? "لا توجد عمليات خروج مسجّلة" : "لا توجد عمليات دخول مسجّلة"}
          />
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <th>الكود</th>
                  <th>اسم المنتج</th>
                  <th>التاريخ</th>
                  <th>الكمية</th>
                  <th>ملاحظات</th>
                </tr>
              </thead>
              <tbody>
                {sortedLog.map((r) => (
                  <tr key={r.id}>
                    <td><CodeTag code={r.code} /></td>
                    <td className="cell-strong">{r.name}</td>
                    <td className="cell-muted">{r.date}</td>
                    <td className="cell-mono">{r.qty}</td>
                    <td className="cell-muted">{r.notes || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {cameraOpen && <BarcodeCameraModal onDetect={handleCameraDetect} onClose={() => setCameraOpen(false)} />}
      {quickModalOpen && (
        <AddOrMoveItemModal
          kind={kind}
          data={data}
          setData={setData}
          notify={notify}
          inventory={inventory}
          onClose={() => setQuickModalOpen(false)}
        />
      )}
    </div>
  );
}

function StockInPage(props) {
  return <StockMovementPage kind="in" {...props} />;
}

function StockOutPage(props) {
  return <StockMovementPage kind="out" {...props} />;
}

function InventoryPage({ inventory, itemGroups, branches, onPrint, currentUser, isOwner, focusCode, onFocusConsumed, hideLocationsPanel, hideLocationFilter, showBranchFilter, quickFilter }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [locationFilter, setLocationFilter] = useState("all");
  const [groupFilter, setGroupFilter] = useState("all");
  const [branchFilter, setBranchFilter] = useState("all");
  const [view, setView] = useSharedViewMode("grid"); // grid | list — البطاقات هي الوضع الافتراضي، ومحفوظ لكل الموقع
  const [sortKey, setSortKey] = useState("name");
  const [sortDir, setSortDir] = useState(1);
  const [searchCameraOpen, setSearchCameraOpen] = useState(false);
  const [boxView, setBoxView] = useState(null); // صنف "صندوق" نعرض محتوياته من صفحة المخزون — عرض فقط بدون تعديل/حذف

  // لما يوصل كود صنف من البحث العام: نصفّر كل الفلاتر حتى يضمن ظهور
  // الصنف، ثم نمرّر له ونميّزه لحظياً
  useEffect(() => {
    if (!focusCode) return;
    setQuery("");
    setStatusFilter("all");
    setLocationFilter("all");
    setGroupFilter("all");
    setBranchFilter("all");
    const t = setTimeout(() => {
      const el = document.getElementById(`inv-item-${focusCode}`);
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("inv-card-highlight");
        setTimeout(() => el.classList.remove("inv-card-highlight"), 2200);
      }
      onFocusConsumed && onFocusConsumed();
    }, 80);
    return () => clearTimeout(t);
  }, [focusCode]);

  // ضغطة على قسم/موقع بقائمة "الأقسام/المواقع" أعلى الشاشة (لدى الزوّار) —
  // تفلتر جدول المخزون تلقائياً وتنزل له
  useEffect(() => {
    if (!quickFilter) return;
    if (quickFilter.kind === "branch") {
      setBranchFilter(quickFilter.branchId || "all");
      setLocationFilter("all");
    } else if (quickFilter.kind === "location") {
      setLocationFilter(quickFilter.loc || "all");
      setBranchFilter(quickFilter.branchId || "all");
    }
    const el = document.getElementById("inventory-page-root");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }, [quickFilter]);

  const groupName = (id) => itemGroups.find((g) => g.id === id)?.name || "";
  const branchName = (id) => (branches || []).find((b) => b.id === id)?.name || "";
  const itemName = (code) => inventory.find((i) => i.code === code)?.name || "";

  // منظم مقيّد بقسم معيّن يشوف بس مخزون قسمه؛ رئيس الموقع يشوف كل شيء دائماً
  const myBranch = !isOwner && currentUser?.restrictedBranch;
  const scopedInventory = myBranch ? inventory.filter((i) => i.branch === myBranch) : inventory;

  // خانة "المواقع" بالفلاتر تعتمد على القسم المختار: لو اخترت قسم معيّن
  // تعرض مواقع هذا القسم فقط، ولو "كل الأقسام" تعرض كل المواقع بدون تمييز
  const locationsScope = branchFilter === "all" ? scopedInventory : scopedInventory.filter((i) => i.branch === branchFilter);

  const locations = useMemo(
    () => [...new Set(locationsScope.map((i) => i.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ar")),
    [locationsScope]
  );

  // لو الموقع المختار حالياً مو موجود بقائمة مواقع القسم الجديد (بعد تغيير
  // فلتر القسم)، نرجّع فلتر الموقع لـ"الكل" حتى ما تصير نتيجة فاضية بصمت
  useEffect(() => {
    if (locationFilter !== "all" && !locations.includes(locationFilter)) {
      setLocationFilter("all");
    }
  }, [branchFilter, locations]);

  // عدد الأصناف بكل موقع — لعرض "قائمة المواقع" بشكل واضح بدل قائمة منسدلة
  // مخفية فقط. المواقع هنا هي حقل "الموقع/الفئة" على كل صنف، وهي مفهوم
  // مختلف عن "الأقسام" الحقيقية (branches)، لذا نجمّعها أيضاً حسب القسم
  // الذي تنتمي له كل مجموعة مواقع — تماماً مثل "قسم المكتبة" وبداخله عدة
  // مواقع (الرف الأول، الرف الثاني...)
  const locationCounts = useMemo(() => {
    const m = {};
    scopedInventory.forEach((i) => { if (i.category) m[i.category] = (m[i.category] || 0) + 1; });
    return m;
  }, [scopedInventory]);

  const locationGroups = useMemo(() => {
    const byBranch = new Map(); // branchId ("" = بدون قسم) -> Map(location -> count)
    scopedInventory.forEach((i) => {
      if (!i.category) return;
      const bKey = i.branch || "";
      if (!byBranch.has(bKey)) byBranch.set(bKey, new Map());
      const inner = byBranch.get(bKey);
      inner.set(i.category, (inner.get(i.category) || 0) + 1);
    });
    const groups = [...byBranch.entries()].map(([bKey, inner]) => ({
      branchId: bKey,
      branchLabel: bKey ? (branchName(bKey) || bKey) : "بدون قسم",
      locations: [...inner.entries()]
        .map(([loc, count]) => ({ loc, count }))
        .sort((a, b) => a.loc.localeCompare(b.loc, "ar")),
    }));
    groups.sort((a, b) => {
      if (!a.branchId) return 1;
      if (!b.branchId) return -1;
      return a.branchLabel.localeCompare(b.branchLabel, "ar");
    });
    return groups;
  }, [scopedInventory, branches]);

  const filtered = scopedInventory
    .filter((i) => fuzzyIncludes(i.name + i.code + i.category, query))
    .filter((i) => statusFilter === "all" || i.status === statusFilter)
    .filter((i) => locationFilter === "all" || i.category === locationFilter)
    .filter((i) => groupFilter === "all" || i.group === groupFilter)
    .filter((i) => branchFilter === "all" || i.branch === branchFilter)
    .sort((a, b) => {
      if (sortKey === "daysLeft") {
        const va = a.daysLeft === null || a.daysLeft === undefined ? Infinity : a.daysLeft;
        const vb = b.daysLeft === null || b.daysLeft === undefined ? Infinity : b.daysLeft;
        return (va - vb) * sortDir;
      }
      const va = a[sortKey], vb = b[sortKey];
      if (typeof va === "number") return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb), "ar") * sortDir;
    });

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir((d) => -d);
    else { setSortKey(key); setSortDir(1); }
  };

  const SortHeader = ({ label, k }) => (
    <th onClick={() => toggleSort(k)} className="sortable">
      {label} {sortKey === k && <ChevronDown size={12} style={{ transform: sortDir === -1 ? "rotate(180deg)" : "none", display: "inline" }} />}
    </th>
  );

  // محتويات الصندوق المعروض حالياً — من inventory نفسه (عرض فقط، بدون
  // أي إمكانية تعديل أو حذف من هذه الصفحة)
  const boxContents = boxView ? inventory.filter((i) => i.parentCode === boxView.code) : [];

  return (
    <div className="page" id="inventory-page-root">
      <PageHeader eyebrow="الجرد" title="المخزون" />

      <div className="toolbar">
        <div className="search-box">
          <Search size={16} />
          <input placeholder="ابحث بالاسم أو الكود…" value={query} onChange={(e) => setQuery(e.target.value)} />
          <button type="button" className="search-cam-btn" title="بحث بالكاميرا" onClick={() => setSearchCameraOpen(true)}>
            <Camera size={15} />
          </button>
        </div>
        <div className="filter-chips">
          {[
            { k: "all", label: "الكل" },
            { k: "available", label: "متوفر" },
            { k: "low", label: "منخفض" },
            { k: "empty", label: "نفد" },
          ].map((f) => (
            <button key={f.k} className={`chip ${statusFilter === f.k ? "chip-active" : ""}`} onClick={() => setStatusFilter(f.k)}>
              {f.label}
            </button>
          ))}
        </div>
        {itemGroups.length > 0 && (
          <select className="input location-select" value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)}>
            <option value="all">كل المجموعات</option>
            {itemGroups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
        )}
        {!hideLocationFilter && locations.length > 0 && (
          <select className="input location-select" value={locationFilter} onChange={(e) => setLocationFilter(e.target.value)}>
            <option value="all">كل المواقع</option>
            {locations.map((loc) => <option key={loc} value={loc}>{loc}</option>)}
          </select>
        )}
        {(isOwner || showBranchFilter) && (branches || []).length > 0 && (
          <select className="input location-select" value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)}>
            <option value="all">كل الأقسام</option>
            {branches.map((b) => <option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        )}
        <div className="view-toggle">
          <button className={`chip ${view === "grid" ? "chip-active" : ""}`} onClick={() => setView("grid")}>بطاقات</button>
          <button className={`chip ${view === "list" ? "chip-active" : ""}`} onClick={() => setView("list")}>جدول</button>
        </div>
        <button
          className="btn-ghost"
          onClick={() => downloadCSV("المخزون.csv", filtered, ["code", "name", "category", "inQty", "outQty", "balance", "status"])}
        >
          <Download size={15} /> تصدير CSV
        </button>
        <button className="btn-ghost" onClick={() => (onPrint ? onPrint() : window.print())}>
          <Download size={15} /> طباعة / PDF
        </button>
      </div>

      {!hideLocationsPanel && locations.length > 0 && (
        <div className="panel cat-list-panel">
          <div className="cat-list-title"><MapPin size={14} /> قائمة المواقع</div>
          <div className="cat-list-row">
            <button
              className={`chip ${locationFilter === "all" ? "chip-active" : ""}`}
              onClick={() => setLocationFilter("all")}
            >
              كل المواقع <span className="cat-count">{scopedInventory.length}</span>
            </button>
          </div>
          {locationGroups.map((g) => (
            <div className="cat-branch-group" key={g.branchId || "none"}>
              <div className="cat-branch-label">{g.branchLabel}</div>
              <div className="cat-list-row">
                {g.locations.map(({ loc, count }) => (
                  <button
                    key={loc}
                    className={`chip ${locationFilter === loc ? "chip-active" : ""}`}
                    onClick={() => setLocationFilter((cur) => (cur === loc ? "all" : loc))}
                  >
                    {loc} <span className="cat-count">{count}</span>
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {searchCameraOpen && (
        <BarcodeCameraModal
          onClose={() => setSearchCameraOpen(false)}
          onDetect={(code) => { setQuery(code); setSearchCameraOpen(false); }}
        />
      )}

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon={Boxes} title="لا توجد نتائج" hint="جرّب تغيير الفلتر أو كلمة البحث" />
        ) : view === "grid" ? (
          <div className="inv-card-grid">
            {filtered.map((i) => (
              <div className={`inv-card ${getCardTheme(i, itemGroups) ? `inv-card-${getCardTheme(i, itemGroups)}` : ""}`} key={i.code} id={`inv-item-${i.code}`}>
                {i.image && <img className="inv-card-photo" src={i.image} alt={i.name} />}
                <div className="inv-card-head">
                  <span className="cell-strong">
                    {i.emoji ? `${i.emoji} ` : ""}{i.name}
                    {i.isContainer && <span className="box-badge">📦 صندوق</span>}
                    {i.parentCode && <span className="box-badge">↳ داخل: {itemName(i.parentCode) || "—"}</span>}
                  </span>
                  <StampBadge status={i.status} />
                </div>
                <CodeTag code={i.code} />
                <div className="inv-card-loc"><MapPin size={12} style={{ opacity: 0.55 }} /> {i.category || "—"}{groupName(i.group) ? ` · ${groupName(i.group)}` : ""}{branchName(i.branch) ? ` · ${branchName(i.branch)}` : ""}</div>
                {i.expiry && <ExpiryBadge expiry={i.expiry} daysLeft={i.daysLeft} />}
                <div className="inv-card-balance">{i.balance} <span className="inv-card-balance-unit">الكمية</span></div>
                {i.isContainer && (
                  <button type="button" className="btn-ghost inv-card-box-btn" onClick={() => setBoxView(i)}>
                    <Boxes size={15} /> عرض المحتويات
                  </button>
                )}
              </div>
            ))}
          </div>
        ) : (
          <div className="table-wrap">
            <table className="ledger-table">
              <thead>
                <tr>
                  <SortHeader label="الكود" k="code" />
                  <SortHeader label="اسم المنتج" k="name" />
                  <SortHeader label="الفئة / الموقع" k="category" />
                  <th>القسم</th>
                  <SortHeader label="الداخل" k="inQty" />
                  <SortHeader label="الخارج" k="outQty" />
                  <SortHeader label="الكمية" k="balance" />
                  <th>الحالة</th>
                  <SortHeader label="الصلاحية" k="daysLeft" />
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((i) => (
                  <tr key={i.code} id={`inv-item-${i.code}`}>
                    <td><CodeTag code={i.code} /></td>
                    <td className="cell-strong">
                      {i.image && <img className="row-thumb" src={i.image} alt={i.name} />}
                      {i.emoji ? `${i.emoji} ` : ""}{i.name}
                      {i.isContainer && <span className="box-badge">📦 صندوق</span>}
                      {i.parentCode && <span className="box-badge">↳ داخل: {itemName(i.parentCode) || "—"}</span>}
                    </td>
                    <td className="cell-muted">{i.category || "—"}</td>
                    <td className="cell-muted">{branchName(i.branch) || "—"}</td>
                    <td className="cell-mono">{i.inQty}</td>
                    <td className="cell-mono">{i.outQty}</td>
                    <td className="cell-mono cell-balance">{i.balance}</td>
                    <td><StampBadge status={i.status} /></td>
                    <td>{i.expiry ? <ExpiryBadge expiry={i.expiry} daysLeft={i.daysLeft} /> : "—"}</td>
                    <td>
                      {i.isContainer && (
                        <button type="button" className="icon-btn" title="عرض المحتويات" onClick={() => setBoxView(i)}>
                          <Boxes size={15} />
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {boxView && (
        <Modal
          title={`📦 محتويات «${boxView.name}» (عرض فقط)`}
          onClose={() => setBoxView(null)}
        >
          {boxContents.length === 0 ? (
            <EmptyState icon={Boxes} title="الصندوق فاضي" hint="ما فيه أي منتج مضاف داخل هذا الصندوق حتى الآن" />
          ) : (
            <div className="box-contents-list">
              {boxContents.map((c) => (
                <div className="box-contents-row" key={c.code}>
                  <div>
                    <div className="cell-strong">{c.emoji ? `${c.emoji} ` : ""}{c.name}</div>
                    <div className="cell-muted" style={{ fontSize: 12 }}>{c.code} · الرصيد: {c.balance}</div>
                  </div>
                  <StampBadge status={c.status} />
                </div>
              ))}
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

/*  BARCODES PAGE                                                      */
