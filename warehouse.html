/*  صفحة الجوال المستقلة: تفتح عبر رابط index.html?scanner=1          */
/* ------------------------------------------------------------------ */
function ScannerMobilePage({ initialCode }) {
  const [step, setStep] = useState("code"); // code | connecting | scanning | error
  const [code, setCode] = useState(initialCode || "");
  const [errorMsg, setErrorMsg] = useState("");
  const [lastSent, setLastSent] = useState(null);
  const [manualCode, setManualCode] = useState("");
  const scannerRef = React.useRef(null);
  const busyRef = React.useRef(false);
  const scanCounterRef = React.useRef(0);
  const lastValueRef = React.useRef("");
  const lastTimeRef = React.useRef(0);
  const regionId = "scanner-mobile-region";

  const loadHtml5Qrcode = () =>
    new Promise((resolve, reject) => {
      if (window.Html5Qrcode) return resolve();
      const existing = document.querySelector('script[data-html5-qrcode]');
      if (existing) {
        existing.addEventListener("load", () => resolve());
        existing.addEventListener("error", () => reject(new Error("load-failed")));
        return;
      }
      const s = document.createElement("script");
      s.src = "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js";
      s.async = true;
      s.setAttribute("data-html5-qrcode", "1");
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("load-failed"));
      document.head.appendChild(s);
    });

  const stopCamera = async () => {
    const inst = scannerRef.current;
    scannerRef.current = null;
    if (!inst) return;
    try { await inst.stop(); } catch {}
    try { await inst.clear(); } catch {}
  };

  const sendBarcode = async (value) => {
    const clean = String(value || "").trim();
    if (!clean) return;
    const now = Date.now();
    if (clean === lastValueRef.current && now - lastTimeRef.current < 1500) return; // منع تكرار نفس الكود بسرعة
    lastValueRef.current = clean;
    lastTimeRef.current = now;
    scanCounterRef.current += 1;

    try {
      await window.storage?.set(
        scannerSessionKey(code),
        JSON.stringify({
          code,
          status: "connected",
          lastBarcode: clean,
          scanId: scanCounterRef.current,
          lastScanAt: now,
        })
      );
      setLastSent(clean);
      hapticPulse("success");
      playBeep("success");
    } catch {
      hapticPulse("error");
    }
  };

  const startCamera = async () => {
    try {
      await loadHtml5Qrcode();
    } catch {
      setStep("camera-error");
      return;
    }
    try {
      const html5QrCode = new window.Html5Qrcode(regionId);
      scannerRef.current = html5QrCode;
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 260, height: 170 } },
        (decodedText) => { sendBarcode(decodedText); },
        () => {} // نتجاهل أخطاء عدم اكتشاف باركود بكل إطار — طبيعية جداً
      );
    } catch {
      setStep("camera-error");
    }
  };

  const connect = async (rawCode) => {
    const clean = String(rawCode || "").trim();
    if (clean.length !== 4) { setErrorMsg("أدخل رمزاً من 4 أرقام"); return; }
    setErrorMsg("");
    setStep("connecting");
    try {
      const res = await window.storage?.get(scannerSessionKey(clean));
      const parsed = res?.value ? JSON.parse(res.value) : null;
      if (!parsed || Date.now() - (parsed.createdAt || 0) > SCANNER_SESSION_TTL_MS) {
        setStep("code");
        setErrorMsg("الرمز غير صحيح أو انتهت صلاحية الجلسة — تأكد من الرمز الظاهر على اللابتوب");
        return;
      }
      setCode(clean);
      await window.storage?.set(
        scannerSessionKey(clean),
        JSON.stringify({ ...parsed, status: "connected", phoneConnectedAt: Date.now() })
      );
      setStep("scanning");
    } catch {
      setStep("code");
      setErrorMsg("تعذّر الاتصال — تأكد من اتصال الجوال بالإنترنت وحاول مجدداً");
    }
  };

  useEffect(() => {
    if (step === "scanning") startCamera();
    return () => { if (step !== "scanning") stopCamera(); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [step]);

  useEffect(() => () => stopCamera(), []);

  useEffect(() => {
    if (initialCode && initialCode.length === 4) connect(initialCode);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const disconnect = async () => {
    await stopCamera();
    setStep("code");
    setLastSent(null);
  };

  const submitManual = () => {
    const v = manualCode.trim();
    if (v) { sendBarcode(v); setManualCode(""); }
  };

  return (
    <div className="scanner-mobile-shell">
      <FontStyles />
      <style>{`
        .scanner-mobile-shell {
          min-height: 100vh; min-height: 100dvh; background: var(--navy); color: #F3EEDD;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          padding: 24px 18px; font-family: 'Tajawal', sans-serif; direction: rtl; text-align: center;
          gap: 16px; box-sizing: border-box;
        }
        .scanner-mobile-title { font-family: 'Almarai', sans-serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 8px; }
        .scanner-mobile-card { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
        .scanner-mobile-code-input {
          width: 100%; text-align: center; letter-spacing: 10px; font-size: 30px; font-family: 'JetBrains Mono', monospace;
          padding: 14px; border-radius: 12px; border: 2px solid #46586A; background: #1E2A33; color: #F3EEDD; box-sizing: border-box;
        }
        .scanner-mobile-code-input:focus { outline: none; border-color: #C9BA96; }
        .scanner-mobile-btn {
          width: 100%; padding: 14px; border-radius: 12px; border: none; background: #C9BA96; color: #23303A;
          font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .scanner-mobile-btn:active { transform: scale(0.98); }
        .scanner-mobile-error { color: #F3A79A; font-size: 13.5px; }
        .scanner-mobile-hint { font-size: 13px; color: #B7C2CB; }
        .scanner-mobile-video-wrap { width: 100%; max-width: 340px; border-radius: 16px; overflow: hidden; position: relative; background: #000; aspect-ratio: 1/1; }
        #${regionId} { width: 100%; height: 100%; }
        #${regionId} video { width: 100% !important; height: 100% !important; object-fit: cover; }
        .scanner-mobile-status { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
        .scanner-mobile-last { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 15px; direction: ltr; }
        .scanner-mobile-manual { display: flex; gap: 8px; width: 100%; max-width: 340px; }
        .scanner-mobile-manual input {
          flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #46586A; background: #1E2A33; color: #F3EEDD; font-size: 16px;
        }
        .scanner-mobile-disconnect { background: transparent; border: 1px solid #6B7A87; color: #F3EEDD; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; cursor: pointer; }
      `}</style>

      <div className="scanner-mobile-title"><Smartphone size={20} /> قارئ باركود لاسلكي</div>

      {step === "code" && (
        <div className="scanner-mobile-card">
          <p className="scanner-mobile-hint">أدخل الرمز المكوّن من 4 أرقام الظاهر على شاشة اللابتوب</p>
          <input
            className="scanner-mobile-code-input"
            inputMode="numeric"
            pattern="[0-9]*"
            maxLength={4}
            autoFocus
            placeholder="0000"
            value={code}
            onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
            onKeyDown={(e) => { if (e.key === "Enter") connect(code); }}
          />
          {errorMsg && <div className="scanner-mobile-error"><TriangleAlert size={13} style={{ verticalAlign: "-2px" }} /> {errorMsg}</div>}
          <button className="scanner-mobile-btn" onClick={() => connect(code)}><Wifi size={17} /> ربط بالجهاز</button>
        </div>
      )}

      {step === "connecting" && (
        <div className="scanner-mobile-card">
          <p className="scanner-mobile-hint">جاري الاتصال…</p>
        </div>
      )}

      {(step === "scanning" || step === "camera-error") && (
        <div className="scanner-mobile-card">
          <div className="scanner-mobile-status"><Wifi size={15} /> متصل بالكمبيوتر 🟢</div>

          {step === "scanning" && (
            <div className="scanner-mobile-video-wrap">
              <div id={regionId} />
            </div>
          )}

          {step === "camera-error" && (
            <div className="scanner-mobile-error">
              <TriangleAlert size={13} style={{ verticalAlign: "-2px" }} /> تعذّر تشغيل الكاميرا. تأكد من إعطاء إذن الكاميرا للمتصفح، أو استخدم الإدخال اليدوي بالأسفل.
            </div>
          )}

          {lastSent && (
            <div className="scanner-mobile-last"><ScanLine size={13} style={{ verticalAlign: "-2px" }} /> تم الإرسال: {lastSent}</div>
          )}

          <div className="scanner-mobile-manual">
            <input
              placeholder="أدخل الكود يدوياً عند تعذّر الكاميرا"
              value={manualCode}
              onChange={(e) => setManualCode(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") submitManual(); }}
            />
            <button className="icon-btn" style={{ color: "#F3EEDD" }} onClick={submitManual}><Check size={18} /></button>
          </div>

          <button className="scanner-mobile-disconnect" onClick={disconnect}>قطع الاتصال / رمز جديد</button>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  تصوير عبر الجوال (نفس فكرة ربط ماسح الباركود أعلاه بالضبط، لكن     */
/*  لالتقاط صورة بدل قراءة باركود): اللابتوب يولّد رمز جلسة من 4 أرقام */
/*  ويعرض باركود QR يفتح صفحة تصوير مستقلة على الجوال (index.html?    */
/*  photo=1&code=XXXX)، الجوال يلتقط الصورة ويكتبها بنفس وثيقة الجلسة  */
/*  في Supabase، واللابتوب يستمع لحظياً (window.subscribeStorage)      */
/*  ويرفق الصورة تلقائياً بحقل الصورة المفتوح — دون أي رفع/تنزيل يدوي. */
/* ------------------------------------------------------------------ */

const PHOTO_SESSION_PREFIX = "photo_session_";
const PHOTO_SESSION_TTL_MS = 2 * 60 * 60 * 1000; // ساعتان قبل أول اتصال من الجوال بالرمز

function genPhotoSessionCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

function photoSessionKey(code) {
  return PHOTO_SESSION_PREFIX + String(code || "").trim();
}

function photoMobileUrl(code, mode = "camera") {
  try {
    const url = new URL(window.location.href);
    url.hash = "";
    url.search = "";
    url.searchParams.set("photo", "1");
    url.searchParams.set("code", code);
    url.searchParams.set("mode", mode === "gallery" ? "gallery" : "camera");
    return url.toString();
  } catch {
    return "";
  }
}

/* جلسة ربط تصوير الجوال على مستوى الجلسة الكاملة للموقع (وليس على مستوى
   نافذة التصوير وحدها): بمجرد أن يمسح المستخدم الباركود ويتصل جواله مرة
   واحدة، يبقى الجوال مرتبطاً طوال استخدامه للموقع — فلا يحتاج لإعادة مسح
   الباركود مع كل صنف جديد يريد تصوير صورة له. تُخزَّن حالة الربط في متغيّر
   خارج React (module-level) حتى تبقى حيّة رغم إغلاق/إعادة فتح نافذة
   التصوير (unmount)، وتشترك أي نافذة مفتوحة بها عبر useSyncExternalStore. */
const photoPairing = {
  session: null, // { code, status, requestId, requestMode, photo, photoId, createdAt, phoneConnectedAt }
  unsub: null,
  subscribers: new Set(),
};

function photoPairingNotify() {
  photoPairing.subscribers.forEach((fn) => { try { fn(); } catch {} });
}

function photoPairingListen(code) {
  if (photoPairing.unsub) { try { photoPairing.unsub(); } catch {} photoPairing.unsub = null; }
  photoPairing.unsub = window.subscribeStorage
    ? window.subscribeStorage(photoSessionKey(code), (rawValue) => {
        let parsed;
        try { parsed = JSON.parse(rawValue); } catch { return; }
        if (!parsed) return;
        photoPairing.session = { ...(photoPairing.session || {}), ...parsed };
        photoPairingNotify();
      })
    : null;
}

async function photoPairingStart() {
  const code = genPhotoSessionCode();
  const value = {
    code, createdAt: Date.now(), status: "waiting",
    requestId: 1, requestMode: "camera", photo: null, photoId: 0, phoneConnectedAt: null,
  };
  photoPairing.session = value;
  photoPairingNotify();
  try { await window.storage?.set(photoSessionKey(code), JSON.stringify(value)); } catch {}
  photoPairingListen(code);
}

// تُستدعى عند فتح نافذة التصوير لأي صنف — لو الجوال متصل بالفعل بنفس رمز
// الجلسة، تكتفي بطلب صورة جديدة (رفع رقم الطلب) بنفس الرمز القائم بدل
// توليد باركود جديد، فيلتقطها الجوال تلقائياً بمجرد فتح النافذة دون أي
// إعادة مسح. لو لا توجد جلسة أصلاً تبدأ واحدة جديدة بباركود جديد.
async function photoPairingRequestCapture(mode) {
  const session = photoPairing.session;
  if (!session || !session.code) { await photoPairingStart(); return; }
  const value = {
    ...session,
    requestId: (session.requestId || 0) + 1,
    requestMode: mode,
    photo: null,
  };
  photoPairing.session = value;
  photoPairingNotify();
  try { await window.storage?.set(photoSessionKey(session.code), JSON.stringify(value)); } catch {}
}

async function photoPairingRegenerate() {
  const old = photoPairing.session?.code;
  if (photoPairing.unsub) { try { photoPairing.unsub(); } catch {} photoPairing.unsub = null; }
  if (old) { try { await window.storage?.delete(photoSessionKey(old)); } catch {} }
  photoPairing.session = null;
  photoPairingNotify();
  await photoPairingStart();
}

async function photoPairingDisconnect() {
  const old = photoPairing.session?.code;
  if (photoPairing.unsub) { try { photoPairing.unsub(); } catch {} photoPairing.unsub = null; }
  if (old) { try { await window.storage?.delete(photoSessionKey(old)); } catch {} }
  photoPairing.session = null;
  photoPairingNotify();
}

function usePhotoPairingSession() {
  return React.useSyncExternalStore(
    (cb) => { photoPairing.subscribers.add(cb); return () => photoPairing.subscribers.delete(cb); },
    () => photoPairing.session
  );
}

/* نافذة "تصوير عبر الجوال" / "رفع من الجوال" — تُفتح من زر داخل حقل الصورة
   (ImageUploadField) على اللابتوب: تولّد رمز جلسة، تعرض باركود QR، وتستلم
   الصورة تلقائياً فور التقاطها/اختيارها من الجوال دون أي تدخّل إضافي على
   اللابتوب. الوضع (mode) يحدد ما يفتحه الجوال تلقائياً فور الاتصال:
   "camera" يفتح الكاميرا مباشرة، و"gallery" يفتح معرض الصور مباشرة —
   في الحالتين بدون أي ضغطة إضافية على الجوال نفسه. */
function PhotoCapturePairing({ mode = "camera", onCapture, onClose }) {
  // تعتمد على جلسة الربط الدائمة (photoPairing) بدل إنشاء/حذف جلسة خاصة
  // بها — لو الجوال متصل من قبل تُستخدَم نفس الجلسة تلقائياً دون أي مسح
  // جديد للباركود، وتبقى الجلسة حيّة حتى بعد إغلاق هذه النافذة.
  const session = usePhotoPairingSession();
  const [copied, setCopied] = useState(false);
  const handledPhotoIdRef = React.useRef(session?.photoId || 0);
  const startedRef = React.useRef(false);

  useEffect(() => {
    handledPhotoIdRef.current = session?.photoId || 0;
    if (!startedRef.current) {
      startedRef.current = true;
      if (session?.code) photoPairingRequestCapture(mode);
      else photoPairingStart();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (!session) return;
    if (session.photo && session.photoId && session.photoId > handledPhotoIdRef.current) {
      handledPhotoIdRef.current = session.photoId;
      onCapture(session.photo);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [session]);

  const connected = session?.status === "connected";
  const link = session?.code ? photoMobileUrl(session.code, mode) : "";

  const copyLink = async () => {
    if (!link) return;
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch {}
  };

  const regenerate = async () => { await photoPairingRegenerate(); };
  const disconnectAll = async () => { await photoPairingDisconnect(); onClose(); };

  const isGallery = mode === "gallery";

  return (
    <Modal
      title={
        isGallery
          ? <><FolderOpen size={16} style={{ verticalAlign: "-2px", marginLeft: 6 }} /> رفع صورة من الجوال</>
          : <><Camera size={16} style={{ verticalAlign: "-2px", marginLeft: 6 }} /> تصوير عبر الجوال</>
      }
      onClose={onClose}
    >
      <div className="scanner-pair-body">
        <div className={`scanner-status ${connected ? "scanner-status-on" : "scanner-status-wait"}`}>
          {connected ? <><Wifi size={14} /> الجوال متصل — بانتظار الصورة… 🟢</> : <><WifiOff size={14} /> جاري الانتظار…</>}
        </div>

        {!connected && link && (
          <div className="scanner-qr-wrap">
            <img
              className="scanner-qr-img"
              alt="باركود فتح صفحة التصوير على الجوال"
              src={`https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(link)}`}
            />
          </div>
        )}

        <p className="scanner-hint">
          {connected
            ? "جوالك مرتبط بالفعل — ستفتح الكاميرا/المعرض على جوالك تلقائياً خلال ثوانٍ، وستُرفق الصورة هنا مباشرة. سيبقى الجوال مرتبطاً لبقية الجلسة، فلن تحتاج لإعادة مسح الباركود عند تصوير صور لأصناف أخرى."
            : isGallery
              ? "صوّر هذا الباركود بكاميرا جوالك (أو أي تطبيق قارئ QR) — سيفتح معرض صور جوالك مباشرة لاختيار صورة، وستُرفق هنا تلقائياً خلال ثوانٍ. وسيبقى جوالك مرتبطاً بعدها لبقية الجلسة دون الحاجة لإعادة المسح."
              : "صوّر هذا الباركود بكاميرا جوالك (أو أي تطبيق قارئ QR) — ستفتح كاميرا جوالك مباشرة للالتقاط، وستُرفق الصورة هنا تلقائياً خلال ثوانٍ. وسيبقى جوالك مرتبطاً بعدها لبقية الجلسة دون الحاجة لإعادة المسح."}
        </p>

        <details className="scanner-manual-fallback">
          <summary>الباركود ما اشتغل؟ افتح الرابط يدوياً</summary>
          <div className="scanner-code-display">{session?.code ? session.code.split("").join(" ") : "‑ ‑ ‑ ‑"}</div>
          <div className="scanner-link-row">
            <input className="input scanner-link-input mono" readOnly value={link} onFocus={(e) => e.target.select()} />
            <button type="button" className="icon-btn" title="نسخ الرابط" onClick={copyLink}>
              {copied ? <Check size={16} /> : <Copy size={16} />}
            </button>
          </div>
        </details>

        <div className="scanner-actions">
          {!connected && (
            <button type="button" className="btn-ghost" onClick={regenerate}><RefreshCw size={14} /> رمز جديد</button>
          )}
          {connected && (
            <button type="button" className="btn-ghost" onClick={disconnectAll}><WifiOff size={14} /> قطع الاتصال نهائياً</button>
          )}
          <button type="button" className="btn-danger" onClick={onClose}><X size={14} /> إغلاق</button>
        </div>
      </div>
    </Modal>
  );
}

/* ------------------------------------------------------------------ */
/*  صفحة الجوال المستقلة: تفتح عبر رابط index.html?photo=1&code=XXXX  */
/* ------------------------------------------------------------------ */
function PhotoCaptureMobilePage({ initialCode, initialMode }) {
  const [step, setStep] = useState("code"); // code | connecting | ready | sending | sent
  const [code, setCode] = useState(initialCode || "");
  const [errorMsg, setErrorMsg] = useState("");
  const [preview, setPreview] = useState("");
  const [sentCount, setSentCount] = useState(0);
  const [mode, setMode] = useState(initialMode === "gallery" ? "gallery" : "camera");
  const galleryRef = React.useRef(null);
  const cameraRef = React.useRef(null);
  const photoCounterRef = React.useRef(0);
  // يفتح الكاميرا (أو المعرض حسب الوضع) تلقائياً فور الاتصال، بدون أي
  // ضغطة إضافية من المستخدم على الجوال — يُعاد ضبطه مع كل طلب جديد
  const autoTriggeredRef = React.useRef(false);
  // يبقى مستمعاً لجلسة الربط طوال الوقت بعد الاتصال (وليس فقط لحظة الربط)
  // حتى يفتح الكاميرا/المعرض تلقائياً من جديد فور طلب اللابتوب صورة صنف
  // آخر — دون الحاجة لإعادة مسح الباركود مطلقاً طوال هذه الجلسة
  const lastRequestIdRef = React.useRef(0);
  const unsubRef = React.useRef(null);

  const stopListening = () => {
    if (unsubRef.current) { try { unsubRef.current(); } catch {} unsubRef.current = null; }
  };

  const listen = (clean) => {
    stopListening();
    unsubRef.current = window.subscribeStorage
      ? window.subscribeStorage(photoSessionKey(clean), (rawValue) => {
          let parsed;
          try { parsed = JSON.parse(rawValue); } catch { return; }
          if (!parsed) return;
          if (parsed.requestId && parsed.requestId > lastRequestIdRef.current) {
            lastRequestIdRef.current = parsed.requestId;
            setMode(parsed.requestMode === "gallery" ? "gallery" : "camera");
            setPreview("");
            setErrorMsg("");
            autoTriggeredRef.current = false;
            setStep("ready");
          }
        })
      : null;
  };

  const connect = async (rawCode) => {
    const clean = String(rawCode || "").trim();
    if (clean.length !== 4) { setErrorMsg("أدخل رمزاً من 4 أرقام"); return; }
    setErrorMsg("");
    setStep("connecting");
    try {
      const res = await window.storage?.get(photoSessionKey(clean));
      const parsed = res?.value ? JSON.parse(res.value) : null;
      if (!parsed || Date.now() - (parsed.createdAt || 0) > PHOTO_SESSION_TTL_MS) {
        setStep("code");
        setErrorMsg("الرمز غير صحيح أو انتهت صلاحية الجلسة — تأكد من الرمز الظاهر على اللابتوب");
        return;
      }
      setCode(clean);
      lastRequestIdRef.current = parsed.requestId || 0;
      setMode(parsed.requestMode === "gallery" ? "gallery" : "camera");
      await window.storage?.set(
        photoSessionKey(clean),
        JSON.stringify({ ...parsed, status: "connected", phoneConnectedAt: Date.now() })
      );
      listen(clean);
      setStep("ready");
    } catch {
      setStep("code");
      setErrorMsg("تعذّر الاتصال — تأكد من اتصال الجوال بالإنترنت وحاول مجدداً");
    }
  };

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // يسمح بالتقاط نفس الصورة مرة ثانية لاحقاً لو احتاج
    if (!file) return;
    setErrorMsg("");
    setStep("sending");
    try {
      const dataUrl = await fileToCompressedDataURL(file);
      setPreview(dataUrl);
      photoCounterRef.current += 1;
      await window.storage?.set(
        photoSessionKey(code),
        JSON.stringify({
          code, status: "connected",
          requestId: lastRequestIdRef.current, requestMode: mode,
          photo: dataUrl, photoId: photoCounterRef.current, lastSentAt: Date.now(),
        })
      );
      setSentCount((n) => n + 1);
      hapticPulse("success");
      playBeep("success");
      setStep("sent");
    } catch {
      hapticPulse("error");
      setErrorMsg("تعذّر إرسال الصورة، حاول مرة أخرى");
      setStep("ready");
    }
  };

  useEffect(() => {
    if (initialCode && initialCode.length === 4) connect(initialCode);
    return () => stopListening();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // فور الوصول لخطوة "جاهز" (متصل باللابتوب، أو وصل طلب صورة جديد لصنف
  // آخر) نفتح الكاميرا أو المعرض تلقائياً حسب الوضع المطلوب — دون انتظار
  // ضغطة من المستخدم
  useEffect(() => {
    if (step !== "ready" || autoTriggeredRef.current) return;
    autoTriggeredRef.current = true;
    const t = setTimeout(() => {
      if (mode === "gallery") galleryRef.current?.click();
      else cameraRef.current?.click();
    }, 200);
    return () => clearTimeout(t);
  }, [step, mode]);

  // قطع الاتصال نهائياً — ينهي جلسة الربط بالكامل ويحتاج المستخدم لمسح
  // باركود جديد بعدها؛ ما يحدث تلقائياً عند مجرد إغلاق صفحة الجوال أو
  // التنقل بين الأصناف على اللابتوب (تبقى الجلسة مرتبطة طوال ذلك)
  const disconnect = async () => {
    stopListening();
    if (code) { try { await window.storage?.delete(photoSessionKey(code)); } catch {} }
    setStep("code");
    setCode("");
    setPreview("");
    setSentCount(0);
    autoTriggeredRef.current = false;
  };

  return (
    <div className="scanner-mobile-shell">
      <FontStyles />
      <style>{`
        .photo-mobile-preview { width: 100%; max-width: 240px; border-radius: 14px; overflow: hidden; border: 2px solid #46586A; }
        .photo-mobile-preview img { width: 100%; display: block; }
        .photo-mobile-big-btn {
          width: 92px; height: 92px; border-radius: 50%; background: #C9BA96; color: #23303A;
          border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .photo-mobile-big-btn:disabled { opacity: 0.6; }
        .photo-mobile-big-btn:active { transform: scale(0.95); }
        .photo-mobile-gallery-btn {
          background: transparent; border: 1px solid #6B7A87; color: #F3EEDD; padding: 10px 16px;
          border-radius: 10px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
      `}</style>

      <div className="scanner-mobile-title">
        {mode === "gallery" ? <><FolderOpen size={20} /> رفع صورة من الجوال</> : <><Camera size={20} /> تصوير عبر الجوال</>}
      </div>

      {step === "code" && (
        <div className="scanner-mobile-card">
          <p className="scanner-mobile-hint">أدخل الرمز المكوّن من 4 أرقام الظاهر على شاشة اللابتوب</p>
          <input
            className="scanner-mobile-code-input"
            inputMode="numeric"
            pattern="[0-9]*"
            maxLength={4}
            autoFocus
            placeholder="0000"
            value={code}
            onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
            onKeyDown={(e) => { if (e.key === "Enter") connect(code); }}
          />
          {errorMsg && <div className="scanner-mobile-error"><TriangleAlert size={13} style={{ verticalAlign: "-2px" }} /> {errorMsg}</div>}
          <button className="scanner-mobile-btn" onClick={() => connect(code)}><Wifi size={17} /> ربط بالجهاز</button>
        </div>
      )}

      {step === "connecting" && (
        <div className="scanner-mobile-card">
          <p className="scanner-mobile-hint">جاري الاتصال…</p>
        </div>
      )}

      {(step === "ready" || step === "sending" || step === "sent") && (
        <div className="scanner-mobile-card">
          <div className="scanner-mobile-status"><Wifi size={15} /> متصل بالكمبيوتر 🟢</div>

          {preview && (
            <div className="photo-mobile-preview"><img src={preview} alt="آخر صورة أُرسلت" /></div>
          )}

          {step === "sent" && (
            <div className="scanner-mobile-last"><PackageCheck size={13} style={{ verticalAlign: "-2px" }} /> تم الإرسال إلى اللابتوب ✓ ({sentCount})</div>
          )}
          {errorMsg && <div className="scanner-mobile-error"><TriangleAlert size={13} style={{ verticalAlign: "-2px" }} /> {errorMsg}</div>}

          <button
            className="photo-mobile-big-btn"
            disabled={step === "sending"}
            onClick={() => (mode === "gallery" ? galleryRef.current?.click() : cameraRef.current?.click())}
            title={mode === "gallery" ? "اختيار صورة" : "التقط صورة"}
          >
            {mode === "gallery" ? <FolderOpen size={34} /> : <Camera size={34} />}
          </button>
          <p className="scanner-mobile-hint">
            {step === "sending"
              ? "جاري الإرسال…"
              : step === "sent"
                ? "الجوال ما زال مرتبطاً — سيفتح تلقائياً فور طلب صورة صنف آخر من اللابتوب، أو اضغط للالتقاط الآن"
                : mode === "gallery"
                  ? "اضغط لاختيار صورة من المعرض وإرسالها فوراً"
                  : "اضغط لالتقاط صورة وإرسالها فوراً"}
          </p>

          {mode === "gallery" ? (
            <button type="button" className="photo-mobile-gallery-btn" onClick={() => cameraRef.current?.click()} disabled={step === "sending"}>
              <Camera size={15} /> التقاط بالكاميرا بدلاً من ذلك
            </button>
          ) : (
            <button type="button" className="photo-mobile-gallery-btn" onClick={() => galleryRef.current?.click()} disabled={step === "sending"}>
              <FolderOpen size={15} /> اختيار من المعرض بدلاً من ذلك
            </button>
          )}

          <button className="scanner-mobile-disconnect" onClick={disconnect}>قطع الاتصال نهائياً</button>
        </div>
      )}

      <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={handleFile} />
      <input ref={galleryRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleFile} />
    </div>
  );
}

function App() {
  const [page, setPage] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const [navOpen, setNavOpen] = useState(false);
  const [showPwModal, setShowPwModal] = useState(false);
  const [showControlLogin, setShowControlLogin] = useState(false);
  const [printJob, setPrintJob] = useState(null); // { type: 'dashboard'|'inventory'|'items' } | null
  const [focusCode, setFocusCode] = useState(null); // كود صنف مطلوب التمرير له وتمييزه في صفحة المخزون بعد اختياره من البحث العام

  // الوضع الليلي: فاتح / داكن / تلقائي (يتبع إعداد نظام تشغيل الجهاز، ويتحدّث
  // فوراً لو المستخدم غيّر إعداد جهازه وهو فاتح الموقع، بدون إعادة تحميل)
  const [themePref, setThemePrefState] = useState(() => getThemePref());
  const [systemPrefersDark, setSystemPrefersDark] = useState(
    () => typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
  );
  const effectiveTheme = themePref === "system" ? (systemPrefersDark ? "dark" : "light") : themePref;
  const setThemePref = (v) => { setThemePrefState(v); saveThemePref(v); };

  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = (e) => setSystemPrefersDark(e.matches);
    mq.addEventListener ? mq.addEventListener("change", onChange) : mq.addListener(onChange);
    return () => (mq.removeEventListener ? mq.removeEventListener("change", onChange) : mq.removeListener(onChange));
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", effectiveTheme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", effectiveTheme === "dark" ? "#171C22" : "#2B3B47");
  }, [effectiveTheme]);

  // القائمة الجانبية بالجوال (عبر أيقونة الخطوط الثلاثة): تُغلق تلقائياً
  // عند اختيار صفحة، أو الضغط خارجها، أو زر Escape — بدل شريط سفلي ثابت.
  useEffect(() => {
    if (!navOpen) return;
    const onKey = (e) => { if (e.key === "Escape") setNavOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [navOpen]);

  // اكتشاف الجوال عبر JS مباشرة (وليس فقط عبر @media) — بعض متصفحات
  // الأندرويد (خصوصاً متصفحات هواوي/الشركات الصينية عند فتح الملف مباشرة
  // بدون سيرفر) لا تُطبّق meta viewport بشكل صحيح فتفشل @media في العمل،
  // فيبقى الشريط الجانبي ظاهراً بعرضه الكامل وتخرج البطاقات عن الشاشة.
  // هذا احتياط إضافي يجبر وضع الجوال بناءً على العرض الفعلي للنافذة.
  const [isMobile, setIsMobile] = useState(
    () => typeof window !== "undefined" && window.innerWidth <= 860
  );
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= 860);
    onResize();
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", onResize);
    return () => {
      window.removeEventListener("resize", onResize);
      window.removeEventListener("orientationchange", onResize);
    };
  }, []);
  const [session, setSession] = useState(() => {
    try {
      const raw = sessionStorage.getItem(ROLE_KEY);
      return raw ? JSON.parse(raw) : { type: "guest" };
    } catch (e) { return { type: "guest" }; }
  });

  const [auditLog, setAuditLog] = useState([]);
  const auditLogRef = React.useRef([]);
  // اسم الفاعل الحالي (يُحدَّث لاحقاً بعد اشتقاق currentUser بالأسفل)،
  // نحتفظ به بمرجع حتى تقدر notify() تقرأه دون إعادة ترتيب الكود
  const actorRef = React.useRef("رئيس الموقع");

  // تحميل سجل النشاط الدائم من Supabase عند فتح الموقع + مزامنة فورية
  // بين كل الأجهزة (بدل السجل المحلي المؤقت السابق الذي يضيع بإغلاق الصفحة)
  useEffect(() => {
    let cancelled = false;
    let unsub = null;
    (async () => {
      try {
        const res = await window.storage?.get(AUDIT_KEY, false);
        if (cancelled) return;
        const list = res?.value ? JSON.parse(res.value) : [];
        auditLogRef.current = list;
        setAuditLog(list);
      } catch {}
      if (!cancelled && window.subscribeStorage) {
        unsub = window.subscribeStorage(AUDIT_KEY, (rawValue, isLocalWrite) => {
          if (cancelled || isLocalWrite) return;
          try {
            const list = JSON.parse(rawValue);
            auditLogRef.current = list;
            setAuditLog(list);
          } catch {}
        });
      }
    })();
    return () => { cancelled = true; if (unsub) unsub(); };
  }, []);

  const pushAuditEntry = useCallback((msg) => {
    const next = [{ msg, time: Date.now(), by: actorRef.current }, ...auditLogRef.current].slice(0, 500);
    auditLogRef.current = next;
    setAuditLog(next);
    window.storage?.set(AUDIT_KEY, JSON.stringify(next), false).catch(() => {});
  }, []);

  // استعادة سجل النشاط بالكامل من نسخة احتياطية مستوردة (لو كانت موجودة بالملف)
  const restoreAuditLog = useCallback((list) => {
    if (!Array.isArray(list)) return;
    auditLogRef.current = list;
    setAuditLog(list);
    window.storage?.set(AUDIT_KEY, JSON.stringify(list), false).catch(() => {});
  }, []);

  const notify = useCallback((msg, type = "success", opts = {}) => {
    setToast({ msg, type, id: Date.now() });
    if (!opts.silent) { playBeep(type === "error" ? "error" : "success"); hapticPulse(type === "error" ? "error" : "success"); }
    if (type !== "error" && !opts.silent) {
      pushAuditEntry(msg);
    }
    setTimeout(() => setToast((t) => (t?.msg === msg ? null : t)), 2600);
  }, [pushAuditEntry]);

  const onRemoteUpdate = useCallback(() => {
    notify("تم تحديث البيانات من جهاز آخر", "success", { silent: true });
  }, [notify]);

  const [data, setData, saving, sync] = useStore(onRemoteUpdate);

  // نسخ احتياطي تلقائي محلي: لو رئيس الموقع سبق واختار مجلداً على هذا
  // الجهاز، وحان وقت النسخة التالية (حسب المدة التي حددها)، نكتب الملف
  // تلقائياً بدون أي تدخل منه — بصمت، ودون إزعاجه لو تعذّر ذلك.
  useEffect(() => {
    if (session.type !== "owner" || !data || !isAutoBackupSupported()) return;
    (async () => {
      try {
        const settings = getAutoBackupSettings();
        if (!settings.enabled) return;
        if (daysSinceAutoBackup() < (settings.everyDays || 1)) return;
        const handle = await getDirHandle();
        if (!handle) return;
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm !== "granted") return; // ما نقدر نطلب الإذن بدون تفاعل مباشر من المستخدم
        await writeAutoBackupFile(handle, data, auditLogRef.current);
      } catch {
        // نتجاهل أي خطأ هنا بصمت — رئيس الموقع يقدر يتأكد ويأخذ نسخة يدوية من نافذة النسخ الاحتياطي
      }
    })();
  }, [session.type, data]);

  const inventory = useMemo(() => (data ? computeInventory(data) : []), [data]);

  // إعدادات تنبيهات رئيس الموقع (خاصة بهذا الجهاز/المتصفح)
  const [notifSettings, setNotifSettingsState] = useState(() => getNotifSettings());
  const [showNotifSettings, setShowNotifSettings] = useState(false);
  const [showGuestScreenSettings, setShowGuestScreenSettings] = useState(false);
  const [showBackupSettings, setShowBackupSettings] = useState(false);
  const setNotifSettings = (level) => {
    const next = { ...notifSettings, level };
    setNotifSettingsState(next);
    saveNotifSettings(next);
  };

  const systemNotify = useCallback((opts) => {
    notifySystemEvent({
      isOwner: session.type === "owner",
      ownerId: session.type === "owner" ? session.ownerId : undefined,
      settings: notifSettings,
      ...opts,
    });
  }, [session.type, session.ownerId, notifSettings]);

  // تسجيل الـ Service Worker مرة واحدة عند فتح الموقع (شرط أساسي لعمل PWA وPush)
  useEffect(() => {
    registerServiceWorker();
  }, []);

  // كشف تلقائي لأي صنف "دخل حالة نقص" جديدة (منخفض أو نفد) ليست موجودة بالفحص السابق،
  // فيرسل تنبيه نظام لرئيس الموقع (حسب إعداداته)، بدون تكرار نفس التنبيه في كل مرة.
  const prevShortageRef = React.useRef(new Set());
  useEffect(() => {
    if (session.type !== "owner" || !data) return;
    const shortageNow = new Set(inventory.filter((i) => i.status === "low" || i.status === "empty").map((i) => i.code));
    const prev = prevShortageRef.current;
    const newlyShort = [...shortageNow].filter((c) => !prev.has(c));
    if (newlyShort.length) {
      const names = newlyShort.map((c) => inventory.find((i) => i.code === c)?.name).filter(Boolean);
      systemNotify({
        eventLevel: "shortage",
        title: "المستودع — تنبيه نقص",
        body: names.length === 1
          ? `الصنف «${names[0]}» وصل لحد النقص أو نفد`
          : `${names.length} أصناف وصلت لحد النقص أو نفدت: ${names.slice(0, 3).join("، ")}${names.length > 3 ? "…" : ""}`,
        tag: "warehouse-shortage",
      });
    }
    prevShortageRef.current = shortageNow;
  }, [inventory, session.type, data, systemNotify]);

  // "مهامك اليوم" — تظهر تلقائياً مرة وحدة لكل دخول للمنظم (session.type === "user")
  // لو عنده مهام معلّقة مكلّف فيها شخصياً أو موجّهة لكل المنظمين، دون إزعاجه بها
  // في كل مرة يتنقل بين الصفحات.
  const [showMyTasks, setShowMyTasks] = useState(false);
  const shownTasksForUserRef = React.useRef(null);
  const myPendingTasks = useMemo(() => {
    if (!data || session.type !== "user") return [];
    const me = data.users.find((u) => u.id === session.userId);
    if (!me) return [];
    return (data.tasks || []).filter((t) => !t.done && (t.assignedTo === "all" || t.assignedTo === me.id));
  }, [data, session.type, session.userId]);
  useEffect(() => {
    if (!data || session.type !== "user") return;
    if (shownTasksForUserRef.current === session.userId) return;
    shownTasksForUserRef.current = session.userId;
    if (myPendingTasks.length > 0) setShowMyTasks(true);
  }, [data, session.type, session.userId, myPendingTasks.length]);

  const enter = (s) => {
    setSession(s);
    try { sessionStorage.setItem(ROLE_KEY, JSON.stringify(s)); } catch (e) {}
  };

  // تسجيل الخروج من وضع التحكم يعيدك دائماً إلى وضع العرض الافتراضي، وليس لشاشة اختيار فارغة
  const logout = () => {
    setSession({ type: "guest" });
    setPage("dashboard");
    shownTasksForUserRef.current = null;
    try { sessionStorage.removeItem(ROLE_KEY); } catch (e) {}
  };

  // تجهيز تقرير قابل للطباعة/PDF بتصميم مستند مرتّب، ثم فتح نافذة الطباعة
  const triggerPrint = (type) => setPrintJob({ type });
  useEffect(() => {
    if (!printJob) {
      document.body.classList.remove("printing-report");
      return;
    }
    document.body.classList.add("printing-report");
    const t = setTimeout(() => window.print(), 60);
    const after = () => setPrintJob(null);
    window.addEventListener("afterprint", after);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", after); };
  }, [printJob]);

  if (!data) {
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">📦</div>
        <div>جارٍ تحضير المستودع…</div>
      </div>
    );
  }

  const isOwner = session.type === "owner";
  const isGuest = session.type !== "owner" && session.type !== "user";
  const currentUser = session.type === "user" ? data.users.find((u) => u.id === session.userId) : null;
  const currentOwner = isOwner ? (data.owners || []).find((o) => o.id === session.ownerId) : null;
  actorRef.current = isOwner
    ? (currentOwner ? `${currentOwner.name} (رئيس الموقع)` : "رئيس الموقع")
    : (currentUser?.name || currentUser?.username || "مستخدم");

  // رئيس تم حذف حسابه (من رئيس آخر) وهو ما زال بجلسة مفتوحة — إخراج فوري
  if (session.type === "owner" && !currentOwner) {
    setTimeout(() => {
      logout();
      notify("تم حذف حسابك — تواصل مع رئيس آخر بالموقع", "error");
    }, 0);
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">⏳</div>
        <div>جارٍ تسجيل الخروج…</div>
      </div>
    );
  }

  // مستخدم مؤقت انتهت صلاحيته أو حُذف حسابه — إخراج فوري
  if (session.type === "user" && (!currentUser || isTempExpired(currentUser))) {
    setTimeout(() => {
      logout();
      notify("انتهت صلاحية الدخول — تواصل مع رئيس الموقع", "error");
    }, 0);
    return (
      <div className="boot-screen">
        <FontStyles />
        <div className="boot-mark">⏳</div>
        <div>جارٍ تسجيل الخروج…</div>
      </div>
    );
  }

  /* ---------------- وضع العرض (الافتراضي التلقائي) ----------------
     واجهة مبسّطة جداً: المخزون فقط للقراءة، بدون لوحة تحكم ولا قوائم جانبية،
     مع زر واحد للانتقال لوضع التحكم والتعديل (محمي بكلمة مرور). */
  if (isGuest) {
    return (
      <>
      <div className="view-shell">
        <FontStyles />
        <header className="view-topbar">
          <div className="brand">
            <div className="brand-mark">
              <Boxes size={20} strokeWidth={2.2} />
            </div>
            <div>
              <div className="brand-title">المستودع</div>
              <div className="brand-sub">لوحة العرض</div>
            </div>
          </div>
          <span
            className={`conn-dot ${sync.online ? "conn-dot-on" : "conn-dot-off"}`}
            title={sync.online ? "متصل — البيانات محدّثة" : "غير متصل — سيتم التحديث عند عودة الاتصال"}
          />
          <ThemeToggle themePref={themePref} effectiveTheme={effectiveTheme} onSet={setThemePref} />
          <button className="btn-ghost view-control-btn" onClick={() => setShowControlLogin(true)}>
            <KeyRound size={14} /> <span>الدخول للتحكم</span>
          </button>
        </header>

        <main className="view-main">
          {data.guestScreen === "welcome" ? (
            <GuestWelcomeScreen text={data.guestWelcomeText} />
          ) : data.guestScreen === "lists" ? (
            <GuestListsWithInventory data={data} inventory={inventory} triggerPrint={triggerPrint} />
          ) : data.guestScreen === "dashboard" ? (
            <GuestDashboardSummary inventory={inventory} />
          ) : (
            <InventoryPage inventory={inventory} itemGroups={data.itemGroups} branches={data.branches} onPrint={() => triggerPrint("inventory")} showBranchFilter />
          )}
        </main>

        {showControlLogin && (
          <ControlLoginModal
            data={data}
            onClose={() => setShowControlLogin(false)}
            onEnter={(s) => { enter(s); setShowControlLogin(false); notify("تم الدخول بنجاح"); }}
          />
        )}

        <Toast toast={toast} />
      </div>
      <PrintableReport job={printJob} data={data} inventory={inventory} />
      </>
    );
  }

  // كل مستخدم مسجّل دخول (رئيس الموقع أو مستخدم) يشوف الصفحات المتاحة له فقط؛
  // رئيس الموقع "بتحكم كامل" (permissions: null) يشوف كل شيء دائماً كسابق.
  // رئيس "بصلاحيات محددة" يشوف فقط الصفحات المفعّلة له من صفحة الرؤساء —
  // تماماً كالمستخدم العادي، لكن بإمكانية الوصول لصفحات الإدارة (الرؤساء/
  // المستخدمون/المجموعات/الأقسام) إن مُنحها تحديداً. المستخدم (متحكم) يشوف
  // "لوحة التحكم" دائماً بالإضافة لأي صفحة من GRANTABLE_PAGES فُعّلت له —
  // وإن لم تُحدَّد صلاحياته بعد (مستخدم قديم) يشوف كل الصفحات المتاحة كسابق
  // افتراضياً حتى لا ينكسر شيء بالترقية.
  const readOnly = currentUser ? !currentUser.canEdit : false;
  const isRestrictedOwner = isOwner && Array.isArray(currentOwner?.permissions);
  // نفس منطق صلاحيات الصفحات يُطبّق على صلاحية "ربط الجوال" — رئيس بتحكم كامل
  // أو مستخدم قديم بدون صلاحيات محددة يشوفها دائماً كسابق.
  const canUseScanner = isOwner
    ? (!isRestrictedOwner || currentOwner.permissions.includes("scannerPairing"))
    : (!currentUser?.permissions || currentUser.permissions.includes("scannerPairing"));
  const nonOwnerKeys = NAV.filter((n) => !n.ownerOnly).map((n) => n.key);
  const allowedKeys = isOwner
    ? (isRestrictedOwner
        ? nonOwnerKeys.filter((k) => k === "dashboard" || currentOwner.permissions.includes(k))
        : nonOwnerKeys)
    : nonOwnerKeys.filter((k) => k === "dashboard" || !currentUser?.permissions || currentUser.permissions.includes(k));
  const visibleNav = NAV.filter((n) => {
    if (!n.ownerOnly) return allowedKeys.includes(n.key);
    if (!isOwner) return false;
    return !isRestrictedOwner || currentOwner.permissions.includes(n.key);
  });
  const safePage = allowedKeys.includes(page) || (n2ok(page)) ? page : (allowedKeys[0] || "dashboard");
  function n2ok(p) {
    if (!NAV.some((n) => n.key === p && n.ownerOnly)) return false;
    if (!isOwner) return false;
    return !isRestrictedOwner || currentOwner.permissions.includes(p);
  }
  const go = (p) => {
    const ok = n2ok(p) || allowedKeys.includes(p);
    setPage(ok ? p : (allowedKeys[0] || "dashboard"));
    setNavOpen(false);
  };

  // من نتيجة البحث العام: يودّي المستخدم مباشرة لصفحة المخزون ويمرّر
  // للصنف بعينه ويميّزه، بدل ما يفتح الصفحة فاضية ويضطر يدوّر عليه يدوياً
  const goToItem = (code) => {
    setFocusCode(code);
    go("inventory");
  };

  const roleLabel = isOwner ? `${currentOwner?.name || "رئيس الموقع"} — ${isRestrictedOwner ? "صلاحيات محددة" : "تحكم كامل"}`
    : `${currentUser?.name || currentUser?.username}${readOnly ? " (قراءة فقط)" : " (يقدر يعدّل)"}`;

  return (
    <>
    <div className={`app-shell ${isMobile ? "is-mobile" : ""}`}>
      <FontStyles />
      {navOpen && <div className="sidebar-backdrop" onClick={() => setNavOpen(false)} />}
      <aside className={`sidebar ${navOpen ? "sidebar-open" : ""}`}>
        <div className="brand">
          <div className="brand-mark">
            <Boxes size={20} strokeWidth={2.2} />
          </div>
          <div>
            <div className="brand-title">المستودع</div>
            <div className="brand-sub">Warehouse Manifest</div>
          </div>
        </div>

        <div className={`role-badge role-badge-admin`}>
          {isOwner ? <ShieldAlert size={13} /> : <Users size={13} />}
          {roleLabel}
        </div>

        <nav className="nav-list">
          {visibleNav.map((n, i) => (
            <button key={n.key} className={`nav-item ${safePage === n.key ? "nav-item-active" : ""}`} onClick={() => go(n.key)}>
              <span className="nav-index">{String(i + 1).padStart(2, "0")}</span>
              <n.icon size={17} strokeWidth={2} />
              <span>{n.label}</span>
            </button>
          ))}
        </nav>

        <div className="sidebar-foot">
          {isOwner && (
            <button className="logout-btn" onClick={() => setShowPwModal(true)}>
              <KeyRound size={14} /> تغيير كلمة المرور
            </button>
          )}
          <button className="logout-btn" onClick={logout}>
            <X size={14} /> تسجيل الخروج
          </button>
        </div>
      </aside>

      <div className="main-col">
        <header className="topbar">
          {isMobile && (
            <button className="hamburger hamburger-force" onClick={() => setNavOpen((v) => !v)} aria-label="القائمة">
              <span /><span /><span />
            </button>
          )}
          <span
            className={`conn-dot ${sync.online ? "conn-dot-on" : "conn-dot-off"}`}
            title={sync.online ? (saving ? "جارٍ الحفظ…" : "متصل — يُحفظ تلقائياً") : "غير متصل — سيتم الحفظ عند عودة الاتصال"}
          />
          <GlobalSearch data={data} inventory={inventory} go={go} onPick={goToItem} currentUser={currentUser} isOwner={isOwner} />
          <ThemeToggle themePref={themePref} effectiveTheme={effectiveTheme} onSet={setThemePref} />
          {isOwner && (
            <button className="icon-btn" title="إعدادات التنبيهات" onClick={() => setShowNotifSettings(true)}>
              <Bell size={17} />
            </button>
          )}
          {isOwner && (
            <button className="icon-btn" title="إعدادات شاشة البداية" onClick={() => setShowGuestScreenSettings(true)}>
              <Monitor size={17} />
            </button>
          )}
          {isOwner && (
            <button className="icon-btn" title="النسخ الاحتياطي والاستعادة" onClick={() => setShowBackupSettings(true)}>
              <HardDriveDownload size={17} />
            </button>
          )}
          {canUseScanner && <ScannerPairing isOwner={isOwner} />}
          <button className="topbar-logout-btn" onClick={logout} title="تسجيل الخروج">
            <X size={15} /> <span>تسجيل الخروج</span>
          </button>
        </header>

        <main className="main-area">
          {safePage === "dashboard" && <Dashboard inventory={inventory} data={data} go={go} readOnly={readOnly} onPrint={() => triggerPrint("dashboard")} isOwner={isOwner} />}
          {safePage === "tasks" && <TasksPage data={data} setData={setData} notify={notify} isOwner={isOwner} currentUser={currentUser} />}
          {safePage === "items" && <ItemsPage data={data} setData={setData} notify={notify} readOnly={readOnly} onPrint={() => triggerPrint("items")} systemNotify={systemNotify} currentUser={currentUser} isOwner={isOwner} inventory={inventory} />}
          {safePage === "activities" && <ActivitiesPage data={data} setData={setData} notify={notify} readOnly={readOnly} inventory={inventory} />}
          {safePage === "inventory" && <InventoryPage inventory={inventory} itemGroups={data.itemGroups} branches={data.branches} onPrint={() => triggerPrint("inventory")} currentUser={currentUser} isOwner={isOwner} focusCode={focusCode} onFocusConsumed={() => setFocusCode(null)} />}
          {safePage === "barcodes" && <BarcodesPage data={data} setData={setData} notify={notify} readOnly={readOnly} />}
          {safePage === "audit" && <AuditPage log={auditLog} isOwner={isOwner} currentUser={currentUser} />}
          {safePage === "owners" && isOwner && <OwnersPage data={data} setData={setData} notify={notify} currentOwnerId={session.ownerId} />}
          {safePage === "users" && isOwner && <UsersPage data={data} setData={setData} notify={notify} />}
          {safePage === "groups" && isOwner && <GroupsPage data={data} setData={setData} notify={notify} />}
          {safePage === "branches" && isOwner && <BranchesPage data={data} setData={setData} notify={notify} />}
          {safePage === "reports" && <ReportsPage data={data} inventory={inventory} auditLog={auditLog} />}
        </main>
      </div>

      {showPwModal && (
        <ChangeOwnerPasswordModal
          owner={(data.owners || []).find((o) => o.id === session.ownerId)}
          notify={notify}
          onClose={() => setShowPwModal(false)}
          onSave={({ password, recoveryQuestion, recoveryAnswer }) => {
            setData({
              ...data,
              owners: (data.owners || []).map((o) =>
                o.id === session.ownerId ? { ...o, password, recoveryQuestion, recoveryAnswer } : o
              ),
            });
            notify("تم تغيير كلمة المرور");
          }}
        />
      )}

      {showNotifSettings && (
        <NotificationSettingsModal
          settings={notifSettings}
          onClose={() => setShowNotifSettings(false)}
          onSave={(level) => setNotifSettings(level)}
          ownerId={isOwner ? session.ownerId : null}
        />
      )}

      {showGuestScreenSettings && (
        <GuestScreenSettingsModal
          data={data}
          onClose={() => setShowGuestScreenSettings(false)}
          onSave={({ guestScreen, guestWelcomeText, guestListsConfig }) => {
            setData({ ...data, guestScreen, guestWelcomeText, guestListsConfig });
            notify("تم حفظ إعدادات شاشة البداية");
          }}
        />
      )}

      {showBackupSettings && (
        <BackupSettingsModal
          data={data}
          auditLog={auditLog}
          notify={notify}
          onClose={() => setShowBackupSettings(false)}
          onRestore={(payload) => {
            setData(mergeBackupIntoData(data, payload));
            if (Array.isArray(payload.auditLog)) restoreAuditLog(payload.auditLog);
            notify("تم استيراد النسخة الاحتياطية الكاملة بنجاح");
          }}
        />
      )}

      {showMyTasks && myPendingTasks.length > 0 && (
        <MyTasksModal
          tasks={myPendingTasks}
          onClose={() => setShowMyTasks(false)}
          onDone={(taskId) => {
            setData({
              ...data,
              tasks: data.tasks.map((t) => (t.id === taskId
                ? { ...t, done: true, doneAt: new Date().toISOString(), doneBy: currentUser?.name || currentUser?.username || "?" }
                : t)),
            });
          }}
        />
      )}

      <Toast toast={toast} />
    </div>
    <PrintableReport job={printJob} data={data} inventory={inventory} />
    </>
  );
}

/* ------------------------------------------------------------------ */
/*  PRINTABLE REPORT — تصميم مستند مرتّب للتصدير كـ PDF/طباعة           */
/*  (بديل عن طباعة الموقع كما هو، يظهر فقط أثناء الطباعة)              */
/* ------------------------------------------------------------------ */

function PrintableReport({ job, data, inventory }) {
  if (!job || !data) return null;
  const type = job.type;
  const now = new Date();
  let generatedAt;
  try {
    generatedAt = new Intl.DateTimeFormat("ar-SA-u-nu-latn", { dateStyle: "long", timeStyle: "short" }).format(now);
  } catch {
    generatedAt = now.toLocaleString();
  }

  const groupName = (id) => data.itemGroups.find((g) => g.id === id)?.name || "بدون مجموعة";
  const branchName = (id) => (data.branches || []).find((b) => b.id === id)?.name || "—";

  const TITLES = {
    dashboard: "تقرير ملخص المستودع",
    inventory: "تقرير المخزون",
    items: "تقرير قائمة الأغراض",
  };

  const total = inventory.length;
  const available = inventory.filter((i) => i.status === "available").length;
  const low = inventory.filter((i) => i.status === "low").length;
  const empty = inventory.filter((i) => i.status === "empty").length;

  return (
    <div className="print-report">
      <div className="print-report-header">
        <div className="print-report-brand">
          <div className="print-report-brand-mark">📦</div>
          <div>
            <div className="print-report-brand-title">المستودع</div>
            <div className="print-report-brand-sub">Warehouse Manifest</div>
          </div>
        </div>
        <div className="print-report-meta">
          <div className="print-report-doc-title">{TITLES[type] || "تقرير"}</div>
          <div>تاريخ الإصدار: {generatedAt}</div>
        </div>
      </div>

      {type === "dashboard" && (
        <>
          <div className="print-stat-row">
            <div className="print-stat"><span>{total}</span>إجمالي الأصناف</div>
            <div className="print-stat"><span>{available}</span>متوفرة</div>
            <div className="print-stat"><span>{low}</span>مخزون منخفض</div>
            <div className="print-stat"><span>{empty}</span>نفدت كمياتها</div>
          </div>
          <table className="print-table">
            <thead><tr><th>الكود</th><th>الصنف</th><th>المجموعة</th><th>الموقع</th><th>الكمية</th><th>الحالة</th></tr></thead>
            <tbody>
              {inventory.map((i) => (
                <tr key={i.code}>
                  <td>{i.code}</td>
                  <td>{i.name}</td>
                  <td>{groupName(i.group)}</td>
                  <td>{i.category || "—"}</td>
                  <td>{i.balance}</td>
                  <td>{STATUS_META[i.status]?.label}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </>
      )}

      {type === "inventory" && (
        <table className="print-table">
          <thead><tr><th>الكود</th><th>الصنف</th><th>القسم</th><th>المجموعة</th><th>الموقع</th><th>الداخل</th><th>الخارج</th><th>الكمية</th><th>الحالة</th></tr></thead>
          <tbody>
            {inventory.map((i) => (
              <tr key={i.code}>
                <td>{i.code}</td>
                <td>{i.name}</td>
                <td>{branchName(i.branch)}</td>
                <td>{groupName(i.group)}</td>
                <td>{i.category || "—"}</td>
                <td>{i.inQty}</td>
                <td>{i.outQty}</td>
                <td>{i.balance}</td>
                <td>{STATUS_META[i.status]?.label}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {type === "items" && (
        <table className="print-table">
          <thead><tr><th>الكود</th><th>اسم الغرض</th><th>الفئة / الموقع</th><th>ملاحظات</th></tr></thead>
          <tbody>
            {data.items.map((it) => (
              <tr key={it.code}>
                <td>{it.code}</td>
                <td>{it.name}</td>
                <td>{it.category || "—"}</td>
                <td>{it.notes || "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <div className="print-report-footer">المستودع — مستند تم إنشاؤه تلقائياً بتاريخ {generatedAt}</div>
    </div>
  );
}

function FontStyles() {
  return (
    <style>{`

      :root {
        --kraft: #ECE2CC;
        --kraft-deep: #E1D3B2;
        --paper: #F8F3E7;
        --ink: #23303A;
        --ink-soft: #5B6570;
        --line: #C9BA96;
        --line-soft: #F0E9D6;
        --navy: #2B3B47;
        --green: #3F6D4E;
        --green-bg: #E9F1E9;
        --amber: #B3792C;
        --amber-bg: #FBF0DD;
        --red: #B23A2E;
        --red-bg: #FAE6E2;
        --olive: #8A7A3E;
        --olive-bg: #F5F0DD;
        --surface: #FFFFFF;
        --surface-hover: #FAF6EA;
        --chip-bg: #F3EEDD;
        --shadow-color: 35, 48, 58;
        color-scheme: light;
      }

      /* الوضع الليلي: نفس هوية العلامة (كرافت/كحلي) لكن معكوسة لراحة العين
         بالإضاءة المنخفضة — يُفعَّل عبر data-theme="dark" على <html> إما يدوياً
         أو تلقائياً حسب إعداد نظام تشغيل الجهاز (system). */
      [data-theme="dark"] {
        --kraft: #232B33;
        --kraft-deep: #2C3640;
        --paper: #171C22;
        --ink: #EDE7D8;
        --ink-soft: #9BA5AD;
        --line: #34404A;
        --line-soft: #2A333C;
        --navy: #5C84A6;
        --green: #6FBE8B;
        --green-bg: #16261C;
        --amber: #E3A868;
        --amber-bg: #2E2312;
        --red: #E2685A;
        --red-bg: #351815;
        --olive: #C9B76B;
        --olive-bg: #2A2612;
        --surface: #1E252C;
        --surface-hover: #29323B;
        --chip-bg: #29323B;
        --shadow-color: 0, 0, 0;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      /* حماية من خروج أي عنصر عن عرض الشاشة بالجوال (كروت، جداول، إلخ) */
      html, body { max-width: 100%; overflow-x: hidden; }

      /* ---------- نسخة احتياطية من قواعد الجوال، مبنية على كلاس JS
         (.is-mobile) بدل الاعتماد فقط على @media. بعض متصفحات الأندرويد
         (مثل متصفح هواوي عند فتح الملف مباشرة بدون سيرفر) لا تُفعّل
         meta viewport بشكل صحيح فتفشل @media، فيبقى الشريط الجانبي
         ظاهراً بعرضه الكامل ويغطي الواجهة. هذه القواعد تضمن نفس السلوك
         دائماً لأنها تعتمد على عرض النافذة الفعلي المحسوب بالجافاسكربت. */
      .app-shell.is-mobile .sidebar {
        position: fixed !important; top: 0; bottom: 0; right: 0; z-index: 70;
        width: min(78vw, 300px) !important;
        transform: translateX(100%);
        transition: transform 0.18s ease-out;
        box-shadow: -8px 0 24px rgba(0,0,0,0.18);
      }
      .app-shell.is-mobile .sidebar.sidebar-open { transform: translateX(0); }
      .app-shell.is-mobile .hamburger-force { display: flex !important; padding: 10px; margin: -10px; touch-action: manipulation; }
      .app-shell.is-mobile .main-area { padding: 18px 16px 24px !important; }
      .app-shell.is-mobile .stat-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .app-shell.is-mobile .chart-grid { grid-template-columns: 1fr !important; }
      .app-shell.is-mobile .form-grid, .app-shell.is-mobile .form-grid-move { grid-template-columns: 1fr 1fr !important; }
      /* على شاشات الجوال الضيقة (أغلب الهواتف) تُعرض حقول النماذج عمود
         واحد بعرض كامل بدل التصاقها جنب بعض وانقطاع النص — يشمل هذا
         نماذج الإضافة/التعديل كلها (باركود، صنف، مستخدم...الخ) */
      @media (max-width: 560px) {
        .app-shell.is-mobile .form-grid,
        .app-shell.is-mobile .form-grid-move { grid-template-columns: 1fr !important; }
        .app-shell.is-mobile .modal-overlay { align-items: flex-end !important; padding: 0 !important; }
        .app-shell.is-mobile .modal-sheet { max-width: 100% !important; border-radius: 16px 16px 0 0 !important; max-height: 88vh !important; }
        .app-shell.is-mobile .modal-body { padding: 16px !important; }
        .app-shell.is-mobile .modal-actions { flex-direction: column-reverse !important; gap: 8px !important; }
        .app-shell.is-mobile .modal-actions .btn-primary,
        .app-shell.is-mobile .modal-actions .btn-ghost,
        .app-shell.is-mobile .modal-actions .btn-danger { width: 100% !important; }
      }
      .app-shell.is-mobile .topbar { padding: 10px 12px !important; gap: 8px !important; }
      .app-shell.is-mobile .global-search { max-width: none !important; padding: 7px 10px !important; }
      .app-shell.is-mobile .topbar-logout-btn span { display: none !important; }
      .app-shell.is-mobile .topbar-logout-btn { padding: 8px !important; }
